<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>爱的回忆 · 给你的纪念册</title>
<meta name="description" content="一本只属于我们的纪念册 — 从 2017 到 ∞">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Noto+Serif+SC:wght@200;400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
  touch-action:none;overscroll-behavior:none;
}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}

/* ============== Splash 星空漩涡 ============== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 70%,#000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.splash-content{position:relative;z-index:2;text-align:center;color:#f8e8d4;padding:0 30px}
.splash-eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.6em;color:rgba(248,232,212,.5);margin-bottom:18px;opacity:0;animation:fadeIn 1.4s ease .3s forwards}
.splash-title{font-family:"Dancing Script","Cormorant Garamond",serif;font-size:clamp(3rem,12vw,5rem);font-weight:400;letter-spacing:.04em;color:#fff;text-shadow:0 0 40px rgba(255,180,200,.4),0 0 80px rgba(180,120,255,.2);margin-bottom:8px;opacity:0;animation:titleIn 1.8s ease .8s forwards}
.splash-sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.5em;color:rgba(248,232,212,.7);margin-bottom:36px;opacity:0;animation:fadeIn 1.4s ease 1.4s forwards}
.splash-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 40px;background:rgba(248,232,212,.05);border:1px solid rgba(248,232,212,.4);color:#f8e8d4;font-family:"Noto Serif SC",serif;font-size:clamp(.9rem,3vw,1rem);letter-spacing:.35em;cursor:pointer;border-radius:50px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;animation:fadeUp 1.4s ease 2s forwards;transition:all .3s ease}
.splash-btn:active{transform:scale(.96);background:rgba(248,232,212,.12);border-color:#f8e8d4}
.splash-btn .heart{display:inline-block;color:#ff6b95;animation:heartbeat 1.4s ease-in-out infinite;font-size:1.1em}
.splash-hint{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(248,232,212,.35);font-size:.7rem;letter-spacing:.4em;z-index:2;animation:fadeIn 1.4s ease 2.5s forwards;opacity:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleIn{from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* ============== 3D 球面首页 ============== */
#home{
  position:fixed;inset:0;z-index:10;
  background:#000;
  display:block;
}
#bgFx{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
#home canvas{position:absolute;inset:0;width:100%;height:100%}
#home canvas:not(#bgFx){z-index:1}
#homeHint{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),90px);
  transform:translateX(-50%);z-index:12;
  color:rgba(255,255,255,.75);font-size:.72rem;letter-spacing:.3em;
  text-align:center;pointer-events:none;
  opacity:0;animation:fadeIn 1.4s ease .5s forwards;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
#homeHint > div{margin:3px 0}
#homeHint .arrow{display:inline-block;font-size:1.2rem;margin-right:6px;animation:bob 2s ease-in-out infinite;vertical-align:-.1em}
#homeHint .hint2,#homeHint .hint3{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.4em}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 回忆录入口按钮（球体下方） */
#openChapterBtn{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),24px);
  transform:translateX(-50%);z-index:20;
  display:inline-flex;align-items:center;gap:10px;
  padding:12px 28px 12px 22px;
  background:rgba(248,232,212,.06);
  border:1px solid rgba(248,232,212,.35);
  border-radius:50px;color:#f8e8d4;
  font-family:"Noto Serif SC",serif;
  font-size:clamp(.82rem,3vw,.95rem);
  letter-spacing:.4em;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;animation:fadeUp 1.4s ease 1.4s forwards;
  transition:all .3s ease;
  box-shadow:0 4px 24px rgba(248,180,200,.15),inset 0 0 12px rgba(248,180,200,.08);
}
#openChapterBtn:active{transform:translateX(-50%) scale(.96);background:rgba(248,232,212,.14)}
#openChapterBtn .ch-bookmark{color:#ff8eb3;animation:heartbeat 1.6s ease-in-out infinite}
#openChapterBtn .ch-arrow{transition:transform .3s ease}
#openChapterBtn:hover .ch-arrow{transform:translateX(4px)}
@keyframes chGlow{
  0%,100%{box-shadow:0 4px 24px rgba(248,180,200,.15),inset 0 0 12px rgba(248,180,200,.08)}
  50%{box-shadow:0 4px 32px rgba(248,180,200,.28),inset 0 0 16px rgba(248,180,200,.15)}
}
#openChapterBtn.show{animation:fadeUp .8s ease forwards, chGlow 3s ease-in-out infinite .8s}

/* 缩放控制按钮 */
#zoomCtl{
  position:fixed;right:14px;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:15;display:flex;flex-direction:column;gap:6px;
  opacity:0;animation:fadeIn 1.4s ease 1s forwards;
}
.zoom-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;
}
.zoom-btn:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.zoom-btn.reset{font-size:.7rem;letter-spacing:.05em;font-weight:500}
#homeTitle{
  position:fixed;left:50%;top:max(env(safe-area-inset-top),30px);
  transform:translateX(-50%);z-index:12;
  text-align:center;color:#fff;pointer-events:none;
}
#homeTitle .t1{font-family:"Dancing Script",serif;font-size:clamp(1.8rem,7vw,2.4rem);text-shadow:0 2px 20px rgba(0,0,0,.8)}
#homeTitle .t2{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.75rem;letter-spacing:.5em;color:rgba(248,232,212,.7);margin-top:4px}

/* ============== 预览大图 ============== */
#preview{
  position:fixed;inset:0;z-index:25;background:#000;
  display:none;
}
#preview.active{display:block}
.preview-stage{position:absolute;inset:0;overflow:hidden;background:#000}
.preview-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;
  pointer-events:none;
}
.preview-slide.show{opacity:1;pointer-events:auto}
.preview-slide img{
  width:100%;height:100%;object-fit:contain;
  background:#000;
}
.preview-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.6);font-size:.85rem;letter-spacing:.3em;
  z-index:2;pointer-events:none;
}
.preview-loading::after{
  content:'';display:block;width:30px;height:30px;
  margin:14px auto 0;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:rgba(255,180,200,.8);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.preview-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.preview-back.show{display:flex}
.preview-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

.preview-info{
  position:fixed;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  text-align:center;color:#fff;padding:0 24px;z-index:10;
  pointer-events:none;
}
.preview-info .pn{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:4px}
.preview-info .pt{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.2rem,5vw,1.6rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7)}

.preview-hint{
  position:fixed;left:50%;bottom:calc(max(env(safe-area-inset-bottom),30px) + 70px);
  transform:translateX(-50%);z-index:20;
  color:rgba(255,255,255,.5);font-size:.7rem;letter-spacing:.3em;
  pointer-events:none;display:none;
}
.preview-hint.show{display:block}

.preview-dots{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);
  z-index:15;display:none;flex-direction:column;gap:5px;
}
.preview-dots.show{display:flex}
.pdot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.pdot.active{background:#ffb0c4;transform:scale(1.6)}

/* ============== 章节全屏视图 ============== */
#viewer{
  position:fixed;inset:0;z-index:20;background:#000;
  display:none;
  touch-action:pan-y;
}
#viewer.active{display:block}
.viewer-stage{position:absolute;inset:0;overflow:hidden}
.viewer-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.viewer-slide img.slide-photo{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(.85) saturate(110%);
  transition:transform .4s ease;
}
.viewer-slide::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.85) 100%);
  pointer-events:none;
}
.viewer-info{
  position:absolute;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  z-index:3;text-align:center;color:#fff;padding:0 24px;
  pointer-events:none;
}
.viewer-num{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.95rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:10px}
.viewer-title{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7);margin-bottom:4px}
.viewer-en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.7rem,2.5vw,.85rem);letter-spacing:.4em;color:rgba(248,232,212,.7)}
.viewer-text{
  position:absolute;left:0;right:0;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:3;text-align:center;color:rgba(255,245,235,.95);padding:0 32px;
  font-size:clamp(.85rem,3.2vw,.95rem);line-height:2;letter-spacing:.05em;
  pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.8);
  white-space:pre-line;
}
.viewer-text::before{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-right:4px;vertical-align:-.15em}
.viewer-text::after{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-left:2px;vertical-align:-.25em}
.viewer-fx{position:absolute;inset:0;z-index:2;pointer-events:none}

/* 返回按钮 */
.viewer-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.viewer-back.show{display:flex}
.viewer-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

/* 章节进度 */
.viewer-dots{
  position:fixed;right:14px;top:50%;transform:translateY(-50%);
  z-index:40;display:none;flex-direction:column;gap:8px;
}
.viewer-dots.show{display:flex}
.vdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);border:none;padding:0;cursor:pointer;transition:all .3s ease}
.vdot.active{background:#ffb0c4;transform:scale(1.8)}

/* 许愿页特殊样式 */
.viewer-slide.wish{background:radial-gradient(ellipse at center,#2a1840 0%,#08040e 100%)}
.viewer-slide.wish img{filter:brightness(.4)}
.viewer-wish-title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(2rem,8vw,3rem);color:#fff;letter-spacing:.3em;margin-bottom:30px;text-shadow:0 0 30px rgba(255,180,200,.6)}
.viewer-wish-text{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.9rem,3.5vw,1.05rem);color:rgba(255,245,235,.95);letter-spacing:.1em;line-height:2.3;max-width:88%;margin:0 auto 14px}
.viewer-wish-sign{font-family:"Dancing Script",serif;font-size:clamp(1.2rem,5vw,1.6rem);color:#ffb0c4;letter-spacing:.15em;margin-top:30px;text-shadow:0 0 20px rgba(255,180,200,.5)}
.wish-hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wish-heart{position:absolute;color:#ff6b95;font-size:1.2rem;animation:floatUp 6s ease-in infinite;opacity:0}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
}

/* 封面特殊样式 */
.viewer-slide.cover{background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 100%)}
.viewer-slide.cover img{display:none}

/* ============================================================ */
/* 每章文案专属动画（结合章节特点 —— 字符级动态）              */
/* ============================================================ */
/* 默认（基础）已在上面 .scene-text 定义；这里只覆盖各章特殊样式 */

.scene-text{white-space:pre-wrap;line-height:2.1;font-size:.95rem;position:relative}
.scene-text .ch{display:inline-block;transition:transform .25s ease, color .25s ease, text-shadow .25s ease}
/* 桌面端专属：文案扫光 */
.is-desktop .scene-text .text-sweep{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, transparent 0%, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%, transparent 100%);
  background-size:300% 100%;
  -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent);
  mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent);
  animation:txtSweep 4.5s ease-in-out infinite;
}
@keyframes txtSweep{
  0%{background-position:300% 50%}
  100%{background-position:-300% 50%}
}

/* ============ ch01 在那之前 —— 流星雨字符逐颗闪烁 ============ */
.scene.ch01 .scene-text{
  background:linear-gradient(90deg,#f8e8d4,#fff,#f8e8d4);
  background-size:200% 100%;
  -webkit-background-clip:text;
  background-clip:text;color:transparent;
}
.scene.ch01 .scene-text .ch{
  animation:ch01Char 3.5s ease-in-out infinite;
}
.scene.ch01 .scene-text .ch:nth-child(odd){animation-delay:.7s;color:rgba(180,210,255,.9);text-shadow:0 0 8px rgba(140,180,255,.7)}
.scene.ch01 .scene-text .ch:nth-child(3n){animation-delay:1.4s;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.8)}
@keyframes ch01Char{
  0%,100%{transform:translateY(0) scale(1);opacity:.85}
  35%{transform:translateY(-2px) scale(1.05);opacity:1}
  70%{transform:translateY(1px) scale(.98);opacity:.7}
}

/* ============ ch02 峨眉雪 —— 雪花飘落字符 ============ */
.scene.ch02 .scene-text .ch{
  animation:ch02Snow 4s ease-in-out infinite;
}
.scene.ch02 .scene-text .ch:nth-child(2n){animation-delay:.6s;color:#fff}
.scene.ch02 .scene-text .ch:nth-child(3n){animation-delay:1.2s;color:rgba(200,225,255,1)}
@keyframes ch02Snow{
  0%{transform:translateY(-6px);opacity:0;filter:blur(1.5px);text-shadow:0 0 6px rgba(200,225,255,.6)}
  20%{transform:translateY(-2px);opacity:1;filter:blur(0);text-shadow:0 0 12px rgba(255,255,255,.8), 0 0 24px rgba(180,220,255,.5)}
  60%{transform:translateY(0);opacity:1;text-shadow:0 0 8px rgba(200,225,255,.4)}
  100%{transform:translateY(2px);opacity:.85;filter:blur(.3px)}
}

/* ============ ch03 山城之夜 —— 灯笼明灭字符 ============ */
.scene.ch03 .scene-text .ch{
  animation:ch03Lantern 2.2s ease-in-out infinite;
}
.scene.ch03 .scene-text .ch:nth-child(2n){animation-delay:.5s}
.scene.ch03 .scene-text .ch:nth-child(3n){animation-delay:1s}
@keyframes ch03Lantern{
  0%,100%{
    color:rgba(255,200,140,.95);
    text-shadow:
      0 0 6px rgba(255,180,80,.7),
      0 0 14px rgba(255,140,60,.4),
      0 0 24px rgba(255,120,40,.2),
      0 2px 14px rgba(0,0,0,.9);
    transform:translateY(0) scale(1);
  }
  50%{
    color:#fff;
    text-shadow:
      0 0 10px rgba(255,210,140,.95),
      0 0 22px rgba(255,170,80,.75),
      0 0 36px rgba(255,140,60,.4),
      0 2px 14px rgba(0,0,0,.9);
    transform:translateY(-1px) scale(1.04);
  }
}

/* ============ ch04 北海海风 —— 海浪浪花打过来 ============ */
.scene.ch04 .scene-text{position:relative}
.scene.ch04 .scene-text::before{
  content:'';position:absolute;left:-10%;top:50%;
  width:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(180,230,255,.9),transparent);
  animation:ch04WaveSweep 4s ease-in-out infinite;
  pointer-events:none;
}
.scene.ch04 .scene-text .ch{
  animation:ch04Wave 3.5s ease-in-out infinite;
}
.scene.ch04 .scene-text .ch:nth-child(2n){animation-delay:.4s}
.scene.ch04 .scene-text .ch:nth-child(3n){animation-delay:.8s}
.scene.ch04 .scene-text .ch:nth-child(4n){animation-delay:1.2s}
@keyframes ch04Wave{
  0%{transform:translateY(2px);color:rgba(220,235,250,.75);text-shadow:0 0 4px rgba(120,180,220,.3)}
  25%{transform:translateY(-1px);color:rgba(255,255,255,1);text-shadow:0 0 16px rgba(140,200,255,.9), 0 0 28px rgba(120,180,220,.5)}
  50%{transform:translateY(-3px) translateX(0);color:#fff;text-shadow:0 0 18px rgba(180,220,255,1), 0 0 30px rgba(120,180,220,.6)}
  75%{transform:translateY(0);color:rgba(230,245,255,.95);text-shadow:0 0 12px rgba(140,200,255,.6)}
  100%{transform:translateY(2px);color:rgba(220,235,250,.75);text-shadow:0 0 4px rgba(120,180,220,.3)}
}
@keyframes ch04WaveSweep{
  0%{left:-10%;width:0;opacity:0}
  20%{opacity:1}
  60%{width:120%;left:-10%;opacity:1}
  100%{width:120%;left:120%;opacity:0}
}

/* ============ ch05 那年毕业 —— 花瓣飘落字符 ============ */
.scene.ch05 .scene-text .ch{
  animation:ch05Petal 5s ease-in-out infinite;
}
.scene.ch05 .scene-text .ch:nth-child(2n){animation-delay:.8s;color:rgba(255,210,225,1)}
.scene.ch05 .scene-text .ch:nth-child(3n){animation-delay:1.6s;color:#fff;text-shadow:0 0 10px rgba(255,180,200,.7)}
.scene.ch05 .scene-text .ch:nth-child(5n){animation-delay:2.4s;color:rgba(255,225,235,.95)}
@keyframes ch05Petal{
  0%,100%{transform:translate(0,0) rotate(0);text-shadow:0 0 4px rgba(255,180,200,.3)}
  25%{transform:translate(3px,-4px) rotate(2deg);text-shadow:0 0 14px rgba(255,200,220,.7), 0 0 24px rgba(255,180,200,.3)}
  50%{transform:translate(-2px,-7px) rotate(-2deg);text-shadow:0 0 18px rgba(255,200,220,.8)}
  75%{transform:translate(2px,-3px) rotate(1deg);text-shadow:0 0 12px rgba(255,180,200,.5)}
}

/* ============ ch06 在一起 —— 烛光暖晕字符 ============ */
.scene.ch06 .scene-text .ch{
  animation:ch06Bokeh 3.5s ease-in-out infinite;
}
.scene.ch06 .scene-text .ch:nth-child(2n){animation-delay:.5s}
.scene.ch06 .scene-text .ch:nth-child(3n){animation-delay:1s}
@keyframes ch06Bokeh{
  0%,100%{
    color:rgba(255,235,215,.92);
    text-shadow:0 0 6px rgba(255,170,100,.4), 0 0 16px rgba(255,150,80,.2), 0 2px 14px rgba(0,0,0,.9);
    transform:translateY(0) scale(1);
  }
  50%{
    color:#fff8ec;
    text-shadow:0 0 14px rgba(255,200,140,.85), 0 0 28px rgba(255,180,120,.5), 0 0 44px rgba(255,150,80,.2), 0 2px 14px rgba(0,0,0,.9);
    transform:translateY(-1px) scale(1.04);
  }
}

/* ============ ch07 我们结婚了 —— 玫瑰金光扫过 ============ */
.scene.ch07 .scene-text{
  background:linear-gradient(110deg,#ffd4dc 0%,#fff 30%,#ffb0c4 60%,#fff 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;color:transparent;
  animation:ch07Rose 4s linear infinite;
}
.scene.ch07 .scene-text .ch{color:transparent;background:inherit;-webkit-background-clip:text;background-clip:text}
@keyframes ch07Rose{
  0%{background-position:300% 50%}
  100%{background-position:-300% 50%}
}

/* ============ ch08 柯柯来了 —— 气泡上浮字符 ============ */
.scene.ch08 .scene-text .ch{
  animation:ch11Bubble 3.6s ease-in-out infinite;
}
.scene.ch08 .scene-text .ch:nth-child(2n){animation-delay:.6s}
.scene.ch08 .scene-text .ch:nth-child(3n){animation-delay:1.2s;color:rgba(255,210,235,1);text-shadow:0 0 12px rgba(255,180,210,.7)}
.scene.ch08 .scene-text .ch:nth-child(4n){animation-delay:1.8s;color:#fff}
@keyframes ch11Bubble{
  0%,100%{transform:translateY(0) scale(1);text-shadow:0 0 6px rgba(255,180,210,.4), 0 2px 14px rgba(0,0,0,.9)}
  35%{transform:translateY(-3px) scale(1.05);text-shadow:0 0 16px rgba(255,200,225,.85), 0 0 28px rgba(255,180,210,.4)}
  70%{transform:translateY(-1px) scale(1.02);text-shadow:0 0 12px rgba(255,200,225,.6)}
}

/* ============ ch09 时光影片 —— 老电影抖动字符 ============ */
.scene.ch09 .scene-text .ch{
  animation:ch14Film 3s steps(8) infinite;
  color:rgba(255,235,210,.95);
}
.scene.ch09 .scene-text .ch:nth-child(2n){animation-delay:.4s}
.scene.ch09 .scene-text .ch:nth-child(3n){animation-delay:.8s}
@keyframes ch14Film{
  0%,100%{transform:translate(0,0) skewX(0);text-shadow:0 0 6px rgba(255,200,140,.4), 0 2px 14px rgba(0,0,0,.9);opacity:.92}
  20%{transform:translate(-1px,0) skewX(.5deg);opacity:1;text-shadow:0 0 14px rgba(255,200,140,.6)}
  40%{transform:translate(1px,1px) skewX(-.3deg);opacity:.85;text-shadow:1px 0 0 rgba(255,0,0,.3),-1px 0 0 rgba(0,255,255,.3),0 0 10px rgba(255,200,140,.5)}
  60%{transform:translate(0,-1px);opacity:1;text-shadow:0 0 12px rgba(255,200,140,.7)}
  80%{transform:translate(0,1px) skewX(.3deg);opacity:.9;text-shadow:0 0 8px rgba(255,200,140,.5)}
}
.cover-content{text-align:center;color:#fff;padding:0 30px;z-index:3}
.cover-content .deco{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.8rem;letter-spacing:.5em;color:rgba(248,232,212,.5);margin-bottom:18px}
.cover-content .title{font-family:"Dancing Script",serif;font-size:clamp(3.2rem,13vw,5.5rem);font-weight:400;letter-spacing:.05em;text-shadow:0 0 40px rgba(255,180,200,.5);margin-bottom:12px;line-height:1.1}
.cover-content .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.95rem,3.5vw,1.1rem);color:rgba(248,232,212,.7);letter-spacing:.5em;margin-bottom:30px}
.cover-content .heart{font-size:1.8rem;color:#ff6b95;animation:heartbeat 2s ease-in-out infinite;display:inline-block;margin-bottom:30px}
.cover-content .quote{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.85rem,3.2vw,.95rem);color:rgba(255,245,235,.85);letter-spacing:.12em;line-height:2.1;max-width:85%;margin:0 auto 32px}
.cover-content .date{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.4em;color:rgba(248,232,212,.5)}

/* 加载进度 */
#loader{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse at center,#0a0618 0%,#050310 60%,#000 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
}
#loader.show{display:flex;animation:fadeIn .6s ease}
#loader canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#loader canvas.loader-3d{z-index:0}
#loader canvas.loader-fx{z-index:1}
.loader-inner{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;
  width:100%;max-width:340px;
}
.loader-hex{
  position:relative;
  font-family:"Noto Serif SC",serif;font-weight:200;
  font-size:clamp(1rem,3.4vw,1.15rem);letter-spacing:.4em;
  color:rgba(255,200,220,.92);margin-bottom:6px;
  text-shadow:0 0 20px rgba(255,142,179,.5), 0 0 40px rgba(200,162,255,.3);
  height:1.6em;
  display:flex;align-items:center;justify-content:center;
}
.loader-hex-text{position:relative;z-index:2}
.loader-hex::before{
  content:attr(data-hex);
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:"Courier New",monospace;
  font-size:.55rem;letter-spacing:.18em;
  color:rgba(140,220,180,.55);
  white-space:nowrap;opacity:.7;
}
@keyframes loaderGlitch{
  0%,100%{transform:translate(0,0);filter:none}
  20%{transform:translate(-1px,0)}
  40%{transform:translate(1px,0);filter:hue-rotate(15deg)}
  60%{transform:translate(0,1px)}
  80%{transform:translate(-.5px,-.5px)}
}
.loader-hex.shake{animation:loaderGlitch .35s steps(4) 1}
.loader-quote{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.78rem;letter-spacing:.25em;color:rgba(248,232,212,.45);
  margin-bottom:34px;height:1.2em;text-align:center;
  transition:opacity .8s ease;
}
.loader-quote.fade{opacity:0}
.loader-rng{position:relative;width:120px;height:120px;margin-bottom:18px}
.loader-rng svg{transform:rotate(-90deg);width:100%;height:100%;overflow:visible}
.loader-rng .track{stroke:rgba(255,255,255,.06);fill:none;stroke-width:2.5}
.loader-rng .fill{
  stroke:url(#loaderGrad);fill:none;stroke-width:2.5;
  stroke-linecap:round;
  stroke-dasharray:339.292;  /* 2πr, r=54 */
  stroke-dashoffset:339.292;
  transition:stroke-dashoffset .35s ease;
  filter:drop-shadow(0 0 6px rgba(255,142,179,.5));
}
.loader-rng-pct{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:"Dancing Script",serif;color:rgba(248,232,212,.9);
}
.loader-rng-pct .num{font-size:1.8rem;line-height:1}
.loader-rng-pct .label{font-size:.6rem;letter-spacing:.3em;color:rgba(248,232,212,.4);margin-top:4px;font-family:"Noto Serif SC",serif;font-style:normal;font-weight:200}
.loader-count{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.85rem;letter-spacing:.2em;color:rgba(248,232,212,.6);
  margin-bottom:24px;
}
.loader-count b{color:#ffb0c4;font-style:normal;font-family:"Noto Serif SC",serif;font-weight:200;margin:0 2px}
/* 缩略图预览条 */
.loader-thumbs{
  position:relative;width:90%;max-width:340px;height:54px;
  overflow:hidden;border-radius:6px;
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
}
.loader-thumbs-track{
  display:flex;gap:6px;
  transition:transform .4s ease;
  will-change:transform;
}
.loader-thumb{
  flex:0 0 auto;width:42px;height:54px;border-radius:4px;
  background:rgba(255,255,255,.04);
  opacity:0;transform:translateY(10px) scale(.9);
  transition:opacity .5s ease,transform .5s ease;
  background-size:cover;background-position:center;
}
.loader-thumb.show{opacity:1;transform:translateY(0) scale(1)}
.loader-thumb.glow{box-shadow:0 0 12px rgba(255,142,179,.35)}

/* 程序员控制台日志（打字机效果） */
.loader-log{
  margin-top:18px;width:90%;max-width:340px;height:54px;
  font-family:"Courier New",monospace;font-size:.65rem;
  color:rgba(140,220,180,.7);letter-spacing:.05em;
  text-align:left;line-height:1.5;
  opacity:0;animation:fadeIn .8s ease 1.2s forwards;
  overflow:hidden;
}
.loader-log .ln{display:block}
.loader-log .k{color:#c8a2ff}
.loader-log .s{color:#ffb0c4}
.loader-log .ok{color:#88ff88}

/* CRT 扫描线 + 渐变暗角 */
.loader-scan{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,
    rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
  animation:scanShift 6s linear infinite;
}
@keyframes scanShift{
  0%{background-position:0 0}
  100%{background-position:0 100px}
}

@media (max-width:380px){
  .viewer-title{font-size:1.5rem}
  .viewer-text{font-size:.82rem}
}

/* ============================================================ */
/* 章节场景（每章专属氛围）                                    */
/* ============================================================ */
.scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
}
.scene-bg{position:absolute;inset:0;z-index:0}
.scene-fx{position:absolute;inset:0;z-index:3;pointer-events:none}
.scene-deco{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.scene-frame{
  position:relative;z-index:2;
  width:100%;height:62vh;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;
  perspective-origin:50% 50%;
}
.scene-info{
  position:relative;z-index:4;
  width:100%;padding:0 28px 32px;
  text-align:center;
  margin-top:-20px;
}
.scene-num{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.9rem;letter-spacing:.4em;color:rgba(248,232,212,.6);margin-bottom:8px}
.scene-title{
  font-family:"Noto Serif SC",serif;font-weight:200;
  font-size:clamp(1.5rem,6vw,2rem);letter-spacing:.3em;
  margin-bottom:6px;
  opacity:0;transform:translateY(20px);
  animation:sceneTitleIn .8s ease .2s forwards;
}
.scene-en{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.75rem;letter-spacing:.4em;
  color:rgba(248,232,212,.5);
  margin-bottom:18px;
  opacity:0;animation:sceneTitleIn .8s ease .4s forwards;
}
.scene-text{
  font-family:"Noto Serif SC",serif;font-weight:200;
  font-size:clamp(.85rem,3.2vw,.95rem);
  color:rgba(255,245,235,.92);
  line-height:2.1;letter-spacing:.08em;
  max-width:88%;margin:0 auto;
  white-space:pre-line;
  text-shadow:0 2px 16px rgba(0,0,0,.9);

}
@keyframes sceneTitleIn{to{opacity:1;transform:translateY(0)}}
@keyframes sceneTextIn{to{opacity:1}}

/* ============================================================ */
/* ============================================================ */
/* 3D 照片展示 —— book（中心展开相册）/flow（聚光封面流）/stack（影院画廊） */
/* ============================================================ */

/* ============ BOOK：立体对开相册 ============ */
.book{
  position:relative;
  width:84vw;max-width:360px;height:88%;
  transform-style:preserve-3d;
  perspective:1200px;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.5));
}
.book-spread{
  position:absolute;inset:0;
  display:flex;transform-style:preserve-3d;
  transform:rotateY(-8deg) rotateX(2deg);
}
.book-spread::before{
  /* 中缝阴影 */
  content:'';position:absolute;left:50%;top:0;bottom:0;width:30px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,
    rgba(0,0,0,.25) 0%,
    rgba(0,0,0,.05) 35%,
    rgba(255,255,255,.12) 50%,
    rgba(0,0,0,.05) 65%,
    rgba(0,0,0,.25) 100%);
  z-index:5;pointer-events:none;
}
.book-page{
  position:relative;
  flex:1;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,250,240,.6) 0%,rgba(245,235,220,.3) 60%,rgba(220,200,170,.4) 100%),
    #f8f1e3;
  overflow:hidden;
  backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(120,90,60,.18);
}
.book-page.left{
  border-radius:4px 0 0 4px;
  border-right:1px solid rgba(120,90,60,.15);
}
.book-page.right{
  border-radius:0 4px 4px 0;
  border-left:1px solid rgba(120,90,60,.15);
}
.book-page img{
  width:100%;height:100%;object-fit:cover;
  display:block;
}
/* 纸张右下角阴影 / 弧线（更立体） */
.book-page::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at right top,rgba(255,255,255,.35) 0%,transparent 30%),
    radial-gradient(ellipse at left bottom,rgba(80,50,30,.22) 0%,transparent 40%);
  mix-blend-mode:multiply;
}
.book-page .page-num{
  position:absolute;bottom:10px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.7rem;letter-spacing:.15em;
  color:rgba(80,60,40,.55);
}
.book-page.left .page-num{left:14px}
.book-page.right .page-num{right:14px}
.book-page .page-corner{
  /* 右上角微翻（折角） */
  position:absolute;top:0;right:0;
  width:0;height:0;
  border-style:solid;border-width:0 14px 14px 0;
  border-color:transparent rgba(40,30,20,.35) transparent transparent;
  filter:drop-shadow(-1px 1px 1px rgba(0,0,0,.3));
  pointer-events:none;
}
/* 翻页动画：当前页（右边）向左掀起 180°，下一页从右边滑入 */
.book.flipping .book-page.right{
  transform-origin:left center;
  animation:bookFlipR 1.1s cubic-bezier(.4,.05,.25,1) forwards;
}
.book.flipping .book-page.right .page-corner{
  animation:bookFlipCorner 1.1s cubic-bezier(.4,.05,.25,1) forwards;
}
@keyframes bookFlipR{
  0%{transform:rotateY(0)}
  60%{transform:rotateY(-150deg);box-shadow:-20px 0 50px rgba(0,0,0,.55)}
  100%{transform:rotateY(-180deg);box-shadow:0 0 0 rgba(0,0,0,0)}
}
@keyframes bookFlipCorner{
  0%{opacity:1}
  50%{opacity:0}
  100%{opacity:0}
}
.book .book-next-in{
  position:absolute;right:0;top:0;bottom:0;width:50%;
  background:#fff;
  transform-origin:left center;
  transform:rotateY(180deg);
  overflow:hidden;
  z-index:2;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(120,90,60,.18);
  border-radius:0 4px 4px 0;
}
.book.flipping .book-next-in{
  animation:bookFlipIn 1.1s cubic-bezier(.4,.05,.25,1) forwards;
}
@keyframes bookFlipIn{
  0%{transform:rotateY(180deg)}
  60%{transform:rotateY(20deg);box-shadow:-20px 0 50px rgba(0,0,0,.55)}
  100%{transform:rotateY(0deg);box-shadow:none}
}

/* ============ FLOW：聚光封面流（中间大 + 两侧倾斜 + Ken Burns）============ */
.flow{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;perspective:1200px;
}
.flow-card{
  position:absolute;left:50%;top:50%;
  width:62vw;max-width:280px;height:78%;
  border-radius:8px;overflow:hidden;
  background:#000;
  box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  transition:transform 1s cubic-bezier(.22,.61,.36,1),opacity 1s ease,box-shadow 1s ease;
  backface-visibility:hidden;
  transform-origin:center center;
  will-change:transform,opacity;
}
.flow-card img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  transform-origin:center;
  transition:transform 6s ease-out;
}
.flow-card.active{
  box-shadow:0 32px 90px rgba(0,0,0,.75), 0 0 60px rgba(255,180,200,.18);
  z-index:5;
}
.flow-card.active img{
  animation:kenBurns 7s ease-out forwards;
}
@keyframes kenBurns{
  0%{transform:scale(1.04) translate(0,0)}
  100%{transform:scale(1.12) translate(-1.5%,-1%)}
}
.flow-card .flow-num{
  position:absolute;top:12px;right:16px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.85rem;color:#fff;letter-spacing:.1em;
  text-shadow:0 1px 6px rgba(0,0,0,.8);z-index:3;
}
.flow-card .flow-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);
  z-index:2;
}
.flow-card .flow-glow{
  /* 顶部暖色高光 */
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,200,180,.12) 0%,transparent 25%);
  z-index:2;
}
.flow-card .flow-caption{
  position:absolute;left:18px;right:18px;bottom:16px;
  font-family:"Dancing Script","Noto Serif SC",serif;
  font-size:1.05rem;color:#fff;letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
  z-index:3;
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease .3s, transform .6s ease .3s;
}
.flow-card.active .flow-caption{
  opacity:1;transform:translateY(0);
}

/* ============ STACK：影院画廊（一图全屏 + 缩略图条）============ */
.cinema{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.cinema-hero{
  position:relative;
  width:88vw;max-width:380px;
  aspect-ratio: 3/4;
  border-radius:6px;overflow:hidden;
  background:#000;
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
}
.cinema-hero img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  transform-origin:center;
  animation:cinemaPan 9s ease-in-out infinite alternate;
}
@keyframes cinemaPan{
  0%{transform:scale(1.08) translate(0,0)}
  100%{transform:scale(1.14) translate(-2%,-1.5%)}
}
.cinema-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%),
    linear-gradient(180deg,rgba(255,200,180,.08) 0%,transparent 30%);
}
.cinema-hero .cinema-num{
  position:absolute;top:14px;left:18px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.9rem;color:#fff;letter-spacing:.15em;
  text-shadow:0 1px 6px rgba(0,0,0,.7);z-index:3;
}
.cinema-hero .cinema-cap{
  position:absolute;left:20px;right:20px;bottom:18px;
  font-family:"Dancing Script","Noto Serif SC",serif;
  font-size:1.1rem;color:#fff;letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
  z-index:3;
  animation:cinemaCap 1s ease forwards;
}
@keyframes cinemaCap{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}
}
.cinema-thumbs{
  position:absolute;bottom:max(env(safe-area-inset-bottom),76px);left:50%;
  transform:translateX(-50%);
  display:flex;gap:6px;
  padding:6px 10px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(10px);
  border-radius:20px;
  max-width:88vw;
  overflow-x:auto;
  scrollbar-width:none;
}
.cinema-thumbs::-webkit-scrollbar{display:none}
.cinema-thumb{
  flex:0 0 auto;width:36px;height:48px;border-radius:4px;
  background-size:cover;background-position:center;
  background-color:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.1);
  cursor:pointer;
  opacity:.5;
  transition:opacity .3s ease, transform .3s ease, border-color .3s ease;

<script type="module">
import * as THREE from 'three';

// ============================================================
// 0. 设备检测：决定使用轻量版还是 3D 满血版
// ============================================================
const isDesktop = window.matchMedia('(min-width:769px) and (hover:hover) and (pointer:fine)').matches;
const isMobile = !isDesktop;
// 暴露到 window 方便 puppeteer 测试 + 调试
window.__isDesktop = isDesktop;
window.__isMobile = isMobile;
// 写入根节点，方便 CSS 也能针对设备差异化（如隐藏某些层）
document.documentElement.classList.add(isDesktop ? 'is-desktop' : 'is-mobile');

// ============================================================
// 0.5 桌面端专属：鼠标位置追踪 / 光标尾迹 / 翻页粒子翻飞
// ============================================================
const mouse = { x: 0.5, y: 0.5, nx: 0, ny: 0, hasMoved: false };  // 0~1 视口坐标 + -1~1 归一化
if (isDesktop) {
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX / window.innerWidth;
    mouse.y = e.clientY / window.innerHeight;
    mouse.nx = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.ny = (e.clientY / window.innerHeight) * 2 - 1;
    mouse.hasMoved = true;
  }, { passive: true });
}

// 桌面端：全局光标尾迹（彩色光点拖尾）
function initCursorTrail() {
  if (!isDesktop) return;
  const cv = document.createElement('canvas');
  cv.id = 'cursorTrail';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize(){
    const dpr = Math.min(window.devicePixelRatio, 2);
    W = cv.width = window.innerWidth * dpr;
    H = cv.height = window.innerHeight * dpr;
    cv.style.width = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:screen;opacity:.9';

  const palette = [
    [255,180,210], [200,160,255], [255,220,170], [180,230,255], [255,160,200]
  ];
  const trail = [];
  let lastX = -100, lastY = -100, sinceLast = 0;
  function draw(){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const cx = mouse.x * window.innerWidth;
    const cy = mouse.y * window.innerHeight;
    // 仅当鼠标实际移动才发射
    if (mouse.hasMoved && (Math.hypot(cx - lastX, cy - lastY) > 2 || sinceLast > 0)) {
      sinceLast++;
      if (sinceLast > 1) {
        const c = palette[(trail.length + Math.floor(Math.random()*5)) % palette.length];
        trail.push({ x: cx, y: cy, r: 2 + Math.random()*3.5, life: 1, c });
        sinceLast = 0;
      }
      lastX = cx; lastY = cy;
    }
    for (let i = trail.length - 1; i >= 0; i--){
      const p = trail[i];
      p.life -= 0.025;
      if (p.life <= 0) { trail.splice(i, 1); continue; }
      const [r, g, b] = p.c;
      ctx.fillStyle = `rgba(${r},${g},${b},${p.life * 0.45})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.fill();
    }
    // 主光点（更亮）
    if (mouse.hasMoved){
      const c = palette[Math.floor(Math.random()*palette.length)];
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},.55)`;
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}
initCursorTrail();

// 桌面端：翻页粒子翻飞
const flipParticles = [];
function spawnFlipBurst(sceneEl, opts = {}) {
  if (!isDesktop || !sceneEl) return;
  const cv = sceneEl.querySelector('.flip-burst');
  let bcv = cv;
  let bctx = null;
  if (!bcv) {
    bcv = document.createElement('canvas');
    bcv.className = 'flip-burst';
    bcv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8';
    sceneEl.appendChild(bcv);
    const dpr = Math.min(window.devicePixelRatio, 2);
    function rs(){
      bcv.width = sceneEl.clientWidth * dpr;
      bcv.height = sceneEl.clientHeight * dpr;
      bcv.style.width = sceneEl.clientWidth + 'px';
      bcv.style.height = sceneEl.clientHeight + 'px';
      bctx = bcv.getContext('2d');
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    rs();
    window.addEventListener('resize', rs);
  }
  bctx = bcv.getContext('2d');
  const w = sceneEl.clientWidth;
  const h = sceneEl.clientHeight;
  const cx = opts.cx ?? w * 0.5;
  const cy = opts.cy ?? h * 0.45;
  const count = opts.count ?? 40;
  const palette = ['#ff8eb3','#c8a2ff','#ffd4a0','#fff0c4','#a8d8ff'];
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 6;
    flipParticles.push({
      cv: bcv, ctx: bctx,
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.5,
      g: 0.12 + Math.random() * 0.08,
      life: 1,
      r: 1.2 + Math.random() * 2.5,
      color: palette[Math.floor(Math.random()*palette.length)]
    });
  }
  if (flipParticles.length === 1) requestAnimationFrame(animateFlipBurst);
}
function animateFlipBurst(){
  for (let i = flipParticles.length - 1; i >= 0; i--){
    const p = flipParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;
    p.vx *= 0.985;
    p.life -= 0.018;
    if (p.life <= 0) { flipParticles.splice(i, 1); continue; }
    p.ctx.globalAlpha = p.life;
    p.ctx.fillStyle = p.color;
    p.ctx.beginPath();
    p.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    p.ctx.fill();
  }
  if (flipParticles.length > 0) requestAnimationFrame(animateFlipBurst);
}

// ============================================================
// 1. 数据
// ============================================================
const CHAPTERS = [
  { id:'cover', title:'爱的回忆', en:'A LOVE STORY', folder:null, bg:null, effect:null, text:'', isCover:true, photo:null },
  { id:'ch01', title:'在那之前', en:'BEFORE WE MET', folder:'chapter-01-before', bg:'bg-images/01-snow.jpg', effect:'meteor',

// 1. Splash 星空漩涡
// ============================================================
(() => {
  const c = document.getElementById('splashCanvas');
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W, H, stars = [];
  function resize(){
    W = c.width = window.innerWidth * dpr;
    H = c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);
  function initStars(){
    stars = [];
    const maxDim = Math.max(window.innerWidth, window.innerHeight);
    for (let i=0;i<200;i++){
      const angle = Math.random()*Math.PI*2;
      const radius = 30 + Math.random()*maxDim*.6;
      stars.push({
        angle, radius,
        speed: .0005 + Math.random()*.001,
        size: .3 + Math.random()*1.4,
        hue: Math.random()<.7 ? 280+Math.random()*40 : 330+Math.random()*40,
        alpha: .4+Math.random()*.5,
        drift: (Math.random()-.5)*.0003
      });
    }
  }
  initStars();
  function draw(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.fillStyle = 'rgba(8,4,14,.25)';
    ctx.fillRect(0,0,w,h);
    const cx = w/2, cy = h/2;
    const haloR = Math.min(w,h)*.35;
    const halo = ctx.createRadialGradient(cx,cy,0,cx,cy,haloR);
    halo.addColorStop(0,'rgba(255,180,200,.12)');
    halo.addColorStop(.3,'rgba(180,120,255,.08)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.fillRect(0,0,w,h);
    stars.forEach(s => {
      s.angle += s.speed; s.radius += s.drift;
      const r = s.radius;
      const x = cx + Math.cos(s.angle)*r, y = cy + Math.sin(s.angle)*r;
      const fade = Math.max(0, Math.min(1, 1 - r/(haloR*1.4)));
      const sz = s.size*(1 + (1-fade)*.8);
      ctx.fillStyle = `hsla(${s.hue},70%,75%,${s.alpha*fade})`;
      ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2); ctx.fill();
      if (r < haloR){
        const tx = cx + Math.cos(s.angle - s.speed*3)*r;
        const ty = cy + Math.sin(s.angle - s.speed*3)*r;
        ctx.strokeStyle = `hsla(${s.hue},70%,75%,${s.alpha*fade*.4})`;
        ctx.lineWidth = sz*.6;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
      }
      if (r < 5 || r > Math.max(w,h)*.8){
        s.angle = Math.random()*Math.PI*2;
        s.radius = Math.max(w,h)*.6;
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============================================================
// 1.4 加载页特效：Three.js DNA 双螺旋 + 2D 粒子网 + glitch 标题
// ============================================================
(() => {
  const fx = document.getElementById('loaderFx');
  const tdc = document.getElementById('loader3d');
  if (!fx || !tdc) return;
  const ctx = fx.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W = 0, H = 0;
  function resizeFx(){
    W = fx.width = window.innerWidth * dpr;
    H = fx.height = window.innerHeight * dpr;
    fx.style.width = window.innerWidth + 'px';
    fx.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeFx();
  window.addEventListener('resize', resizeFx);

  // ---------- Three.js 场景：DNA 双螺旋（仅桌面端运行） ----------
  if (!isDesktop) {
    // 移动端：不创建 Three.js 渲染器，隐藏 3D canvas，只保留 2D 节点星网 + hex 字符流
    tdc.style.display = 'none';
    // 让 2D 层接管视觉，下面只跑 drawFx
  } else {
  const renderer = new THREE.WebGLRenderer({ canvas: tdc, alpha: true, antialias: true });
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 9);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  const pLight1 = new THREE.PointLight(0xff8eb3, 1.6, 30); pLight1.position.set(-6, 4, 5); scene.add(pLight1);
  const pLight2 = new THREE.PointLight(0xc8a2ff, 1.4, 30); pLight2.position.set( 6,-3, 5); scene.add(pLight2);

  const helixTurns = 4;
  const helixPairs = 26;
  const helixTotal = helixTurns * helixPairs;
  const helixRadius = 1.6;
  const helixHeight = 8.2;
  const helixStepY = helixHeight / helixTotal;

  // 桌面端专属：周围星尘场
  const starCount = 600;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++){
    // 在半径 8-22 的球壳上均匀分布
    const r = 8 + Math.random() * 14;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    starPos[i*3+2] = r * Math.cos(phi) - 4;  // 整体往后推一点
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xfff0fa, size: 0.05, transparent: true, opacity: 0.85, depthWrite: false });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  const strandGeoA = new THREE.BufferGeometry();
  const strandGeoB = new THREE.BufferGeometry();
  const strandPosA = new Float32Array(helixTotal * 3);
  const strandPosB = new Float32Array(helixTotal * 3);
  strandGeoA.setAttribute('position', new THREE.BufferAttribute(strandPosA, 3));
  strandGeoB.setAttribute('position', new THREE.BufferAttribute(strandPosB, 3));
  const strandMatA = new THREE.PointsMaterial({ color: 0xff8eb3, size: 0.22, transparent: true, opacity: 0.95, depthWrite:false, sizeAttenuation: true });
  const strandMatB = new THREE.PointsMaterial({ color: 0xc8a2ff, size: 0.22, transparent: true, opacity: 0.95, depthWrite:false, sizeAttenuation: true });
  const strandA = new THREE.Points(strandGeoA, strandMatA);
  const strandB = new THREE.Points(strandGeoB, strandMatB);
  scene.add(strandA, strandB);

  const rungGeo = new THREE.BufferGeometry();
  const rungPos = new Float32Array(helixTotal * 2 * 3);
  rungGeo.setAttribute('position', new THREE.BufferAttribute(rungPos, 3));
  const rungMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 });
  const rungs = new THREE.LineSegments(rungGeo, rungMat);
  scene.add(rungs);

  const labelTextureCache = new Map();
  function makeDigitTexture(ch){
    if (labelTextureCache.has(ch)) return labelTextureCache.get(ch);
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    const cx = cv.getContext('2d');
    cx.font = 'bold 52px "Courier New", monospace';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const grad = cx.createLinearGradient(0,0,0,64);
    grad.addColorStop(0, '#ffd0e0'); grad.addColorStop(1, '#ff8eb3');
    cx.fillStyle = grad;
    cx.shadowColor = 'rgba(255,142,179,.9)'; cx.shadowBlur = 12;
    cx.fillText(ch, 32, 34);
    const tex = new THREE.CanvasTexture(cv);
    labelTextureCache.set(ch, tex);
    return tex;
  }
  const digits = [];
  for (let i = 0; i < helixTotal; i++){
    const mat = new THREE.SpriteMaterial({ map: makeDigitTexture(Math.random() > 0.5 ? '1' : '0'), transparent: true, opacity: 0 });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(0.42, 0.42, 0.42);
    scene.add(sp);
    digits.push({ sprite: sp });
  }

  function helixPoint(i, strand){
    const t = i / helixTotal;
    const y = -helixHeight/2 + i * helixStepY;
    const angle = t * Math.PI * 2 * helixTurns + (strand === 0 ? 0 : Math.PI);
    return [Math.cos(angle) * helixRadius, y, Math.sin(angle) * helixRadius];
  }

  let loaded = false;
  let loadProgress = 0;
  window.__setLoaderProgress = (p) => { loadProgress = Math.max(0, Math.min(1, p)); };
  window.__setLoaderDone = () => { loaded = true; };

  let w3d = window.innerWidth, h3d = window.innerHeight;
  function onResize3d(){
    w3d = window.innerWidth; h3d = window.innerHeight;
    camera.aspect = w3d / h3d;
    camera.updateProjectionMatrix();
    renderer.setSize(w3d, h3d, false);
  }
  window.addEventListener('resize', onResize3d);

  let t0 = performance.now();
  function animate3d(){
    const t = (performance.now() - t0) * 0.001;
    if (!loaded){
      const arrA = strandGeoA.attributes.position.array;
      const arrB = strandGeoB.attributes.position.array;
      const arrR = rungGeo.attributes.position.array;
      for (let i = 0; i < helixTotal; i++){
        const reveal = Math.max(0, Math.min(1, (loadProgress * helixTotal - i) / 6));
        const [ax, ay, az] = helixPoint(i, 0);
        const [bx, by, bz] = helixPoint(i, 1);
        arrA[i*3]=ax; arrA[i*3+1]=ay; arrA[i*3+2]=az;
        arrB[i*3]=bx; arrB[i*3+1]=by; arrB[i*3+2]=bz;
        arrR[i*6]=ax; arrR[i*6+1]=ay; arrR[i*6+2]=az;
        arrR[i*6+3]=bx; arrR[i*6+4]=by; arrR[i*6+5]=bz;
        const fade = reveal * (0.55 + 0.45 * Math.sin(t*1.5 + i*0.3));
        strandMatA.opacity = strandMatB.opacity = 0.85 * fade + 0.15;
        rungMat.opacity = 0.22 * fade;
        const sp = digits[i].sprite;
        sp.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2);
        sp.material.opacity = reveal * 0.85;
        sp.scale.setScalar(0.42 * reveal);
      }
      strandGeoA.attributes.position.needsUpdate = true;
      strandGeoB.attributes.position.needsUpdate = true;
      rungGeo.attributes.position.needsUpdate = true;
      strandA.rotation.y = strandB.rotation.y = rungs.rotation.y = t * 0.4;
      strandA.position.y = strandB.position.y = rungs.position.y = Math.sin(t*0.7) * 0.15;
      digits.forEach(d => { d.sprite.material.rotation = t * 0.4; });
    } else {
      // 100% 后粒子飞向心形并脉动
      const heartSprite = makeDigitTexture('♥');
      digits.forEach((d, i) => {
        const a = (i / digits.length) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(a), 3);
        const y = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
        const target = new THREE.Vector3(x*0.16, y*0.16, Math.sin(a*3)*0.3);
        d.sprite.position.lerp(target, 0.05);
        d.sprite.material.opacity = 0.95;
        d.sprite.material.map = heartSprite;
        d.sprite.material.needsUpdate = true;
        d.sprite.scale.setScalar(0.45 + Math.sin(t*2 + i)*0.05);
      });
      strandA.rotation.y = strandB.rotation.y = rungs.rotation.y = t * 0.5;
    }
    renderer.render(scene, camera);
    stars.rotation.y = t * 0.05;
    stars.rotation.x = Math.sin(t * 0.3) * 0.05;
    requestAnimationFrame(animate3d);
  }
  animate3d();
  } // end if (isDesktop)

  // ---------- 移动端专属：浪漫主题（樱花瓣 + 玫瑰 + 心形星座 + 柔光晕） ----------
  if (!isDesktop) {
    // 1) 心形星座
    const heartCount = 36;
    const hearts = [];
    for (let i = 0; i < heartCount; i++){
      const a = (i / heartCount) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(a), 3);
      const y = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
      hearts.push({
        baseX: x, baseY: y,
        scale: 0.6 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        pulse: 0.7 + Math.random() * 0.6
      });
    }
    // 2) 樱花瓣（带缺口的五瓣形）
    function drawSakura(ctx, x, y, r, rot, alpha, color){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      // 5 瓣花瓣
      for (let i = 0; i < 5; i++){
        ctx.save();
        ctx.rotate((i / 5) * Math.PI * 2);
        ctx.beginPath();
        // 花瓣：椭圆顶端带小凹
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(r*0.5, -r*0.3, r*1.0, -r*0.5, r*1.0, 0);
        ctx.bezierCurveTo(r*1.0, r*0.5, r*0.5, r*0.3, 0, 0);
        ctx.fill();
        ctx.restore();
      }
      // 中心花蕊
      ctx.fillStyle = '#ffeaa0';
      ctx.globalAlpha = alpha * 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, r*0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    const sakura = [];
    const sakuraColors = ['#ffb0c4', '#ffc4d8', '#ffd4dc', '#ff9ebc', '#ffeae0'];
    for (let i = 0; i < 32; i++){
      sakura.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 4 + Math.random() * 6,
        vx: -0.3 + Math.random() * 0.6,
        vy: 0.25 + Math.random() * 0.7,
        rot: Math.random() * Math.PI * 2,
        rotSpd: -0.03 + Math.random() * 0.06,
        sway: Math.random() * Math.PI * 2,
        color: sakuraColors[Math.floor(Math.random() * sakuraColors.length)],
        alpha: 0.5 + Math.random() * 0.4,
        bloomPhase: Math.random() * Math.PI * 2
      });
    }
    // 3) 飘零玫瑰花瓣（更红更深）
    const rosePetals = [];
    for (let i = 0; i < 14; i++){
      rosePetals.push({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight,
        r: 4 + Math.random() * 4,
        vx: -0.5 + Math.random() * 1,
        vy: 0.5 + Math.random() * 1.2,
        rot: Math.random() * Math.PI * 2,
        rotSpd: -0.05 + Math.random() * 0.1,
        color: `hsl(${340 + Math.random()*30}, ${70 + Math.random()*20}%, ${50 + Math.random()*15}%)`,
        alpha: 0.5 + Math.random() * 0.4
      });
    }
    // 4) 1 朵绽放的大玫瑰（中心装饰）
    let roseReveal = 0; // 0→1 在加载完成时绽放
    function drawRose(cx, cy, r, progress){
      // 多层花瓣组成的玫瑰（简化的几何玫瑰）
      const layers = 5;
      const petalsPerLayer = 7;
      for (let L = 0; L < layers; L++){
        const layerProg = Math.max(0, Math.min(1, (progress * (layers + 1) - L)));
        if (layerProg <= 0) continue;
        const lr = r * (0.4 + L * 0.18);
        const tilt = (L - 2) * 0.18;
        for (let p = 0; p < petalsPerLayer; p++){
          const a = (p / petalsPerLayer) * Math.PI * 2 + L * 0.3;
          const px = cx + Math.cos(a) * lr * 0.3;
          const py = cy + Math.sin(a) * lr * 0.3 + tilt * r * 0.3;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(a + Math.PI/2);
          ctx.scale(layerProg, layerProg);
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r*0.45);
          grad.addColorStop(0, `rgba(255,${130 - L*15},${160 - L*10},${0.9 - L*0.1})`);
          grad.addColorStop(1, `rgba(220,${70 - L*10},${110 - L*8},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(0, -r*0.3, r*0.35, r*0.5, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
      }
      // 花蕊
      ctx.fillStyle = '#fff5b0';
      ctx.globalAlpha = progress;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.12 * progress, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    function drawMobileRomantic(ts){
      const w = window.innerWidth, h = window.innerHeight;
      ctx.fillStyle = 'rgba(20, 8, 30, 0.32)';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2, cy = h * 0.42;
      const pulse = 0.5 + 0.5 * Math.sin(ts * 1.4);
      // 中心柔光晕
      const glowR = 140 + pulse * 60;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      grad.addColorStop(0, `rgba(255,200,220,${0.35 + pulse*0.15})`);
      grad.addColorStop(0.5, `rgba(255,160,200,${0.18 + pulse*0.08})`);
      grad.addColorStop(1, 'rgba(255,140,180,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - glowR, cy - glowR, glowR*2, glowR*2);

      // 心形星座骨架
      ctx.strokeStyle = `rgba(255,180,210,${0.22 + pulse*0.12})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= hearts.length; i++){
        const h0 = hearts[i % hearts.length];
        const px = cx + h0.baseX * h0.scale + Math.sin(ts*0.6 + h0.phase) * 4;
        const py = cy + h0.baseY * h0.scale * -1 + Math.cos(ts*0.5 + h0.phase) * 3;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      // 心形节点光点
      for (const h0 of hearts){
        const px = cx + h0.baseX * h0.scale + Math.sin(ts*0.6 + h0.phase) * 4;
        const py = cy + h0.baseY * h0.scale * -1 + Math.cos(ts*0.5 + h0.phase) * 3;
        const a = (0.6 + 0.4 * Math.sin(ts * 2 + h0.phase)) * h0.pulse;
        ctx.fillStyle = `rgba(255,225,235,${a})`;
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI*2);
        ctx.fill();
      }

      // 樱花瓣飘落（轻旋绽放）
      for (const p of sakura){
        p.x += p.vx + Math.sin(ts*1.2 + p.sway) * 0.4;
        p.y += p.vy;
        p.rot += p.rotSpd;
        if (p.y > h + 20){ p.y = -20; p.x = Math.random() * w; }
        if (p.x > w + 20) p.x = -20;
        if (p.x < -20) p.x = w + 20;
        const bloom = 0.7 + 0.3 * Math.sin(ts * 1.8 + p.bloomPhase);
        drawSakura(ctx, p.x, p.y, p.r, p.rot, p.alpha * bloom, p.color);
      }

      // 玫瑰花瓣飘落（更红更大）
      for (const rp of rosePetals){
        rp.x += rp.vx + Math.sin(ts + rp.rot) * 0.3;
        rp.y += rp.vy;
        rp.rot += rp.rotSpd;
        if (rp.y > h + 20){ rp.y = -20; rp.x = Math.random() * w; }
        ctx.save();
        ctx.translate(rp.x, rp.y);
        ctx.rotate(rp.rot);
        ctx.fillStyle = rp.color;
        ctx.globalAlpha = rp.alpha;
        ctx.beginPath();
        ctx.ellipse(0, 0, rp.r, rp.r*0.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      // 中心大玫瑰（加载完成时绽放）
      if (roseReveal > 0){

      }

  // ---------- 2D 顶层：节点星网 + hex 流 ----------

  function drawFx(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.fillStyle = 'rgba(10, 6, 24, 0.22)';
    ctx.fillRect(0, 0, w, h);
    nodes.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
    });
    ctx.strokeStyle = 'rgba(180,140,220,0.18)';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < nodes.length; i++){
      for (let j = i+1; j < nodes.length; j++){
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 140){
          ctx.globalAlpha = (1 - d/140) * 0.4;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    nodes.forEach(n => {
      ctx.fillStyle = 'rgba(255,200,220,0.7)';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.font = '9px "Courier New", monospace';
    hexArr.forEach((c, i) => {

  // 移动端：不再跑节点星网 + hex 流（已用浪漫主题替代）

  // glitch hex 标题（背景显示当前 hex hash + 抖动）

// 1.5 球面背景特效：常驻银河、极光、漂浮粒子、流星雨
// ============================================================
(() => {
  const c = document.getElementById('bgFx');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W, H;
  let stars = [], meteors = [], motes = [], auroraBands = [];

  function resize(){
    W = c.width = window.innerWidth * dpr;
    H = c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // 主星层（近）
  function initStars(){
    stars = [];
    const baseCount = Math.floor((window.innerWidth * window.innerHeight) / 3200);
    for (let i = 0; i < baseCount; i++){
      const isBig = Math.random() < 0.05;
      const hueChoice = Math.random();
      let hue;
      if (hueChoice < 0.55) hue = 200 + Math.random()*40;
      else if (hueChoice < 0.8) hue = 280 + Math.random()*40;
      else hue = 330 + Math.random()*40;
      stars.push({
        x: Math.random(),
        y: Math.random(),
        sz: isBig ? (1.5 + Math.random()*1.5) : (0.3 + Math.random()*1.1),
        baseAlpha: 0.3 + Math.random()*0.7,
        twinkleSpeed: 0.0008 + Math.random()*0.002,
        twinklePhase: Math.random()*Math.PI*2,
        hue
      });
    }
  }
  initStars();

  // 漂浮粒子（暖色萤火，缓慢上升）
  function initMotes(){
    motes = [];
    const count = Math.floor((window.innerWidth * window.innerHeight) / 22000);
    for (let i = 0; i < count; i++){
      motes.push({
        x: Math.random(),
        y: Math.random(),
        r: 1.0 + Math.random()*2.5,
        baseAlpha: 0.25 + Math.random()*0.55,
        vy: -(0.00008 + Math.random()*0.00015),  // 缓慢上升
        vx: (Math.random()-0.5) * 0.00005,
        phase: Math.random()*Math.PI*2,
        pulseSpeed: 0.0008 + Math.random()*0.0012,
        hue: Math.random() < 0.7 ? (35 + Math.random()*20) : (320 + Math.random()*30)
      });
    }
  }
  initMotes();

  // 极光带：2 条横向波幕，慢慢漂移
  function initAurora(){
    auroraBands = [];
    for (let i = 0; i < 2; i++){
      auroraBands.push({
        yBase: 0.15 + i*0.45 + Math.random()*0.15,
        amplitude: 0.08 + Math.random()*0.08,
        freq: 0.5 + Math.random()*0.8,
        speed: 0.00015 + Math.random()*0.0002,
        hue: i === 0 ? (140 + Math.random()*30) : (280 + Math.random()*30),  // 绿/紫
        alpha: 0.10 + Math.random()*0.08,
        phase: Math.random()*Math.PI*2
      });
    }
  }
  initAurora();

  // 流星
  const MAX_METEORS = 6;
  let lastMeteorTime = 0;
  function spawnMeteor(){
    const dir = Math.random() < 0.5 ? 1 : -1;
    return {
      x: dir === 1 ? -0.05 : 1.05,
      y: Math.random() * 0.5,
      vx: 0.006 * dir,
      vy: 0.003 + Math.random()*0.002,
      len: 0.18 + Math.random()*0.12,
      life: 0,
      maxLife: 50 + Math.random()*30,
      hue: dir === 1 ? (Math.random()<0.5 ? 35+Math.random()*15 : 200+Math.random()*40) : 280+Math.random()*40
    };
  }

  function draw(t){
    const w = window.innerWidth, h = window.innerHeight;

    // 底层：极深的紫黑色（不画实底，让球面透明效果保留）
    ctx.fillStyle = 'rgba(3, 1, 10, 0.55)';
    ctx.fillRect(0, 0, w, h);

    // 1. 远景星云（柔光斑缓慢漂移）
    const nebulaAlpha = 0.22;
    const nebulaTime = t * 0.0003;
    const nebulae = [
      { cx: w*0.3 + Math.sin(nebulaTime)*w*0.08, cy: h*0.4 + Math.cos(nebulaTime*0.85)*h*0.06, r: w*0.55, hue: 280 },
      { cx: w*0.75 + Math.cos(nebulaTime*0.7)*w*0.07, cy: h*0.6 + Math.sin(nebulaTime*1.1)*h*0.05, r: w*0.5, hue: 330 },
      { cx: w*0.5 + Math.sin(nebulaTime*1.3)*w*0.09, cy: h*0.25 + Math.cos(nebulaTime*0.6)*h*0.07, r: w*0.6, hue: 200 },
      { cx: w*0.15 + Math.cos(nebulaTime*0.4)*w*0.05, cy: h*0.8 + Math.sin(nebulaTime*0.9)*h*0.04, r: w*0.4, hue: 310 }
    ];
    nebulae.forEach(n => {
      const g = ctx.createRadialGradient(n.cx, n.cy, 0, n.cx, n.cy, n.r);
      g.addColorStop(0, `hsla(${n.hue}, 75%, 55%, ${nebulaAlpha})`);
      g.addColorStop(0.4, `hsla(${n.hue}, 65%, 40%, ${nebulaAlpha*0.5})`);
      g.addColorStop(1, `hsla(${n.hue}, 65%, 20%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });

    // 2. 极光波带（沿横向起伏的彩色光幕）
    auroraBands.forEach(b => {
      b.phase += b.speed;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 用多点横向曲线 + 渐变填充
      const yTop = h * (b.yBase - b.amplitude);
      const yBot = h * (b.yBase + b.amplitude*1.6);
      const grad = ctx.createLinearGradient(0, yTop, 0, yBot);
      grad.addColorStop(0, `hsla(${b.hue}, 70%, 60%, 0)`);
      grad.addColorStop(0.4, `hsla(${b.hue}, 80%, 65%, ${b.alpha})`);
      grad.addColorStop(1, `hsla(${b.hue}, 80%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      const steps = 40;
      for (let i = 0; i <= steps; i++){
        const u = i / steps;
        const x = u * w;
        const y = h*b.yBase + Math.sin(u*b.freq*Math.PI*2 + b.phase) * h*b.amplitude;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      for (let i = steps; i >= 0; i--){
        const u = i / steps;
        const x = u * w;
        const y = h*(b.yBase + b.amplitude*1.4) + Math.sin(u*b.freq*Math.PI*2 + b.phase + 0.6) * h*b.amplitude*0.5;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // 3. 主星点（带 twinkle 闪烁）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stars.forEach(s => {
      const tw = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
      const alpha = s.baseAlpha * (0.5 + tw*0.5);
      ctx.fillStyle = `hsla(${s.hue}, 75%, 85%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.sz, 0, Math.PI*2);
      ctx.fill();
      if (s.sz > 1.4){
        const r = s.sz*5;
        const rg = ctx.createRadialGradient(s.x*w, s.y*h, 0, s.x*w, s.y*h, r);
        rg.addColorStop(0, `hsla(${s.hue}, 80%, 90%, ${alpha*0.4})`);
        rg.addColorStop(1, `hsla(${s.hue}, 80%, 90%, 0)`);
        ctx.fillStyle = rg;
        ctx.fillRect(s.x*w - r, s.y*h - r, r*2, r*2);
      }
    });
    ctx.restore();

    // 4. 漂浮萤火粒子（缓慢上升 + 呼吸）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    motes.forEach(m => {
      m.x += m.vx;
      m.y += m.vy;
      if (m.y < -0.05){ m.y = 1.05; m.x = Math.random(); }
      if (m.x < 0) m.x = 1; else if (m.x > 1) m.x = 0;
      const pulse = 0.5 + 0.5 * Math.sin(t * m.pulseSpeed + m.phase);
      const alpha = m.baseAlpha * (0.4 + pulse*0.6);
      const r = m.r * (0.8 + pulse*0.5);
      const grd = ctx.createRadialGradient(m.x*w, m.y*h, 0, m.x*w, m.y*h, r*4);
      grd.addColorStop(0, `hsla(${m.hue}, 85%, 80%, ${alpha})`);
      grd.addColorStop(0.4, `hsla(${m.hue}, 85%, 70%, ${alpha*0.4})`);
      grd.addColorStop(1, `hsla(${m.hue}, 85%, 60%, 0)`);
      ctx.fillStyle = grd;
      ctx.fillRect(m.x*w - r*4, m.y*h - r*4, r*8, r*8);
    });
    ctx.restore();

    // 5. 流星雨（更频繁）
    if (t - lastMeteorTime > 800 + Math.random()*1800 && meteors.length < MAX_METEORS){
      meteors.push(spawnMeteor());
      lastMeteorTime = t;
    }
    meteors = meteors.filter(m => m.life < m.maxLife);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    meteors.forEach(m => {
      m.x += m.vx; m.y += m.vy;
      m.life++;
      const x0 = m.x*w, y0 = m.y*h;
      const tx = (m.x - m.vx*m.len*100)*w, ty = (m.y - m.vy*m.len*100)*h;
      const g = ctx.createLinearGradient(tx, ty, x0, y0);
      g.addColorStop(0, `hsla(${m.hue}, 80%, 85%, 0)`);
      g.addColorStop(0.7, `hsla(${m.hue}, 90%, 95%, 0.45)`);
      g.addColorStop(1, `hsla(${m.hue}, 95%, 100%, 0.95)`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x0, y0);
      ctx.stroke();
      const hr = 8;
      const hg = ctx.createRadialGradient(x0, y0, 0, x0, y0, hr);
      hg.addColorStop(0, `hsla(${m.hue}, 95%, 100%, 0.9)`);
      hg.addColorStop(1, `hsla(${m.hue}, 95%, 100%, 0)`);
      ctx.fillStyle = hg;
      ctx.fillRect(x0 - hr, y0 - hr, hr*2, hr*2);
    });
    ctx.restore();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

function shuffle(arr){

  for (let i=a.length-1;i>0;i--){

}

function fibonacciSphere(n, radius){
  const points = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(1 - y*y);
    const theta = phi * i;
    const x = Math.cos(theta)*r;
    const z = Math.sin(theta)*r;
    points.push(new THREE.Vector3(x*radius, y*radius, z*radius));
  }
  return points;
}

async function buildSphereWall(photosData){

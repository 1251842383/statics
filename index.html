  const allItems = [];
  CHAPTERS.forEach((ch, ci) => {
    if (!ch.folder) return;
    const photos = photosData[ch.folder]?.original || [];
    const shuffled = shuffle(photos);
    shuffled.forEach((p, i) => {
      if (!p) return;
      allItems.push({
        chapterIdx: ci,
        src: `${ch.folder}/${p}`,
        thumbSrc: `${ch.folder}/thumb_small/${p.replace(/^thumb\//,'')}`,
        isMain: i === 0
      });
    });
  });

  const loader = document.getElementById('loader');
  const loaderRing = document.getElementById('loaderRing');
  const loaderPct = document.getElementById('loaderPct');
  const loaderCount = document.getElementById('loaderCount');
  const loaderTotal = document.getElementById('loaderTotal');
  const loaderThumbs = document.getElementById('loaderThumbs');
  loader.classList.add('show');
  loaderTotal.textContent = allItems.length;

  // 用 Fibonacci 球面分布一次性占完所有位置
  const totalPositions = allItems.length;
  const allPositions = fibonacciSphere(totalPositions, SPHERE_R - 2.5);

  // 缩略图条：滚动到底，保证最新缩略图可见
  const RING_CIRCUM = 339.292;  // 2π * 54

  function loadOne(item, idx){
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        resolve({ item, tex, idx, ok:true, thumbImg: img });
      };
      img.onerror = () => resolve({ item, tex:null, idx, ok:false, thumbImg: null });
      img.src = item.thumbSrc;
    });
  }

  function addPhotoToSphere(item, tex, posIndex){
    const img = tex.image;
    const aspect = img.width / img.height;
    const baseH = 6.5;
    const baseW = baseH * aspect;
    const geo = new THREE.PlaneGeometry(baseW, baseH);
    const mat = new THREE.MeshBasicMaterial({ map: tex, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(allPositions[posIndex]);
    mesh.lookAt(0, 0, 0);
    mesh.scale.set(0.01, 0.01, 0.01);
    photoGroup.add(mesh);
    photoMeshes.push({
      mesh, chapterIdx: item.chapterIdx, src: item.src,
      basePos: allPositions[posIndex].clone(),
      positionMul: 1.0
    });
    window.photoCount = photoMeshes.length;
  }

  let loadedCount = 0;
  const totalCount = allItems.length;

  const allPromises = allItems.map((item, idx) =>
    loadOne(item, idx).then(result => {
      loadedCount++;
      const pct = Math.floor(loadedCount / totalCount * 100);
      // 更新 SVG ring
      const offset = RING_CIRCUM * (1 - pct/100);
      if (loaderRing) loaderRing.style.strokeDashoffset = offset;
      // 更新数字 + 计数器
      if (loaderPct) loaderPct.textContent = pct;
      if (loaderCount) loaderCount.textContent = loadedCount;
      // DNA helix reveal progress
      if (window.__setLoaderProgress) window.__setLoaderProgress(loadedCount / totalCount);
      // 添加缩略图到条带
      if (loaderThumbs && result.thumbImg){
        const t = document.createElement('div');
        t.className = 'loader-thumb';
        t.style.backgroundImage = `url(${item.thumbSrc})`;
        loaderThumbs.appendChild(t);
        // 触发进入动画
        requestAnimationFrame(() => t.classList.add('show'));
        // 横向滚动使最新缩略图可见
        loaderThumbs.scrollLeft = loaderThumbs.scrollWidth;
      }
      return result;
    })
  );

  // 全部加载完（每张 mesh 入场，但先不让 photoGroup 可见）
  const results = await Promise.all(allPromises);

  // 把所有 mesh 添加到 photoGroup
  results.forEach(r => {
    if (r.ok) addPhotoToSphere(r.item, r.tex, r.idx);
  });

  // 触发 DNA → 心形聚合
  if (window.__setLoaderProgress) window.__setLoaderProgress(1);
  if (window.__setLoaderDone) window.__setLoaderDone();
  // 移动端：触发中心玫瑰绽放
  if (window.__setMobileRose) window.__setMobileRose(1);

  // ========== 阶段 2：渐进预加载后续章节图片 ==========
  // 让 loader 保留可见，持续加载 ch01-ch09 的章节照片
  if (typeof CHAPTERS !== 'undefined') {
    let photosByFolder = window.__photosByFolder;
    if (!photosByFolder){
      try {
        const r = await fetch('photos.json');
        const data = await r.json();
        photosByFolder = {};
        Object.keys(data).forEach(k => {
          const e = data[k];
          photosByFolder[k] = Array.isArray(e) ? e : (e?.original || []);
        });
        window.__photosByFolder = photosByFolder;
      } catch(e){
        photosByFolder = {};
      }
    }
    const phase2Start = performance.now();
    // 收集所有章节的全部原图 URL
    const chapterUrls = [];
    CHAPTERS.forEach(ch => {
      if (ch.folder && !ch.isVideo && photosByFolder && photosByFolder[ch.folder]){
        const arr = photosByFolder[ch.folder];
        if (Array.isArray(arr)){
          arr.forEach(p => chapterUrls.push(`${ch.folder}/${p}`));
        }
      }
    });

    // 切换文案（阶段 2）
    const loaderQuote = document.getElementById('loaderQuote');
    const loaderHexText = document.querySelector('.loader-hex-text');
    const loaderCount = document.getElementById('loaderCount');
    const loaderTotal = document.getElementById('loaderTotal');
    const loaderRing = document.getElementById('loaderRing');
    const loaderPct = document.getElementById('loaderPct');

    if (loaderHexText) loaderHexText.textContent = '正 在 收 集 回 忆';
    const phase2Quotes = [
      '把每一个值得纪念的瞬间打包……',
      '让相册提前翻到我们最相爱的那一页',
      '从那年那月那天开始，一页一页翻给你看',
      '这些照片，我都想慢慢讲给你听',
      '时间还很长，我们的故事也是'
    ];
    if (loaderQuote) loaderQuote.textContent = phase2Quotes[0];

    let phase2Loaded = 0;
    const phase2Total = chapterUrls.length;
    if (loaderCount) loaderCount.textContent = '0';
    if (loaderTotal) loaderTotal.textContent = phase2Total;
    if (loaderPct) loaderPct.textContent = '0';

    // 并发预加载（每批 4 张）
    const batchSize = isDesktop ? 6 : 3;
    for (let i = 0; i < chapterUrls.length; i += batchSize){
      const batch = chapterUrls.slice(i, i + batchSize);
      await Promise.all(batch.map(url => preloadImage(url).then(() => {
        phase2Loaded++;
        const pct = Math.floor(phase2Loaded / phase2Total * 100);
        if (loaderPct) loaderPct.textContent = pct;
        if (loaderCount) loaderCount.textContent = phase2Loaded;
        const RING_CIRCUM = 339.292;
        if (loaderRing) loaderRing.style.strokeDashoffset = RING_CIRCUM * (1 - pct/100);
        // 每 20% 切换一句文案
        if (loaderQuote && phase2Total > 0){
          const qi = Math.min(phase2Quotes.length - 1, Math.floor(pct / 20));
          loaderQuote.textContent = phase2Quotes[qi];
        }
      })));
    }

    // 阶段 2 完成：再保留 600ms 让用户看到 100%
    await new Promise(r => setTimeout(r, 600));
  }

  // 显示 loader 还保留 1200ms 让用户看到心形绽放
  await new Promise(r => setTimeout(r, 1500));

  loader.classList.remove('show');
  setTimeout(() => loader.remove(), 500);

  // 整体显示球体（统一入场动画）
  const showStart = performance.now();
  photoMeshes.forEach((p, i) => {
    photoEnterStart.set(p.mesh, showStart + i * 12);  // 12ms 间隔，错落入场
  });
  photoGroup.visible = true;
}

// 旋转控制（拖动 + 自动旋转 + 缩放）
let rotY = 0, rotX = 0;
let camDist = 70;  // 相机到球心距离
const CAM_MIN = 12;   // 最近（飞入球内）
const CAM_MAX = 100;  // 最远（看全貌）
const CAM_DEFAULT = 70;
let autoRotate = true;
let lastTouchX = 0, lastTouchY = 0;
let isDragging = false;
let pinchStartDist = 0;
let pinchStartCamDist = 0;

function applyRotation(){
  photoGroup.rotation.y = rotY;
  photoGroup.rotation.x = rotX;
  homeCamera.position.set(0, 0, camDist);
  homeCamera.lookAt(0, 0, 0);
}
applyRotation();

function getDist(a, b){
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    // 双指捏合
    isDragging = false;
    pinchStartDist = getDist(e.touches[0], e.touches[1]);
    pinchStartCamDist = camDist;
    autoRotate = false;
    return;
  }
  isDragging = true; autoRotate = false;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 2){
    const d = getDist(e.touches[0], e.touches[1]);
    const ratio = pinchStartDist / d;
    camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, pinchStartCamDist * ratio));
    applyRotation();
    return;
  }
  if (!isDragging) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
  applyRotation();
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// 鼠标拖动（PC）
homeRenderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false;
  lastTouchX = e.clientX; lastTouchY = e.clientY;
});
homeRenderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.clientX; lastTouchY = e.clientY;
  applyRotation();
});
homeRenderer.domElement.addEventListener('mouseup', () => isDragging = false);
homeRenderer.domElement.addEventListener('mouseleave', () => isDragging = false);

// 鼠标滚轮缩放（PC）
homeRenderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist + e.deltaY * 0.05));
  autoRotate = false;
  applyRotation();
}, {passive:false});

// 点击照片 - 打开预览大图
const raycaster = new THREE.Raycaster();
const pickMouse = new THREE.Vector2();
let touchDownX = 0, touchDownY = 0;

function pickPhoto(clientX, clientY){
  const rect = homeRenderer.domElement.getBoundingClientRect();
  pickMouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pickMouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pickMouse, homeCamera);
  const meshes = photoMeshes.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length){
    return photoMeshes.find(p => p.mesh === hits[0].object) || null;
  }
  return null;
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  touchDownX = e.touches[0].clientX;
  touchDownY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', e => {
  const dx = Math.abs(e.changedTouches[0].clientX - touchDownX);
  const dy = Math.abs(e.changedTouches[0].clientY - touchDownY);
  if (dx > 8 || dy > 8) return;
  const pm = pickPhoto(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  if (pm) openPreview(pm);
});

homeRenderer.domElement.addEventListener('click', e => {
  const pm = pickPhoto(e.clientX, e.clientY);
  if (pm) openPreview(pm);
});

// 自动旋转 + 高亮镜头正前方的照片 + 共享入场缩放
const photoEnterStart = new WeakMap();  // mesh -> 入场开始时间
const photoPhase = new WeakMap();       // mesh -> 独立呼吸相位

function animateHome(){
  if (autoRotate){
    rotY += 0.0012;
    applyRotation();
  }

  // 中心心脏核心脉动
  const tNow = performance.now() * 0.001;
  const heartbeat = 0.85 + Math.sin(tNow * 2.8) * 0.15;  // 0.7 ~ 1.0
  coreMesh.scale.setScalar(heartbeat);
  haloMesh.scale.setScalar(1 + Math.sin(tNow * 2.8) * 0.15);
  haloMat.opacity = 0.18 + Math.sin(tNow * 2.8) * 0.08;

  // 银河尘埃带慢转
  dust.rotation.y += 0.0005;
  dustMat.opacity = 0.5 + Math.sin(tNow * 1.3) * 0.25;

  // 找到最朝向镜头的照片（z 最大，即最靠近镜头）
  let bestIdx = -1;
  let bestZ = -Infinity;
  const tmpVec = new THREE.Vector3();
  photoMeshes.forEach((p, i) => {
    tmpVec.copy(p.mesh.position).applyEuler(photoGroup.rotation);
    const z = tmpVec.z;
    if (z > bestZ){
      bestZ = z;
      bestIdx = i;
    }
  });

  const now = performance.now();
  photoMeshes.forEach((p, i) => {
    if (!photoEnterStart.has(p.mesh)){
      photoEnterStart.set(p.mesh, now);
      photoPhase.set(p.mesh, Math.random() * Math.PI * 2);
    }
    const elapsed = now - photoEnterStart.get(p.mesh);
    const enterT = elapsed < 0 ? 0 : Math.min(1, elapsed / 600);
    const enterScale = enterT < 1 ? (1 - Math.pow(1 - enterT, 3)) : 1;

    // 高亮条件：相机远时（camDist > 40）所有照片同等显示；相机近时高亮正前方
    const isHi = (i === bestIdx && bestZ > 5 && camDist < 40);
    const targetScale = isHi ? 1.18 : 1.0;
    const cur = p.mesh.scale.x;
    const highlightScale = cur + (targetScale - cur) * 0.1;

    // 照片呼吸：±1.5% 独立相位
    const breathe = 1 + Math.sin(tNow * 1.6 + photoPhase.get(p.mesh)) * 0.015;

    const finalScale = enterT < 1 ? enterScale : highlightScale * breathe;
    p.mesh.scale.set(finalScale, finalScale, 1);

    // 高亮照片沿径向向外浮起（push outward from sphere center）
    if (enterT >= 1 && p.basePos){
      const targetMul = isHi ? 1.03 : 1.0;
      const cur = p.positionMul || 1.0;
      const next = cur + (targetMul - cur) * 0.15;
      p.positionMul = next;
      p.mesh.position.set(p.basePos.x * next, p.basePos.y * next, p.basePos.z * next);
    }
  });

  homeRenderer.render(homeScene, homeCamera);
  requestAnimationFrame(animateHome);
}
animateHome();

// 4. 预览大图（原图懒加载 + 进入章节入口）
// ============================================================
const previewEl = document.getElementById('preview');
const previewStage = document.getElementById('previewStage');
const previewBack = document.getElementById('previewBack');
const previewHint = document.getElementById('previewHint');
const previewDots = document.getElementById('previewDots');

let previewChapterIdx = 0;
let previewPhotos = [];      // 该章节所有原图 URL
let previewPhotoIdx = 0;
let previewAllChapters = {};  // 缓存每章的照片列表

async function openPreview(pm){
  previewChapterIdx = pm.chapterIdx;
  // 取该章节所有照片（不重复）
  const ch = CHAPTERS[previewChapterIdx];
  if (!previewAllChapters[previewChapterIdx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[previewChapterIdx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[previewChapterIdx] = [];
    }
  }
  previewPhotos = previewAllChapters[previewChapterIdx];
  // 找到当前点击的照片在预览列表中的位置
  previewPhotoIdx = previewPhotos.findIndex(p => p === pm.src);
  if (previewPhotoIdx < 0) previewPhotoIdx = 0;

  previewEl.classList.add('active');
  homeEl.style.display = 'none';
  previewBack.classList.add('show');
  setTimeout(() => previewHint.classList.add('show'), 600);

  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';
  document.getElementById('openChapterBtn').style.display = 'none';

  buildPreviewDots();
  renderPreview();
}

function buildPreviewDots(){
  previewDots.innerHTML = '';
  previewPhotos.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (i === previewPhotoIdx) d.classList.add('active');
    d.addEventListener('click', e => { e.stopPropagation(); previewPhotoIdx = i; renderPreview(); });
    previewDots.appendChild(d);
  });
  previewDots.classList.add('show');
}

function renderPreview(){
  const ch = CHAPTERS[previewChapterIdx];
  previewStage.innerHTML = `
    <div class="preview-info">
      <div class="pn">No.${String(previewChapterIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="pt">${ch.title}</div>
    </div>
  `;
  // 加载原图
  const loading = document.createElement('div');
  loading.className = 'preview-loading';
  loading.textContent = '加载原图中…';
  previewStage.appendChild(loading);

  const url = previewPhotos[previewPhotoIdx];
  const img = new Image();
  img.onload = () => {
    loading.remove();
    const slide = document.createElement('div');
    slide.className = 'preview-slide show';
    slide.innerHTML = `<img src="${url}" alt="${ch.title}">`;
    previewStage.appendChild(slide);
    // 更新 dots
    previewDots.querySelectorAll('.pdot').forEach((d, i) => d.classList.toggle('active', i === previewPhotoIdx));
  };
  img.onerror = () => {
    loading.textContent = '加载失败';
  };
  img.src = url;
}

function closePreview(){
  previewEl.classList.remove('active');
  homeEl.style.display = 'block';
  previewBack.classList.remove('show');
  previewHint.classList.remove('show');
  previewDots.classList.remove('show');
  document.getElementById('homeTitle').style.display = 'block';
  document.getElementById('homeHint').style.display = 'block';
  document.getElementById('openChapterBtn').style.display = 'inline-flex';
  previewStage.innerHTML = '';
}

previewBack.addEventListener('click', closePreview);

// 预览页触摸切换
let prevTSX = 0, prevTSY = 0, prevTST = 0;
previewEl.addEventListener('touchstart', e => {
  prevTSX = e.touches[0].clientX;
  prevTSY = e.touches[0].clientY;
  prevTST = performance.now();
}, {passive:true});
previewEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - prevTSX;
  const dy = e.changedTouches[0].clientY - prevTSY;
  const dt = performance.now() - prevTST;
  if (dt > 600) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    // 左右滑 → 切换章节
    if (dx < 0) previewNextChapter();
    else previewPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 → 切换同章节照片
    if (dy < 0) previewNext();
    else previewPrev();
  }
}, {passive:true});

function previewNext(){
  if (previewPhotoIdx < previewPhotos.length - 1){
    previewPhotoIdx++;
    renderPreview();
  }
}
function previewPrev(){
  if (previewPhotoIdx > 0){
    previewPhotoIdx--;
    renderPreview();
  }
}
function previewNextChapter(){
  // 找到下一个有 folder 的章节
  for (let i = previewChapterIdx + 1; i < CHAPTERS.length; i++){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
function previewPrevChapter(){
  for (let i = previewChapterIdx - 1; i >= 0; i--){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
async function switchPreviewChapter(idx){
  previewChapterIdx = idx;
  const ch = CHAPTERS[idx];
  if (!previewAllChapters[idx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[idx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[idx] = [];
    }
  }
  previewPhotos = previewAllChapters[idx];
  previewPhotoIdx = 0;
  buildPreviewDots();
  renderPreview();
}

const viewerEl = document.getElementById('viewer');

// ============================================================
// 5. 章节全屏视图 —— 每章专属场景 + 3D 相册（book/flow/stack）
// ============================================================
// (viewerEl/Stage/Back/Dots 已在上方声明，viewerIdx/Photos 在上面已声明)
let viewerPhotoIdx = 0;
let viewerMode = 'flow';  // book / flow / stack
let viewerFxState = { stop: true };

async function openChapter(idx){

  const ch = CHAPTERS[idx];
  viewerEl.classList.add('active');
  homeEl.style.display = 'none';
  viewerBack.classList.add('show');

  viewerPhotos = [];
  if (ch.folder){
    const data = await loadPhotosData();
    const entry = data[ch.folder];
    const arr = Array.isArray(entry) ? entry : (entry?.original || []);
    arr.forEach(p => viewerPhotos.push(`${ch.folder}/${p}`));
  }
  if (!viewerPhotos.length && ch.folder && !ch.isVideo){
    const fromSphere = photoMeshes.filter(p => p.chapterIdx === idx).map(p => p.src);
    viewerPhotos = fromSphere;
  }

  // 根据照片数选择展示模式
  const n = viewerPhotos.length;
  if (ch.isCover) viewerMode = 'cover';
  else if (ch.isWish) viewerMode = 'wish';
  else if (ch.isVideo) viewerMode = 'filmstrip';
  else if (n <= 8) viewerMode = 'book';
  else if (n <= 18) viewerMode = 'flow';
  else viewerMode = 'stack';

  viewerPhotoIdx = 0;
  buildViewerDots();
  renderChapterScene();
}

function buildViewerDots(){
  viewerDots.innerHTML = '';
  CHAPTERS.forEach((_,i) => {
    if (CHAPTERS[i].isCover || CHAPTERS[i].isWish || CHAPTERS[i].folder){
      const d = document.createElement('button');
      d.className = 'vdot';
      if (i === viewerIdx) d.classList.add('active');
      d.addEventListener('click', e => { e.stopPropagation(); openChapter(i); });
      viewerDots.appendChild(d);
    }
  });
  viewerDots.classList.add('show');
}

// ============================================================
// 场景渲染（每章专属氛围 + 3D 相册）
// ============================================================
let autoAdvTimer = null;
// 预加载图片缓存
const _imgCache = new Map();
function preloadImage(url){
  if (_imgCache.has(url)) return _imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
  _imgCache.set(url, p);
  return p;
}

// ============================================================
// 桌面端：每章 Three.js 专属 3D 背景
// ============================================================
let chapterThree = null;
function destroyChapterThree(){
  if (chapterThree && chapterThree.stop){ chapterThree.stop(); chapterThree = null; }
}
function startChapterThree(sceneEl, ch){
  if (!isDesktop || !sceneEl || !ch) return;
  destroyChapterThree();

  // 用 scene-fx canvas 容器做 3D 渲染
  const host = sceneEl;
  const w = host.clientWidth || window.innerWidth;
  const h = host.clientHeight || window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  renderer.setClearColor(0x000000, 0);
  host.appendChild(renderer.domElement);
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2';

  const threeScene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, w/h, 0.1, 200);
  camera.position.set(0, 0, 14);

  const objs = [];
  const fx = ch.effect;

  // 根据章节选择 3D 场景
  if (fx === 'meteor'){
    // ch01 在那之前：流星雨
    const N = 80;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 30;
      pos[i*3+1] = (Math.random()-0.5) * 20;
      pos[i*3+2] = (Math.random()-0.5) * 10;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xfff0fa, size: 0.08, transparent: true, opacity: 0.95, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'meteor', mesh: pts, geo, mat, basePos: pos.slice() });
  } else if (fx === 'snow'){
    // ch02 峨眉雪：雪花（白色 sprite 粒子）
    const N = 120;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const vy = new Float32Array(N);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 24;
      pos[i*3+1] = (Math.random()-0.5) * 18;
      pos[i*3+2] = (Math.random()-0.5) * 8;
      vy[i] = 0.02 + Math.random()*0.06;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.85, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'snow', mesh: pts, geo, mat, vy });
  } else if (fx === 'lantern'){
    // ch03 山城之夜：暖灯笼群
    for (let i = 0; i < 14; i++){
      const g = new THREE.SphereGeometry(0.45 + Math.random()*0.25, 16, 12);
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.05 + Math.random()*0.05, 0.85, 0.55 + Math.random()*0.15), transparent: true, opacity: 0.85 });
      const s = new THREE.Mesh(g, m);
      s.position.set((Math.random()-0.5)*16, (Math.random()-0.5)*10, (Math.random()-0.5)*4);
      s.userData = { vy: 0.005 + Math.random()*0.01, ph: Math.random()*Math.PI*2, baseY: s.position.y };
      threeScene.add(s);
      objs.push({ kind:'lantern', mesh: s });
      // 光晕
      const hg = new THREE.SphereGeometry(0.9 + Math.random()*0.4, 12, 8);
      const hm = new THREE.MeshBasicMaterial({ color: m.color, transparent: true, opacity: 0.18 });
      const h = new THREE.Mesh(hg, hm);
      h.position.copy(s.position);
      threeScene.add(h);
      objs.push({ kind:'lantern-glow', mesh: h, parent: s });
    }
  } else if (fx === 'wave'){
    // ch04 北海海风：海面波浪（顶点位移）
    const geo = new THREE.PlaneGeometry(28, 16, 32, 16);
    geo.rotateX(-Math.PI/2);
    const mat = new THREE.MeshBasicMaterial({ color: 0x1a4060, transparent: true, opacity: 0.45, wireframe: false });
    const sea = new THREE.Mesh(geo, mat);
    sea.position.y = -2;
    threeScene.add(sea);
    objs.push({ kind:'wave', mesh: sea, geo });
    // 远处水平线
    const hgeo = new THREE.PlaneGeometry(40, 0.02, 1, 1);
    const hmat = new THREE.MeshBasicMaterial({ color: 0x88c0e8, transparent: true, opacity: 0.4 });
    const hor = new THREE.Mesh(hgeo, hmat);
    hor.position.set(0, 1, -12);
    threeScene.add(hor);
  } else if (fx === 'petal'){
    // ch05 那年毕业：樱花瓣粒子
    const N = 90;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const vy = new Float32Array(N);
    const vx = new Float32Array(N);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 22;
      pos[i*3+1] = (Math.random()-0.5) * 14;
      pos[i*3+2] = (Math.random()-0.5) * 6;
      vy[i] = -(0.02 + Math.random()*0.05);
      vx[i] = (Math.random()-0.5)*0.04;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffb0c4, size: 0.22, transparent: true, opacity: 0.85, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'petal3d', mesh: pts, geo, mat, vy, vx });
  } else if (fx === 'rose'){
    // ch07 我们结婚了：玫瑰金光粒子环绕
    const N = 60;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const phases = new Float32Array(N);
    for (let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2;
      const r = 4 + Math.random() * 2.5;
      pos[i*3]   = Math.cos(a) * r;
      pos[i*3+1] = (Math.random()-0.5) * 6;
      pos[i*3+2] = Math.sin(a) * r;
      phases[i] = a;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffd0a0, size: 0.18, transparent: true, opacity: 0.9, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'rose-orbit', mesh: pts, geo, mat, phases });
  } else if (fx === 'bubble'){
    // ch08 柯柯来了：气球群
    for (let i = 0; i < 18; i++){
      const r = 0.4 + Math.random() * 0.5;
      const g = new THREE.SphereGeometry(r, 14, 10);
      const hue = 0.92 + Math.random()*0.06;
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.7), transparent: true, opacity: 0.7 });
      const s = new THREE.Mesh(g, m);
      s.position.set((Math.random()-0.5)*18, (Math.random()-0.5)*12, (Math.random()-0.5)*6);
      s.userData = { ph: Math.random()*Math.PI*2, baseY: s.position.y, bob: 0.3 + Math.random()*0.5 };
      threeScene.add(s);
      objs.push({ kind:'balloon', mesh: s });
    }
  } else if (fx === 'film'){
    // ch09 时光影片：胶片孔 + 浮尘
    const N = 40;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 24;
      pos[i*3+1] = (Math.random()-0.5) * 16;
      pos[i*3+2] = (Math.random()-0.5) * 8;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffe8c0, size: 0.08, transparent: true, opacity: 0.7, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'film', mesh: pts });
  } else if (fx === 'bokeh'){
    // ch06 在一起：金色圆斑（远景 3D 圆盘）
    for (let i = 0; i < 18; i++){
      const g = new THREE.CircleGeometry(0.3 + Math.random()*0.6, 18);
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.1 + Math.random()*0.06, 0.85, 0.6), transparent: true, opacity: 0.35 + Math.random()*0.3 });
      const c = new THREE.Mesh(g, m);
      c.position.set((Math.random()-0.5)*20, (Math.random()-0.5)*14, -3 - Math.random()*4);
      c.userData = { ph: Math.random()*Math.PI*2 };
      threeScene.add(c);
      objs.push({ kind:'bokeh3d', mesh: c });
    }
  }

  let raf = 0, stop = false;
  function onResize(){
    const w2 = host.clientWidth || window.innerWidth;
    const h2 = host.clientHeight || window.innerHeight;
    renderer.setSize(w2, h2, false);
    camera.aspect = w2/h2;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);

  function tick(t){
    if (stop) return;
    raf = requestAnimationFrame(tick);
    const ts = t * 0.001;
    camera.position.x = Math.sin(ts*0.2) * 0.4;
    camera.position.y = Math.cos(ts*0.15) * 0.3;
    camera.lookAt(0, 0, 0);

    for (const o of objs){
      if (o.kind === 'meteor'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i]   -= 0.04;
          arr[i+1] -= 0.015;
          if (arr[i] < -15){ arr[i] = 15; arr[i+1] = (Math.random()-0.5)*20; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'snow'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] -= o.vy[i/3];
          arr[i] += Math.sin(ts + i) * 0.005;
          if (arr[i+1] < -10){ arr[i+1] = 10; arr[i] = (Math.random()-0.5)*24; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'lantern'){
        o.mesh.position.y = o.mesh.userData.baseY + Math.sin(ts * 1.2 + o.mesh.userData.ph) * 0.4;
        if (o.mesh.material.opacity !== undefined){
          o.mesh.material.opacity = 0.7 + 0.2 * Math.sin(ts*2 + o.mesh.userData.ph);
        }
      } else if (o.kind === 'lantern-glow'){
        o.mesh.position.copy(o.parent.position);
        o.mesh.material.opacity = 0.15 + 0.05 * Math.sin(ts*1.5);
      } else if (o.kind === 'wave'){
        const pos = o.geo.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3){
          const x = pos[i], z = pos[i+2];
          pos[i+1] = Math.sin(x*0.4 + ts*1.6) * 0.35 + Math.cos(z*0.3 + ts*1.2) * 0.25;
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'petal3d'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] += o.vy[i/3];
          arr[i]   += o.vx[i/3] + Math.sin(ts*1.4 + i)*0.005;
          if (arr[i+1] < -8){ arr[i+1] = 8; arr[i] = (Math.random()-0.5)*22; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'rose-orbit'){
        o.mesh.rotation.y = ts * 0.25;
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] += Math.sin(ts*0.8 + o.phases[i/3]) * 0.005;
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'balloon'){
        o.mesh.position.y = o.mesh.userData.baseY + Math.sin(ts*0.8 + o.mesh.userData.ph) * o.mesh.userData.bob;
      } else if (o.kind === 'film'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] -= 0.005;
          if (arr[i+1] < -8){ arr[i+1] = 8; arr[i] = (Math.random()-0.5)*24; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'bokeh3d'){
        const m = o.mesh.material;
        m.opacity = 0.25 + 0.2 * Math.sin(ts*0.6 + o.mesh.userData.ph);
      }
    }

    renderer.render(threeScene, camera);
  }
  raf = requestAnimationFrame(tick);

  chapterThree = {
    stop: () => {
      stop = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      try { renderer.dispose(); } catch(e){}
      const dom = renderer.domElement;
      if (dom && dom.parentNode) dom.parentNode.removeChild(dom);
    }
  };
}

function clearAutoAdvance(){
  if (autoAdvTimer) { clearTimeout(autoAdvTimer); autoAdvTimer = null; }
}
function startAutoAdvance(scene){
  clearAutoAdvance();
  if (viewerPhotos.length <= 1) return;  // 单张无需自动切换
  // 根据模式不同时间略不同（保证用户有时间读完文案 + 图片加载完成）
  const interval = viewerMode === 'book' ? 6500 : (viewerMode === 'stack' ? 5500 : 5000);
  autoAdvTimer = setTimeout(async () => {
    if (!scene.isConnected) return;
    // 计算下一张的索引
    const total = viewerPhotos.length;
    const nextIdx = (viewerPhotoIdx + 1) % total;
    // 等待下一张图片加载完成（最多等 5 秒超时）
    await Promise.race([
      preloadImage(viewerPhotos[nextIdx]),
      new Promise(r => setTimeout(r, 5000))
    ]);
    if (!scene.isConnected) return;
    // 触发切换
    if (viewerMode === 'book' && scene._book){
      bookFlip(scene._book, 'next');
    } else if (viewerMode === 'flow' && scene._flow){
      flowGo(scene, 'next');
    } else if (viewerMode === 'stack' && scene._stack){
      stackGo(scene, 'next');
    }
    // 切到下一张后再启动下一个
    startAutoAdvance(scene);
  }, interval);
}

function renderChapterScene(){
  clearAutoAdvance();
  viewerFxState.stop = true;
  destroyChapterThree();
  viewerStage.innerHTML = '';
  const ch = CHAPTERS[viewerIdx];

  if (viewerMode === 'cover'){
    renderCoverScene(ch);
    return;
  }
  if (viewerMode === 'wish'){
    renderWishScene(ch);
    return;
  }

  // 普通章节场景：背景 + 装饰 + 3D 相册 + 文案
  const scene = document.createElement('div');
  scene.className = `scene ch${String(viewerIdx).padStart(2,'0')}`;
  scene.innerHTML = `
    <div class="scene-bg"></div>
    <div class="scene-deco"></div>
    <canvas class="scene-fx"></canvas>
    <div class="scene-frame" id="sceneFrame"></div>
    <div class="scene-info" data-ch="${ch.id}">
      <div class="scene-num">No.${String(viewerIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="scene-title">${ch.title}</div>
      <div class="scene-en">${ch.en}</div>
      <div class="scene-text">${(ch.text || '').split('').map(c => `<span class="ch">${c === '\n' ? '<br>' : c}</span>`).join('')}${isDesktop ? '<span class="text-sweep"></span>' : ''}</div>
    </div>
    <div class="scene-counter">${viewerPhotoIdx + 1} / ${viewerPhotos.length}</div>
    <div class="scene-hint">
      <span><span class="ico"></span>左 右 · 翻 章</span>
      ${viewerMode === 'filmstrip'
        ? '<span><span class="ico"></span>点 击 · 播 放</span>'
        : '<span><span class="ico"></span>上 下 · 换 照</span>'}
    </div>`;
  viewerStage.appendChild(scene);

  // 渲染 3D 相册
  if (viewerMode === 'book') renderBook(scene);
  else if (viewerMode === 'flow') renderFlow(scene);
  else if (viewerMode === 'stack') renderStack(scene);
  else if (viewerMode === 'filmstrip') renderFilmstrip(scene);

  // 启动章节特效
  startChapterFx(scene, ch);
  startChapterThree(scene, ch);

  // 启动自动切换（视频章节不自动）
  if (viewerMode !== 'filmstrip') startAutoAdvance(scene);
}

// 视频胶片章 —— 横向胶片条 + 点击播放
function renderFilmstrip(scene){
  const frame = scene.querySelector('#sceneFrame');
  frame.style.height = '70vh';
  frame.style.flexDirection = 'column';

  const strip = document.createElement('div');
  strip.className = 'filmstrip';
  frame.appendChild(strip);

  viewerPhotos.forEach((url, i) => {
    const card = document.createElement('div');
    card.className = 'film-card';
    card.innerHTML = `
      <div class="film-frame">
        <video src="${url}" preload="metadata" muted playsinline></video>
        <div class="film-play">▶</div>
        <div class="film-grain"></div>
      </div>
      <div class="film-num">No.${String(i+1).padStart(2,'0')}</div>
    `;
    card.addEventListener('click', () => openVideoPlayer(url, i));
    strip.appendChild(card);
  });

  scene._filmstrip = strip;
}

function openVideoPlayer(url, idx){
  // 创建全屏播放器
  const overlay = document.createElement('div');
  overlay.className = 'video-overlay';
  overlay.innerHTML = `
    <button class="video-close">×</button>
    <video src="${url}" controls autoplay playsinline></video>
    <div class="video-info">No.${String(idx+1).padStart(2,'0')} · ${viewerPhotos.length}</div>
  `;
  document.body.appendChild(overlay);
  const close = () => {
    const v = overlay.querySelector('video');
    if (v) v.pause();
    overlay.remove();
  };
  overlay.querySelector('.video-close').addEventListener('click', close);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) close();
  });
}

// 3D 相册：book —— 翻页效果
function renderBook(scene){
  const frame = scene.querySelector('#sceneFrame');
  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  // 立体对开相册：左页 = 当前照片的左半/前一页，右页 = 当前
  const book = document.createElement('div');
  book.className = 'book';
  const spread = document.createElement('div');
  spread.className = 'book-spread';

  const left = document.createElement('div');
  left.className = 'book-page left';
  const prevIdx = (curIdx - 1 + total) % total;
  left.innerHTML = `<img src="${viewerPhotos[prevIdx]}" alt="page ${prevIdx+1}"><div class="page-corner"></div><div class="page-num">— ${String(prevIdx+1).padStart(2,'0')} —</div>`;
  spread.appendChild(left);

  const right = document.createElement('div');
  right.className = 'book-page right';
  right.innerHTML = `<img src="${viewerPhotos[curIdx]}" alt="page ${curIdx+1}"><div class="page-corner"></div><div class="page-num">— ${String(curIdx+1).padStart(2,'0')} —</div>`;
  spread.appendChild(right);

  book.appendChild(spread);
  frame.appendChild(book);

  // 桌面端：鼠标视差（轻微倾斜跟随）
  if (isDesktop) {
    book.style.transition = 'transform .6s cubic-bezier(.2,.8,.2,1)';
    book.style.transformStyle = 'preserve-3d';
    applyBookParallax(book);
  }

  book._state = { curIdx, total, bookEl: book, spread, right, flipping: false };
  scene._book = book;
}

// 单 rAF 循环驱动当前活跃 book 的视差（避免每渲染一次就泄漏 rAF）
let _parallaxBook = null;
let _parallaxFlow = null;
let _parallaxStack = null;
let _parallaxRaf = 0;
function applyBookParallax(book) {
  _parallaxBook = book;
  if (!_parallaxRaf) _parallaxRaf = requestAnimationFrame(parallaxTick);
}
function applyFlowParallax(flow) {
  _parallaxFlow = flow;
  if (!_parallaxRaf) _parallaxRaf = requestAnimationFrame(parallaxTick);
}
function applyStackParallax(hero) {
  _parallaxStack = hero;
  if (!_parallaxRaf) _parallaxRaf = requestAnimationFrame(parallaxTick);
}
function parallaxTick() {
  _parallaxRaf = 0;
  if (_parallaxBook && _parallaxBook.isConnected) {
    _parallaxBook.style.transform = `rotateY(${mouse.nx * 6}deg) rotateX(${-mouse.ny * 4}deg)`;
  }
  if (_parallaxFlow && _parallaxFlow.isConnected) {
    _parallaxFlow.style.transform = `translateY(${mouse.ny * -8}px) perspective(900px) rotateY(${mouse.nx * 4}deg)`;
  }
  if (_parallaxStack && _parallaxStack.isConnected) {
    _parallaxStack.style.transform = `translateX(${mouse.nx * -10}px) translateY(${mouse.ny * -6}px) rotateY(${mouse.nx * 3}deg) rotateX(${-mouse.ny * 2}deg)`;
  }
  if (_parallaxBook || _parallaxFlow || _parallaxStack) {
    _parallaxRaf = requestAnimationFrame(parallaxTick);
  }
}

function bookFlip(book, dir){
  if (book._state.flipping) return;
  const st = book._state;
  const total = st.total;
  let nextIdx = st.curIdx + (dir === 'next' ? 1 : -1);
  if (nextIdx < 0) nextIdx = total - 1;
  if (nextIdx >= total) nextIdx = 0;
  st.flipping = true;

  // 在右页后面准备下一页（隐藏的 .book-next-in，从背面翻入）
  let nextIn = book.querySelector('.book-next-in');
  if (nextIn) nextIn.remove();
  nextIn = document.createElement('div');
  nextIn.className = 'book-next-in';
  nextIn.innerHTML = `<img src="${viewerPhotos[nextIdx]}" alt="page ${nextIdx+1}"><div class="page-num" style="position:absolute;bottom:10px;right:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.7rem;color:rgba(80,60,40,.55);letter-spacing:.15em">— ${String(nextIdx+1).padStart(2,'0')} —</div>`;
  book.appendChild(nextIn);

  // 桌面端：从书脊中线爆出粒子
  if (isDesktop) {
    const sceneEl = book.closest('.scene');
    if (sceneEl) {
      const cw = sceneEl.clientWidth || 393;
      spawnFlipBurst(sceneEl, { cx: cw * 0.5, cy: (sceneEl.clientHeight || 700) * 0.5, count: 36 });
    }
  }

  // 触发翻页动画
  book.classList.add('flipping');

  setTimeout(() => {
    book.classList.remove('flipping');
    if (nextIn) nextIn.remove();
    st.curIdx = nextIdx;
    // 重渲染左 + 右页
    renderBook(book.parentElement.parentElement);
    const counter = book.parentElement.parentElement.querySelector('.scene-counter');
    if (counter) counter.textContent = `${nextIdx + 1} / ${total}`;
  }, 1150);
}

// 3D 相册：flow —— 聚光封面流
function renderFlow(scene){
  const frame = scene.querySelector('#sceneFrame');
  const flow = document.createElement('div');
  flow.className = 'flow';
  frame.appendChild(flow);

  // 桌面端：flow 整体跟随鼠标做 z 轴浮动
  if (isDesktop) {
    flow.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
    applyFlowParallax(flow);
  }

  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  const angleStep = 28;
  const xStep = Math.min(window.innerWidth * 0.30, 130);
  const chTitle = CHAPTERS[viewerIdx].title;
  viewerPhotos.forEach((url, i) => {
    const card = document.createElement('div');
    card.className = 'flow-card' + (i === curIdx ? ' active' : '');
    const offset = i - curIdx;
    let tx = 0, ty = 0, rz = 0, ry = 0, alpha = 1, scale = 1;
    if (offset === 0){
      tx = 0; ty = 0; ry = 0; rz = 0; scale = 1; alpha = 1;
    } else if (offset > 0){
      const off = Math.min(offset, 2);
      tx = off * xStep;
      ty = off * 16;
      ry = -off * angleStep;
      rz = -off * 2.5;
      alpha = Math.max(0.25, 1 - offset * 0.25);
      scale = 1 - off * 0.07;
    } else {
      const off = Math.max(offset, -2);
      tx = off * xStep;
      ty = Math.abs(off) * 16;
      ry = -off * angleStep;
      rz = -off * 2.5;
      alpha = Math.max(0.25, 1 + offset * 0.25);
      scale = 1 - Math.abs(off) * 0.07;
    }
    card.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${scale})`;
    card.style.opacity = alpha;
    card.style.zIndex = 100 - Math.abs(offset);
    card.innerHTML = `
      <img src="${url}" alt="card ${i+1}">
      <div class="flow-vignette"></div>
      <div class="flow-glow"></div>
      <div class="flow-num">No.${String(i+1).padStart(2,'0')}</div>
      <div class="flow-caption">${chTitle}</div>`;
    flow.appendChild(card);
  });

  scene._flow = flow;
}

function flowGo(scene, dir){
  const total = viewerPhotos.length;
  let next = viewerPhotoIdx + (dir === 'next' ? 1 : -1);
  if (next < 0) next = total - 1;
  if (next >= total) next = 0;
  viewerPhotoIdx = next;
  if (isDesktop) spawnFlipBurst(scene, { cx: scene.clientWidth * 0.5, cy: scene.clientHeight * 0.5, count: 28 });
  // 等待图片就绪再重渲染（避免遮挡）
  const url = viewerPhotos[next];
  preloadImage(url).then(ok => {
    renderFlow(scene);
    const counter = scene.querySelector('.scene-counter');
    if (counter) counter.textContent = `${next + 1} / ${total}`;
  });
}

// 3D 相册：stack —— 影院画廊（一图全屏 + Ken Burns + 缩略图条）
function renderStack(scene){
  const frame = scene.querySelector('#sceneFrame');
  const cinema = document.createElement('div');
  cinema.className = 'cinema';

  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  const ch = CHAPTERS[viewerIdx];

  // 影院主图
  const hero = document.createElement('div');
  hero.className = 'cinema-hero';
  hero.innerHTML = `
    <img src="${viewerPhotos[curIdx]}" alt="cinema ${curIdx+1}">
    <div class="cinema-num">No.${String(curIdx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
    <div class="cinema-cap">${ch.title}</div>`;
  cinema.appendChild(hero);

  // 缩略图条
  const thumbs = document.createElement('div');
  thumbs.className = 'cinema-thumbs';
  // 显示当前 ± 8 张
  const range = 12;
  const start = Math.max(0, curIdx - range);
  const end = Math.min(total, curIdx + range + 1);
  for (let i = start; i < end; i++){
    const t = document.createElement('div');
    t.className = 'cinema-thumb' + (i === curIdx ? ' active' : '');
    t.style.backgroundImage = `url(${viewerPhotos[i]})`;
    t.title = `No.${i+1}`;
    t.addEventListener('click', () => {
      if (i === viewerPhotoIdx) return;
      viewerPhotoIdx = i;
      preloadImage(viewerPhotos[i]).then(ok => {
        renderStack(scene);
        const counter = scene.querySelector('.scene-counter');
        if (counter) counter.textContent = `${i + 1} / ${total}`;
        // 自动滚动到 active 缩略图
        setTimeout(() => {
          const act = thumbs.querySelector('.cinema-thumb.active');
          if (act) act.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }, 60);
      });
    });
    thumbs.appendChild(t);
  }
  cinema.appendChild(thumbs);
  frame.appendChild(cinema);

  // 桌面端：影院主图随鼠标轻微倾斜
  if (isDesktop) {
    hero.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
    applyStackParallax(hero);
  }

  scene._stack = cinema;
  // 滚动到 active
  setTimeout(() => {
    const act = thumbs.querySelector('.cinema-thumb.active');
    if (act) act.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }, 60);
}

function stackGo(scene, dir){
  const total = viewerPhotos.length;
  let next = viewerPhotoIdx + (dir === 'next' ? 1 : -1);
  if (next < 0) next = total - 1;
  if (next >= total) next = 0;
  viewerPhotoIdx = next;
  if (isDesktop) spawnFlipBurst(scene, { cx: scene.clientWidth * 0.5, cy: scene.clientHeight * 0.5, count: 32 });

    renderStack(scene);
    const counter = scene.querySelector('.scene-counter');
    if (counter) counter.textContent = `${next + 1} / ${total}`;
  });
}

// 章节特效：每章自定义粒子 + 装饰
function startChapterFx(scene, ch){
  const canvas = scene.querySelector('.scene-fx');
  if (!canvas) return;
  const ctx2 = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  function resize(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const state = { stop: false, particles: [] };
  viewerFxState = state;
  const rand = (a,b) => a + Math.random()*(b-a);
  const cw = () => canvas.width/dpr, chh = () => canvas.height/dpr;
  const fx = ch.effect;

  // 根据章节扩展粒子初始化（移动端粒子数减半以降低 GPU/CPU 压力）
  const mult = isDesktop ? 1 : 0.5;
  const count = (n) => Math.max(4, Math.floor(n * mult));
  if (fx === 'snow'){
    for (let i=0;i<count(60);i++) state.particles.push({x:rand(0,1),y:rand(0,1),r:rand(1.5,4.5),vy:rand(.0006,.0018),vx:rand(-.0003,.0003),ph:rand(0,6.28),alpha:rand(.5,1)});
  } else if (fx === 'meteor'){
    for (let i=0;i<count(20);i++) state.particles.push({x:Math.random(),y:Math.random()*.5,vx:rand(.002,.005),vy:rand(.001,.003)});
  } else if (fx === 'wave'){
    state.phase = 0;
  } else if (fx === 'petal'){
    for (let i=0;i<count(22);i++) state.particles.push({x:Math.random(),y:Math.random(),vy:rand(.0004,.0014),vx:rand(-.0004,.0004),rot:rand(0,6.28),vrot:rand(-.008,.008),sz:rand(5,9),hue:rand(330,360)});
  } else if (fx === 'rose'){
    for (let i=0;i<count(28);i++) state.particles.push({x:Math.random(),y:rand(0,1)+.2,vy:rand(.0003,.0008),vx:rand(-.0003,.0003),sz:rand(2,5),a:rand(.4,.8),ph:rand(0,6.28),hue:rand(340,360)});
  } else if (fx === 'bubble'){
    for (let i=0;i<count(24);i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(4,14),vy:rand(-.001,-.0003),ph:rand(0,6.28)});
  } else if (fx === 'lantern'){
    for (let i=0;i<count(14);i++) state.particles.push({x:Math.random(),y:rand(.3,1),vy:rand(-.0003,-.0001),ph:rand(0,6.28),sz:rand(4,7)});
  } else if (fx === 'bokeh'){
    for (let i=0;i<count(22);i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(10,26),ph:rand(0,6.28),col:`hsl(${rand(20,40)},80%,70%)`});
  } else if (fx === 'heart'){
    for (let i=0;i<count(16);i++) state.particles.push({x:Math.random(),y:rand(.5,1),vy:rand(-.0008,-.0003),sz:rand(8,16),ph:rand(0,6.28)});
  } else if (fx === 'film'){
    // 浮尘 + 偶尔的胶片划痕
    for (let i=0;i<count(25);i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(.6,1.5),vy:rand(-.0003,-.0001),vx:rand(-.0001,.0001),ph:rand(0,6.28),a:rand(.3,.7)});
    state.scratches = [];
    state.scratchTimer = 0;
  }

  const loop = t => {
    if (state.stop) return;
    const w = cw(), h = chh();
    ctx2.clearRect(0,0,w,h);

    if (fx === 'snow'){
      ctx2.fillStyle = 'rgba(255,255,255,.85)';
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(t*.001+p.ph)*.0005;
        if (p.y > 1){p.y=-.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.globalAlpha = p.alpha;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      ctx2.globalAlpha = 1;
    } else if (fx === 'meteor'){
      state.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x>1.2||p.y>1.2){p.x=-.2;p.y=Math.random()*.3;}
        const x0=p.x*w,y0=p.y*h,x1=(p.x-p.vx*80)*w,y1=(p.y-p.vy*80)*h;
        const g=ctx2.createLinearGradient(x1,y1,x0,y0);
        g.addColorStop(0,'rgba(255,220,180,0)');
        g.addColorStop(1,'rgba(255,240,200,.9)');
        ctx2.strokeStyle=g;ctx2.lineWidth=1.8;
        ctx2.beginPath();ctx2.moveTo(x1,y1);ctx2.lineTo(x0,y0);ctx2.stroke();
      });
    } else if (fx === 'wave'){
      ctx2.strokeStyle = 'rgba(180,220,255,.4)';
      ctx2.lineWidth = 1.2;
      const tt = t*.001;
      for (let row=0;row<6;row++){
        ctx2.beginPath();
        const y0 = h*(.5+row*.07);
        for (let x=0;x<=w;x+=8){
          const y = y0 + Math.sin(x*.02-tt*2+row*.5)*5 + Math.sin(x*.01+tt)*3;
          if (x===0)ctx2.moveTo(x,y);else ctx2.lineTo(x,y);
        }
        ctx2.stroke();
      }
    } else if (fx === 'petal'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt+p.rot)*.0006;
        p.rot += p.vrot;
        if (p.y>1.1){p.y=-.1;p.x=Math.random();}
        ctx2.save();ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.rot);
        ctx2.fillStyle=`hsla(${p.hue},75%,82%,.7)`;
        ctx2.beginPath();ctx2.ellipse(0,0,p.sz,p.sz*.6,0,0,Math.PI*2);ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'rose'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y -= p.vy; p.x += Math.sin(tt+p.ph)*.0004;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        ctx2.save();
        ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.ph+tt);
        ctx2.fillStyle=`hsla(${p.hue},70%,75%,${p.a})`;
        ctx2.beginPath();
        // 简化玫瑰花瓣形（5 瓣）
        for (let k=0;k<5;k++){
          const ang = k*Math.PI*2/5;
          ctx2.ellipse(0,0,p.sz*1.4,p.sz*.8,ang,0,Math.PI*2);
        }
        ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'bubble'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt*.5+p.ph)*.0005;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const g=ctx2.createRadialGradient(p.x*w-p.r*.3,p.y*h-p.r*.3,1,p.x*w,p.y*h,p.r);
        g.addColorStop(0,'rgba(255,255,255,.6)');
        g.addColorStop(.5,'rgba(220,240,255,.18)');
        g.addColorStop(1,'rgba(180,220,255,.02)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'lantern'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy;
        if (p.y<0){p.y=1;p.x=Math.random();}
        const al=.4+Math.sin(tt*2+p.ph)*.3;
        const r=p.sz*(1+Math.sin(tt+p.ph)*.2);
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r*4);
        g.addColorStop(0,`rgba(255,180,80,${al})`);
        g.addColorStop(.3,`rgba(255,140,60,${al*.4})`);
        g.addColorStop(1,'rgba(255,100,40,0)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r*4,0,Math.PI*2);ctx2.fill();
        ctx2.fillStyle=`rgba(255,220,150,${al})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'bokeh'){
      const tt=t*.001;
      state.particles.forEach(p => {
        const sc=1+Math.sin(tt*.5+p.ph)*.2;
        const r=p.r*sc;
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r);
        g.addColorStop(0,p.col.replace('70%)','50%)').replace(')',',.4)'));
        g.addColorStop(1,p.col.replace('70%)','40%)').replace(')',',0)'));
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'heart'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt+p.ph)*.0002;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const sc=1+Math.sin(tt+p.ph)*.3;
        const r=p.sz*sc;
        ctx2.save();
        ctx2.translate(p.x*w,p.y*h);
        ctx2.scale(r/16,r/16);
        ctx2.fillStyle=`rgba(255,142,179,${.4+Math.sin(tt+p.ph)*.2})`;
        ctx2.beginPath();
        ctx2.moveTo(0,-2);
        ctx2.bezierCurveTo(-4,-8,-12,-4,-8,4);
        ctx2.bezierCurveTo(-4,8,0,12,0,16);
        ctx2.bezierCurveTo(0,12,4,8,8,4);
        ctx2.bezierCurveTo(12,-4,4,-8,0,-2);
        ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'film'){
      const tt=t*.001;
      // 浮尘
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt*.5+p.ph)*.0002;
        if (p.y<-.05){p.y=1.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.fillStyle=`rgba(255,230,180,${p.a})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      // 胶片划痕（偶发横线闪烁）
      state.scratchTimer -= 16;
      if (state.scratchTimer <= 0 && Math.random() < 0.05){
        state.scratches.push({y: Math.random()*h, life: 8+Math.random()*12, x: 0, speed: 1+Math.random()*2});
        state.scratchTimer = 800 + Math.random()*1500;
      }
      ctx2.strokeStyle = 'rgba(255,240,200,.5)';
      ctx2.lineWidth = 1;
      state.scratches = state.scratches.filter(s => s.life > 0);
      state.scratches.forEach(s => {
        s.x = (s.x + s.speed) % w;
        s.life -= 1;
        ctx2.globalAlpha = Math.min(1, s.life / 12);
        ctx2.beginPath();
        ctx2.moveTo(s.x, s.y);
        ctx2.lineTo(s.x + 30, s.y + (Math.random()-0.5)*4);
        ctx2.stroke();
      });
      ctx2.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

// 在章节视图中：左滑下一章、右滑上一章、上下滑切换同一章内的照片
let viewTouchStartX = 0, viewTouchStartY = 0, viewTouchStartT = 0;
viewerStage.addEventListener('touchstart', e => {
  viewTouchStartX = e.touches[0].clientX;
  viewTouchStartY = e.touches[0].clientY;
  viewTouchStartT = performance.now();
}, {passive:true});
viewerStage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - viewTouchStartX;
  const dy = e.changedTouches[0].clientY - viewTouchStartY;
  const dt = performance.now() - viewTouchStartT;
  if (dt > 600) return;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50){
    // 左右滑 - 切换章节
    if (dx < 0) openNextChapter();
    else if (dx > 0) openPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 - 切换同章节内的照片
    const scene = viewerStage.querySelector('.scene');
    if (!scene || !viewerPhotos.length) return;
    if (dy < 0){
      // 下一张
      if (viewerMode === 'book' && scene._book) bookFlip(scene._book, 'next');
      else if (viewerMode === 'flow' && scene._flow) flowGo(scene, 'next');
      else if (viewerMode === 'stack' && scene._stack) stackGo(scene, 'next');
    } else {
      if (viewerMode === 'book' && scene._book) bookFlip(scene._book, 'prev');
      else if (viewerMode === 'flow' && scene._flow) flowGo(scene, 'prev');
      else if (viewerMode === 'stack' && scene._stack) stackGo(scene, 'prev');
    }
    // 手动滑动后，重启定时器（避免刚滑完又自动跳）
    startAutoAdvance(scene);
  }
}, {passive:true});

function openNextChapter(){

function openPrevChapter(){

function playNote(freq, st, dur, vol, type){
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, st);
  g.gain.linearRampToValueAtTime(vol, st + .02);
  g.gain.exponentialRampToValueAtTime(vol*.5, st + dur*.5);
  g.gain.exponentialRampToValueAtTime(.001, st + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(st); osc.stop(st + dur + .1);
}
function playPad(freqs, st, dur, vol){
  if (!audioCtx) return;
  freqs.forEach(f => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(vol, st + .5);
    g.gain.linearRampToValueAtTime(vol, st + dur - .5);
    g.gain.exponentialRampToValueAtTime(.001, st + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(st); osc.stop(st + dur + .1);
  });
}
function playBGM(name){
  if (!audioCtx || !musicPlaying) return;
  const bgm = BGMS[name];
  if (!bgm) return;
  const tempo = bgm.tempo, beatDur = 60/tempo;
  const t0 = audioCtx.currentTime + .1;
  const loopDur = bgm.melody.reduce((s, n) => s + n.d, 0) * beatDur;

  let t = t0;
  bgm.melody.forEach(n => {
    if (NOTES[n.n] !== undefined)
      playNote(NOTES[n.n], t, n.d * beatDur * .9, bgm.vol, bgm.type);
    t += n.d * beatDur;
  });
  const chordStep = loopDur / bgm.chords.length;
  bgm.chords.forEach((c, i) => {
    c.forEach(note => {
      if (NOTES[note] !== undefined)
        playNote(NOTES[note], t0 + i*chordStep, chordStep*.95, bgm.padVol, 'sine');
    });
  });
  playPad(bgm.chords[0].map(n => NOTES[n]/4).filter(n => n && isFinite(n)), t0, loopDur, bgm.bassVol);

  musicLoopTimer = setTimeout(() => playBGM(name), (loopDur - .3) * 1000);
}
function startMusic(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
}
function stopMusic(){
  musicPlaying = false;
  if (musicLoopTimer) clearTimeout(musicLoopTimer);
  if (audioCtx) audioCtx.suspend();
}
function switchBGM(name){
  if (!audioCtx || !musicPlaying || !name) return;
  if (currentBGM === name) return;
  if (musicLoopTimer) clearTimeout(musicLoopTimer);
  currentBGM = name;
  playBGM(name);
}

        rot: Math.random() * Math.PI * 2,
        rotSpd: -0.05 + Math.random() * 0.1,
        color: `hsl(${340 + Math.random()*30}, ${70 + Math.random()*20}%, ${50 + Math.random()*15}%)`,
        alpha: 0.5 + Math.random() * 0.4
      });
    }
    // 4) 1 朵绽放的大玫瑰（中心装饰）
    let roseReveal = 0; // 0→1 在加载完成时绽放
    function drawRose(cx, cy, r, progress){
      // 多层花瓣组成的玫瑰（简化的几何玫瑰）
      const layers = 5;
      const petalsPerLayer = 7;
      for (let L = 0; L < layers; L++){
        const layerProg = Math.max(0, Math.min(1, (progress * (layers + 1) - L)));
        if (layerProg <= 0) continue;
        const lr = r * (0.4 + L * 0.18);
        const tilt = (L - 2) * 0.18;
        for (let p = 0; p < petalsPerLayer; p++){
          const a = (p / petalsPerLayer) * Math.PI * 2 + L * 0.3;
          const px = cx + Math.cos(a) * lr * 0.3;
          const py = cy + Math.sin(a) * lr * 0.3 + tilt * r * 0.3;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(a + Math.PI/2);
          ctx.scale(layerProg, layerProg);
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r*0.45);
          grad.addColorStop(0, `rgba(255,${130 - L*15},${160 - L*10},${0.9 - L*0.1})`);
          grad.addColorStop(1, `rgba(220,${70 - L*10},${110 - L*8},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(0, -r*0.3, r*0.35, r*0.5, 0, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
      }
      // 花蕊
      ctx.fillStyle = '#fff5b0';
      ctx.globalAlpha = progress;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.12 * progress, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    function drawMobileRomantic(ts){
      const w = window.innerWidth, h = window.innerHeight;
      ctx.fillStyle = 'rgba(20, 8, 30, 0.32)';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2, cy = h * 0.42;
      const pulse = 0.5 + 0.5 * Math.sin(ts * 1.4);
      // 中心柔光晕
      const glowR = 140 + pulse * 60;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      grad.addColorStop(0, `rgba(255,200,220,${0.35 + pulse*0.15})`);
      grad.addColorStop(0.5, `rgba(255,160,200,${0.18 + pulse*0.08})`);
      grad.addColorStop(1, 'rgba(255,140,180,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - glowR, cy - glowR, glowR*2, glowR*2);

      // 心形星座骨架
      ctx.strokeStyle = `rgba(255,180,210,${0.22 + pulse*0.12})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= hearts.length; i++){
        const h0 = hearts[i % hearts.length];
        const px = cx + h0.baseX * h0.scale + Math.sin(ts*0.6 + h0.phase) * 4;
        const py = cy + h0.baseY * h0.scale * -1 + Math.cos(ts*0.5 + h0.phase) * 3;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      // 心形节点光点
      for (const h0 of hearts){
        const px = cx + h0.baseX * h0.scale + Math.sin(ts*0.6 + h0.phase) * 4;
        const py = cy + h0.baseY * h0.scale * -1 + Math.cos(ts*0.5 + h0.phase) * 3;
        const a = (0.6 + 0.4 * Math.sin(ts * 2 + h0.phase)) * h0.pulse;
        ctx.fillStyle = `rgba(255,225,235,${a})`;
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI*2);
        ctx.fill();
      }

      // 樱花瓣飘落（轻旋绽放）
      for (const p of sakura){
        p.x += p.vx + Math.sin(ts*1.2 + p.sway) * 0.4;
        p.y += p.vy;
        p.rot += p.rotSpd;
        if (p.y > h + 20){ p.y = -20; p.x = Math.random() * w; }
        if (p.x > w + 20) p.x = -20;
        if (p.x < -20) p.x = w + 20;
        const bloom = 0.7 + 0.3 * Math.sin(ts * 1.8 + p.bloomPhase);
        drawSakura(ctx, p.x, p.y, p.r, p.rot, p.alpha * bloom, p.color);
      }

      // 玫瑰花瓣飘落（更红更大）
      for (const rp of rosePetals){
        rp.x += rp.vx + Math.sin(ts + rp.rot) * 0.3;
        rp.y += rp.vy;
        rp.rot += rp.rotSpd;
        if (rp.y > h + 20){ rp.y = -20; rp.x = Math.random() * w; }
        ctx.save();
        ctx.translate(rp.x, rp.y);
        ctx.rotate(rp.rot);
        ctx.fillStyle = rp.color;
        ctx.globalAlpha = rp.alpha;
        ctx.beginPath();
        ctx.ellipse(0, 0, rp.r, rp.r*0.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;

      // 中心大玫瑰（加载完成时绽放）
      if (roseReveal > 0){
        drawRose(cx, cy, 38, roseReveal);
      }
    }

    window.__setMobileRose = (p) => { roseReveal = p; };
    window.__drawMobileRomantic = drawMobileRomantic;
    // 2D 浪漫循环不再启动：移动端现在与桌面共用 3D DNA/玫瑰/花瓣舞台
    // （旧循环每帧叠不透明暗色 fill，会把 3D 层完全遮黑）
    function mobileLoop(){
      const ts = performance.now() * 0.001;
      drawMobileRomantic(ts);
      requestAnimationFrame(mobileLoop);
    }
  }

  // ---------- 2D 顶层：节点星网 + hex 流 ----------
  const nodes = [];
  for (let i = 0; i < 26; i++){
    nodes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: 1 + Math.random() * 1.6
    });
  }
  const hexChars = '0123456789ABCDEF';
  const hexCols = 12;
  const hexArr = [];
  for (let i = 0; i < hexCols; i++){
    hexArr.push({ y: Math.random() * window.innerHeight, len: 6 + Math.floor(Math.random()*8), sp: 0.4 + Math.random()*0.8 });
  }

  function drawFx(){
    const w = window.innerWidth, h = window.innerHeight;
    // 关键：用 destination-out 淡出旧帧 —— 保持这层"半透明"而非
    // 每帧叠加暗色收敛成不透明黑幕（那会把背后的 3D 特效完全遮住）
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
    nodes.forEach(n => {
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;
    });
    ctx.strokeStyle = 'rgba(180,140,220,0.18)';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < nodes.length; i++){
      for (let j = i+1; j < nodes.length; j++){
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 140){
          ctx.globalAlpha = (1 - d/140) * 0.4;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    nodes.forEach(n => {
      ctx.fillStyle = 'rgba(255,200,220,0.7)';
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.font = '9px "Courier New", monospace';
    hexArr.forEach((c, i) => {
      c.y += c.sp;
      if (c.y > h + c.len * 12) c.y = -c.len * 12;
      for (let k = 0; k < c.len; k++){
        const ch = hexChars[Math.floor(Math.random() * 16)];
        const fade = 1 - k / c.len;
        ctx.fillStyle = `rgba(140,220,180,${0.06 * fade})`;
        ctx.fillText(ch, i * (w / hexCols) + 4, c.y + k * 12);
      }
    });
    requestAnimationFrame(drawFx);
  }
  // 节点星网 + hex 流：桌面 + 移动端都跑（trail 已改 destination-out，不遮挡 3D）
  drawFx();

  // ---------- 文案 / 日志 / glitch hex ----------
  const quotes = [
    '// compiled with love ♥',
    'while (alive) { love("you"); }',
    'function forever() { return "与你"; }',
    '// 一生一世 = 1314',
    'const us = [相遇, 相爱, 永远];',
    'try { forever } catch (永远) { continue; }',
    '# 始于初见，止于终老',
    '01001001 00100000 01101100 01101111 01110110 00100000 01111001 01101111 01110101'
  ];
  const quoteEl = document.getElementById('loaderQuote');
  let quoteIdx = 0;
  function showQuote(){
    if (!quoteEl) return;
    quoteEl.classList.add('fade');
    setTimeout(() => { quoteEl.textContent = quotes[quoteIdx]; quoteEl.classList.remove('fade'); quoteIdx = (quoteIdx+1) % quotes.length; }, 400);
  }
  showQuote();
  setInterval(showQuote, 3200);

  // glitch hex 标题（背景显示当前 hex hash + 抖动）
  const hexEl = document.getElementById('loaderHex');
  function randomHex(n){
    let s = '0x';
    const c = '0123456789ABCDEF';
    for (let i = 0; i < n; i++) s += c[Math.floor(Math.random()*16)];
    return s;
  }
  if (hexEl){
    setInterval(() => {
      hexEl.setAttribute('data-hex', randomHex(12));
      hexEl.classList.add('shake');
      setTimeout(() => hexEl.classList.remove('shake'), 350);
    }, 1400);
  }

  // 控制台日志（逐行打字）
  const logEl = document.getElementById('loaderLog');
  const logLines = [
    '<span class="k">$</span> <span class="s">love.init()</span> ... <span class="ok">ok</span>',
    '<span class="k">$</span> loading <span class="s">memories.json</span> ...',
    '<span class="k">$</span> binding <span class="s">heart.geometry</span> ... <span class="ok">ok</span>',
    '<span class="k">$</span> <span style="color:#88c0ff">>></span> awaiting your smile <span class="ok">♥</span>'
  ];
  if (logEl){
    let li = 0;
    function typeLine(){
      if (li >= logLines.length){ setTimeout(() => { logEl.innerHTML = ''; li = 0; typeLine(); }, 1800); return; }
      const ln = document.createElement('span');
      ln.className = 'ln';
      ln.innerHTML = logLines[li];
      ln.style.opacity = '0'; ln.style.transform = 'translateX(-4px)';
      ln.style.transition = 'opacity .35s ease, transform .35s ease';
      logEl.appendChild(ln);
      requestAnimationFrame(() => { ln.style.opacity = '1'; ln.style.transform = 'translateX(0)'; });
      while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
      li++;
      setTimeout(typeLine, 1100 + Math.random() * 400);
    }
    setTimeout(typeLine, 600);
  }

  // 彩蛋：F12 控制台
  console.log('%c♥ Compiled with love ♥', 'color:#ff8eb3;font-size:18px;font-weight:bold;text-shadow:0 0 10px #ff8eb3;');
  console.log('%cfor (let i = 0; i < ∞; i++) { love("you"); }', 'color:#c8a2ff;font-size:14px;font-style:italic;');
  console.log('%c// 1314 = 一生一世', 'color:#ffb0c4;font-size:12px;');
  console.log('%c>>> echo " forever & always"', 'color:#88c0ff;font-size:12px;');
  console.log('%c  —— 给最爱的人', 'color:#ffd0e0;font-size:11px;');
})();

// ============================================================
// 1.5 球面背景特效：常驻银河、极光、漂浮粒子、流星雨
// ============================================================
(() => {
  const c = document.getElementById('bgFx');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W, H;
  let stars = [], meteors = [], motes = [], auroraBands = [];

  function resize(){
    W = c.width = window.innerWidth * dpr;
    H = c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // 主星层（近）
  function initStars(){
    stars = [];
    const baseCount = Math.floor((window.innerWidth * window.innerHeight) / 3200);
    for (let i = 0; i < baseCount; i++){
      const isBig = Math.random() < 0.05;
      const hueChoice = Math.random();
      let hue;
      if (hueChoice < 0.55) hue = 200 + Math.random()*40;
      else if (hueChoice < 0.8) hue = 280 + Math.random()*40;
      else hue = 330 + Math.random()*40;
      stars.push({
        x: Math.random(),
        y: Math.random(),
        sz: isBig ? (1.5 + Math.random()*1.5) : (0.3 + Math.random()*1.1),
        baseAlpha: 0.3 + Math.random()*0.7,
        twinkleSpeed: 0.0008 + Math.random()*0.002,
        twinklePhase: Math.random()*Math.PI*2,
        hue
      });
    }
  }
  initStars();

  // 漂浮粒子（暖色萤火，缓慢上升）
  function initMotes(){
    motes = [];
    const count = Math.floor((window.innerWidth * window.innerHeight) / 22000);
    for (let i = 0; i < count; i++){
      motes.push({
        x: Math.random(),
        y: Math.random(),
        r: 1.0 + Math.random()*2.5,
        baseAlpha: 0.25 + Math.random()*0.55,
        vy: -(0.00008 + Math.random()*0.00015),  // 缓慢上升
        vx: (Math.random()-0.5) * 0.00005,
        phase: Math.random()*Math.PI*2,
        pulseSpeed: 0.0008 + Math.random()*0.0012,
        hue: Math.random() < 0.7 ? (35 + Math.random()*20) : (320 + Math.random()*30)
      });
    }
  }
  initMotes();

  // 极光带：2 条横向波幕，慢慢漂移
  function initAurora(){
    auroraBands = [];
    for (let i = 0; i < 2; i++){
      auroraBands.push({
        yBase: 0.15 + i*0.45 + Math.random()*0.15,
        amplitude: 0.08 + Math.random()*0.08,
        freq: 0.5 + Math.random()*0.8,
        speed: 0.00015 + Math.random()*0.0002,
        hue: i === 0 ? (140 + Math.random()*30) : (280 + Math.random()*30),  // 绿/紫
        alpha: 0.10 + Math.random()*0.08,
        phase: Math.random()*Math.PI*2
      });
    }
  }
  initAurora();

  // 流星
  const MAX_METEORS = 6;
  let lastMeteorTime = 0;
  function spawnMeteor(){
    const dir = Math.random() < 0.5 ? 1 : -1;
    return {
      x: dir === 1 ? -0.05 : 1.05,
      y: Math.random() * 0.5,
      vx: 0.006 * dir,
      vy: 0.003 + Math.random()*0.002,
      len: 0.18 + Math.random()*0.12,
      life: 0,
      maxLife: 50 + Math.random()*30,
      hue: dir === 1 ? (Math.random()<0.5 ? 35+Math.random()*15 : 200+Math.random()*40) : 280+Math.random()*40
    };
  }

  function draw(t){
    const w = window.innerWidth, h = window.innerHeight;

    // 底层：极深的紫黑色（不画实底，让球面透明效果保留）
    ctx.fillStyle = 'rgba(3, 1, 10, 0.55)';
    ctx.fillRect(0, 0, w, h);

    // 1. 远景星云（柔光斑缓慢漂移）
    const nebulaAlpha = 0.22;
    const nebulaTime = t * 0.0003;
    const nebulae = [
      { cx: w*0.3 + Math.sin(nebulaTime)*w*0.08, cy: h*0.4 + Math.cos(nebulaTime*0.85)*h*0.06, r: w*0.55, hue: 280 },
      { cx: w*0.75 + Math.cos(nebulaTime*0.7)*w*0.07, cy: h*0.6 + Math.sin(nebulaTime*1.1)*h*0.05, r: w*0.5, hue: 330 },
      { cx: w*0.5 + Math.sin(nebulaTime*1.3)*w*0.09, cy: h*0.25 + Math.cos(nebulaTime*0.6)*h*0.07, r: w*0.6, hue: 200 },
      { cx: w*0.15 + Math.cos(nebulaTime*0.4)*w*0.05, cy: h*0.8 + Math.sin(nebulaTime*0.9)*h*0.04, r: w*0.4, hue: 310 }
    ];
    nebulae.forEach(n => {
      const g = ctx.createRadialGradient(n.cx, n.cy, 0, n.cx, n.cy, n.r);
      g.addColorStop(0, `hsla(${n.hue}, 75%, 55%, ${nebulaAlpha})`);
      g.addColorStop(0.4, `hsla(${n.hue}, 65%, 40%, ${nebulaAlpha*0.5})`);
      g.addColorStop(1, `hsla(${n.hue}, 65%, 20%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });

    // 2. 极光波带（沿横向起伏的彩色光幕）
    auroraBands.forEach(b => {
      b.phase += b.speed;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 用多点横向曲线 + 渐变填充
      const yTop = h * (b.yBase - b.amplitude);
      const yBot = h * (b.yBase + b.amplitude*1.6);
      const grad = ctx.createLinearGradient(0, yTop, 0, yBot);
      grad.addColorStop(0, `hsla(${b.hue}, 70%, 60%, 0)`);
      grad.addColorStop(0.4, `hsla(${b.hue}, 80%, 65%, ${b.alpha})`);
      grad.addColorStop(1, `hsla(${b.hue}, 80%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      const steps = 40;
      for (let i = 0; i <= steps; i++){
        const u = i / steps;
        const x = u * w;
        const y = h*b.yBase + Math.sin(u*b.freq*Math.PI*2 + b.phase) * h*b.amplitude;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      for (let i = steps; i >= 0; i--){
        const u = i / steps;
        const x = u * w;
        const y = h*(b.yBase + b.amplitude*1.4) + Math.sin(u*b.freq*Math.PI*2 + b.phase + 0.6) * h*b.amplitude*0.5;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // 3. 主星点（带 twinkle 闪烁）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stars.forEach(s => {
      const tw = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
      const alpha = s.baseAlpha * (0.5 + tw*0.5);
      ctx.fillStyle = `hsla(${s.hue}, 75%, 85%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.sz, 0, Math.PI*2);
      ctx.fill();
      if (s.sz > 1.4){
        const r = s.sz*5;
        const rg = ctx.createRadialGradient(s.x*w, s.y*h, 0, s.x*w, s.y*h, r);
        rg.addColorStop(0, `hsla(${s.hue}, 80%, 90%, ${alpha*0.4})`);
        rg.addColorStop(1, `hsla(${s.hue}, 80%, 90%, 0)`);
        ctx.fillStyle = rg;
        ctx.fillRect(s.x*w - r, s.y*h - r, r*2, r*2);
      }
    });
    ctx.restore();

    // 4. 漂浮萤火粒子（缓慢上升 + 呼吸）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    motes.forEach(m => {
      m.x += m.vx;
      m.y += m.vy;
      if (m.y < -0.05){ m.y = 1.05; m.x = Math.random(); }
      if (m.x < 0) m.x = 1; else if (m.x > 1) m.x = 0;
      const pulse = 0.5 + 0.5 * Math.sin(t * m.pulseSpeed + m.phase);
      const alpha = m.baseAlpha * (0.4 + pulse*0.6);
      const r = m.r * (0.8 + pulse*0.5);
      const grd = ctx.createRadialGradient(m.x*w, m.y*h, 0, m.x*w, m.y*h, r*4);
      grd.addColorStop(0, `hsla(${m.hue}, 85%, 80%, ${alpha})`);
      grd.addColorStop(0.4, `hsla(${m.hue}, 85%, 70%, ${alpha*0.4})`);
      grd.addColorStop(1, `hsla(${m.hue}, 85%, 60%, 0)`);
      ctx.fillStyle = grd;
      ctx.fillRect(m.x*w - r*4, m.y*h - r*4, r*8, r*8);
    });
    ctx.restore();

    // 5. 流星雨（更频繁）
    if (t - lastMeteorTime > 800 + Math.random()*1800 && meteors.length < MAX_METEORS){
      meteors.push(spawnMeteor());
      lastMeteorTime = t;
    }
    meteors = meteors.filter(m => m.life < m.maxLife);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    meteors.forEach(m => {
      m.x += m.vx; m.y += m.vy;
      m.life++;
      const x0 = m.x*w, y0 = m.y*h;
      const tx = (m.x - m.vx*m.len*100)*w, ty = (m.y - m.vy*m.len*100)*h;
      const g = ctx.createLinearGradient(tx, ty, x0, y0);
      g.addColorStop(0, `hsla(${m.hue}, 80%, 85%, 0)`);
      g.addColorStop(0.7, `hsla(${m.hue}, 90%, 95%, 0.45)`);
      g.addColorStop(1, `hsla(${m.hue}, 95%, 100%, 0.95)`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x0, y0);
      ctx.stroke();
      const hr = 8;
      const hg = ctx.createRadialGradient(x0, y0, 0, x0, y0, hr);
      hg.addColorStop(0, `hsla(${m.hue}, 95%, 100%, 0.9)`);
      hg.addColorStop(1, `hsla(${m.hue}, 95%, 100%, 0)`);
      ctx.fillStyle = hg;
      ctx.fillRect(x0 - hr, y0 - hr, hr*2, hr*2);
    });
    ctx.restore();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

function shuffle(arr){

function fibonacciSphere(n, radius){
  const points = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(1 - y*y);
    const theta = phi * i;
    const x = Math.cos(theta)*r;
    const z = Math.sin(theta)*r;
    points.push(new THREE.Vector3(x*radius, y*radius, z*radius));
  }
  return points;
}

async function buildSphereWall(photosData){
  // 收集所有照片（缩略图用 thumb_small，原图等用户点击才加载）
  const allItems = [];
  CHAPTERS.forEach((ch, ci) => {
    if (!ch.folder) return;
    const photos = photosData[ch.folder]?.original || [];
    const shuffled = shuffle(photos);
    shuffled.forEach((p, i) => {
      if (!p) return;
      allItems.push({
        chapterIdx: ci,
        src: `${ch.folder}/${p}`,
        thumbSrc: `${ch.folder}/thumb_small/${p.replace(/^thumb\//,'')}`,
        isMain: i === 0
      });
    });
  });

  const loader = document.getElementById('loader');
  const loaderCount = document.getElementById('loaderCount');
  const loaderTotal = document.getElementById('loaderTotal');
  const loaderThumbs = document.getElementById('loaderThumbs');
  loader.classList.add('show');
  window.__loaderStartTime = performance.now();  // 用于计算最小 loader 时长
  loaderTotal.textContent = allItems.length;

  // 用 Fibonacci 球面分布一次性占完所有位置
  const totalPositions = allItems.length;
  const allPositions = fibonacciSphere(totalPositions, SPHERE_R - 2.5);

  function loadOne(item, idx){
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        resolve({ item, tex, idx, ok:true, thumbImg: img });
      };
      img.onerror = () => resolve({ item, tex:null, idx, ok:false, thumbImg: null });
      img.src = item.thumbSrc;
    });
  }

  function addPhotoToSphere(item, tex, posIndex){
    const img = tex.image;
    const aspect = img.width / img.height;
    const baseH = 6.5;
    const baseW = baseH * aspect;
    const geo = new THREE.PlaneGeometry(baseW, baseH);
    const mat = new THREE.MeshBasicMaterial({ map: tex, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(allPositions[posIndex]);
    mesh.lookAt(0, 0, 0);
    mesh.scale.set(0.01, 0.01, 0.01);
    photoGroup.add(mesh);
    photoMeshes.push({
      mesh, chapterIdx: item.chapterIdx, src: item.src,
      basePos: allPositions[posIndex].clone(),
      positionMul: 1.0
    });
    window.photoCount = photoMeshes.length;
  }

  let loadedCount = 0;
  const totalCount = allItems.length;

  const allPromises = allItems.map((item, idx) =>
    loadOne(item, idx).then(result => {
      loadedCount++;
      // 更新计数器（光圈进度环已移除）
      if (loaderCount) loaderCount.textContent = loadedCount;
      // DNA helix reveal progress
      if (window.__setLoaderProgress) window.__setLoaderProgress(loadedCount / totalCount);
      // 添加缩略图到条带
      if (loaderThumbs && result.thumbImg){
        const t = document.createElement('div');
        t.className = 'loader-thumb';
        t.style.backgroundImage = `url(${item.thumbSrc})`;
        loaderThumbs.appendChild(t);
        // 触发进入动画
        requestAnimationFrame(() => t.classList.add('show'));
        // 横向滚动使最新缩略图可见
        loaderThumbs.scrollLeft = loaderThumbs.scrollWidth;
      }
      return result;
    })
  );

  // 全部加载完（每张 mesh 入场，但先不让 photoGroup 可见）
  const results = await Promise.all(allPromises);

  // 把所有 mesh 添加到 photoGroup
  results.forEach(r => {
    if (r.ok) addPhotoToSphere(r.item, r.tex, r.idx);
  });

  // 触发 DNA → 心形聚合
  if (window.__setLoaderProgress) window.__setLoaderProgress(1);
  if (window.__setLoaderDone) window.__setLoaderDone();
  // 移动端：触发中心玫瑰绽放
  if (window.__setMobileRose) window.__setMobileRose(1);

  // ========== 阶段 2：loader 内限时预加载前两章，其余进相册后后台加载 ==========
  const MIN_LOADER_DURATION = 15000;  // 与 5 阶段 × 3 秒同步，保证每段特效用户都能看到
  if (typeof CHAPTERS !== 'undefined') {
    let photosByFolder = window.__photosByFolder;
    if (!photosByFolder){
      try {
        const r = await fetch('photos.json');
        const data = await r.json();
        photosByFolder = {};
        Object.keys(data).forEach(k => {
          const e = data[k];
          photosByFolder[k] = Array.isArray(e) ? e : (e?.original || []);
        });
        window.__photosByFolder = photosByFolder;
      } catch(e){
        photosByFolder = {};
      }
    }
    // 收集前两章的全部原图 URL
    const chapterUrls = [];
    const PRELOAD_CHAPTER_COUNT = 2;
    let _preloadedChapters = 0;
    CHAPTERS.forEach(ch => {
      if (ch.folder && !ch.isVideo && photosByFolder && photosByFolder[ch.folder] && _preloadedChapters < PRELOAD_CHAPTER_COUNT){
        const arr = photosByFolder[ch.folder];
        if (Array.isArray(arr)){
          arr.forEach(p => chapterUrls.push(`${ch.folder}/${p}`));
        }
        _preloadedChapters++;
      }
    });

    // 等 DNA + 玫瑰阶段轮播完（STAGE_DURATION*4 ≈ 6.4s）再切阶段 2 文案，
    // 否则本地加载太快会立刻顶掉玫瑰特效的阶段标题
    const STAGE_WAIT = 4 * 3000;  // 与 STAGE_DURATION 同步：等 4 个 DNA/玫瑰阶段轮播完（约 12 秒）
    await new Promise(r => setTimeout(r, Math.max(0, (window.__loaderStartTime + STAGE_WAIT) - performance.now())));

    // 切换文案（阶段 2）
    const loaderQuote = document.getElementById('loaderQuote');
    const loaderHexText = document.querySelector('.loader-hex-text');
    const loaderCount = document.getElementById('loaderCount');
    const loaderTotal = document.getElementById('loaderTotal');

    if (loaderHexText) loaderHexText.textContent = '正 在 收 集 回 忆';
    if (window.__markPhase2) window.__markPhase2();
    const phase2Quotes = [
      '把每一个值得纪念的瞬间打包……',
      '让相册提前翻到我们最相爱的那一页',
      '从那年那月那天开始，一页一页翻给你看',
      '这些照片，我都想慢慢讲给你听',
      '时间还很长，我们的故事也是'
    ];
    if (loaderQuote) loaderQuote.textContent = phase2Quotes[0];

    let phase2Loaded = 0;
    const phase2Total = chapterUrls.length;
    if (loaderCount) loaderCount.textContent = '0';
    if (loaderTotal) loaderTotal.textContent = phase2Total;

    // 并发预加载（每批 6 张），但受 phase2Deadline 限制：
    // 超时后剩余图片交给进相册后的后台任务，绝不拖慢进入 3D 球
    const phase2Deadline = window.__loaderStartTime + MIN_LOADER_DURATION - 600;
    const batchSize = isDesktop ? 6 : 3;
    for (let i = 0; i < chapterUrls.length; i += batchSize){
      if (performance.now() > phase2Deadline) break;
      const batch = chapterUrls.slice(i, i + batchSize);
      await Promise.all(batch.map(url => preloadImage(url).then(() => {
        phase2Loaded++;
        const pct = Math.floor(phase2Loaded / phase2Total * 100);
        if (loaderCount) loaderCount.textContent = phase2Loaded;
        // 每 20% 切换一句文案
        if (loaderQuote && phase2Total > 0){
          const qi = Math.min(phase2Quotes.length - 1, Math.floor(pct / 20));
          loaderQuote.textContent = phase2Quotes[qi];
        }
      })));
    }
  }

  // 保证 loader 至少展示 MIN_LOADER_DURATION 毫秒（让用户能看到阶段轮换 + 交互）
  const _elapsedSinceLoader = performance.now() - window.__loaderStartTime;
  const _remainingWait = Math.max(0, MIN_LOADER_DURATION - _elapsedSinceLoader);
  if (_remainingWait > 0){
    await new Promise(r => setTimeout(r, _remainingWait));
  }

  // ============ 加载完成：不再自动进入，右下角出现"进入回忆球"按钮 ============
  // 按钮带一个 CSS 3D 小球（旋转渐变球面），用户点击后才进入 3D 球首页
  const _enterSphere = () => {
    loader.classList.remove('show');
    setTimeout(() => loader.remove(), 500);
    // 销毁加载页 3D 特效（DNA、玫瑰粒子云、玫瑰几何、花瓣雨、点击涟漪等），节省 GPU
    // 必须在 loader 隐藏后调用，否则用户看不到加载期间的 3D 互动特效
    if (window.__destroyLoaderThree) window.__destroyLoaderThree();
    // 整体显示球体（统一入场动画）
    const showStart = performance.now();
    photoMeshes.forEach((p, i) => {
      photoEnterStart.set(p.mesh, showStart + i * 12);  // 12ms 间隔，错落入场
    });
    photoGroup.visible = true;
  };
  if (document.getElementById('loader')){
    const enterBtn = document.createElement('button');
    enterBtn.id = 'loaderEnterBtn';
    enterBtn.innerHTML = `<span class="le-ball"></span><span>进入回忆球</span>`;
    enterBtn.addEventListener('click', _enterSphere, { once: true });
    document.getElementById('loader').appendChild(enterBtn);
    window.__loaderEnterReady = true;
  } else {
    // loader 已不存在（异常路径）：直接进入
    _enterSphere();
  }

  // 注意：不再后台加载全部章节原图 —— 117 张原图全部解码进内存会把
  // 移动端浏览器压垮（表现为页面被杀、从头重新加载）。
  // 改为每章进入时才加载该章图片（见 openChapter 的预加载逻辑）。
}

// 旋转控制（拖动 + 自动旋转 + 缩放）
let rotY = 0, rotX = 0;
let camDist = 70;  // 相机到球心距离
const CAM_MIN = 12;   // 最近（飞入球内）
const CAM_MAX = 100;  // 最远（看全貌）
const CAM_DEFAULT = 70;
let autoRotate = true;
let lastTouchX = 0, lastTouchY = 0;
let isDragging = false;
let pinchStartDist = 0;
let pinchStartCamDist = 0;

function applyRotation(){
  photoGroup.rotation.y = rotY;
  photoGroup.rotation.x = rotX;
  homeCamera.position.set(0, 0, camDist);
  homeCamera.lookAt(0, 0, 0);
}
applyRotation();

function getDist(a, b){
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    // 双指捏合
    isDragging = false;
    pinchStartDist = getDist(e.touches[0], e.touches[1]);
    pinchStartCamDist = camDist;
    autoRotate = false;
    return;
  }
  isDragging = true; autoRotate = false;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 2){
    const d = getDist(e.touches[0], e.touches[1]);
    const ratio = pinchStartDist / d;
    camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, pinchStartCamDist * ratio));
    applyRotation();
    return;
  }
  if (!isDragging) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
  applyRotation();
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// 鼠标拖动（PC）
homeRenderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false;
  lastTouchX = e.clientX; lastTouchY = e.clientY;
});
homeRenderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.clientX; lastTouchY = e.clientY;
  applyRotation();
});
homeRenderer.domElement.addEventListener('mouseup', () => isDragging = false);
homeRenderer.domElement.addEventListener('mouseleave', () => isDragging = false);

// 鼠标滚轮缩放（PC）
homeRenderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist + e.deltaY * 0.05));
  autoRotate = false;
  applyRotation();
}, {passive:false});

// 点击照片 - 打开预览大图
const raycaster = new THREE.Raycaster();
const pickMouse = new THREE.Vector2();
let touchDownX = 0, touchDownY = 0;

function pickPhoto(clientX, clientY){
  const rect = homeRenderer.domElement.getBoundingClientRect();
  pickMouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pickMouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pickMouse, homeCamera);
  const meshes = photoMeshes.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length){
    return photoMeshes.find(p => p.mesh === hits[0].object) || null;
  }
  return null;
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  touchDownX = e.touches[0].clientX;
  touchDownY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', e => {
  const dx = Math.abs(e.changedTouches[0].clientX - touchDownX);
  const dy = Math.abs(e.changedTouches[0].clientY - touchDownY);
  if (dx > 8 || dy > 8) return;
  const pm = pickPhoto(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  if (pm) openPreview(pm);
});

homeRenderer.domElement.addEventListener('click', e => {
  const pm = pickPhoto(e.clientX, e.clientY);
  if (pm) openPreview(pm);
});

// 自动旋转 + 高亮镜头正前方的照片 + 共享入场缩放
const photoEnterStart = new WeakMap();  // mesh -> 入场开始时间
const photoPhase = new WeakMap();       // mesh -> 独立呼吸相位

function animateHome(){
  if (autoRotate){
    rotY += 0.0012;
    applyRotation();
  }

  // 中心心脏核心脉动
  const tNow = performance.now() * 0.001;
  const heartbeat = 0.85 + Math.sin(tNow * 2.8) * 0.15;  // 0.7 ~ 1.0
  coreMesh.scale.setScalar(heartbeat);
  haloMesh.scale.setScalar(1 + Math.sin(tNow * 2.8) * 0.15);
  haloMat.opacity = 0.18 + Math.sin(tNow * 2.8) * 0.08;

  // 银河尘埃带慢转
  dust.rotation.y += 0.0005;
  dustMat.opacity = 0.5 + Math.sin(tNow * 1.3) * 0.25;

  // 找到最朝向镜头的照片（z 最大，即最靠近镜头）
  let bestIdx = -1;
  let bestZ = -Infinity;
  const tmpVec = new THREE.Vector3();
  photoMeshes.forEach((p, i) => {
    tmpVec.copy(p.mesh.position).applyEuler(photoGroup.rotation);
    const z = tmpVec.z;
    if (z > bestZ){
      bestZ = z;
      bestIdx = i;
    }
  });

  const now = performance.now();
  photoMeshes.forEach((p, i) => {
    if (!photoEnterStart.has(p.mesh)){
      photoEnterStart.set(p.mesh, now);
      photoPhase.set(p.mesh, Math.random() * Math.PI * 2);
    }
    const elapsed = now - photoEnterStart.get(p.mesh);
    const enterT = elapsed < 0 ? 0 : Math.min(1, elapsed / 600);
    const enterScale = enterT < 1 ? (1 - Math.pow(1 - enterT, 3)) : 1;

    // 高亮条件：相机远时（camDist > 40）所有照片同等显示；相机近时高亮正前方
    const isHi = (i === bestIdx && bestZ > 5 && camDist < 40);
    const targetScale = isHi ? 1.18 : 1.0;
    const cur = p.mesh.scale.x;
    const highlightScale = cur + (targetScale - cur) * 0.1;

    // 照片呼吸：±1.5% 独立相位
    const breathe = 1 + Math.sin(tNow * 1.6 + photoPhase.get(p.mesh)) * 0.015;

    const finalScale = enterT < 1 ? enterScale : highlightScale * breathe;
    p.mesh.scale.set(finalScale, finalScale, 1);

    // 高亮照片沿径向向外浮起（push outward from sphere center）
    if (enterT >= 1 && p.basePos){
      const targetMul = isHi ? 1.03 : 1.0;
      const cur = p.positionMul || 1.0;
      const next = cur + (targetMul - cur) * 0.15;
      p.positionMul = next;
      p.mesh.position.set(p.basePos.x * next, p.basePos.y * next, p.basePos.z * next);
    }
  });

  if (!window.__homePaused){
    homeRenderer.render(homeScene, homeCamera);
  }
  requestAnimationFrame(animateHome);
}
animateHome();

// 4. 预览大图（原图懒加载 + 进入章节入口）
// ============================================================
const previewEl = document.getElementById('preview');
const previewStage = document.getElementById('previewStage');
const previewBack = document.getElementById('previewBack');
const previewHint = document.getElementById('previewHint');
const previewDots = document.getElementById('previewDots');

let previewChapterIdx = 0;
let previewPhotos = [];      // 该章节所有原图 URL
let previewPhotoIdx = 0;
let previewAllChapters = {};  // 缓存每章的照片列表
let previewFromChapter = false;  // 大图预览是从章节视图还是首页球面打开

async function openPreview(pm){
  previewFromChapter = viewerEl.classList.contains('active');
  if (previewFromChapter) clearAutoAdvance();  // 看大图时暂停底层章节自动翻页
  previewChapterIdx = pm.chapterIdx;
  // 取该章节所有照片（不重复）
  const ch = CHAPTERS[previewChapterIdx];
  if (!previewAllChapters[previewChapterIdx]){
    if (ch.folder){
      const data = await loadPhotosData();
      // 预览用原图（点击章节图后才加载）
      previewAllChapters[previewChapterIdx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[previewChapterIdx] = [];
    }
  }
  previewPhotos = previewAllChapters[previewChapterIdx];
  // 找到当前点击的照片在预览列表中的位置
  // pm.src 可能是 thumb_small（章节视图）或 original（首页球面）—— 都做匹配
  const pmSrc = pm.src;
  const pmSrcOriginal = pmSrc.replace(/\/thumb_small\//, '/');
  previewPhotoIdx = previewPhotos.findIndex(p => p === pmSrc || p === pmSrcOriginal);
  if (previewPhotoIdx < 0) previewPhotoIdx = 0;

  previewEl.classList.add('active');
  homeEl.style.display = 'none';
  previewBack.classList.add('show');
  setTimeout(() => previewHint.classList.add('show'), 600);

  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';
  document.getElementById('openChapterBtn').style.display = 'none';

  buildPreviewDots();
  renderPreview();
}

function buildPreviewDots(){
  previewDots.innerHTML = '';
  previewPhotos.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (i === previewPhotoIdx) d.classList.add('active');
    d.addEventListener('click', e => { e.stopPropagation(); previewPhotoIdx = i; renderPreview(); });
    previewDots.appendChild(d);
  });
  previewDots.classList.add('show');
}

function renderPreview(){
  const ch = CHAPTERS[previewChapterIdx];
  previewStage.innerHTML = `
    <div class="preview-info">
      <div class="pn">No.${String(previewChapterIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="pt">${ch.title}</div>
    </div>
  `;
  // 加载原图
  const loading = document.createElement('div');
  loading.className = 'preview-loading';
  loading.textContent = '加载原图中…';
  previewStage.appendChild(loading);

  const url = previewPhotos[previewPhotoIdx];
  const img = new Image();
  img.onload = () => {
    loading.remove();
    const slide = document.createElement('div');
    slide.className = 'preview-slide show';
    slide.innerHTML = `<img class="preview-img" src="${url}" alt="${ch.title}">`;
    previewStage.appendChild(slide);
    // EXIF 方向校正
    const prevImgEl = slide.querySelector('.preview-img');
    const tryApplyPrev = () => _applyExif(prevImgEl, url);
    tryApplyPrev();
    if (!_exifOri.has(url) || _exifOri.get(url) === 1){
      [150, 400, 1000].forEach(d => setTimeout(tryApplyPrev, d));
    }
    // 更新 dots
    previewDots.querySelectorAll('.pdot').forEach((d, i) => d.classList.toggle('active', i === previewPhotoIdx));
  };
  img.onerror = () => {
    loading.textContent = '加载失败';
  };
  img.src = url;
}

function closePreview(){
  previewEl.classList.remove('active');
  previewBack.classList.remove('show');
  previewHint.classList.remove('show');
  previewDots.classList.remove('show');
  previewStage.innerHTML = '';
  // 从章节视图打开的：章节还在下层，直接关掉回到章节即可
  if (previewFromChapter){
    window.__homePaused = true;  // 章节视图仍占用，home 保持暂停
    const scene = viewerStage.querySelector('.scene');
    if (scene) startAutoAdvance(scene);
    return;
  }
  // 从首页打开：恢复 home 渲染
  window.__homePaused = false;
  homeEl.style.display = 'block';
  document.getElementById('homeTitle').style.display = 'block';
  document.getElementById('homeHint').style.display = 'block';
  document.getElementById('openChapterBtn').style.display = 'inline-flex';
}

previewBack.addEventListener('click', closePreview);

// 预览页触摸切换
let prevTSX = 0, prevTSY = 0, prevTST = 0;
previewEl.addEventListener('touchstart', e => {
  prevTSX = e.touches[0].clientX;
  prevTSY = e.touches[0].clientY;
  prevTST = performance.now();
}, {passive:true});
previewEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - prevTSX;
  const dy = e.changedTouches[0].clientY - prevTSY;
  const dt = performance.now() - prevTST;
  if (dt > 600) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    // 左右滑 → 切换章节
    if (dx < 0) previewNextChapter();
    else previewPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 → 切换同章节照片
    if (dy < 0) previewNext();
    else previewPrev();
  }
}, {passive:true});

function previewNext(){
  if (previewPhotoIdx < previewPhotos.length - 1){
    previewPhotoIdx++;
    renderPreview();
  }
}
function previewPrev(){
  if (previewPhotoIdx > 0){
    previewPhotoIdx--;
    renderPreview();
  }
}
function previewNextChapter(){
  // 找到下一个有 folder 的章节
  for (let i = previewChapterIdx + 1; i < CHAPTERS.length; i++){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
function previewPrevChapter(){
  for (let i = previewChapterIdx - 1; i >= 0; i--){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
async function switchPreviewChapter(idx){
  previewChapterIdx = idx;
  const ch = CHAPTERS[idx];
  if (!previewAllChapters[idx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[idx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[idx] = [];
    }
  }
  previewPhotos = previewAllChapters[idx];
  previewPhotoIdx = 0;
  buildPreviewDots();
  renderPreview();
}

const viewerEl = document.getElementById('viewer');
const viewerStage = document.getElementById('viewerStage');
const viewerBack = document.getElementById('viewerBack');
const viewerDots = document.getElementById('viewerDots');
let viewerIdx = 0;
let viewerPhotos = [];  // 每章所有照片

// ============================================================
// 5. 章节全屏视图 —— 每章专属场景 + 3D 相册（book/flow/stack）
// ============================================================
// (viewerEl/Stage/Back/Dots 已在上方声明，viewerIdx/Photos 在上面已声明)
let viewerPhotoIdx = 0;
let viewerMode = 'flow';  // book / flow / stack / ar
let viewerFxState = { stop: true };
let arThemes = [];  // ch15 AR 章节的主题照片组

async function openChapter(idx){
  viewerIdx = idx;
  const ch = CHAPTERS[idx];
  // 防止快速点击切章时上一章异步加载污染当前章
  const _openToken = ++window._openChapterToken;
  viewerEl.classList.add('active');
  homeEl.style.display = 'none';
  // 进入章节：暂停 home 渲染 + 释放上一页章节 3D 资源
  window.__homePaused = true;
  destroyChapterThree();
  viewerBack.classList.add('show');
  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';
  document.getElementById('openChapterBtn').style.display = 'none';
  // iOS Safari：每次进入章节时唤醒 AudioContext，避免长时间停留后 BGM 哑火
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // 切换到对应章节的 BGM
  if (ch.bgm) switchBGM(ch.bgm);

  // 加载这一章的照片（章节显示用 thumb_small —— 球面已预加载，复用避免黑屏）
  viewerPhotos = [];
  if (ch.folder){
    const data = await loadPhotosData();
    if (_openToken !== window._openChapterToken) return;  // 已被新章节取代
    const entry = data[ch.folder];
    if (ch.isAR){
      // AR 章节：按主题加载（photos.json 的 themes 结构）
      arThemes = (entry?.themes || []).map(t => ({
        name: t.name, en: t.en, color: new THREE.Color(t.color || '#ffb3c8'),
        photos: (t.photos || []).map(p => `${ch.folder}/${t.dir}/thumb/${p}`)
      })).filter(t => t.photos.length);
    } else {
      const arr = Array.isArray(entry) ? entry : (entry?.original || []);
      if (ch.isVideo){
        // 视频章直接用 mp4 路径（thumb_small 不存在）
        arr.forEach(p => viewerPhotos.push(`${ch.folder}/${p}`));
      } else {
        arr.forEach(p => {
          // 显示用压缩图 thumb_small（原图点击预览时才加载）
          const displayName = p.replace(/^thumb\//, '');
          viewerPhotos.push(`${ch.folder}/thumb_small/${displayName}`);
        });
      }
    }
  }
  if (!viewerPhotos.length && ch.folder && !ch.isVideo && !ch.isAR){
    const fromSphere = photoMeshes.filter(p => p.chapterIdx === idx).map(p => p.src);
    viewerPhotos = fromSphere;
  }
  // 预加载本章前几张原图（首页秒开），其余边看边提前一张加载
  if (!ch.isVideo && viewerPhotos.length){
    const firstBatch = viewerPhotos.slice(0, isDesktop ? 4 : 2);
    await Promise.all(firstBatch.map(u => preloadImage(u)));
    if (_openToken !== window._openChapterToken) return;  // 已被新章节取代
    // 后面的图片小并发提前热身（不 await，不阻塞章节打开）
    const rest = viewerPhotos.slice(firstBatch.length);
    (async () => {
      const bs = isDesktop ? 3 : 2;
      for (let i = 0; i < rest.length; i += bs){
        await Promise.all(rest.slice(i, i + bs).map(u => preloadImage(u)));
      }
    })();
    // 后台预取下一章前几张，翻章节时秒开
    const nextCh = CHAPTERS[idx + 1];
    if (nextCh && nextCh.folder && !nextCh.isVideo){
      loadPhotosData().then(data => {
        const entry = data[nextCh.folder];
        const arr = Array.isArray(entry) ? entry : (entry?.original || []);
        arr.slice(0, 2).forEach(p => preloadImage(`${nextCh.folder}/${p}`));
      }).catch(() => {});
    }
  }

  // 根据照片数选择展示模式
  const n = viewerPhotos.length;
  if (ch.isCover) viewerMode = 'cover';
  else if (ch.isWish) viewerMode = 'wish';
  else if (ch.isAR) viewerMode = 'ar';
  else if (ch.isVideo) viewerMode = 'filmstrip';
  else if (n <= 8) viewerMode = 'book';
  else if (n <= 18) viewerMode = 'flow';
  else viewerMode = 'stack';

  viewerPhotoIdx = 0;
  buildViewerDots();
  renderChapterScene();
}

function buildViewerDots(){
  viewerDots.innerHTML = '';
  CHAPTERS.forEach((_,i) => {
    if (CHAPTERS[i].isCover || CHAPTERS[i].isWish || CHAPTERS[i].folder){
      const d = document.createElement('button');
      d.className = 'vdot';
      d.dataset.chapter = String(i);
      d.title = CHAPTERS[i].title || ('chapter ' + i);
      if (i === viewerIdx) d.classList.add('active');
      d.addEventListener('click', e => { e.stopPropagation(); openChapter(i); });
      viewerDots.appendChild(d);
    }
  });
  viewerDots.classList.add('show');
}

// ============================================================
// 场景渲染（每章专属氛围 + 3D 相册）
// ============================================================
let autoAdvTimer = null;
// 预加载图片缓存
const _imgCache = new Map();
// EXIF Orientation 缓存（手机拍摄的横/倒照片自动校正）
const _exifOri = new Map();   // url → orientation (1-8)
// 轻量 EXIF parser：只读 APP1 → TIFF → Orientation tag (0x0112)
async function _readExifOrientation(url){
  try {
    const resp = await fetch(url, { headers: { 'Range': 'bytes=0-131072' } });
    if (!resp.ok) return 1;
    const buf = await resp.arrayBuffer();
    const view = new DataView(buf);
    if (view.byteLength < 4 || view.getUint16(0) !== 0xFFD8) return 1;
    let off = 2;
    while (off < view.byteLength){
      if (view.getUint8(off) !== 0xFF) return 1;
      const marker = view.getUint8(off + 1);
      const size = view.getUint16(off + 2);
      if (marker === 0xE1){
        if (view.getUint32(off + 4) !== 0x45786966) return 1;
        const tiffOff = off + 10;
        const little = view.getUint16(tiffOff) === 0x4949;
        const get16 = p => view.getUint16(p, little);
        const get32 = p => view.getUint32(p, little);
        if (get16(tiffOff + 2) !== 0x002A) return 1;
        const ifd0Off = tiffOff + get32(tiffOff + 4);
        if (ifd0Off + 2 > view.byteLength) return 1;
        const numEntries = get16(ifd0Off);
        for (let i = 0; i < numEntries; i++){
          const eOff = ifd0Off + 2 + i * 12;
          if (eOff + 12 > view.byteLength) break;
          if (get16(eOff) === 0x0112){
            return get16(eOff + 8);
          }
        }
        return 1;
      }
      off += 2 + size;
    }
    return 1;
  } catch(e){ return 1; }
}
// 应用 EXIF orientation → CSS transform 角度（只对非预览大图）
function _exifToCssTransform(ori){
  switch(ori){
    case 2: return 'scaleX(-1)';
    case 3: return 'rotate(180deg)';
    case 4: return 'scaleY(-1)';
    case 5: return 'scaleX(-1) rotate(90deg)';
    case 6: return 'rotate(90deg)';
    case 7: return 'scaleX(-1) rotate(-90deg)';
    case 8: return 'rotate(-90deg)';
    default: return '';
  }
}
// 异步预读 EXIF orientation（不阻塞图片显示）
// 缩略图（thumb_small/）不含 EXIF，所以统一从原图读，再缓存到缩略图 URL
function _preloadExif(url){
  if (_exifOri.has(url)) return;
  _exifOri.set(url, 1);
  // 把 thumb_small/ 替换成原图根目录来读 EXIF
  const originalUrl = url.replace(/\/thumb_small\//, '/').replace(/\/thumb\//, '/');
  _readExifOrientation(originalUrl).then(o => {
    _exifOri.set(url, o);
    if (window.__exifDebug) console.log('[exif]', url.split('/').pop(), '→', o, '(from', originalUrl.split('/').pop(), ')');
  }).catch(e => {
    if (window.__exifDebug) console.log('[exif-err]', url.split('/').pop(), e.message);
  });
}
window._exifOri = _exifOri;  // 调试用
window._readExifOrientation = _readExifOrientation;
window._preloadExif = _preloadExif;
// 在所有用到图片 URL 的地方调用：传入时给 img 元素加 transform
// 自动判断缩略图是否已被自动旋转（生成时已 auto-orient）：
//   原图 EXIF ∈ {5,6,7,8}：要顺/逆时针 90° 才能正，raw 方向是竖的
//   raw 像素里人的方向就是 EXIF=1 时的"正常方向"再逆运算
//   如果缩略图生成工具用了 auto-orient，则缩略图 nw/nh 已交换（视觉方向 nw>nh 表示横、nw<nh 表示竖）
//   如果未 auto-orient，则缩略图 nw/nh 与 raw 一致（EXIF=6 的原图 nw>nh，raw 横躺）
// 简单判定：EXIF=6/8（需顺/逆时针 90）且 raw 仍 nw>nh → 缩略图未自动旋转，需要 CSS 旋转
//           EXIF=6/8 但 raw nw<nh → 缩略图已 auto-orient，raw 已正，无需再旋转
function _applyExif(imgEl, url){
  const ori = _exifOri.get(url);
  let effective = (ori && ori !== 1) ? ori : 1;
  if (ori && (ori === 6 || ori === 8) && imgEl.naturalWidth && imgEl.naturalHeight){
    if (imgEl.naturalWidth < imgEl.naturalHeight){
      effective = 1;
    }
  } else if (ori && (ori === 5 || ori === 7) && imgEl.naturalWidth && imgEl.naturalHeight){
    if (imgEl.naturalWidth < imgEl.naturalHeight){
      effective = 1;
    }
  }
  // 同时写 CSS 变量（Ken Burns 动画用）和 inline transform（非 active 卡片立即生效）
  if (effective !== 1){
    const tx = _exifToCssTransform(effective);
    imgEl.style.setProperty('--exif-rot', tx);
    imgEl.style.transform = tx;
  } else {
    imgEl.style.removeProperty('--exif-rot');
    imgEl.style.transform = '';
  }
}

function preloadImage(url){
  if (_imgCache.has(url)) return _imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
  _imgCache.set(url, p);
  _preloadExif(url);
  return p;
}

let chapterThree = null;
function destroyChapterThree(){
  if (chapterThree && chapterThree.stop){ chapterThree.stop(); chapterThree = null; }
}
function startChapterThree(sceneEl, ch){
  if (!isDesktop || !sceneEl || !ch) return;
  destroyChapterThree();

  // 用 scene-fx canvas 容器做 3D 渲染
  const host = sceneEl;
  const w = host.clientWidth || window.innerWidth;
  const h = host.clientHeight || window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  renderer.setClearColor(0x000000, 0);
  host.appendChild(renderer.domElement);
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2';

  const threeScene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, w/h, 0.1, 200);
  camera.position.set(0, 0, 14);

  const objs = [];
  const fx = ch.effect;

  // 根据章节选择 3D 场景
  if (fx === 'meteor'){
    // ch01 在那之前：流星雨
    const N = 80;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 30;
      pos[i*3+1] = (Math.random()-0.5) * 20;
      pos[i*3+2] = (Math.random()-0.5) * 10;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xfff0fa, size: 0.08, transparent: true, opacity: 0.95, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'meteor', mesh: pts, geo, mat, basePos: pos.slice() });
  } else if (fx === 'snow'){
    // ch02 峨眉雪：雪花（白色 sprite 粒子）
    const N = 120;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const vy = new Float32Array(N);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 24;
      pos[i*3+1] = (Math.random()-0.5) * 18;
      pos[i*3+2] = (Math.random()-0.5) * 8;
      vy[i] = 0.02 + Math.random()*0.06;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.85, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'snow', mesh: pts, geo, mat, vy });
  } else if (fx === 'lantern'){
    // ch03 山城之夜：暖灯笼群
    for (let i = 0; i < 14; i++){
      const g = new THREE.SphereGeometry(0.45 + Math.random()*0.25, 16, 12);
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.05 + Math.random()*0.05, 0.85, 0.55 + Math.random()*0.15), transparent: true, opacity: 0.85 });
      const s = new THREE.Mesh(g, m);
      s.position.set((Math.random()-0.5)*16, (Math.random()-0.5)*10, (Math.random()-0.5)*4);
      s.userData = { vy: 0.005 + Math.random()*0.01, ph: Math.random()*Math.PI*2, baseY: s.position.y };
      threeScene.add(s);
      objs.push({ kind:'lantern', mesh: s });
      // 光晕
      const hg = new THREE.SphereGeometry(0.9 + Math.random()*0.4, 12, 8);
      const hm = new THREE.MeshBasicMaterial({ color: m.color, transparent: true, opacity: 0.18 });
      const h = new THREE.Mesh(hg, hm);
      h.position.copy(s.position);
      threeScene.add(h);
      objs.push({ kind:'lantern-glow', mesh: h, parent: s });
    }
  } else if (fx === 'wave'){
    // ch04 北海海风：替换为「气泡上升 + 海面粼光 + 远处海鸥剪影」
    // 替代原本突兀的波浪顶点动画，让背景更贴近真实海景
    // 1) 气泡粒子：从下往上漂浮，柔和白色透明
    const N = 38;
    const bubGeo = new THREE.BufferGeometry();
    const bubPos = new Float32Array(N * 3);
    const bubVy = new Float32Array(N);
    const bubPhase = new Float32Array(N);
    for (let i = 0; i < N; i++){
      bubPos[i*3]   = (Math.random()-0.5) * 22;
      bubPos[i*3+1] = (Math.random()-0.5) * 12 - 3;
      bubPos[i*3+2] = (Math.random()-0.5) * 6 - 4;
      bubVy[i] = 0.04 + Math.random() * 0.06;
      bubPhase[i] = Math.random() * Math.PI * 2;
    }
    bubGeo.setAttribute('position', new THREE.BufferAttribute(bubPos, 3));
    const bubMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending });
    const bubbles = new THREE.Points(bubGeo, bubMat);
    threeScene.add(bubbles);
    objs.push({ kind:'bubbles3d', mesh: bubbles, geo: bubGeo, vy: bubVy, phase: bubPhase });
    // 2) 海面粼光：底部一圈暖色光斑（GPU 粒子在水面闪烁）
    const SP = 60;
    const spGeo = new THREE.BufferGeometry();
    const spPos = new Float32Array(SP * 3);
    const spPh = new Float32Array(SP);
    for (let i = 0; i < SP; i++){
      spPos[i*3]   = (Math.random()-0.5) * 26;
      spPos[i*3+1] = -5.0 + (Math.random()-0.5) * 0.4;
      spPos[i*3+2] = -10 + Math.random() * 12;
      spPh[i] = Math.random() * Math.PI * 2;
    }
    spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
    const spMat = new THREE.PointsMaterial({ color: 0xffe9b8, size: 0.22, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending });
    const sparkle = new THREE.Points(spGeo, spMat);
    threeScene.add(sparkle);
    objs.push({ kind:'sparkle3d', mesh: sparkle, geo: spGeo, phase: spPh });
    // 3) 远处海鸥剪影（2 只，沿水平线滑翔）
    for (let gi = 0; gi < 2; gi++){
      const gullGroup = new THREE.Group();
      // 用两条 BufferGeometry 模拟海鸥双翼
      const wing = new Float32Array([
        -0.5, 0, 0,  0.0, 0.05, 0,
        0.0, 0.05, 0,  0.5, 0, 0
      ]);
      const wGeo = new THREE.BufferGeometry();
      wGeo.setAttribute('position', new THREE.BufferAttribute(wing, 3));
      const wMat = new THREE.LineBasicMaterial({ color: 0x1a2a38, transparent: true, opacity: 0.65 });
      const w = new THREE.LineSegments(wGeo, wMat);
      gullGroup.add(w);
      gullGroup.position.set(-8 + gi*4, 1.5 + gi*0.6, -9 - gi);
      gullGroup.userData = { baseX: gullGroup.position.x, dir: gi === 0 ? 1 : -1, flap: Math.random()*Math.PI*2 };
      threeScene.add(gullGroup);
      objs.push({ kind:'gull', mesh: gullGroup });
    }
  } else if (fx === 'petal'){
    // ch05 那年毕业：樱花瓣粒子
    const N = 90;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const vy = new Float32Array(N);
    const vx = new Float32Array(N);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 22;
      pos[i*3+1] = (Math.random()-0.5) * 14;
      pos[i*3+2] = (Math.random()-0.5) * 6;
      vy[i] = -(0.02 + Math.random()*0.05);
      vx[i] = (Math.random()-0.5)*0.04;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffb0c4, size: 0.22, transparent: true, opacity: 0.85, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'petal3d', mesh: pts, geo, mat, vy, vx });
  } else if (fx === 'rose'){
    // ch07 我们结婚了：玫瑰金光粒子环绕
    const N = 60;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const phases = new Float32Array(N);
    for (let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2;
      const r = 4 + Math.random() * 2.5;
      pos[i*3]   = Math.cos(a) * r;
      pos[i*3+1] = (Math.random()-0.5) * 6;
      pos[i*3+2] = Math.sin(a) * r;
      phases[i] = a;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffd0a0, size: 0.18, transparent: true, opacity: 0.9, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'rose-orbit', mesh: pts, geo, mat, phases });
  } else if (fx === 'bubble'){
    // ch08 柯柯来了：气球群
    for (let i = 0; i < 18; i++){
      const r = 0.4 + Math.random() * 0.5;
      const g = new THREE.SphereGeometry(r, 14, 10);
      const hue = 0.92 + Math.random()*0.06;
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.7), transparent: true, opacity: 0.7 });
      const s = new THREE.Mesh(g, m);
      s.position.set((Math.random()-0.5)*18, (Math.random()-0.5)*12, (Math.random()-0.5)*6);
      s.userData = { ph: Math.random()*Math.PI*2, baseY: s.position.y, bob: 0.3 + Math.random()*0.5 };
      threeScene.add(s);
      objs.push({ kind:'balloon', mesh: s });
    }
  } else if (fx === 'film'){
    // ch09 时光影片：胶片孔 + 浮尘
    const N = 40;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      pos[i*3]   = (Math.random()-0.5) * 24;
      pos[i*3+1] = (Math.random()-0.5) * 16;
      pos[i*3+2] = (Math.random()-0.5) * 8;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffe8c0, size: 0.08, transparent: true, opacity: 0.7, depthWrite: false });
    const pts = new THREE.Points(geo, mat);
    threeScene.add(pts);
    objs.push({ kind:'film', mesh: pts, geo });
  } else if (fx === 'bokeh'){
    // ch06 在一起：金色圆斑（远景 3D 圆盘）
    for (let i = 0; i < 18; i++){
      const g = new THREE.CircleGeometry(0.3 + Math.random()*0.6, 18);
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.1 + Math.random()*0.06, 0.85, 0.6), transparent: true, opacity: 0.35 + Math.random()*0.3 });
      const c = new THREE.Mesh(g, m);
      c.position.set((Math.random()-0.5)*20, (Math.random()-0.5)*14, -3 - Math.random()*4);
      c.userData = { ph: Math.random()*Math.PI*2 };
      threeScene.add(c);
      objs.push({ kind:'bokeh3d', mesh: c });
    }
  }

  let raf = 0, stop = false;
  function onResize(){
    const w2 = host.clientWidth || window.innerWidth;
    const h2 = host.clientHeight || window.innerHeight;
    renderer.setSize(w2, h2, false);
    camera.aspect = w2/h2;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);

  function tick(t){
    if (stop) return;
    raf = requestAnimationFrame(tick);
    const ts = t * 0.001;
    camera.position.x = Math.sin(ts*0.2) * 0.4;
    camera.position.y = Math.cos(ts*0.15) * 0.3;
    camera.lookAt(0, 0, 0);

    for (const o of objs){
      if (o.kind === 'meteor'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i]   -= 0.04;
          arr[i+1] -= 0.015;
          if (arr[i] < -15){ arr[i] = 15; arr[i+1] = (Math.random()-0.5)*20; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'snow'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] -= o.vy[i/3];
          arr[i] += Math.sin(ts + i) * 0.005;
          if (arr[i+1] < -10){ arr[i+1] = 10; arr[i] = (Math.random()-0.5)*24; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'lantern'){
        o.mesh.position.y = o.mesh.userData.baseY + Math.sin(ts * 1.2 + o.mesh.userData.ph) * 0.4;
        if (o.mesh.material.opacity !== undefined){
          o.mesh.material.opacity = 0.7 + 0.2 * Math.sin(ts*2 + o.mesh.userData.ph);
        }
      } else if (o.kind === 'lantern-glow'){
        o.mesh.position.copy(o.parent.position);
        o.mesh.material.opacity = 0.15 + 0.05 * Math.sin(ts*1.5);
      } else if (o.kind === 'bubbles3d'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] += o.vy[i/3];
          arr[i]   += Math.sin(ts*1.2 + o.phase[i/3]) * 0.006;
          if (arr[i+1] > 7){
            arr[i+1] = -7;
            arr[i] = (Math.random()-0.5) * 22;
          }
        }
        o.geo.attributes.position.needsUpdate = true;
        o.mesh.material.opacity = 0.45 + Math.sin(ts*0.7) * 0.1;
      } else if (o.kind === 'sparkle3d'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          // 每个光斑轻微上下漂移（粼光闪烁）
          arr[i+1] = -5.0 + Math.sin(ts*2.0 + o.phase[i/3]) * 0.18;
        }
        o.geo.attributes.position.needsUpdate = true;
        o.mesh.material.opacity = 0.6 + Math.abs(Math.sin(ts*1.4)) * 0.4;
      } else if (o.kind === 'gull'){
        // 海鸥滑翔：缓慢左右飘，翅膀扇动（y 缩放模拟）
        const d = o.mesh.userData;
        d.flap += 0.06;
        o.mesh.scale.y = 0.7 + Math.abs(Math.sin(d.flap)) * 0.5;
        o.mesh.position.x = d.baseX + Math.sin(ts*0.25 + d.flap) * 3.5 * d.dir;
        o.mesh.position.y += Math.sin(ts*0.4 + d.flap) * 0.002;
      } else if (o.kind === 'petal3d'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] += o.vy[i/3];
          arr[i]   += o.vx[i/3] + Math.sin(ts*1.4 + i)*0.005;
          if (arr[i+1] < -8){ arr[i+1] = 8; arr[i] = (Math.random()-0.5)*22; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'rose-orbit'){
        o.mesh.rotation.y = ts * 0.25;
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] += Math.sin(ts*0.8 + o.phases[i/3]) * 0.005;
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'balloon'){
        o.mesh.position.y = o.mesh.userData.baseY + Math.sin(ts*0.8 + o.mesh.userData.ph) * o.mesh.userData.bob;
      } else if (o.kind === 'film'){
        const arr = o.geo.attributes.position.array;
        for (let i = 0; i < arr.length; i += 3){
          arr[i+1] -= 0.005;
          if (arr[i+1] < -8){ arr[i+1] = 8; arr[i] = (Math.random()-0.5)*24; }
        }
        o.geo.attributes.position.needsUpdate = true;
      } else if (o.kind === 'bokeh3d'){
        const m = o.mesh.material;
        m.opacity = 0.25 + 0.2 * Math.sin(ts*0.6 + o.mesh.userData.ph);
      }
    }

    renderer.render(threeScene, camera);
  }
  raf = requestAnimationFrame(tick);

  chapterThree = {
    stop: () => {
      stop = true;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      // 释放场景里的 geometry / material / texture（renderer.dispose 不递归）
      const _disposedTexs = new Set();
      try {
        threeScene.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material){
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            for (const mm of mats){
              mm.dispose();
              // 释放 material 持有的 map（CanvasTexture / TextureLoader 贴图）
              for (const k of ['map','normalMap','aoMap','roughnessMap','emissiveMap','alphaMap']){
                if (mm[k] && !_disposedTexs.has(mm[k])){
                  try { mm[k].dispose(); _disposedTexs.add(mm[k]); } catch(e){}
                }
              }
            }
          }
        });
        renderer.dispose();
      } catch(e){}
      // 强制释放 GL 上下文 —— 连续浏览多章节时避免上下文累积导致越来越卡
      try { renderer.forceContextLoss(); } catch(e){}
      const dom = renderer.domElement;
      if (dom && dom.parentNode) dom.parentNode.removeChild(dom);
    }
  };
}

function clearAutoAdvance(){
  if (autoAdvTimer) { clearTimeout(autoAdvTimer); autoAdvTimer = null; }
}
function startAutoAdvance(scene){
  clearAutoAdvance();
  if (viewerPhotos.length <= 1) return;  // 单张无需自动切换
  // 放慢节奏：保证用户有时间读完文案 + 图片完全加载后再切换（避免花屏）
  const interval = viewerMode === 'book' ? 11000 : (viewerMode === 'stack' ? 10000 : 9500);
  autoAdvTimer = setTimeout(async () => {
    if (!scene.isConnected) return;
    // 计算下一张的索引
    const total = viewerPhotos.length;
    const nextIdx = (viewerPhotoIdx + 1) % total;
    // 等待下一张图片加载完成（最多等 8 秒超时，加载失败也切，避免卡死）
    await Promise.race([
      preloadImage(viewerPhotos[nextIdx]),
      new Promise(r => setTimeout(r, 8000))
    ]);
    if (!scene.isConnected) return;
    // 触发切换
    if (viewerMode === 'book' && scene._book){
      bookFlip(scene._book, 'next');
    } else if (viewerMode === 'flow' && scene._flow){
      flowGo(scene, 'next');
    } else if (viewerMode === 'stack' && scene._stack){
      stackGo(scene, 'next');
    }
    // 切到下一张后再启动下一个
    startAutoAdvance(scene);
  }, interval);
}

function renderChapterScene(){
  clearAutoAdvance();
  viewerFxState.stop = true;
  destroyChapterThree();
  viewerStage.innerHTML = '';
  const ch = CHAPTERS[viewerIdx];

  if (viewerMode === 'cover'){
    renderCoverScene(ch);
    return;
  }
  if (viewerMode === 'wish'){
    renderWishScene(ch);
    return;
  }
  if (viewerMode === 'ar'){
    renderARScene(ch);
    return;
  }

  // 普通章节场景：背景 + 装饰 + 3D 相册 + 文案
  const scene = document.createElement('div');
  scene.className = `scene ch${String(viewerIdx).padStart(2,'0')}${viewerMode === 'stack' ? ' stack-mode' : ''}`;
  scene.innerHTML = `
    <div class="scene-bg"></div>
    <div class="scene-deco"></div>
    <canvas class="scene-fx"></canvas>
    <div class="scene-frame" id="sceneFrame"></div>
    <div class="scene-info" data-ch="${ch.id}">
      <div class="scene-num">No.${String(viewerIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="scene-title">${ch.title}</div>
      <div class="scene-en">${ch.en}</div>
      <div class="scene-text">${(ch.text || '').split('').map(c => `<span class="ch">${c === '\n' ? '<br>' : c}</span>`).join('')}${isDesktop ? '<span class="text-sweep"></span>' : ''}</div>
    </div>
    <div class="scene-counter">${viewerPhotoIdx + 1} / ${viewerPhotos.length}</div>`;
  viewerStage.appendChild(scene);

  // 渲染 3D 相册
  if (viewerMode === 'book') renderBook(scene);
  else if (viewerMode === 'flow') renderFlow(scene);
  else if (viewerMode === 'stack') renderStack(scene);
  else if (viewerMode === 'filmstrip') renderFilmstrip(scene);

  // 启动章节特效
  startChapterFx(scene, ch);
  startChapterThree(scene, ch);

  // 启动自动切换（视频章节不自动）
  if (viewerMode !== 'filmstrip') startAutoAdvance(scene);
}

// 视频胶片章 —— 横向胶片条 + 点击播放
function renderFilmstrip(scene){
  const frame = scene.querySelector('#sceneFrame');
  frame.style.height = '70vh';
  frame.style.flexDirection = 'column';

  const strip = document.createElement('div');
  strip.className = 'filmstrip';
  frame.appendChild(strip);

  viewerPhotos.forEach((url, i) => {
    const card = document.createElement('div');
    card.className = 'film-card';
    card.innerHTML = `
      <div class="film-frame">
        <video src="${url}#t=0.1" preload="metadata" muted playsinline></video>
        <div class="film-play">▶</div>
        <div class="film-grain"></div>
      </div>
      <div class="film-num">No.${String(i+1).padStart(2,'0')}</div>
    `;
    card.addEventListener('click', () => openVideoPlayer(url, i));
    strip.appendChild(card);
  });

  scene._filmstrip = strip;
}

function openVideoPlayer(url, idx){
  // 创建全屏播放器
  const overlay = document.createElement('div');
  overlay.className = 'video-overlay';
  overlay.innerHTML = `
    <button class="video-close">×</button>
    <video src="${url}" controls autoplay playsinline></video>
    <div class="video-info">No.${String(idx+1).padStart(2,'0')} · ${viewerPhotos.length}</div>
  `;
  document.body.appendChild(overlay);
  const close = () => {
    const v = overlay.querySelector('video');
    if (v) v.pause();
    overlay.remove();
  };
  overlay.querySelector('.video-close').addEventListener('click', close);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) close();
  });
}

// 3D 相册：book —— 翻页效果
function renderBook(scene){
  const frame = scene.querySelector('#sceneFrame');
  frame.innerHTML = '';  // 防止翻页后旧相册累积
  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  // 立体对开相册：左页 = 当前照片的左半/前一页，右页 = 当前
  const book = document.createElement('div');
  book.className = 'book';
  const spread = document.createElement('div');
  spread.className = 'book-spread';

  const left = document.createElement('div');
  left.className = 'book-page left';
  const prevIdx = (curIdx - 1 + total) % total;
  left.innerHTML = `<img src="${viewerPhotos[prevIdx]}" alt="page ${prevIdx+1}"><div class="page-corner"></div><div class="page-num">— ${String(prevIdx+1).padStart(2,'0')} —</div>`;
  spread.appendChild(left);

  const right = document.createElement('div');
  right.className = 'book-page right';
  right.innerHTML = `<img class="book-img" src="${viewerPhotos[curIdx]}" alt="page ${curIdx+1}"><div class="page-corner"></div><div class="page-num">— ${String(curIdx+1).padStart(2,'0')} —</div>`;
  spread.appendChild(right);
  // EXIF 方向校正（手机横拍自动转正）
  _applyExif(right.querySelector('.book-img'), viewerPhotos[curIdx]);
  if (!_exifOri.has(viewerPhotos[curIdx]) || _exifOri.get(viewerPhotos[curIdx]) === 1){
    [150, 400, 1000].forEach(d => setTimeout(() => _applyExif(right.querySelector('.book-img'), viewerPhotos[curIdx]), d));
  }

  book.appendChild(spread);
  frame.appendChild(book);

  // 点击书页 → 打开原图大图预览
  left.addEventListener('click', () => openPreview({ chapterIdx: viewerIdx, src: viewerPhotos[prevIdx] }));
  right.addEventListener('click', () => openPreview({ chapterIdx: viewerIdx, src: viewerPhotos[curIdx] }));

  // 桌面端：鼠标视差（轻微倾斜跟随）
  if (isDesktop) {
    book.style.transition = 'transform .6s cubic-bezier(.2,.8,.2,1)';
    book.style.transformStyle = 'preserve-3d';
    applyBookParallax(book);
  }

  book._state = { curIdx, total, bookEl: book, spread, right, flipping: false };
  scene._book = book;
}

// 单 rAF 循环驱动当前活跃 book 的视差（避免每渲染一次就泄漏 rAF）
let _parallaxBook = null;
let _parallaxFlow = null;
let _parallaxStack = null;
let _parallaxRaf = 0;
function applyBookParallax(book) {
  _parallaxBook = book;
  if (!_parallaxRaf) _parallaxRaf = requestAnimationFrame(parallaxTick);
}
function applyFlowParallax(flow) {
  _parallaxFlow = flow;
  if (!_parallaxRaf) _parallaxRaf = requestAnimationFrame(parallaxTick);
}
function applyStackParallax(hero) {
  _parallaxStack = hero;
  if (!_parallaxRaf) _parallaxRaf = requestAnimationFrame(parallaxTick);
}
function parallaxTick() {
  _parallaxRaf = 0;
  if (_parallaxBook && _parallaxBook.isConnected) {
    _parallaxBook.style.transform = `rotateY(${mouse.nx * 6}deg) rotateX(${-mouse.ny * 4}deg)`;
  }
  if (_parallaxFlow && _parallaxFlow.isConnected) {
    _parallaxFlow.style.transform = `translateY(${mouse.ny * -8}px) perspective(900px) rotateY(${mouse.nx * 4}deg)`;
  }
  if (_parallaxStack && _parallaxStack.isConnected) {
    _parallaxStack.style.transform = `translateX(${mouse.nx * -10}px) translateY(${mouse.ny * -6}px) rotateY(${mouse.nx * 3}deg) rotateX(${-mouse.ny * 2}deg)`;
  }
  if (_parallaxBook || _parallaxFlow || _parallaxStack) {
    _parallaxRaf = requestAnimationFrame(parallaxTick);
  }
}

function bookFlip(book, dir){
  if (book._state.flipping) return;
  const st = book._state;
  const total = st.total;
  // 翻页前先记住场景引用（renderBook 会清空 frame，旧 book 的父子链会断）
  const sceneEl = book.parentElement.parentElement;
  let nextIdx = st.curIdx + (dir === 'next' ? 1 : -1);
  if (nextIdx < 0) nextIdx = total - 1;
  if (nextIdx >= total) nextIdx = 0;
  st.flipping = true;

  // 在右页后面准备下一页（隐藏的 .book-next-in，从背面翻入）
  let nextIn = book.querySelector('.book-next-in');
  if (nextIn) nextIn.remove();
  nextIn = document.createElement('div');
  nextIn.className = 'book-next-in';
  nextIn.innerHTML = `<img class="book-img" src="${viewerPhotos[nextIdx]}" alt="page ${nextIdx+1}"><div class="page-num" style="position:absolute;bottom:10px;right:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.7rem;color:rgba(80,60,40,.55);letter-spacing:.15em">— ${String(nextIdx+1).padStart(2,'0')} —</div>`;
  _applyExif(nextIn.querySelector('.book-img'), viewerPhotos[nextIdx]);
  if (!_exifOri.has(viewerPhotos[nextIdx]) || _exifOri.get(viewerPhotos[nextIdx]) === 1){
    [150, 400, 1000].forEach(d => setTimeout(() => _applyExif(nextIn.querySelector('.book-img'), viewerPhotos[nextIdx]), d));
  }
  book.appendChild(nextIn);

  // 桌面端：从书脊中线爆出粒子
  if (isDesktop) {
    const sceneEl = book.closest('.scene');
    if (sceneEl) {
      const cw = sceneEl.clientWidth || 393;
      spawnFlipBurst(sceneEl, { cx: cw * 0.5, cy: (sceneEl.clientHeight || 700) * 0.5, count: 36 });
    }
  }

  // 触发翻页动画
  book.classList.add('flipping');

  setTimeout(() => {
    book.classList.remove('flipping');
    if (nextIn) nextIn.remove();
    st.curIdx = nextIdx;
    viewerPhotoIdx = nextIdx;  // 同步全局索引（计数器/自动播放/原图预览都依赖它）
    // 重渲染左 + 右页
    renderBook(sceneEl);
    const counter = sceneEl.querySelector('.scene-counter');
    if (counter) counter.textContent = `${nextIdx + 1} / ${total}`;
  }, 1150);
}

// 3D 相册：flow —— 聚光封面流
function renderFlow(scene){
  const frame = scene.querySelector('#sceneFrame');
  frame.innerHTML = '';  // 防止切换后旧卡流累积
  const flow = document.createElement('div');
  flow.className = 'flow';
  frame.appendChild(flow);

  // 桌面端：flow 整体跟随鼠标做 z 轴浮动
  if (isDesktop) {
    flow.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
    applyFlowParallax(flow);
  }

  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  const angleStep = 28;
  const xStep = Math.min(window.innerWidth * 0.30, 130);
  const chTitle = CHAPTERS[viewerIdx].title;
  viewerPhotos.forEach((url, i) => {
    const card = document.createElement('div');
    card.className = 'flow-card' + (i === curIdx ? ' active' : '');
    const offset = i - curIdx;
    let tx = 0, ty = 0, rz = 0, ry = 0, alpha = 1, scale = 1;
    if (offset === 0){
      tx = 0; ty = 0; ry = 0; rz = 0; scale = 1; alpha = 1;
    } else if (offset > 0){
      const off = Math.min(offset, 2);
      tx = off * xStep;
      ty = off * 16;
      ry = -off * angleStep;
      rz = -off * 2.5;
      alpha = Math.max(0.25, 1 - offset * 0.25);
      scale = 1 - off * 0.07;
    } else {
      const off = Math.max(offset, -2);
      tx = off * xStep;
      ty = Math.abs(off) * 16;
      ry = -off * angleStep;
      rz = -off * 2.5;
      alpha = Math.max(0.25, 1 + offset * 0.25);
      scale = 1 - Math.abs(off) * 0.07;
    }
    card.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${scale})`;
    card.style.opacity = alpha;
    card.style.zIndex = 100 - Math.abs(offset);
    card.innerHTML = `
      <img class="flow-img" src="${url}" alt="card ${i+1}">
      <div class="flow-vignette"></div>
      <div class="flow-glow"></div>
      <div class="flow-num">No.${String(i+1).padStart(2,'0')}</div>
      <div class="flow-caption">${chTitle}</div>`;
    // EXIF 方向校正：手机横拍的照片自动转正（若 EXIF 已就位则立即应用；否则等异步加载完成后重应用）
    const flowImg = card.querySelector('.flow-img');
    const tryApply = () => _applyExif(flowImg, url);
    tryApply();
    if (!_exifOri.has(url) || _exifOri.get(url) === 1){
      // EXIF 异步加载中，150ms / 400ms / 1s 各重试一次
      [150, 400, 1000].forEach(delay => setTimeout(tryApply, delay));
    }
    // 点击：当前卡 → 原图大图预览；侧边卡 → 切到该卡
    card.addEventListener('click', () => {
      if (i === viewerPhotoIdx){
        openPreview({ chapterIdx: viewerIdx, src: url });
        return;
      }
      viewerPhotoIdx = i;
      preloadImage(url).then(() => {
        if (!scene.isConnected) return;
        renderFlow(scene);
        const counter = scene.querySelector('.scene-counter');
        if (counter) counter.textContent = `${i + 1} / ${total}`;
      });
    });
    flow.appendChild(card);
  });

  scene._flow = flow;
}

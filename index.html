<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>爱的回忆 · 给你的纪念册</title>
<meta name="description" content="一本只属于我们的纪念册 — 从 2017 到 ∞">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Noto+Serif+SC:wght@200;400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
  touch-action:none;overscroll-behavior:none;
}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}

/* ============== Splash 星空漩涡 ============== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 70%,#000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.splash-content{position:relative;z-index:2;text-align:center;color:#f8e8d4;padding:0 30px}
.splash-eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.6em;color:rgba(248,232,212,.5);margin-bottom:18px;opacity:0;animation:fadeIn 1.4s ease .3s forwards}
.splash-title{font-family:"Dancing Script","Cormorant Garamond",serif;font-size:clamp(3rem,12vw,5rem);font-weight:400;letter-spacing:.04em;color:#fff;text-shadow:0 0 40px rgba(255,180,200,.4),0 0 80px rgba(180,120,255,.2);margin-bottom:8px;opacity:0;animation:titleIn 1.8s ease .8s forwards}
.splash-sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.5em;color:rgba(248,232,212,.7);margin-bottom:36px;opacity:0;animation:fadeIn 1.4s ease 1.4s forwards}
.splash-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 40px;background:rgba(248,232,212,.05);border:1px solid rgba(248,232,212,.4);color:#f8e8d4;font-family:"Noto Serif SC",serif;font-size:clamp(.9rem,3vw,1rem);letter-spacing:.35em;cursor:pointer;border-radius:50px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;animation:fadeUp 1.4s ease 2s forwards;transition:all .3s ease}
.splash-btn:active{transform:scale(.96);background:rgba(248,232,212,.12);border-color:#f8e8d4}
.splash-btn .heart{display:inline-block;color:#ff6b95;animation:heartbeat 1.4s ease-in-out infinite;font-size:1.1em}
.splash-hint{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(248,232,212,.35);font-size:.7rem;letter-spacing:.4em;z-index:2;animation:fadeIn 1.4s ease 2.5s forwards;opacity:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleIn{from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* ============== 3D 球面首页 ============== */
#home{
  position:fixed;inset:0;z-index:10;
  background:#000;
  display:block;
}
#bgFx{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
#home canvas{position:absolute;inset:0;width:100%;height:100%}
#home canvas:not(#bgFx){z-index:1}
#homeHint{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),90px);
  transform:translateX(-50%);z-index:12;
  color:rgba(255,255,255,.75);font-size:.72rem;letter-spacing:.3em;
  text-align:center;pointer-events:none;
  opacity:0;animation:fadeIn 1.4s ease .5s forwards;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
#homeHint > div{margin:3px 0}
#homeHint .arrow{display:inline-block;font-size:1.2rem;margin-right:6px;animation:bob 2s ease-in-out infinite;vertical-align:-.1em}
#homeHint .hint2,#homeHint .hint3{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.4em}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 回忆录入口按钮（球体下方） */
#openChapterBtn{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),24px);
  transform:translateX(-50%);z-index:20;
  display:inline-flex;align-items:center;gap:10px;
  padding:12px 28px 12px 22px;
  background:rgba(248,232,212,.06);
  border:1px solid rgba(248,232,212,.35);
  border-radius:50px;color:#f8e8d4;
  font-family:"Noto Serif SC",serif;
  font-size:clamp(.82rem,3vw,.95rem);
  letter-spacing:.4em;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;animation:fadeUp 1.4s ease 1.4s forwards;
  transition:all .3s ease;
  box-shadow:0 4px 24px rgba(248,180,200,.15),inset 0 0 12px rgba(248,180,200,.08);
}
#openChapterBtn:active{transform:translateX(-50%) scale(.96);background:rgba(248,232,212,.14)}
#openChapterBtn .ch-bookmark{color:#ff8eb3;animation:heartbeat 1.6s ease-in-out infinite}
#openChapterBtn .ch-arrow{transition:transform .3s ease}
#openChapterBtn:hover .ch-arrow{transform:translateX(4px)}
@keyframes chGlow{
  0%,100%{box-shadow:0 4px 24px rgba(248,180,200,.15),inset 0 0 12px rgba(248,180,200,.08)}
  50%{box-shadow:0 4px 32px rgba(248,180,200,.28),inset 0 0 16px rgba(248,180,200,.15)}
}
#openChapterBtn.show{animation:fadeUp .8s ease forwards, chGlow 3s ease-in-out infinite .8s}

/* 缩放控制按钮 */
#zoomCtl{
  position:fixed;right:14px;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:15;display:flex;flex-direction:column;gap:6px;
  opacity:0;animation:fadeIn 1.4s ease 1s forwards;
}
.zoom-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;
}
.zoom-btn:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.zoom-btn.reset{font-size:.7rem;letter-spacing:.05em;font-weight:500}
#homeTitle{
  position:fixed;left:50%;top:max(env(safe-area-inset-top),30px);
  transform:translateX(-50%);z-index:12;
  text-align:center;color:#fff;pointer-events:none;
}
#homeTitle .t1{font-family:"Dancing Script",serif;font-size:clamp(1.8rem,7vw,2.4rem);text-shadow:0 2px 20px rgba(0,0,0,.8)}
#homeTitle .t2{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.75rem;letter-spacing:.5em;color:rgba(248,232,212,.7);margin-top:4px}

/* ============== 预览大图 ============== */
#preview{
  position:fixed;inset:0;z-index:25;background:#000;
  display:none;
}
#preview.active{display:block}
.preview-stage{position:absolute;inset:0;overflow:hidden;background:#000}
.preview-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;
  pointer-events:none;
}
.preview-slide.show{opacity:1;pointer-events:auto}
.preview-slide img{
  width:100%;height:100%;object-fit:contain;
  background:#000;
}
.preview-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.6);font-size:.85rem;letter-spacing:.3em;
  z-index:2;pointer-events:none;
}
.preview-loading::after{
  content:'';display:block;width:30px;height:30px;
  margin:14px auto 0;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:rgba(255,180,200,.8);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.preview-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.preview-back.show{display:flex}
.preview-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

.preview-info{
  position:fixed;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  text-align:center;color:#fff;padding:0 24px;z-index:10;
  pointer-events:none;
}
.preview-info .pn{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:4px}
.preview-info .pt{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.2rem,5vw,1.6rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7)}

.preview-hint{
  position:fixed;left:50%;bottom:calc(max(env(safe-area-inset-bottom),30px) + 70px);
  transform:translateX(-50%);z-index:20;
  color:rgba(255,255,255,.5);font-size:.7rem;letter-spacing:.3em;
  pointer-events:none;display:none;
}
.preview-hint.show{display:block}

.preview-dots{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);
  z-index:15;display:none;flex-direction:column;gap:5px;
}
.preview-dots.show{display:flex}
.pdot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.pdot.active{background:#ffb0c4;transform:scale(1.6)}

/* ============== 章节全屏视图 ============== */
#viewer{
  position:fixed;inset:0;z-index:20;background:#000;
  display:none;
  touch-action:pan-y;
}
#viewer.active{display:block}
.viewer-stage{position:absolute;inset:0;overflow:hidden}
.viewer-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.viewer-slide img.slide-photo{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(.85) saturate(110%);
  transition:transform .4s ease;
}
.viewer-slide::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.85) 100%);
  pointer-events:none;
}
.viewer-info{
  position:absolute;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  z-index:3;text-align:center;color:#fff;padding:0 24px;
  pointer-events:none;
}
.viewer-num{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.95rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:10px}
.viewer-title{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7);margin-bottom:4px}
.viewer-en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.7rem,2.5vw,.85rem);letter-spacing:.4em;color:rgba(248,232,212,.7)}
.viewer-text{
  position:absolute;left:0;right:0;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:3;text-align:center;color:rgba(255,245,235,.95);padding:0 32px;
  font-size:clamp(.85rem,3.2vw,.95rem);line-height:2;letter-spacing:.05em;
  pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.8);
  white-space:pre-line;
}
.viewer-text::before{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-right:4px;vertical-align:-.15em}
.viewer-text::after{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-left:2px;vertical-align:-.25em}
.viewer-fx{position:absolute;inset:0;z-index:2;pointer-events:none}

/* 返回按钮 */
.viewer-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.viewer-back.show{display:flex}
.viewer-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

/* 章节进度 */
.viewer-dots{
  position:fixed;right:14px;top:50%;transform:translateY(-50%);
  z-index:40;display:none;flex-direction:column;gap:8px;
}
.viewer-dots.show{display:flex}
.vdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);border:none;padding:0;cursor:pointer;transition:all .3s ease}
.vdot.active{background:#ffb0c4;transform:scale(1.8)}

/* 许愿页特殊样式 */
.viewer-slide.wish{background:radial-gradient(ellipse at center,#2a1840 0%,#08040e 100%)}
.viewer-slide.wish img{filter:brightness(.4)}
.viewer-wish-title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(2rem,8vw,3rem);color:#fff;letter-spacing:.3em;margin-bottom:30px;text-shadow:0 0 30px rgba(255,180,200,.6)}
.viewer-wish-text{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.9rem,3.5vw,1.05rem);color:rgba(255,245,235,.95);letter-spacing:.1em;line-height:2.3;max-width:88%;margin:0 auto 14px}
.viewer-wish-sign{font-family:"Dancing Script",serif;font-size:clamp(1.2rem,5vw,1.6rem);color:#ffb0c4;letter-spacing:.15em;margin-top:30px;text-shadow:0 0 20px rgba(255,180,200,.5)}
.wish-hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wish-heart{position:absolute;color:#ff6b95;font-size:1.2rem;animation:floatUp 6s ease-in infinite;opacity:0}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
}

/* 封面特殊样式 */
.viewer-slide.cover{background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 100%)}
.viewer-slide.cover img{display:none}

/* ============================================================ */
/* 每章文案专属动画（结合章节特点）                              */
/* ============================================================ */
/* 默认（基础）已在上面 .scene-text 定义；这里只覆盖各章特殊样式 */

/* ch01 在那之前 —— 字符如星辰逐个亮起 */
.scene.ch01 .scene-text{
  background:linear-gradient(90deg,#f8e8d4,#fff,#f8e8d4);
  background-size:200% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:sceneTextIn 1s ease .6s forwards, ch01Twinkle 4s linear 1.6s infinite;
}
@keyframes ch01Twinkle{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

/* ch02 峨眉雪 —— 文字如雪花飘落（轻微模糊下落） */
.scene.ch02 .scene-text{
  animation:sceneTextIn 1s ease .6s forwards, ch02Snow 6s ease-in-out 1.6s infinite;
}
@keyframes ch02Snow{
  0%,100%{text-shadow:0 0 0 rgba(255,255,255,0), 0 2px 16px rgba(0,0,0,.9)}
  50%{text-shadow:0 -2px 0 rgba(255,255,255,.4), 0 0 12px rgba(180,220,255,.4), 0 2px 16px rgba(0,0,0,.9)}
}

/* ch03 山城之夜 —— 文字像灯笼般明灭 */
.scene.ch03 .scene-text{
  animation:sceneTextIn 1s ease .6s forwards, ch03Lantern 2.5s ease-in-out 1.6s infinite;
}
@keyframes ch03Lantern{
  0%,100%{text-shadow:0 0 8px rgba(255,180,80,.5), 0 0 16px rgba(255,140,60,.3), 0 2px 16px rgba(0,0,0,.9)}
  50%{text-shadow:0 0 14px rgba(255,200,100,.8), 0 0 28px rgba(255,160,80,.5), 0 2px 16px rgba(0,0,0,.9)}
}

/* ch04 北海海风 —— 文字像波浪轻晃 */
.scene.ch04 .scene-text{
  animation:sceneTextIn 1s ease .6s forwards, ch04Wave 5s ease-in-out 1.6s infinite;
}
@keyframes ch04Wave{
  0%,100%{transform:translateY(0) skewX(0)}
  25%{transform:translateY(-1px) skewX(.5deg)}
  75%{transform:translateY(1px) skewX(-.5deg)}
}

/* ch05 那年毕业 —— 文字像花瓣飘入（轻浮上移） */
.scene.ch05 .scene-text{
  animation:sceneTextIn 1.4s ease .6s forwards, ch05Petal 4s ease-in-out 2s infinite;
}
@keyframes ch05Petal{
  0%,100%{transform:translateY(0) rotate(0)}
  33%{transform:translateY(-3px) rotate(.3deg)}
  66%{transform:translateY(2px) rotate(-.3deg)}
}

/* ch06 在一起 —— 文字带温暖光晕 */
.scene.ch06 .scene-text{
  animation:sceneTextIn 1s ease .6s forwards, ch06Bokeh 4s ease-in-out 1.6s infinite;
}
@keyframes ch06Bokeh{
  0%,100%{text-shadow:0 0 8px rgba(255,180,100,.3), 0 2px 16px rgba(0,0,0,.9); color:rgba(255,245,235,.92)}
  50%{text-shadow:0 0 18px rgba(255,200,120,.6), 0 0 32px rgba(255,180,140,.3), 0 2px 16px rgba(0,0,0,.9); color:rgba(255,250,230,1)}
}

/* ch07 我们结婚了 —— 文字如玫瑰金光闪烁 */
.scene.ch07 .scene-text{
  background:linear-gradient(120deg,#ffd4dc 0%,#fff 30%,#ffb0c4 60%,#fff 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:sceneTextIn 1s ease .6s forwards, ch07Rose 5s linear 1.6s infinite;
}
@keyframes ch07Rose{
  0%{background-position:200% 50%}
  100%{background-position:-200% 50%}
}

/* ch11 柯柯来了 —— 文字像气泡轻柔浮动 */
.scene.ch11 .scene-text{
  animation:sceneTextIn 1s ease .6s forwards, ch11Bubble 3s ease-in-out 1.6s infinite;
}
@keyframes ch11Bubble{
  0%,100%{transform:translateY(0) scale(1); text-shadow:0 0 8px rgba(255,200,220,.3), 0 2px 16px rgba(0,0,0,.9)}
  50%{transform:translateY(-2px) scale(1.01); text-shadow:0 0 16px rgba(255,200,220,.5), 0 2px 16px rgba(0,0,0,.9)}
}
.cover-content{text-align:center;color:#fff;padding:0 30px;z-index:3}
.cover-content .deco{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.8rem;letter-spacing:.5em;color:rgba(248,232,212,.5);margin-bottom:18px}
.cover-content .title{font-family:"Dancing Script",serif;font-size:clamp(3.2rem,13vw,5.5rem);font-weight:400;letter-spacing:.05em;text-shadow:0 0 40px rgba(255,180,200,.5);margin-bottom:12px;line-height:1.1}
.cover-content .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.95rem,3.5vw,1.1rem);color:rgba(248,232,212,.7);letter-spacing:.5em;margin-bottom:30px}
.cover-content .heart{font-size:1.8rem;color:#ff6b95;animation:heartbeat 2s ease-in-out infinite;display:inline-block;margin-bottom:30px}
.cover-content .quote{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.85rem,3.2vw,.95rem);color:rgba(255,245,235,.85);letter-spacing:.12em;line-height:2.1;max-width:85%;margin:0 auto 32px}
.cover-content .date{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.4em;color:rgba(248,232,212,.5)}

/* 加载进度 */
#loader{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 60%,#000 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
}
#loader.show{display:flex;animation:fadeIn .6s ease}
#loader canvas.loader-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.loader-inner{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  width:100%;max-width:340px;
}
.loader-heart{
  width:54px;height:54px;margin-bottom:22px;
  display:flex;align-items:center;justify-content:center;

.loader-text{

.loader-rng .track{stroke:rgba(255,255,255,.06);fill:none;stroke-width:2.5}
.loader-rng .fill{

.loader-rng-pct{

.loader-rng-pct .label{font-size:.6rem;letter-spacing:.3em;color:rgba(248,232,212,.4);margin-top:4px;font-family:"Noto Serif SC",serif;font-style:normal;font-weight:200}
.loader-count{

/* ============================================================ */
/* 章节场景（每章专属氛围）                                    */
/* ============================================================ */
.scene{

.scene-info{

.scene-title{

@keyframes sceneTitleIn{to{opacity:1;transform:translateY(0)}}

/* ============================================================ */
/* 3D 照片展示 —— 共用：book / cover-flow / polaroid-stack        */
/* ============================================================ */
.book{
  position:relative;
  width:78vw;max-width:340px;height:100%;
  transform-style:preserve-3d;
}
.book-page{
  position:absolute;inset:0;
  background:#fff;
  border-radius:4px;

  box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.04);

  transition:transform 1s cubic-bezier(.45,.05,.25,1);

  display:flex;align-items:center;justify-content:center;
}
.book-page img{
  width:100%;height:100%;object-fit:cover;
}
.book-page.flipping{
  transform:rotateY(-180deg);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.book-page .page-num{
  position:absolute;bottom:8px;right:14px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.7rem;color:rgba(0,0,0,.4);
}
.book-hint{
  position:absolute;bottom:max(env(safe-area-inset-bottom),14px);
  left:50%;transform:translateX(-50%);z-index:5;
  font-size:.7rem;letter-spacing:.3em;color:rgba(255,255,255,.6);
  text-shadow:0 1px 4px rgba(0,0,0,.8);

}
@keyframes bookHintBlink{0%,100%{opacity:.6}50%{opacity:.95}}

/* 翻页时显示的下一页（隐藏在 page 下） */
.book-page.next-hint{
  background:linear-gradient(135deg,#f8f0e6 0%,#efe5d3 100%);
  transform:rotateY(0);
}
.book-page.next-hint::after{
  content:'';position:absolute;inset:8px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:2px;
  background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.02) 6px 12px);
}

/* 封面流 —— 3D 圆柱排列 */
.flow{
  position:relative;
  width:100%;height:100%;
  transform-style:preserve-3d;
}
.flow-card{
  position:absolute;
  left:50%;top:50%;

  transform-origin:center center;
}
.flow-card img{
  width:100%;height:100%;object-fit:cover;
}
.flow-card.active{

}
.flow-card .flow-num{

}

/* Polaroid 堆叠（多图） */
.stack{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
}
.stack-card{
  position:absolute;left:50%;top:50%;

}
.stack-card img{

}
.stack-card .stack-caption{

}
.stack-card.active{

}

/* 章节进度计数器 */
.scene-counter{

}
.scene.ch03 .scene-deco::before{

    linear-gradient(180deg,transparent 0%,rgba(30,15,40,.6) 60%,#0a0414 100%),

.scene.ch03 .scene-deco::after{

}
.scene.ch04 .scene-deco::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:55%;
  background:linear-gradient(180deg,transparent 0%,rgba(20,80,120,.5) 50%,#062840 100%);
}
.scene.ch04 .scene-deco::after{

  filter:blur(3px);
}

/* ch05 —— 那年毕业 */
.scene.ch05 .scene-bg{
  background:linear-gradient(180deg,#2a1830 0%,#503040 50%,#705050 100%);
}
.scene.ch05 .scene-deco::before{
  content:'🎓';position:absolute;top:18%;left:18%;font-size:2.4rem;
  animation:ch05Cap 6s ease-in-out infinite;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
.scene.ch05 .scene-deco::after{
  content:'🎓';position:absolute;top:30%;right:15%;font-size:1.8rem;
  animation:ch05Cap 7s ease-in-out infinite -3s;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
@keyframes ch05Cap{
  0%,100%{transform:translateY(0) rotate(-15deg)}

}

/* ch06 —— 在一起（温暖日常） */

.video-overlay{

/* ch14 章节背景：复古电影感 */

// 1. Splash 星空漩涡
// ============================================================
(() => {
  const c = document.getElementById('splashCanvas');
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W, H, stars = [];
  function resize(){
    W = c.width = window.innerWidth * dpr;
    H = c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);
  function initStars(){
    stars = [];
    const maxDim = Math.max(window.innerWidth, window.innerHeight);
    for (let i=0;i<200;i++){
      const angle = Math.random()*Math.PI*2;
      const radius = 30 + Math.random()*maxDim*.6;
      stars.push({
        angle, radius,
        speed: .0005 + Math.random()*.001,
        size: .3 + Math.random()*1.4,
        hue: Math.random()<.7 ? 280+Math.random()*40 : 330+Math.random()*40,
        alpha: .4+Math.random()*.5,
        drift: (Math.random()-.5)*.0003
      });
    }
  }
  initStars();
  function draw(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.fillStyle = 'rgba(8,4,14,.25)';
    ctx.fillRect(0,0,w,h);
    const cx = w/2, cy = h/2;
    const haloR = Math.min(w,h)*.35;
    const halo = ctx.createRadialGradient(cx,cy,0,cx,cy,haloR);
    halo.addColorStop(0,'rgba(255,180,200,.12)');
    halo.addColorStop(.3,'rgba(180,120,255,.08)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.fillRect(0,0,w,h);
    stars.forEach(s => {
      s.angle += s.speed; s.radius += s.drift;
      const r = s.radius;
      const x = cx + Math.cos(s.angle)*r, y = cy + Math.sin(s.angle)*r;
      const fade = Math.max(0, Math.min(1, 1 - r/(haloR*1.4)));
      const sz = s.size*(1 + (1-fade)*.8);
      ctx.fillStyle = `hsla(${s.hue},70%,75%,${s.alpha*fade})`;
      ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2); ctx.fill();
      if (r < haloR){
        const tx = cx + Math.cos(s.angle - s.speed*3)*r;
        const ty = cy + Math.sin(s.angle - s.speed*3)*r;
        ctx.strokeStyle = `hsla(${s.hue},70%,75%,${s.alpha*fade*.4})`;
        ctx.lineWidth = sz*.6;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
      }
      if (r < 5 || r > Math.max(w,h)*.8){
        s.angle = Math.random()*Math.PI*2;
        s.radius = Math.max(w,h)*.6;
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// 1.4 加载页特效：星空 + Binary 心 + 代码雨 + 文案轮播
// ============================================================
(() => {
  const c = document.getElementById('loaderFx');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W, H;
  function resize(){

  // 编程式浪漫字符池
  const tokens = ['0', '1', '♥', '<3', '∞', 'function love(){return "you"}',
                  '01001000', 'while(true){love("you")}',
                  'const us = ∞;', '1011', '01110', '// 1314',
                  'import love', '1+1=2', 'commit -m "love"'];

  // 二进制心形点阵（5x7）
  const heartBin = [
    '01100110',
    '11111111',
    '11111111',
    '01111110',
    '00111100',
    '00011000',
    '00000000'
  ];

  // 程序员的浪漫
  const quotes = [
    '// compiled with love ♥',
    '01001001 00100000 01101100 01101111 01110110 01100101 00100000 01111001 01101111 01110101',
    'while (alive) { love("you"); }',
    'function forever() { return "与你"; }',
    '// 一生一世 = 1314',
    'const us = [相遇, 相爱, 永远];',

    '# 始于初见，止于终老'
  ];
  const quoteEl = document.getElementById('loaderQuote');
  let quoteIdx = 0;
  function showQuote(){
    if (!quoteEl) return;
    quoteEl.classList.add('fade');
    setTimeout(() => {
      quoteEl.textContent = quotes[quoteIdx];
      quoteEl.classList.remove('fade');
      quoteIdx = (quoteIdx + 1) % quotes.length;
    }, 400);
  }
  showQuote();
  setInterval(showQuote, 3200);

  // 程序员控制台日志（逐行打字）
  const logEl = document.getElementById('loaderLog');
  const logLines = [
    { html: '<span class="k">$</span> <span class="s">love.init()</span> ... <span class="ok">ok</span>' },
    { html: '<span class="k">$</span> loading <span class="s">memories.json</span> ...' },
    { html: '<span class="k">$</span> binding <span class="s">heart.geometry</span> ... <span class="ok">ok</span>' },
    { html: '<span class="k">$</span> <span style="color:#88c0ff">>></span> awaiting your smile <span class="ok">♥</span>' }
  ];
  if (logEl){
    let li = 0;
    function typeLine(){
      if (li >= logLines.length){ setTimeout(() => { logEl.innerHTML = ''; li = 0; typeLine(); }, 1800); return; }
      const ln = document.createElement('span');
      ln.className = 'ln';
      ln.innerHTML = logLines[li].html;
      ln.style.opacity = '0';
      ln.style.transform = 'translateX(-4px)';
      ln.style.transition = 'opacity .35s ease, transform .35s ease';
      logEl.appendChild(ln);
      requestAnimationFrame(() => { ln.style.opacity = '1'; ln.style.transform = 'translateX(0)'; });
      // 限制最多显示 3 行
      while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
      li++;
      setTimeout(typeLine, 1100 + Math.random() * 400);
    }
    setTimeout(typeLine, 600);
  }

  // 星空粒子
  const stars = [];
  for (let i = 0; i < 80; i++){
    stars.push({
      x: Math.random(),
      y: Math.random(),
      sz: 0.4 + Math.random() * 1.2,
      alpha: 0.3 + Math.random() * 0.5,
      sp: 0.0008 + Math.random() * 0.0012,
      ph: Math.random() * Math.PI * 2
    });
  }

  // 代码雨（缓慢下落的小段代码）
  const codeDrops = [];
  const TOKEN_PER_DROP = 10;
  for (let i = 0; i < 22; i++){
    const seq = [];
    for (let k = 0; k < TOKEN_PER_DROP; k++){
      seq.push(tokens[Math.floor(Math.random() * tokens.length)]);
    }
    codeDrops.push({
      x: Math.random(),
      y: Math.random() * 1.2 - 0.2,
      seq,
      vy: 0.00018 + Math.random() * 0.00025,
      alpha: 0.18 + Math.random() * 0.18
    });
  }

  // 大型漂浮 Binary 心（缓慢旋转上升）
  const bigHearts = [];
  for (let i = 0; i < 3; i++){
    bigHearts.push({
      x: 0.2 + Math.random() * 0.6,
      y: 0.3 + Math.random() * 0.5,
      sz: 6 + Math.random() * 4,
      hue: 330 + Math.random() * 30,
      ph: Math.random() * Math.PI * 2
    });
  }

  function draw(t){
    const w = window.innerWidth, h = window.innerHeight;
    // 极淡填充（让前面的元素露出来）
    ctx.fillStyle = 'rgba(8, 4, 18, 0.35)';
    ctx.fillRect(0, 0, w, h);

    // 1. 大型 Binary 心（轮廓）
    bigHearts.forEach(bh => {
      bh.ph += 0.0008;
      const cx = bh.x * w;
      const cy = bh.y * h + Math.sin(bh.ph * 4) * 8;
      const cell = bh.sz;
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.font = `${cell}px "Cormorant Garamond", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let row = 0; row < heartBin.length; row++){
        for (let col = 0; col < 8; col++){
          if (heartBin[row][col] === '1'){
            const px = cx + (col - 4) * cell;
            const py = cy + (row - 3) * cell;
            ctx.fillStyle = `hsla(${bh.hue}, 80%, 75%, ${0.55 + Math.sin(bh.ph + row + col)*0.25})`;
            ctx.fillText(Math.random() > 0.5 ? '1' : '0', px, py);
          }
        }
      }
      ctx.restore();
    });

    // 2. 代码雨（淡色块状）
    ctx.save();
    ctx.font = '11px "Courier New", monospace';
    ctx.textBaseline = 'top';
    codeDrops.forEach(d => {
      d.y += d.vy;
      if (d.y > 1.2){ d.y = -0.2; d.x = Math.random(); }
      d.seq.forEach((tk, k) => {
        const yy = d.y * h + k * 14;
        if (yy < 0 || yy > h) return;
        const fade = k === d.seq.length - 1 ? 0.6 : (k === 0 ? 0.05 : d.alpha);
        ctx.fillStyle = k === d.seq.length - 1
          ? `hsla(330, 80%, 80%, ${fade})`
          : `hsla(${280 + k * 5}, 50%, 65%, ${fade})`;
        ctx.fillText(tk, d.x * w, yy);
      });
    });
    ctx.restore();

    // 3. 星空闪烁
    stars.forEach(s => {
      const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      ctx.fillStyle = `hsla(280, 60%, 85%, ${s.alpha * tw})`;
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.sz, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // 彩蛋：F12 控制台
  console.log('%c♥ Compiled with love ♥', 'color:#ff8eb3;font-size:18px;font-weight:bold;text-shadow:0 0 10px #ff8eb3;');

  console.log('%c  —— 给最爱的人', 'color:#ffd0e0;font-size:11px;');
})();

      { cx: w*0.3 + Math.sin(nebulaTime)*w*0.08, cy: h*0.4 + Math.cos(nebulaTime*0.85)*h*0.06, r: w*0.55, hue: 280 },
      { cx: w*0.75 + Math.cos(nebulaTime*0.7)*w*0.07, cy: h*0.6 + Math.sin(nebulaTime*1.1)*h*0.05, r: w*0.5, hue: 330 },
      { cx: w*0.5 + Math.sin(nebulaTime*1.3)*w*0.09, cy: h*0.25 + Math.cos(nebulaTime*0.6)*h*0.07, r: w*0.6, hue: 200 },
      { cx: w*0.15 + Math.cos(nebulaTime*0.4)*w*0.05, cy: h*0.8 + Math.sin(nebulaTime*0.9)*h*0.04, r: w*0.4, hue: 310 }
    ];
    nebulae.forEach(n => {
      const g = ctx.createRadialGradient(n.cx, n.cy, 0, n.cx, n.cy, n.r);
      g.addColorStop(0, `hsla(${n.hue}, 75%, 55%, ${nebulaAlpha})`);
      g.addColorStop(0.4, `hsla(${n.hue}, 65%, 40%, ${nebulaAlpha*0.5})`);
      g.addColorStop(1, `hsla(${n.hue}, 65%, 20%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });

    // 2. 极光波带（沿横向起伏的彩色光幕）
    auroraBands.forEach(b => {
      b.phase += b.speed;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 用多点横向曲线 + 渐变填充
      const yTop = h * (b.yBase - b.amplitude);
      const yBot = h * (b.yBase + b.amplitude*1.6);
      const grad = ctx.createLinearGradient(0, yTop, 0, yBot);
      grad.addColorStop(0, `hsla(${b.hue}, 70%, 60%, 0)`);
      grad.addColorStop(0.4, `hsla(${b.hue}, 80%, 65%, ${b.alpha})`);
      grad.addColorStop(1, `hsla(${b.hue}, 80%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      const steps = 40;
      for (let i = 0; i <= steps; i++){
        const u = i / steps;
        const x = u * w;
        const y = h*b.yBase + Math.sin(u*b.freq*Math.PI*2 + b.phase) * h*b.amplitude;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      for (let i = steps; i >= 0; i--){
        const u = i / steps;
        const x = u * w;
        const y = h*(b.yBase + b.amplitude*1.4) + Math.sin(u*b.freq*Math.PI*2 + b.phase + 0.6) * h*b.amplitude*0.5;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // 3. 主星点（带 twinkle 闪烁）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    stars.forEach(s => {
      const tw = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
      const alpha = s.baseAlpha * (0.5 + tw*0.5);
      ctx.fillStyle = `hsla(${s.hue}, 75%, 85%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.sz, 0, Math.PI*2);
      ctx.fill();
      if (s.sz > 1.4){
        const r = s.sz*5;
        const rg = ctx.createRadialGradient(s.x*w, s.y*h, 0, s.x*w, s.y*h, r);
        rg.addColorStop(0, `hsla(${s.hue}, 80%, 90%, ${alpha*0.4})`);
        rg.addColorStop(1, `hsla(${s.hue}, 80%, 90%, 0)`);
        ctx.fillStyle = rg;
        ctx.fillRect(s.x*w - r, s.y*h - r, r*2, r*2);
      }
    });
    ctx.restore();

    // 4. 漂浮萤火粒子（缓慢上升 + 呼吸）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    motes.forEach(m => {
      m.x += m.vx;
      m.y += m.vy;
      if (m.y < -0.05){ m.y = 1.05; m.x = Math.random(); }
      if (m.x < 0) m.x = 1; else if (m.x > 1) m.x = 0;
      const pulse = 0.5 + 0.5 * Math.sin(t * m.pulseSpeed + m.phase);
      const alpha = m.baseAlpha * (0.4 + pulse*0.6);
      const r = m.r * (0.8 + pulse*0.5);
      const grd = ctx.createRadialGradient(m.x*w, m.y*h, 0, m.x*w, m.y*h, r*4);
      grd.addColorStop(0, `hsla(${m.hue}, 85%, 80%, ${alpha})`);
      grd.addColorStop(0.4, `hsla(${m.hue}, 85%, 70%, ${alpha*0.4})`);
      grd.addColorStop(1, `hsla(${m.hue}, 85%, 60%, 0)`);
      ctx.fillStyle = grd;
      ctx.fillRect(m.x*w - r*4, m.y*h - r*4, r*8, r*8);
    });
    ctx.restore();

    // 5. 流星雨（更频繁）
    if (t - lastMeteorTime > 800 + Math.random()*1800 && meteors.length < MAX_METEORS){
      meteors.push(spawnMeteor());
      lastMeteorTime = t;
    }
    meteors = meteors.filter(m => m.life < m.maxLife);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    meteors.forEach(m => {
      m.x += m.vx; m.y += m.vy;
      m.life++;
      const x0 = m.x*w, y0 = m.y*h;
      const tx = (m.x - m.vx*m.len*100)*w, ty = (m.y - m.vy*m.len*100)*h;
      const g = ctx.createLinearGradient(tx, ty, x0, y0);
      g.addColorStop(0, `hsla(${m.hue}, 80%, 85%, 0)`);
      g.addColorStop(0.7, `hsla(${m.hue}, 90%, 95%, 0.45)`);
      g.addColorStop(1, `hsla(${m.hue}, 95%, 100%, 0.95)`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x0, y0);
      ctx.stroke();
      const hr = 8;
      const hg = ctx.createRadialGradient(x0, y0, 0, x0, y0, hr);
      hg.addColorStop(0, `hsla(${m.hue}, 95%, 100%, 0.9)`);
      hg.addColorStop(1, `hsla(${m.hue}, 95%, 100%, 0)`);
      ctx.fillStyle = hg;
      ctx.fillRect(x0 - hr, y0 - hr, hr*2, hr*2);
    });
    ctx.restore();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){

}

function fibonacciSphere(n, radius){
  const points = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(1 - y*y);
    const theta = phi * i;
    const x = Math.cos(theta)*r;
    const z = Math.sin(theta)*r;
    points.push(new THREE.Vector3(x*radius, y*radius, z*radius));
  }
  return points;
}

async function buildSphereWall(photosData){
  // 收集所有照片（缩略图用 thumb_small，原图等用户点击才加载）
  const allItems = [];
  CHAPTERS.forEach((ch, ci) => {
    if (!ch.folder) return;
    const photos = photosData[ch.folder]?.original || [];
    const shuffled = shuffle(photos);
    shuffled.forEach((p, i) => {
      if (!p) return;
      allItems.push({
        chapterIdx: ci,
        src: `${ch.folder}/${p}`,
        thumbSrc: `${ch.folder}/thumb_small/${p.replace(/^thumb\//,'')}`,
        isMain: i === 0
      });
    });
  });

  const loader = document.getElementById('loader');
  const loaderRing = document.getElementById('loaderRing');
  const loaderPct = document.getElementById('loaderPct');
  const loaderCount = document.getElementById('loaderCount');
  const loaderTotal = document.getElementById('loaderTotal');
  const loaderThumbs = document.getElementById('loaderThumbs');
  loader.classList.add('show');
  loaderTotal.textContent = allItems.length;

  // 用 Fibonacci 球面分布一次性占完所有位置
  const totalPositions = allItems.length;
  const allPositions = fibonacciSphere(totalPositions, SPHERE_R - 2.5);

  // 缩略图条：滚动到底，保证最新缩略图可见
  const RING_CIRCUM = 339.292;  // 2π * 54

  function loadOne(item, idx){
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        resolve({ item, tex, idx, ok:true, thumbImg: img });
      };
      img.onerror = () => resolve({ item, tex:null, idx, ok:false, thumbImg: null });
      img.src = item.thumbSrc;
    });
  }

  function addPhotoToSphere(item, tex, posIndex){
    const img = tex.image;
    const aspect = img.width / img.height;
    const baseH = 6.5;
    const baseW = baseH * aspect;
    const geo = new THREE.PlaneGeometry(baseW, baseH);
    const mat = new THREE.MeshBasicMaterial({ map: tex, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(allPositions[posIndex]);
    mesh.lookAt(0, 0, 0);
    mesh.scale.set(0.01, 0.01, 0.01);
    photoGroup.add(mesh);
    photoMeshes.push({
      mesh, chapterIdx: item.chapterIdx, src: item.src,
      basePos: allPositions[posIndex].clone(),
      positionMul: 1.0
    });
    window.photoCount = photoMeshes.length;
  }

  let loadedCount = 0;
  const totalCount = allItems.length;

  const allPromises = allItems.map((item, idx) =>
    loadOne(item, idx).then(result => {
      loadedCount++;
      const pct = Math.floor(loadedCount / totalCount * 100);
      // 更新 SVG ring
      const offset = RING_CIRCUM * (1 - pct/100);
      if (loaderRing) loaderRing.style.strokeDashoffset = offset;
      // 更新数字 + 计数器
      if (loaderPct) loaderPct.textContent = pct;
      if (loaderCount) loaderCount.textContent = loadedCount;
      // 添加缩略图到条带
      if (loaderThumbs && result.thumbImg){
        const t = document.createElement('div');
        t.className = 'loader-thumb';
        t.style.backgroundImage = `url(${item.thumbSrc})`;
        loaderThumbs.appendChild(t);
        // 触发进入动画
        requestAnimationFrame(() => t.classList.add('show'));
        // 横向滚动使最新缩略图可见
        loaderThumbs.scrollLeft = loaderThumbs.scrollWidth;
      }
      return result;
    })
  );

  // 全部加载完（每张 mesh 入场，但先不让 photoGroup 可见）
  const results = await Promise.all(allPromises);

  // 把所有 mesh 添加到 photoGroup
  results.forEach(r => {
    if (r.ok) addPhotoToSphere(r.item, r.tex, r.idx);
  });

  // 显示 loader 还保留 500ms 让用户看到 100%
  await new Promise(r => setTimeout(r, 1200));

  loader.classList.remove('show');
  setTimeout(() => loader.remove(), 500);

  // 整体显示球体（统一入场动画）
  const showStart = performance.now();
  photoMeshes.forEach((p, i) => {
    photoEnterStart.set(p.mesh, showStart + i * 12);  // 12ms 间隔，错落入场
  });
  photoGroup.visible = true;
}

// 旋转控制（拖动 + 自动旋转 + 缩放）
let rotY = 0, rotX = 0;
let camDist = 70;  // 相机到球心距离
const CAM_MIN = 12;   // 最近（飞入球内）
const CAM_MAX = 100;  // 最远（看全貌）
const CAM_DEFAULT = 70;
let autoRotate = true;
let lastTouchX = 0, lastTouchY = 0;
let isDragging = false;
let pinchStartDist = 0;
let pinchStartCamDist = 0;

function applyRotation(){
  photoGroup.rotation.y = rotY;
  photoGroup.rotation.x = rotX;
  homeCamera.position.set(0, 0, camDist);
  homeCamera.lookAt(0, 0, 0);
}
applyRotation();

function getDist(a, b){
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    // 双指捏合
    isDragging = false;
    pinchStartDist = getDist(e.touches[0], e.touches[1]);
    pinchStartCamDist = camDist;
    autoRotate = false;
    return;
  }
  isDragging = true; autoRotate = false;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 2){
    const d = getDist(e.touches[0], e.touches[1]);
    const ratio = pinchStartDist / d;
    camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, pinchStartCamDist * ratio));
    applyRotation();
    return;
  }
  if (!isDragging) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
  applyRotation();
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// 鼠标拖动（PC）
homeRenderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false;
  lastTouchX = e.clientX; lastTouchY = e.clientY;
});
homeRenderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.clientX; lastTouchY = e.clientY;
  applyRotation();
});
homeRenderer.domElement.addEventListener('mouseup', () => isDragging = false);
homeRenderer.domElement.addEventListener('mouseleave', () => isDragging = false);

// 鼠标滚轮缩放（PC）
homeRenderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist + e.deltaY * 0.05));
  autoRotate = false;
  applyRotation();
}, {passive:false});

// 点击照片 - 打开预览大图
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let touchDownX = 0, touchDownY = 0;

function pickPhoto(clientX, clientY){
  const rect = homeRenderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, homeCamera);
  const meshes = photoMeshes.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length){
    return photoMeshes.find(p => p.mesh === hits[0].object) || null;
  }
  return null;
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  touchDownX = e.touches[0].clientX;
  touchDownY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', e => {
  const dx = Math.abs(e.changedTouches[0].clientX - touchDownX);
  const dy = Math.abs(e.changedTouches[0].clientY - touchDownY);
  if (dx > 8 || dy > 8) return;
  const pm = pickPhoto(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  if (pm) openPreview(pm);
});

homeRenderer.domElement.addEventListener('click', e => {
  const pm = pickPhoto(e.clientX, e.clientY);
  if (pm) openPreview(pm);
});

// 自动旋转 + 高亮镜头正前方的照片 + 共享入场缩放
const photoEnterStart = new WeakMap();  // mesh -> 入场开始时间
const photoPhase = new WeakMap();       // mesh -> 独立呼吸相位

function animateHome(){
  if (autoRotate){
    rotY += 0.0012;
    applyRotation();
  }

  // 中心心脏核心脉动
  const tNow = performance.now() * 0.001;
  const heartbeat = 0.85 + Math.sin(tNow * 2.8) * 0.15;  // 0.7 ~ 1.0
  coreMesh.scale.setScalar(heartbeat);
  haloMesh.scale.setScalar(1 + Math.sin(tNow * 2.8) * 0.15);
  haloMat.opacity = 0.18 + Math.sin(tNow * 2.8) * 0.08;

  // 银河尘埃带慢转
  dust.rotation.y += 0.0005;
  dustMat.opacity = 0.5 + Math.sin(tNow * 1.3) * 0.25;

  // 找到最朝向镜头的照片（z 最大，即最靠近镜头）
  let bestIdx = -1;
  let bestZ = -Infinity;
  const tmpVec = new THREE.Vector3();
  photoMeshes.forEach((p, i) => {
    tmpVec.copy(p.mesh.position).applyEuler(photoGroup.rotation);
    const z = tmpVec.z;
    if (z > bestZ){
      bestZ = z;
      bestIdx = i;
    }
  });

  const now = performance.now();
  photoMeshes.forEach((p, i) => {
    if (!photoEnterStart.has(p.mesh)){
      photoEnterStart.set(p.mesh, now);
      photoPhase.set(p.mesh, Math.random() * Math.PI * 2);
    }
    const elapsed = now - photoEnterStart.get(p.mesh);
    const enterT = elapsed < 0 ? 0 : Math.min(1, elapsed / 600);
    const enterScale = enterT < 1 ? (1 - Math.pow(1 - enterT, 3)) : 1;

    // 高亮条件：相机远时（camDist > 40）所有照片同等显示；相机近时高亮正前方
    const isHi = (i === bestIdx && bestZ > 5 && camDist < 40);
    const targetScale = isHi ? 1.18 : 1.0;
    const cur = p.mesh.scale.x;
    const highlightScale = cur + (targetScale - cur) * 0.1;

    // 照片呼吸：±1.5% 独立相位
    const breathe = 1 + Math.sin(tNow * 1.6 + photoPhase.get(p.mesh)) * 0.015;

    const finalScale = enterT < 1 ? enterScale : highlightScale * breathe;
    p.mesh.scale.set(finalScale, finalScale, 1);

    // 高亮照片沿径向向外浮起（push outward from sphere center）
    if (enterT >= 1 && p.basePos){
      const targetMul = isHi ? 1.03 : 1.0;
      const cur = p.positionMul || 1.0;
      const next = cur + (targetMul - cur) * 0.15;
      p.positionMul = next;
      p.mesh.position.set(p.basePos.x * next, p.basePos.y * next, p.basePos.z * next);
    }
  });

  homeRenderer.render(homeScene, homeCamera);
  requestAnimationFrame(animateHome);
}
animateHome();

const previewEl = document.getElementById('preview');
const previewStage = document.getElementById('previewStage');
const previewBack = document.getElementById('previewBack');
const previewHint = document.getElementById('previewHint');
const previewDots = document.getElementById('previewDots');

let previewChapterIdx = 0;
let previewPhotos = [];      // 该章节所有原图 URL
let previewPhotoIdx = 0;
let previewAllChapters = {};  // 缓存每章的照片列表

async function openPreview(pm){
  previewChapterIdx = pm.chapterIdx;
  // 取该章节所有照片（不重复）
  const ch = CHAPTERS[previewChapterIdx];
  if (!previewAllChapters[previewChapterIdx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[previewChapterIdx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[previewChapterIdx] = [];
    }
  }
  previewPhotos = previewAllChapters[previewChapterIdx];
  // 找到当前点击的照片在预览列表中的位置
  previewPhotoIdx = previewPhotos.findIndex(p => p === pm.src);
  if (previewPhotoIdx < 0) previewPhotoIdx = 0;

  previewEl.classList.add('active');
  homeEl.style.display = 'none';
  previewBack.classList.add('show');
  setTimeout(() => previewHint.classList.add('show'), 600);

  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';
  document.getElementById('openChapterBtn').style.display = 'none';

  buildPreviewDots();
  renderPreview();
}

function buildPreviewDots(){
  previewDots.innerHTML = '';
  previewPhotos.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (i === previewPhotoIdx) d.classList.add('active');
    d.addEventListener('click', e => { e.stopPropagation(); previewPhotoIdx = i; renderPreview(); });
    previewDots.appendChild(d);
  });
  previewDots.classList.add('show');
}

function renderPreview(){
  const ch = CHAPTERS[previewChapterIdx];
  previewStage.innerHTML = `
    <div class="preview-info">
      <div class="pn">No.${String(previewChapterIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="pt">${ch.title}</div>
    </div>
  `;
  // 加载原图
  const loading = document.createElement('div');
  loading.className = 'preview-loading';
  loading.textContent = '加载原图中…';
  previewStage.appendChild(loading);

  const url = previewPhotos[previewPhotoIdx];
  const img = new Image();
  img.onload = () => {
    loading.remove();
    const slide = document.createElement('div');
    slide.className = 'preview-slide show';
    slide.innerHTML = `<img src="${url}" alt="${ch.title}">`;
    previewStage.appendChild(slide);
    // 更新 dots
    previewDots.querySelectorAll('.pdot').forEach((d, i) => d.classList.toggle('active', i === previewPhotoIdx));
  };
  img.onerror = () => {
    loading.textContent = '加载失败';
  };
  img.src = url;
}

function closePreview(){
  previewEl.classList.remove('active');
  homeEl.style.display = 'block';
  previewBack.classList.remove('show');
  previewHint.classList.remove('show');
  previewDots.classList.remove('show');
  document.getElementById('homeTitle').style.display = 'block';
  document.getElementById('homeHint').style.display = 'block';
  document.getElementById('openChapterBtn').style.display = 'inline-flex';
  previewStage.innerHTML = '';
}

previewBack.addEventListener('click', closePreview);

// 预览页触摸切换
let prevTSX = 0, prevTSY = 0, prevTST = 0;
previewEl.addEventListener('touchstart', e => {
  prevTSX = e.touches[0].clientX;
  prevTSY = e.touches[0].clientY;
  prevTST = performance.now();
}, {passive:true});
previewEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - prevTSX;
  const dy = e.changedTouches[0].clientY - prevTSY;
  const dt = performance.now() - prevTST;
  if (dt > 600) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    // 左右滑 → 切换章节
    if (dx < 0) previewNextChapter();
    else previewPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 → 切换同章节照片
    if (dy < 0) previewNext();
    else previewPrev();
  }
}, {passive:true});

function previewNext(){
  if (previewPhotoIdx < previewPhotos.length - 1){
    previewPhotoIdx++;
    renderPreview();
  }
}
function previewPrev(){
  if (previewPhotoIdx > 0){
    previewPhotoIdx--;
    renderPreview();
  }
}
function previewNextChapter(){
  // 找到下一个有 folder 的章节
  for (let i = previewChapterIdx + 1; i < CHAPTERS.length; i++){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
function previewPrevChapter(){
  for (let i = previewChapterIdx - 1; i >= 0; i--){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
async function switchPreviewChapter(idx){
  previewChapterIdx = idx;
  const ch = CHAPTERS[idx];
  if (!previewAllChapters[idx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[idx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[idx] = [];
    }
  }
  previewPhotos = previewAllChapters[idx];
  previewPhotoIdx = 0;
  buildPreviewDots();
  renderPreview();
}

const viewerEl = document.getElementById('viewer');

// 5. 章节全屏视图 —— 每章专属场景 + 3D 相册（book/flow/stack）
// ============================================================
// (viewerEl/Stage/Back/Dots 已在上方声明，viewerIdx/Photos 在上面已声明)
let viewerPhotoIdx = 0;
let viewerMode = 'flow';  // book / flow / stack
let viewerFxState = { stop: true };

async function openChapter(idx){
  viewerIdx = idx;
  const ch = CHAPTERS[idx];
  viewerEl.classList.add('active');
  homeEl.style.display = 'none';
  viewerBack.classList.add('show');
  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';
  document.getElementById('openChapterBtn').style.display = 'none';
  // 切换到对应章节的 BGM
  if (ch.bgm) switchBGM(ch.bgm);

  // 加载这一章的照片
  viewerPhotos = [];
  if (ch.folder){
    const data = await loadPhotosData();
    const entry = data[ch.folder];
    const arr = Array.isArray(entry) ? entry : (entry?.original || []);
    arr.forEach(p => viewerPhotos.push(`${ch.folder}/${p}`));
  }
  if (!viewerPhotos.length && ch.folder && !ch.isVideo){
    const fromSphere = photoMeshes.filter(p => p.chapterIdx === idx).map(p => p.src);
    viewerPhotos = fromSphere;
  }

  // 根据照片数选择展示模式
  const n = viewerPhotos.length;
  if (ch.isCover) viewerMode = 'cover';
  else if (ch.isWish) viewerMode = 'wish';
  else if (ch.isVideo) viewerMode = 'filmstrip';
  else if (n <= 5) viewerMode = 'book';
  else if (n <= 15) viewerMode = 'flow';
  else viewerMode = 'stack';

  viewerPhotoIdx = 0;
  buildViewerDots();
  renderChapterScene();
}

function buildViewerDots(){
  viewerDots.innerHTML = '';
  CHAPTERS.forEach((_,i) => {
    if (CHAPTERS[i].isCover || CHAPTERS[i].isWish || CHAPTERS[i].folder){
      const d = document.createElement('button');
      d.className = 'vdot';
      if (i === viewerIdx) d.classList.add('active');
      d.addEventListener('click', e => { e.stopPropagation(); openChapter(i); });
      viewerDots.appendChild(d);
    }
  });
  viewerDots.classList.add('show');
}

// ============================================================
// 场景渲染（每章专属氛围 + 3D 相册）
// ============================================================
let autoAdvTimer = null;
// 预加载图片缓存
const _imgCache = new Map();
function preloadImage(url){
  if (_imgCache.has(url)) return _imgCache.get(url);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
  _imgCache.set(url, p);
  return p;
}

function clearAutoAdvance(){
  if (autoAdvTimer) { clearTimeout(autoAdvTimer); autoAdvTimer = null; }
}
function startAutoAdvance(scene){
  clearAutoAdvance();
  if (viewerPhotos.length <= 1) return;  // 单张无需自动切换
  // 根据模式不同时间略不同
  const interval = viewerMode === 'book' ? 5000 : (viewerMode === 'stack' ? 3200 : 4000);
  autoAdvTimer = setTimeout(async () => {
    if (!scene.isConnected) return;
    // 计算下一张的索引
    const total = viewerPhotos.length;
    const nextIdx = (viewerPhotoIdx + 1) % total;
    // 等待下一张图片加载完成（最多等 3 秒超时）
    await Promise.race([
      preloadImage(viewerPhotos[nextIdx]),
      new Promise(r => setTimeout(r, 3000))
    ]);
    if (!scene.isConnected) return;
    // 触发切换
    if (viewerMode === 'book' && scene._book){
      bookFlip(scene._book, 'next');
    } else if (viewerMode === 'flow' && scene._flow){
      flowGo(scene, 'next');
    } else if (viewerMode === 'stack' && scene._stack){
      stackGo(scene, 'next');
    }
    // 切到下一张后再启动下一个
    startAutoAdvance(scene);
  }, interval);
}

function renderChapterScene(){
  clearAutoAdvance();
  viewerFxState.stop = true;
  viewerStage.innerHTML = '';
  const ch = CHAPTERS[viewerIdx];

  if (viewerMode === 'cover'){
    renderCoverScene(ch);
    return;
  }
  if (viewerMode === 'wish'){
    renderWishScene(ch);
    return;
  }

  // 普通章节场景：背景 + 装饰 + 3D 相册 + 文案
  const scene = document.createElement('div');
  scene.className = `scene ch${String(viewerIdx).padStart(2,'0')}`;
  scene.innerHTML = `
    <div class="scene-bg"></div>
    <div class="scene-deco"></div>
    <canvas class="scene-fx"></canvas>
    <div class="scene-frame" id="sceneFrame"></div>
    <div class="scene-info">
      <div class="scene-num">No.${String(viewerIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="scene-title">${ch.title}</div>
      <div class="scene-en">${ch.en}</div>
      <div class="scene-text">${ch.text}</div>
    </div>
    <div class="scene-counter">${viewerPhotoIdx + 1} / ${viewerPhotos.length}</div>
    <div class="scene-hint">
      <span><span class="ico"></span>左 右 · 翻 章</span>
      ${viewerMode === 'filmstrip'
        ? '<span><span class="ico"></span>点 击 · 播 放</span>'
        : '<span><span class="ico"></span>上 下 · 换 照</span>'}
    </div>`;
  viewerStage.appendChild(scene);

  // 渲染 3D 相册
  if (viewerMode === 'book') renderBook(scene);
  else if (viewerMode === 'flow') renderFlow(scene);
  else if (viewerMode === 'stack') renderStack(scene);
  else if (viewerMode === 'filmstrip') renderFilmstrip(scene);

  // 启动章节特效
  startChapterFx(scene, ch);

  // 启动自动切换（视频章节不自动）
  if (viewerMode !== 'filmstrip') startAutoAdvance(scene);
}

// 3D 相册：book —— 翻页效果
function renderBook(scene){
  const frame = scene.querySelector('#sceneFrame');
  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  // 两页：左边 = 当前照片，右边 = 文字 + 当前封面（如果第一章）
  const book = document.createElement('div');
  book.className = 'book';
  book.style.transform = 'rotateY(-12deg)';
  book.style.transformStyle = 'preserve-3d';

  // 当前页（正面可见）
  const pageFront = document.createElement('div');
  pageFront.className = 'book-page';
  const cur = viewerPhotos[curIdx];
  pageFront.innerHTML = `<img src="${cur}" alt="page ${curIdx+1}"><div class="page-num">${curIdx+1} / ${total}</div>`;
  book.appendChild(pageFront);

  // 下一页（藏在当前页下面，翻页时露出）
  const pageNext = document.createElement('div');
  pageNext.className = 'book-page next-hint';
  pageNext.style.zIndex = '-1';
  book.appendChild(pageNext);

  frame.appendChild(book);

  book._state = { curIdx, total, front: pageFront, next: pageNext, flipping: false };
  scene._book = book;
}

// 翻页动作（向上滑/下一张 = 翻到下一页）
function bookFlip(book, dir){
  if (book._state.flipping) return;
  const st = book._state;
  const total = st.total;
  let nextIdx = st.curIdx + (dir === 'next' ? 1 : -1);
  if (nextIdx < 0) nextIdx = total - 1;
  if (nextIdx >= total) nextIdx = 0;
  st.flipping = true;

  // 准备下一页内容（背面的真实内容）
  st.next.innerHTML = `<img src="${viewerPhotos[nextIdx]}" alt="page ${nextIdx+1}" style="transform:scaleX(-1)"><div class="page-num">${nextIdx+1} / ${total}</div>`;

  // 当前页向左翻
  st.front.classList.add('flipping');

  setTimeout(() => {
    // 翻完后：当前页变成下一页，再重置
    st.front.innerHTML = st.next.innerHTML;
    st.front.classList.remove('flipping');
    st.curIdx = nextIdx;
    st.flipping = false;
    // 更新计数
    const counter = book.parentElement.parentElement.querySelector('.scene-counter');
    if (counter) counter.textContent = `${nextIdx + 1} / ${total}`;
  }, 1000);
}

// 3D 相册：flow —— 圆柱封面流
function renderFlow(scene){
  const frame = scene.querySelector('#sceneFrame');
  const flow = document.createElement('div');
  flow.className = 'flow';
  frame.appendChild(flow);

  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  // 卡片分布：当前正前方，相邻卡片沿 Y 轴旋转 + 横移
  const angleStep = 22;
  const xStep = Math.min(window.innerWidth * 0.32, 130);  // 每张卡片横移距离
  viewerPhotos.forEach((url, i) => {
    const card = document.createElement('div');
    card.className = 'flow-card' + (i === curIdx ? ' active' : '');
    const offset = i - curIdx;
    let tx = 0, ty = 0, rz = 0, ry = 0, alpha = 1, scale = 1;
    if (offset === 0){
      // 正前方
      tx = 0; ty = 0;
      ry = 0;
      scale = 1;
      alpha = 1;
    } else if (offset > 0){
      const off = Math.min(offset, 3);
      tx = off * xStep;
      ty = off * 12;
      ry = -off * angleStep;
      rz = -off * 2;
      alpha = Math.max(0.25, 1 - offset * 0.22);
      scale = 1 - off * 0.06;
    } else {
      const off = Math.max(offset, -3);
      tx = off * xStep;
      ty = Math.abs(off) * 12;
      ry = -off * angleStep;
      rz = -off * 2;
      alpha = Math.max(0.25, 1 + offset * 0.22);
      scale = 1 - Math.abs(off) * 0.06;
    }
    card.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${scale})`;
    card.style.opacity = alpha;
    card.style.zIndex = 100 - Math.abs(offset);
    card.innerHTML = `<div class="flow-num">${String(i+1).padStart(2,'0')}</div><img src="${url}" alt="card ${i+1}">`;
    flow.appendChild(card);
  });

  scene._flow = flow;
}

function flowGo(scene, dir){
  const total = viewerPhotos.length;
  let next = viewerPhotoIdx + (dir === 'next' ? 1 : -1);
  if (next < 0) next = total - 1;
  if (next >= total) next = 0;
  viewerPhotoIdx = next;
  renderFlow(scene);
  const counter = scene.querySelector('.scene-counter');
  if (counter) counter.textContent = `${next + 1} / ${total}`;
}

// 3D 相册：stack —— Polaroid 堆叠
function renderStack(scene){
  const frame = scene.querySelector('#sceneFrame');
  const stack = document.createElement('div');
  stack.className = 'stack';
  frame.appendChild(stack);

  const total = viewerPhotos.length;
  const curIdx = viewerPhotoIdx;
  // 只显示当前 + 前 2 张 + 后 2 张（性能考虑）
  const range = 4;
  for (let i = Math.max(0, curIdx - range); i <= Math.min(total - 1, curIdx + range); i++){
    const card = document.createElement('div');
    card.className = 'stack-card' + (i === curIdx ? ' active' : '');
    const offset = i - curIdx;
    let rot = offset * 8;  // 每张旋转 8 度
    let tx = offset * 4;   // 横移
    let ty = Math.abs(offset) * 6;
    let scale = 1 - Math.abs(offset) * 0.04;
    let alpha = Math.max(0.4, 1 - Math.abs(offset) * 0.15);
    if (i === curIdx){
      rot = 0; tx = 0; ty = 0; scale = 1; alpha = 1;
    }
    card.style.transform = `translate(-50%, -50%) translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
    card.style.opacity = alpha;
    card.style.zIndex = 100 - Math.abs(offset);
    card.innerHTML = `<img src="${viewerPhotos[i]}" alt="stack ${i+1}"><div class="stack-caption">${CHAPTERS[viewerIdx].title}</div>`;
    stack.appendChild(card);
  }

  scene._stack = stack;
}

function stackGo(scene, dir){
  const total = viewerPhotos.length;
  let next = viewerPhotoIdx + (dir === 'next' ? 1 : -1);
  if (next < 0) next = total - 1;
  if (next >= total) next = 0;
  viewerPhotoIdx = next;
  renderStack(scene);
  const counter = scene.querySelector('.scene-counter');
  if (counter) counter.textContent = `${next + 1} / ${total}`;
}

// 章节特效：每章自定义粒子 + 装饰
function startChapterFx(scene, ch){
  const canvas = scene.querySelector('.scene-fx');
  if (!canvas) return;
  const ctx2 = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  function resize(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const state = { stop: false, particles: [] };
  viewerFxState = state;
  const rand = (a,b) => a + Math.random()*(b-a);
  const cw = () => canvas.width/dpr, chh = () => canvas.height/dpr;
  const fx = ch.effect;

  // 根据章节扩展粒子初始化
  if (fx === 'snow'){
    for (let i=0;i<60;i++) state.particles.push({x:rand(0,1),y:rand(0,1),r:rand(1.5,4.5),vy:rand(.0006,.0018),vx:rand(-.0003,.0003),ph:rand(0,6.28),alpha:rand(.5,1)});
  } else if (fx === 'meteor'){
    for (let i=0;i<20;i++) state.particles.push({x:Math.random(),y:Math.random()*.5,vx:rand(.002,.005),vy:rand(.001,.003)});
  } else if (fx === 'wave'){
    state.phase = 0;
  } else if (fx === 'petal'){
    for (let i=0;i<22;i++) state.particles.push({x:Math.random(),y:Math.random(),vy:rand(.0004,.0014),vx:rand(-.0004,.0004),rot:rand(0,6.28),vrot:rand(-.008,.008),sz:rand(5,9),hue:rand(330,360)});
  } else if (fx === 'rose'){
    for (let i=0;i<28;i++) state.particles.push({x:Math.random(),y:rand(0,1)+.2,vy:rand(.0003,.0008),vx:rand(-.0003,.0003),sz:rand(2,5),a:rand(.4,.8),ph:rand(0,6.28),hue:rand(340,360)});
  } else if (fx === 'bubble'){
    for (let i=0;i<24;i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(4,14),vy:rand(-.001,-.0003),ph:rand(0,6.28)});
  } else if (fx === 'lantern'){
    for (let i=0;i<14;i++) state.particles.push({x:Math.random(),y:rand(.3,1),vy:rand(-.0003,-.0001),ph:rand(0,6.28),sz:rand(4,7)});
  } else if (fx === 'bokeh'){
    for (let i=0;i<22;i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(10,26),ph:rand(0,6.28),col:`hsl(${rand(20,40)},80%,70%)`});
  } else if (fx === 'heart'){
    for (let i=0;i<16;i++) state.particles.push({x:Math.random(),y:rand(.5,1),vy:rand(-.0008,-.0003),sz:rand(8,16),ph:rand(0,6.28)});
  } else if (fx === 'film'){
    // 浮尘 + 偶尔的胶片划痕
    for (let i=0;i<25;i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(.6,1.5),vy:rand(-.0003,-.0001),vx:rand(-.0001,.0001),ph:rand(0,6.28),a:rand(.3,.7)});
    state.scratches = [];
    state.scratchTimer = 0;
  }

  const loop = t => {
    if (state.stop) return;
    const w = cw(), h = chh();
    ctx2.clearRect(0,0,w,h);

    if (fx === 'snow'){
      ctx2.fillStyle = 'rgba(255,255,255,.85)';
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(t*.001+p.ph)*.0005;
        if (p.y > 1){p.y=-.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.globalAlpha = p.alpha;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      ctx2.globalAlpha = 1;
    } else if (fx === 'meteor'){
      state.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x>1.2||p.y>1.2){p.x=-.2;p.y=Math.random()*.3;}
        const x0=p.x*w,y0=p.y*h,x1=(p.x-p.vx*80)*w,y1=(p.y-p.vy*80)*h;
        const g=ctx2.createLinearGradient(x1,y1,x0,y0);
        g.addColorStop(0,'rgba(255,220,180,0)');
        g.addColorStop(1,'rgba(255,240,200,.9)');
        ctx2.strokeStyle=g;ctx2.lineWidth=1.8;
        ctx2.beginPath();ctx2.moveTo(x1,y1);ctx2.lineTo(x0,y0);ctx2.stroke();
      });
    } else if (fx === 'wave'){
      ctx2.strokeStyle = 'rgba(180,220,255,.4)';
      ctx2.lineWidth = 1.2;
      const tt = t*.001;
      for (let row=0;row<6;row++){
        ctx2.beginPath();
        const y0 = h*(.5+row*.07);
        for (let x=0;x<=w;x+=8){
          const y = y0 + Math.sin(x*.02-tt*2+row*.5)*5 + Math.sin(x*.01+tt)*3;
          if (x===0)ctx2.moveTo(x,y);else ctx2.lineTo(x,y);
        }
        ctx2.stroke();
      }
    } else if (fx === 'petal'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt+p.rot)*.0006;
        p.rot += p.vrot;
        if (p.y>1.1){p.y=-.1;p.x=Math.random();}
        ctx2.save();ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.rot);
        ctx2.fillStyle=`hsla(${p.hue},75%,82%,.7)`;
        ctx2.beginPath();ctx2.ellipse(0,0,p.sz,p.sz*.6,0,0,Math.PI*2);ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'rose'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y -= p.vy; p.x += Math.sin(tt+p.ph)*.0004;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        ctx2.save();
        ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.ph+tt);
        ctx2.fillStyle=`hsla(${p.hue},70%,75%,${p.a})`;
        ctx2.beginPath();
        // 简化玫瑰花瓣形（5 瓣）
        for (let k=0;k<5;k++){
          const ang = k*Math.PI*2/5;
          ctx2.ellipse(0,0,p.sz*1.4,p.sz*.8,ang,0,Math.PI*2);
        }
        ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'bubble'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt*.5+p.ph)*.0005;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const g=ctx2.createRadialGradient(p.x*w-p.r*.3,p.y*h-p.r*.3,1,p.x*w,p.y*h,p.r);
        g.addColorStop(0,'rgba(255,255,255,.6)');
        g.addColorStop(.5,'rgba(220,240,255,.18)');
        g.addColorStop(1,'rgba(180,220,255,.02)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'lantern'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy;
        if (p.y<0){p.y=1;p.x=Math.random();}
        const al=.4+Math.sin(tt*2+p.ph)*.3;
        const r=p.sz*(1+Math.sin(tt+p.ph)*.2);
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r*4);
        g.addColorStop(0,`rgba(255,180,80,${al})`);
        g.addColorStop(.3,`rgba(255,140,60,${al*.4})`);
        g.addColorStop(1,'rgba(255,100,40,0)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r*4,0,Math.PI*2);ctx2.fill();
        ctx2.fillStyle=`rgba(255,220,150,${al})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'bokeh'){
      const tt=t*.001;
      state.particles.forEach(p => {
        const sc=1+Math.sin(tt*.5+p.ph)*.2;
        const r=p.r*sc;
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r);
        g.addColorStop(0,p.col.replace('70%)','50%)').replace(')',',.4)'));
        g.addColorStop(1,p.col.replace('70%)','40%)').replace(')',',0)'));
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'heart'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt+p.ph)*.0002;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const sc=1+Math.sin(tt+p.ph)*.3;
        const r=p.sz*sc;
        ctx2.save();
        ctx2.translate(p.x*w,p.y*h);
        ctx2.scale(r/16,r/16);
        ctx2.fillStyle=`rgba(255,142,179,${.4+Math.sin(tt+p.ph)*.2})`;
        ctx2.beginPath();
        ctx2.moveTo(0,-2);
        ctx2.bezierCurveTo(-4,-8,-12,-4,-8,4);
        ctx2.bezierCurveTo(-4,8,0,12,0,16);
        ctx2.bezierCurveTo(0,12,4,8,8,4);
        ctx2.bezierCurveTo(12,-4,4,-8,0,-2);
        ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'film'){
      const tt=t*.001;
      // 浮尘
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt*.5+p.ph)*.0002;
        if (p.y<-.05){p.y=1.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.fillStyle=`rgba(255,230,180,${p.a})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      // 胶片划痕（偶发横线闪烁）
      state.scratchTimer -= 16;
      if (state.scratchTimer <= 0 && Math.random() < 0.05){
        state.scratches.push({y: Math.random()*h, life: 8+Math.random()*12, x: 0, speed: 1+Math.random()*2});
        state.scratchTimer = 800 + Math.random()*1500;
      }
      ctx2.strokeStyle = 'rgba(255,240,200,.5)';
      ctx2.lineWidth = 1;
      state.scratches = state.scratches.filter(s => s.life > 0);
      state.scratches.forEach(s => {
        s.x = (s.x + s.speed) % w;
        s.life -= 1;
        ctx2.globalAlpha = Math.min(1, s.life / 12);
        ctx2.beginPath();
        ctx2.moveTo(s.x, s.y);
        ctx2.lineTo(s.x + 30, s.y + (Math.random()-0.5)*4);
        ctx2.stroke();
      });
      ctx2.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

// 在章节视图中：左滑下一章、右滑上一章、上下滑切换同一章内的照片
let viewTouchStartX = 0, viewTouchStartY = 0, viewTouchStartT = 0;
viewerStage.addEventListener('touchstart', e => {
  viewTouchStartX = e.touches[0].clientX;
  viewTouchStartY = e.touches[0].clientY;
  viewTouchStartT = performance.now();
}, {passive:true});
viewerStage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - viewTouchStartX;
  const dy = e.changedTouches[0].clientY - viewTouchStartY;
  const dt = performance.now() - viewTouchStartT;
  if (dt > 600) return;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50){
    // 左右滑 - 切换章节
    if (dx < 0) openNextChapter();
    else if (dx > 0) openPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 - 切换同章节内的照片
    const scene = viewerStage.querySelector('.scene');
    if (!scene || !viewerPhotos.length) return;
    if (dy < 0){
      // 下一张
      if (viewerMode === 'book' && scene._book) bookFlip(scene._book, 'next');
      else if (viewerMode === 'flow' && scene._flow) flowGo(scene, 'next');
      else if (viewerMode === 'stack' && scene._stack) stackGo(scene, 'next');
    } else {
      if (viewerMode === 'book' && scene._book) bookFlip(scene._book, 'prev');
      else if (viewerMode === 'flow' && scene._flow) flowGo(scene, 'prev');
      else if (viewerMode === 'stack' && scene._stack) stackGo(scene, 'prev');
    }
    // 手动滑动后，重启定时器（避免刚滑完又自动跳）
    startAutoAdvance(scene);
  }
}, {passive:true});

function openNextChapter(){
  for (let i = viewerIdx + 1; i < CHAPTERS.length; i++){
    if (CHAPTERS[i].folder || CHAPTERS[i].isWish){ openChapter(i); return; }
  }
}
function openPrevChapter(){
  for (let i = viewerIdx - 1; i >= 0; i--){
    if (CHAPTERS[i].folder || CHAPTERS[i].isWish){ openChapter(i); return; }
  }
}

      ['G3','B3','D4'],['G3','B3','D4'],['Am3','E4','A4'],['C3','G3','C4']
    ]
  }
};

// 章节 → BGM 映射（每章独立风格）
CHAPTERS.forEach(ch => {
  if (ch.isCover) { ch.bgm = null; return; }
  if (ch.isWish) { ch.bgm = 'future'; return; }
  const map = {
    'ch01':'lucky',
    'ch02':'snow',
    'ch03':'story',
    'ch04':'wave',
    'ch05':'grad',
    'ch06':'slow',
    'ch07':'wedding',
    'ch11':'future',
    'ch14':'wedding'
  };
  ch.bgm = map[ch.id] || 'lucky';
});

function playNote(freq, st, dur, vol, type){
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, st);
  g.gain.linearRampToValueAtTime(vol, st + .02);
  g.gain.exponentialRampToValueAtTime(vol*.5, st + dur*.5);
  g.gain.exponentialRampToValueAtTime(.001, st + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(st); osc.stop(st + dur + .1);
}
function playPad(freqs, st, dur, vol){
  if (!audioCtx) return;
  freqs.forEach(f => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(vol, st + .5);
    g.gain.linearRampToValueAtTime(vol, st + dur - .5);
    g.gain.exponentialRampToValueAtTime(.001, st + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(st); osc.stop(st + dur + .1);
  });
}
function playBGM(name){
  if (!audioCtx || !musicPlaying) return;
  const bgm = BGMS[name];
  if (!bgm) return;
  const tempo = bgm.tempo, beatDur = 60/tempo;
  const t0 = audioCtx.currentTime + .1;
  const loopDur = bgm.melody.reduce((s, n) => s + n.d, 0) * beatDur;

  let t = t0;
  bgm.melody.forEach(n => {
    if (NOTES[n.n] !== undefined)
      playNote(NOTES[n.n], t, n.d * beatDur * .9, bgm.vol, bgm.type);
    t += n.d * beatDur;
  });
  const chordStep = loopDur / bgm.chords.length;
  bgm.chords.forEach((c, i) => {
    c.forEach(note => {
      if (NOTES[note] !== undefined)
        playNote(NOTES[note], t0 + i*chordStep, chordStep*.95, bgm.padVol, 'sine');
    });
  });
  playPad(bgm.chords[0].map(n => NOTES[n]/4).filter(n => n && isFinite(n)), t0, loopDur, bgm.bassVol);

  musicLoopTimer = setTimeout(() => playBGM(name), (loopDur - .3) * 1000);
}
function startMusic(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
}
function stopMusic(){
  musicPlaying = false;
  if (musicLoopTimer) clearTimeout(musicLoopTimer);
  if (audioCtx) audioCtx.suspend();
}
function switchBGM(name){
  if (!audioCtx || !musicPlaying || !name) return;
  if (currentBGM === name) return;
  if (musicLoopTimer) clearTimeout(musicLoopTimer);
  currentBGM = name;
  playBGM(name);
}

document.getElementById('openBtn').addEventListener('click', async () => {
  window.openTime = Date.now();
  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => document.getElementById('splash').remove(), 1300);
  startMusic();
  switchBGM('lucky');  // 首页（球面）播 lucky 风格的 BGM（小幸运）
  const photosData = await loadPhotosData();
  await buildSphereWall(photosData);
});

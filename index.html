// ============================================================
// 1. Splash 3D 银河：真实太阳系 + 多星系 + 可拖拽/缩放
// ============================================================
(() => {
  const c = document.getElementById('splashCanvas');
  if (!c || typeof THREE === 'undefined') return;
  const T = THREE;
  const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.25 : 1.75);

  const renderer = new T.WebGLRenderer({ canvas: c, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x000000, 0);

  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 8, 90);
  camera.lookAt(0, 0, 0);

  // ============ 工具：圆形粒子 sprite 纹理（消除 Points 默认方块） ============
  function createSpriteTexture(color1, color2){
    const sz = 128;
    const cv = document.createElement('canvas');
    cv.width = cv.height = sz;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
    g.addColorStop(0,    color1);
    g.addColorStop(0.35, color1);
    g.addColorStop(0.7,  color2);
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, sz, sz);
    const t = new T.CanvasTexture(cv);
    t.colorSpace = T.SRGBColorSpace;
    return t;
  }
  // 三种 sprite：亮星 / 暖星 / 蓝紫星（让银河粒子有渐变光晕，不再是方块）
  const spriteBright = createSpriteTexture('rgba(255,255,255,1)', 'rgba(255,240,250,0.7)');
  const spriteWarm   = createSpriteTexture('rgba(255,220,170,1)', 'rgba(255,180,120,0.5)');
  const spritePurple = createSpriteTexture('rgba(200,170,255,1)', 'rgba(160,120,255,0.5)');
  const spritePink   = createSpriteTexture('rgba(255,180,220,1)', 'rgba(255,140,200,0.6)');

  // ============ 工具：程序化生成行星纹理（无需外部资源） ============
  // value-noise 多倍频叠加 → 真实地表细节
  function _noise2D(seed){
    // 简易 value noise，足够生成逼真的大陆/海洋/月坑
    const perm = [];
    let s = seed * 9301 + 49297;
    for (let i = 0; i < 256; i++){
      s = (s * 9301 + 49297) % 233280;
      perm.push(s / 233280);
    }
    return (x, y) => {
      const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
      const xf = x - Math.floor(x), yf = y - Math.floor(y);
      const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
      const aa = perm[(xi + yi*73) & 255];
      const ab = perm[(xi + 1 + yi*73) & 255];
      const ba = perm[(xi + (yi+1)*73) & 255];
      const bb = perm[(xi + 1 + (yi+1)*73) & 255];
      return (aa*(1-u)*(1-v) + ab*u*(1-v) + ba*(1-u)*v + bb*u*v);
    };
  }
  function _fbm(noiseFn, x, y, oct){
    let v = 0, amp = 1, freq = 1, total = 0;
    for (let i = 0; i < oct; i++){
      v += noiseFn(x*freq, y*freq) * amp;
      total += amp;
      amp *= 0.5; freq *= 2;
    }
    return v / total;
  }
  function createEarthTexture(){
    const W = 1024, H = 512;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const n = _noise2D(42);
    const img = ctx.createImageData(W, H);
    const d = img.data;
    for (let y = 0; y < H; y++){
      // 用球面坐标 u,v → noise 采样：避免两极拉长
      const v = y / H;
      const lat = (v - 0.5) * Math.PI;
      const sinLat = Math.sin(lat);
      const cosLat = Math.cos(lat);
      for (let x = 0; x < W; x++){
        const u = x / W;
        const lon = (u - 0.5) * Math.PI * 2;
        // 三维坐标 → 多倍频 fbm
        const px = Math.cos(lon) * cosLat * 3;
        const py = sinLat * 3;
        const pz = Math.sin(lon) * cosLat * 3;
        const h = _fbm(n, px, py, 6);
        const i = (y * W + x) * 4;
        let r, g, b;
        if (h < 0.50){
          // 深海 → 浅海
          const t = h / 0.50;
          r = 10 + t*30; g = 40 + t*60; b = 110 + t*60;
        } else if (h < 0.52){
          // 海岸线
          r = 220; g = 200; b = 150;
        } else if (h < 0.75){
          // 陆地：森林 / 草原 / 沙漠
          const t = (h - 0.52) / 0.23;
          if (t < 0.4){      r = 50 + t*40; g = 95 + t*40; b = 45 + t*30; }
          else if (t < 0.75){ r = 100; g = 130; b = 60; }
          else                { r = 200; g = 175; b = 110; }
        } else {
          // 高山雪线
          const t = (h - 0.75) / 0.25;
          r = 220 + t*30; g = 220 + t*30; b = 230 + t*25;
        }
        // 极地冰盖
        const polar = Math.abs(v - 0.5) > 0.42 ? (Math.abs(v-0.5) - 0.42) / 0.08 : 0;
        if (polar > 0){
          r = r*(1-polar) + 245*polar;
          g = g*(1-polar) + 248*polar;
          b = b*(1-polar) + 252*polar;
        }
        // 云层（更高频白雾）
        const cloud = _fbm(n, px*1.4 + 5.5, py*1.4 + 5.5, 4);
        if (cloud > 0.62){
          const a = Math.min(1, (cloud - 0.62) / 0.25) * 0.55;
          r = r*(1-a) + 250*a;
          g = g*(1-a) + 252*a;
          b = b*(1-a) + 255*a;
        }
        d[i] = r|0; d[i+1] = g|0; d[i+2] = b|0; d[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new T.CanvasTexture(cv);
    tex.colorSpace = T.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }
  function createMoonTexture(){
    const W = 1024, H = 512;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const n = _noise2D(7);
    const img = ctx.createImageData(W, H);
    const d = img.data;
    for (let y = 0; y < H; y++){
      const v = y / H;
      const lat = (v - 0.5) * Math.PI;
      const sinLat = Math.sin(lat), cosLat = Math.cos(lat);
      for (let x = 0; x < W; x++){
        const u = x / W;
        const lon = (u - 0.5) * Math.PI * 2;
        const px = Math.cos(lon)*cosLat*4, py = sinLat*4, pz = Math.sin(lon)*cosLat*4;
        // 月海（大块暗斑）
        const mare = _fbm(n, px*0.4, py*0.4, 4);
        // 月坑（高频暗点 + 边缘亮环）
        const crater = _fbm(n, px*8 + 13, py*8 + 13, 3);
        const detail = _fbm(n, px*16, py*16, 3);
        const base = 0.55 + mare*0.35;
        let gray = base - (crater > 0.72 ? (crater - 0.72) * 2 : 0);
        gray -= detail * 0.18;
        gray = Math.max(0.18, Math.min(0.95, gray));
        const c = (gray * 255)|0;
        const i = (y * W + x) * 4;
        // 月海带轻微蓝色调（玄武岩）
        const isMare = mare < 0.45;
        d[i]   = isMare ? (c*0.92)|0 : c;
        d[i+1] = isMare ? (c*0.94)|0 : c;
        d[i+2] = isMare ? (c*1.00)|0 : (c*0.96)|0;
        d[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new T.CanvasTexture(cv);
    tex.colorSpace = T.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }
  // ============ 真实 NASA 贴图加载（多源 fallback） ============
  // 主源 jsdelivr（国内可达 + CORS 全开）镜像 threex.planets（真实 NASA 影像）；
  // 地球/月亮优先 threejs.org 的 2048 高清版。程序化纹理兜底
  const TEX_URLS = {
    earth: [
      'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthmap1k.jpg'
    ],
    moon: [
      'https://threejs.org/examples/textures/planets/moon_1024.jpg',
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/moonmap1k.jpg'
    ],
    mercury: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurymap.jpg'
    ],
    venus: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusmap.jpg'
    ],
    mars: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsmap1k.jpg'
    ],
    jupiter: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/jupitermap.jpg'
    ],
    saturn: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/saturnmap.jpg'
    ],
    uranus: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/uranusmap.jpg'
    ],
    neptune: [
      'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/neptunemap.jpg'
    ]
  };
  // 同步探测：按顺序尝试，命中即返回
  function tryLoadTexture(urls, fallbackTex){
    return new Promise(resolve => {
      let i = 0;
      const tryNext = () => {
        if (i >= urls.length){
          resolve(fallbackTex);
          return;
        }
        const url = urls[i++];
        const loader = new T.TextureLoader();
        // 用 .load 但立刻检查 image
        loader.load(url,
          tex => {
            tex.colorSpace = T.SRGBColorSpace;
            tex.anisotropy = 4;
            tex.needsUpdate = true;
            resolve(tex);
          },
          undefined,
          () => { tryNext(); }
        );
      };
      tryNext();
      // 兜底超时：单个 URL 1.5s 还不出图就放弃整个链条
      setTimeout(() => resolve(fallbackTex), 6000);
    });
  }
  // 程序化兜底
  const fallbackTextures = {
    earth: createEarthTexture(),
    moon:  createMoonTexture()
  };
  // 程序化卫星剖面贴图（Wikimedia 国内不可达，改为本地绘制始终可见）：
  // 0 = ISS（桁架 + 双侧太阳翼） 1 = Hubble（镜筒 + 两侧太阳板） 2 = 天宫（T 字构型）
  function createSatTexture(kind){
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 128;
    const ctx = cv.getContext('2d');
    const PANEL = '#2a3f6e', MODULE = '#d8dce4', MODULE_D = '#9aa2b0';
    const panel = (x, y, w, h) => {
      ctx.fillStyle = PANEL; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(140,170,255,.5)'; ctx.lineWidth = 1;
      for (let gx = x + w/4; gx < x + w; gx += w/4){ ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y+h); ctx.stroke(); }
      for (let gy = y + h/3; gy < y + h; gy += h/3){ ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x+w, gy); ctx.stroke(); }
    };
    const module = (x, y, w, h) => {
      ctx.fillStyle = MODULE; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = MODULE_D; ctx.fillRect(x, y + h*0.72, w, h*0.28);
    };
    ctx.clearRect(0, 0, 256, 128);
    if (kind === 0){
      // ISS：中央桁架 + 4 对大太阳翼 + 居中舱段群
      ctx.fillStyle = MODULE_D; ctx.fillRect(96, 60, 64, 8);       // 主桁架
      panel(4, 38, 44, 22); panel(4, 68, 44, 22);                  // 左翼
      panel(208, 38, 44, 22); panel(208, 68, 44, 22);              // 右翼
      module(112, 44, 32, 40);                                      // 节点舱
      module(88, 52, 20, 24); module(148, 52, 20, 24);              // 实验舱
      ctx.fillStyle = MODULE; ctx.fillRect(120, 24, 16, 18); ctx.fillRect(120, 86, 16, 18); // 上下舱段
    } else if (kind === 1){
      // Hubble：镜筒本体 + 打开的两块太阳板
      module(96, 44, 64, 40);                                       // 镜筒
      ctx.fillStyle = MODULE_D; ctx.beginPath(); ctx.arc(128, 64, 14, 0, Math.PI*2); ctx.fill(); // 主镜口
      panel(18, 52, 60, 24); panel(178, 52, 60, 24);                // 太阳板
      ctx.fillStyle = MODULE_D; ctx.fillRect(92, 60, 8, 8); ctx.fillRect(156, 60, 8, 8);
    } else {
      // 天宫：T 字构型（核心舱 + 两侧实验舱 + 近端太阳翼）
      module(116, 36, 24, 56);                                      // 核心舱（竖）
      module(72, 48, 112, 20);                                      // 横向实验舱对
      panel(24, 50, 40, 16); panel(192, 50, 40, 16);                // 太阳翼
      ctx.fillStyle = MODULE; ctx.fillRect(120, 92, 16, 16);        // 对接舱
    }
    const tex = new T.CanvasTexture(cv);
    tex.colorSpace = T.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }
  // 异步替换每个行星的贴图
  Object.keys(TEX_URLS).forEach(name => {
    const urls = TEX_URLS[name];
    const fb = fallbackTextures[name] || null;
    tryLoadTexture(urls, fb).then(tex => {
      if (!tex) return;
      const planet = planetMeshes.find(p => p.userData.name === name);
      if (!planet) return;
      // 木星原来是条带 ShaderMaterial：贴图到位后整体换成 Lambert 材质
      if (planet.material.isShaderMaterial){
        planet.material.dispose();
        planet.material = new T.MeshLambertMaterial({ map: tex, emissive: 0x14141f });
      } else {
        planet.material.map = tex;
        planet.material.color.set(0xffffff);  // 去掉底色避免给贴图染色
        planet.material.emissive.setHex(0x14141f);  // 夜面隐约可见
        planet.material.needsUpdate = true;
      }
    });
  });
  // 月亮：单独等 earth 加载完成后再绑定（同 fallback）
  tryLoadTexture(TEX_URLS.moon, fallbackTextures.moon).then(tex => {
    if (!tex) return;
    const earth = planetMeshes.find(p => p.userData.name === 'earth');
    if (earth && earth.userData.moonMesh){
      earth.userData.moonMesh.material.map = tex;
      earth.userData.moonMesh.material.needsUpdate = true;
    }
  });
  // 兼容旧引用：保留这两个变量名供其它代码使用
  const earthTex = fallbackTextures.earth;
  const moonTex  = fallbackTextures.moon;

  // 相机控制状态（球面坐标：yaw 绕 Y 轴、pitch 仰角、distance 距离）
  let yaw = 0, pitch = 0.05, distance = 12;  // 默认距离改为 12：贴近地球（轨道半径）
  let targetYaw = 0, targetPitch = 0.05, targetDistance = 12, targetFOV = 60;
  let isDragging = false, lastX = 0, lastY = 0;
  // 默认相机聚焦在地球（用户要求"以地球为中心"）；点击其他天体/星系后切换
  let focusObj = null;
  let cameraTarget = { x: 12, y: 0, z: 0 };
  let targetCameraTarget = { x: 12, y: 0, z: 0 };
  function applyCamera(){
    // 跟随当前聚焦对象（默认地球）；对象被移除时回退地球
    const f = (focusObj && focusObj.parent) ? focusObj : planetMeshes.find(p => p.userData.name === 'earth');
    if (f){
      targetCameraTarget.x = f.position.x;
      targetCameraTarget.y = f.position.y || 0;
      targetCameraTarget.z = f.position.z;
    }
    // 平滑过渡 camera target
    cameraTarget.x += (targetCameraTarget.x - cameraTarget.x) * 0.05;
    cameraTarget.y += (targetCameraTarget.y - cameraTarget.y) * 0.05;
    cameraTarget.z += (targetCameraTarget.z - cameraTarget.z) * 0.05;
    const cp = Math.cos(pitch);
    // 相机位置 = target + 球面偏移
    camera.position.set(
      cameraTarget.x + Math.sin(yaw)*cp*distance,
      cameraTarget.y + Math.sin(pitch)*distance,
      cameraTarget.z + Math.cos(yaw)*cp*distance
    );
    camera.lookAt(cameraTarget.x, cameraTarget.y, cameraTarget.z);
  }

  // 太阳 —— 程序化湍流着色器（无外部贴图）
  const sunMat = new T.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uHot: { value: 1.0 } },
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}`,
    fragmentShader: `
      varying vec3 vN;
      uniform float uTime;
      uniform float uHot;
      // 紧凑伪噪声
      float h(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
      float n(vec3 p){
        vec3 i=floor(p), f=fract(p);
        f=f*f*(3.0-2.0*f);
        float a=h(i), b=h(i+vec3(1,0,0)), c=h(i+vec3(0,1,0)), d=h(i+vec3(1,1,0));
        float e=h(i+vec3(0,0,1)), g=h(i+vec3(1,0,1)), h2=h(i+vec3(0,1,1)), k=h(i+vec3(1,1,1));
        return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(h2,k,f.x),f.y),f.z);
      }
      float fbm(vec3 p){
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){ v+=a*n(p); p*=2.02; a*=0.5; }
        return v;
      }
      void main(){
        vec3 p = normalize(vN);
        float q = fbm(p*3.5 + vec3(uTime*0.18));
        float q2 = fbm(p*9.0 + vec3(-uTime*0.3));
        float t = clamp(q*0.7 + q2*0.3, 0.0, 1.0);
        vec3 c1=vec3(1.0,0.95,0.7), c2=vec3(1.0,0.55,0.18), c3=vec3(0.85,0.15,0.05);
        vec3 col = mix(c1,c2,smoothstep(0.3,0.55,t));
        col = mix(col, c3, smoothstep(0.55,0.85,t));
        col *= uHot;
        gl_FragColor = vec4(col, 1.0);
      }`,
    transparent: false
  });
  const sun = new T.Mesh(new T.SphereGeometry(3, 64, 32), sunMat);
  sun.userData = { name: 'sun', r: 3 };
  scene.add(sun);

  // 太阳光晕（BackSide 加法）
  const coronaMat = new T.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}`,
    fragmentShader: `
      varying vec3 vN;
      uniform float uTime;
      void main(){
        float rim = pow(1.0 - abs(vN.z), 2.4);
        vec3 col = mix(vec3(1.0,0.55,0.2), vec3(1.0,0.85,0.4), rim);
        gl_FragColor = vec4(col*rim*1.4, rim*0.75);
      }`,
    transparent: true,
    blending: T.AdditiveBlending,
    depthWrite: false,
    side: T.BackSide
  });
  const corona = new T.Mesh(new T.SphereGeometry(4.6, 48, 24), coronaMat);
  scene.add(corona);

  // 行星系统（真实相对大小 + 真实公转比例）
  const PLANETS = [
    { name:'mercury', r:0.42, d:6,  color:0xa39080, speed:4.15, axial:0.02, rough:0.6 },
    { name:'venus',   r:0.70, d:9,  color:0xe8c78a, speed:1.62, axial:0.005, cloud:0xd9b078 },
    { name:'earth',   r:1.5, d:12, color:0x2c6cb8, speed:1.0,  axial:0.04, atm:true },
    { name:'mars',    r:0.55, d:15, color:0xb85a30, speed:0.53, axial:0.045, polar:0xeae0d0 },
    { name:'jupiter', r:2.2,  d:22, color:0xc8a878, speed:0.084, axial:0.12, bands:true },
    { name:'saturn',  r:1.9,  d:27, color:0xe8d18a, speed:0.034, axial:0.11, rings:true },
    { name:'uranus',  r:1.3,  d:32, color:0x7fc8d8, speed:0.012, axial:0.07, tilt:0.5 },
    { name:'neptune', r:1.2,  d:37, color:0x4060d0, speed:0.006, axial:0.07 }
  ];
  const planetMeshes = [];
  const planetOrbits = [];

  // 全局光照：环境光（柔光底）+ 太阳方向光（让行星近看有真实明暗）
  const sunLight = new T.PointLight(0xfff0d0, 2.0, 0, 0);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);
  // 环境光提亮：行星夜面保持隐约可见（否则聚焦夜面时全黑）
  scene.add(new T.AmbientLight(0x606880, 0.85));

  PLANETS.forEach((p) => {
    let mat;
    if (p.name === 'earth'){
      // 地球：Lambert 材质让 NASA 贴图有立体光照感
      mat = new T.MeshLambertMaterial({ map: earthTex });
    } else if (p.name === 'mars'){
      // 火星：锈红程序化纹理 + Lambert 光照
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(256, 256); const d = img.data;
      for (let y = 0; y < 256; y++){
        for (let x = 0; x < 256; x++){
          const i = (y*256+x)*4;
          const n = Math.sin(x*0.05)*Math.cos(y*0.05) + Math.sin(x*0.13+y*0.17)*0.5;
          const v = (n*0.5 + 0.5);
          d[i]   = (160 + v*70)|0;
          d[i+1] = (60 + v*40)|0;
          d[i+2] = (30 + v*30)|0;
          d[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const t = new T.CanvasTexture(cv); t.colorSpace = T.SRGBColorSpace;
      mat = new T.MeshLambertMaterial({ map: t });
    } else if (p.bands){
      // 木星：条带 shader
      mat = new T.ShaderMaterial({
        uniforms: { uTime:{value:0} },
        vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `
          varying vec3 vP;
          uniform float uTime;
          float h(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
          float n(vec3 p){
            vec3 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
            return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                       mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);
          }
          void main(){
            vec3 p = normalize(vP);
            float lat = p.y;                          // -1..1
            float bands = sin(lat*16.0 + n(p*4.0)*0.6) * 0.5 + 0.5;
            float turb = n(p*8.0) * 0.4;
            vec3 a = vec3(0.85,0.72,0.55);           // 浅褐
            vec3 b = vec3(0.55,0.38,0.22);           // 深褐
            vec3 c = vec3(0.95,0.85,0.7);            // 米白
            vec3 col = mix(a, b, bands);
            col = mix(col, c, smoothstep(0.4, 0.55, bands)*0.6);
            col = mix(col, c*0.5, turb);
            gl_FragColor = vec4(col, 1.0);
          }`
      });
    } else {
      mat = new T.MeshLambertMaterial({ color: p.color });
    }
    const m = new T.Mesh(new T.SphereGeometry(p.r, 64, 48), mat);
    m.userData = { ...p, angle: Math.random() * Math.PI * 2 };
    scene.add(m);
    planetMeshes.push(m);

    // 月亮 + 卫星（地球专属）
    if (p.name === 'earth'){
      const moonOrbitR = p.r * 2.2;
      const moonMat = new T.MeshLambertMaterial({ map: moonTex });
      const moonMesh = new T.Mesh(new T.SphereGeometry(p.r * 0.27, 32, 24), moonMat);
      moonMesh.position.set(moonOrbitR, 0, 0);
      moonMesh.userData = { isMoon: true, moonAngle: 0, orbitR: moonOrbitR };
      m.add(moonMesh);
      m.userData.moonMesh = moonMesh;

      // 月亮轨道细线
      const moonOrbitGeo = new T.RingGeometry(moonOrbitR - 0.015, moonOrbitR + 0.015, 64, 1);
      const moonOrbitMat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, side: T.DoubleSide });
      const moonOrbit = new T.Mesh(moonOrbitGeo, moonOrbitMat);
      moonOrbit.rotation.x = Math.PI / 2;
      m.add(moonOrbit);

      // 人造卫星：3 颗不同轨道 + 真实图片 sprite（ISS / Hubble / 天宫）
      m.userData.satellites = [];
      const satCount = 3;
      const satImageKeys = ['iss', 'hubble', 'tiangong'];
      for (let si = 0; si < satCount; si++){
        const satGroup = new T.Group();

        // 真实图片 sprite（异步加载，兜底为发光小球）
        const fallbackSatMat = new T.MeshBasicMaterial({ color: 0x9ab8d8, transparent: true, opacity: 0.85 });
        const fallbackSat = new T.Mesh(new T.SphereGeometry(0.08, 12, 8), fallbackSatMat);
        satGroup.add(fallbackSat);
        // 辉光
        const glowGeo = new T.SphereGeometry(0.14, 12, 8);
        const glowMat = new T.MeshBasicMaterial({ color: 0xffeac8, transparent: true, opacity: 0.18, depthWrite: false, blending: T.AdditiveBlending });
        const glow = new T.Mesh(glowGeo, glowMat);
        satGroup.add(glow);

        const satOrbitR = p.r * (1.5 + si * 0.15);
        const satAngle0 = Math.random() * Math.PI * 2;
        const satTilt = (Math.random() - 0.5) * 0.6;
        const satSpeed = 0.02 + Math.random() * 0.02;
        satGroup.position.set(Math.cos(satAngle0) * satOrbitR, Math.sin(satAngle0 * 1.3) * p.r * 0.3, Math.sin(satAngle0) * satOrbitR);
        satGroup.userData = { isSat: true, angle: satAngle0, orbitR: satOrbitR, tilt: satTilt, speed: satSpeed, fallbackSat, glow, spriteMesh: null, imageKey: satImageKeys[si] };
        m.add(satGroup);
        m.userData.satellites.push(satGroup);

        // 程序化绘制的卫星剖面（ISS / Hubble / 天宫）— 无网络依赖，立即替换
        {
          const tex = createSatTexture(si);
          const satSprite = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
          // 卫星 sprite 大小：约地球半径的 0.85，splash 拉近也能看清
          const satScale = p.r * 0.85;
          satSprite.scale.set(satScale, satScale * 0.5, 1);  // 贴图 2:1 宽高比
          satGroup.add(satSprite);
          satGroup.userData.spriteMesh = satSprite;
          // 隐藏程序化兜底
          if (fallbackSat) fallbackSat.visible = false;
          if (glow) glow.material.opacity = 0.05;
        }

        // 卫星轨道细线（虚线感：用半透明细环）
        const satOrbitGeo = new T.RingGeometry(satOrbitR - 0.008, satOrbitR + 0.008, 64, 1);
        const satOrbitMat = new T.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.18, side: T.DoubleSide });
        const satOrbit = new T.Mesh(satOrbitGeo, satOrbitMat);
        satOrbit.rotation.x = Math.PI / 2;
        satOrbit.rotation.z = satTilt;
        m.add(satOrbit);
      }
    }

    // 轨道细线
    const orbitGeo = new T.RingGeometry(p.d - 0.02, p.d + 0.02, 128, 1);
    const orbitMat = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, side: T.DoubleSide });
    const orbit = new T.Mesh(orbitGeo, orbitMat);
    orbit.rotation.x = Math.PI / 2;
    scene.add(orbit);
    planetOrbits.push(orbit);

    // 大气层（地球）
    if (p.atm){
      const atmMat = new T.ShaderMaterial({
        uniforms:{},
        vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `
          varying vec3 vN;
          void main(){
            float fres = pow(1.0 - abs(vN.z), 2.0);
            gl_FragColor = vec4(0.45, 0.75, 1.0, fres*0.65);
          }`,
        transparent: true, blending: T.AdditiveBlending, side: T.BackSide, depthWrite: false
      });
      m.add(new T.Mesh(new T.SphereGeometry(p.r*1.08, 32, 16), atmMat));
    }
    // 土星环
    if (p.rings){
      const ringGeo = new T.RingGeometry(p.r*1.4, p.r*2.5, 96, 1);
      const ringMat = new T.ShaderMaterial({
        uniforms:{},
        vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader:`
          varying vec2 vUv;
          void main(){
            float t = vUv.y;
            float ring = smoothstep(0.0, 0.18, t) * (1.0 - smoothstep(0.55, 1.0, t));
            vec3 c1 = vec3(0.95,0.85,0.6);
            vec3 c2 = vec3(0.5,0.35,0.22);
            vec3 col = mix(c1, c2, abs(t-0.4)*2.0);
            gl_FragColor = vec4(col, ring*0.85);
          }`,
        transparent: true, side: T.DoubleSide, depthWrite: false
      });
      const ring = new T.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI/2;
      m.add(ring);
    }
    // 自转轴倾斜（天王星）
    if (p.tilt) m.rotation.z = p.tilt;
  });

  // 远景星系生成器（对数螺线臂 + 核球 + 尘埃带 + 多色温）
  function buildGalaxy(N, scaleR){
    const geo = new T.BufferGeometry();
    const pos = new T.Float32BufferAttribute(N*3, 3);
    const col = new T.Float32BufferAttribute(N*3, 3);
    const siz = new T.Float32BufferAttribute(N, 1);
    const arms = 2;
    const bulgeRatio = 0.18;   // 中央核球占比
    for (let i = 0; i < N; i++){
      const isCore = Math.random() < bulgeRatio;
      const arm = i % arms;
      const t = Math.pow(Math.random(), 0.6);  // 偏向中心分布
      // 对数螺线：r = a * exp(b * theta)
      const baseAngle = arm * Math.PI + (isCore ? 0 : Math.log(1 + t*4) * 2.2);
      const wobble = (Math.random()-0.5) * 0.5 * (1 - t * 0.5);  // 臂外散开
      const angle = baseAngle + wobble;
      // 半径：核心区短，外部按对数增长
      let r;
      if (isCore){
        r = Math.random() * scaleR * 0.08;
      } else {
        r = (t * scaleR * 0.35) * (0.85 + Math.random()*0.3);
      }
      const yJitter = (Math.random()-0.5) * scaleR * (isCore ? 0.04 : 0.025);
      pos.setXYZ(i, Math.cos(angle)*r, yJitter, Math.sin(angle)*r);
      // 颜色：核心偏黄（老年星），臂上偏蓝白（年轻星）+ 红巨星（尘埃带）
      let cr, cg, cb;
      const cRand = Math.random();
      if (isCore){
        // 核球：暖黄
        cr = 1.0; cg = 0.85 + Math.random()*0.1; cb = 0.55 + Math.random()*0.15;
        siz.setX(i, 0.5 + Math.random()*0.4);
      } else if (cRand < 0.55){
        // 旋臂蓝白星
        cr = 0.78; cg = 0.88; cb = 1.0;
        siz.setX(i, 0.4 + Math.random()*0.3);
      } else if (cRand < 0.85){
        // 粉红星云（尘埃带）
        cr = 1.0; cg = 0.6 + Math.random()*0.2; cb = 0.85;
        siz.setX(i, 0.6 + Math.random()*0.6);
      } else {
        // 蓝紫
        cr = 0.7; cg = 0.65; cb = 1.0;
        siz.setX(i, 0.35 + Math.random()*0.25);
      }
      col.setXYZ(i, cr, cg, cb);
    }
    geo.setAttribute('position', pos);
    geo.setAttribute('color', col);
    geo.setAttribute('size', siz);
    // 用 ShaderMaterial：gl_PointCoord → 圆形 + 中心高光，解决正方形问题
    const mat = new T.ShaderMaterial({
      uniforms: {
        uTex: { value: spriteBright },
        uScale: { value: window.innerHeight * 0.5 / Math.tan((Math.PI/180)*30) }  // 像素补偿
      },
      vertexShader: `
        attribute float size;
        varying vec3 vCol;
        uniform float uScale;
        void main(){
          vCol = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = size * (uScale / -mv.z);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec3 vCol;
        void main(){
          vec4 t = texture2D(uTex, gl_PointCoord);
          if (t.a < 0.02) discard;
          gl_FragColor = vec4(vCol, 1.0) * t;
        }
      `,
      transparent: true,
      blending: T.AdditiveBlending,
      depthWrite: false,
      vertexColors: true
    });
    return new T.Points(geo, mat);
  }

  const mainGalaxy = buildGalaxy(isMobile ? 1800 : 4000, 700);
  mainGalaxy.position.set(0, 30, -250);
  scene.add(mainGalaxy);

  // 星系核心亮点：可点击的聚焦目标（点击后飞向该星系俯瞰全貌）

  // 星空多层视差（球面均匀分布 + sprite 圆形）
  function buildStarfield(N, rmin, rmax, sprite){
    const geo = new T.BufferGeometry();
    const pos = new T.Float32BufferAttribute(N*3, 3);
    const col = new T.Float32BufferAttribute(N*3, 3);
    const siz = new T.Float32BufferAttribute(N, 1);
    for (let i = 0; i < N; i++){
      const r = rmin + Math.random()*(rmax-rmin);
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      pos.setXYZ(i, r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
      const h = Math.random();
      if (h < 0.55){ col.setXYZ(i, 1, 1, 1); }
      else if (h < 0.8){ col.setXYZ(i, 0.78, 0.85, 1); }
      else { col.setXYZ(i, 1, 0.85, 0.7); }
      siz.setX(i, 0.3 + Math.random()*0.6);
    }
    geo.setAttribute('position', pos);
    geo.setAttribute('color', col);
    geo.setAttribute('size', siz);
    const mat = new T.ShaderMaterial({
      uniforms: {
        uTex: { value: sprite },
        uScale: { value: window.innerHeight * 0.5 / Math.tan((Math.PI/180)*30) }
      },
      vertexShader: `
        attribute float size;
        varying vec3 vCol;
        uniform float uScale;
        void main(){
          vCol = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = size * (uScale / -mv.z);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec3 vCol;
        void main(){
          vec4 t = texture2D(uTex, gl_PointCoord);
          if (t.a < 0.02) discard;
          gl_FragColor = vec4(vCol, 1.0) * t;
        }
      `,
      transparent: true,
      blending: T.AdditiveBlending,
      depthWrite: false,
      vertexColors: true
    });
    return new T.Points(geo, mat);
  }
  scene.add(buildStarfield(isMobile?60:160, 80, 220, spriteBright));     // 前景白星
  scene.add(buildStarfield(isMobile?100:240, 220, 520, spriteWarm));    // 中景暖星

  // ============ 银河实景背景 ============
  // 优先 ESO 360° 全景（8MB，真实银河图像），其次 threejs.org，再 fallback homer-jay
  (function loadMilkyWay(){
    const URLS = [
      'https://cdn.eso.org/images/large/eso0932a.jpg',
      'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg',
      'https://cdn.jsdelivr.net/gh/homer-jay/solar-system-textures@master/stars_milky_way.jpg'
    ];
    function applyTex(tex){
      tex.colorSpace = T.SRGBColorSpace;
      tex.mapping = T.EquirectangularReflectionMapping;
      scene.background = tex;
      window.__milkyWayTex = tex;
    }
    function tryLoad(i){
      if (i >= URLS.length) return;
      const loader = new T.TextureLoader();
      loader.crossOrigin = 'anonymous';
      loader.load(URLS[i], t => applyTex(t), undefined, () => tryLoad(i + 1));
    }
    tryLoad(0);
  })();

  // ---------- 标签 sprite 工厂 ----------
  function makeLabelTexture(text, opts){
    const o = Object.assign({ font: '"Noto Serif SC",serif', size: 20, color: '#e8d8b8', glow: 'rgba(255,170,120,.5)' }, opts);
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.font = `300 ${o.size}px ${o.font}`;
    const tw = ctx.measureText(text).width;
    c.width = Math.ceil(tw + o.size * 1.6);
    c.height = Math.ceil(o.size * 2);
    ctx.font = `300 ${o.size}px ${o.font}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = o.glow;
    ctx.shadowBlur = o.size * 0.4;
    ctx.fillStyle = o.color;
    ctx.fillText(text, c.width / 2, c.height / 2);
    const tex = new T.CanvasTexture(c);
    tex.colorSpace = T.SRGBColorSpace;
    return tex;
  }

    const sp = new T.Sprite(sm);
    sp.scale.set(2.2, 2.2 * tex.image.height / tex.image.width, 1);
    return sp;
  }

  // 拖动模式：'pan' 单指 FPS 平移（默认，可滑到银河深处）；'orbit' 双指/右键旋转视角

      // 灵敏度按当前距离缩放：远景大幅度移动，近景小步位移

      const cp = Math.cos(pitch);

      // 相机的 up 向量
      const upX = -Math.sin(yaw)*Math.sin(pitch), upY = Math.cos(pitch), upZ = -Math.cos(yaw)*Math.sin(pitch);
      const px = -dx * k;
      const py = dy * k;
      // 平移 focusObj / cameraTarget

        focusObj.position.y += upY * py;

        targetCameraTarget.x = cameraTarget.x;
        targetCameraTarget.y = cameraTarget.y;
        targetCameraTarget.z = cameraTarget.z;
      }
    } else {
      // 经典轨道模式：拖动 → 绕聚焦点旋转
      targetYaw -= dx * 0.005;
      targetPitch += dy * 0.005;
      targetPitch = Math.max(-1.2, Math.min(1.2, targetPitch));
    }
    if (Math.hypot(x - _downX, y - _downY) > 6) _isClick = false;  // 移动超过 6px 视为拖拽
  }
  // pointer 事件（桌面 + 大多数移动浏览器）
  c.addEventListener('pointerdown', e => {
    // 鼠标右键 = 旋转视角；左键 = 平移（飞行）
    _spMode = (e.pointerType === 'mouse' && e.button === 2) ? 'orbit' : 'pan';
    if (e.button === 2) e.preventDefault();
    onDown(e.clientX, e.clientY);
    e.preventDefault();
  });
  // 屏蔽 splash 上的右键菜单（防止右键拖动时弹出菜单）
  c.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('pointermove', _spMove);
  window.addEventListener('pointerup', e => {
    const wasClick = _isClick && (performance.now() - _downT) < 350 && _spMode === 'pan';
    _spUp();
    if (wasClick) handlePlanetClick(e.clientX, e.clientY);
  });
  window.addEventListener('pointercancel', _spUp);
  // touch 事件兜底（iOS Safari 移动端）— 单指拖拽 + 双指 pinch 缩放
  let _spTouchActive = false;
  // 缩放：滚轮 + 双指
  c.addEventListener('wheel', e => {
    e.preventDefault();
    // 缩放范围拉宽：最近 0.6（贴近地球/行星表面）→ 最远 800（深银河，看远景星系）
    // 灵敏度：每 deltaY=100 约改变 ~16 单位（原来 4），更跟手
    targetDistance = Math.max(0.6, Math.min(800, targetDistance + e.deltaY * 0.16));
  }, { passive: false });
  let pinchD0 = 0, pinchTar0 = 0;
  // 双指 pinch 缩放（在 touchstart 触发时检测到 2 指则启用）
  c.addEventListener('touchstart', e => {
    if (e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchD0 = Math.hypot(dx, dy);
      pinchTar0 = targetDistance;
      _spTouchActive = false;  // 进入 pinch 模式，禁用单指拖拽
      _spMode = 'orbit';        // 双指 = 旋转 + 缩放
    } else if (e.touches.length === 1){
      // 单指：开始记下点击起点（用于区分 tap / drag）—— 单指 = 自由飞行
      const t = e.touches[0];
      _downX = t.clientX; _downY = t.clientY; _downT = performance.now();
      _isClick = true;
      _spTouchActive = true;
      _spMode = 'pan';
    }
  }, { passive: true });
  // 合并：touchmove 处理单指拖拽 + 双指 pinch（避免重复绑定 touchmove）
  const _spTouchMove = e => {
    if (e.touches.length === 2 && pinchD0 > 0){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      targetDistance = Math.max(0.6, Math.min(800, pinchTar0 * (pinchD0 / d)));
      e.preventDefault();
    } else if (e.touches.length === 1 && _spTouchActive && pinchD0 === 0){
      onMove(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  };
  c.addEventListener('touchmove', _spTouchMove, { passive: false });
  c.addEventListener('touchend', e => {
    const wasTap = _isClick && (performance.now() - _downT) < 350 && pinchD0 === 0;
    _spTouchActive = false; pinchD0 = 0; _spUp();
    if (wasTap && e.changedTouches.length === 1){
      const t = e.changedTouches[0];
      handlePlanetClick(t.clientX, t.clientY);
    }
  });
  c.addEventListener('touchcancel', () => { _spTouchActive = false; pinchD0 = 0; _spUp(); });
  const _spResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  };
  window.addEventListener('resize', _spResize);

  // 点击行星 → 相机平滑切换到该天体为中心并拉近（俯视看山川大海）；
  // 点击星系核心 → 飞向该星系从斜上方俯瞰
  const _spRaycaster = new T.Raycaster();
  const _spNdc = new T.Vector2();
  // 所有可被 raycaster 命中的天体（不递归子节点，避免被卫星 sprite / 标签 sprite 阻挡）
  function _spCollectTargets(){
    const list = planetMeshes.concat(galaxyCores, [sun, asteroids]);
    // 月亮单独加（属于 earth 的子节点）
    planetMeshes.forEach(p => { if (p.userData.moonMesh) list.push(p.userData.moonMesh); });
    return list;
  }
  function handlePlanetClick(cx, cy){
    const rect = c.getBoundingClientRect();
    _spNdc.x = ((cx - rect.left) / rect.width) * 2 - 1;
    _spNdc.y = -((cy - rect.top) / rect.height) * 2 + 1;
    _spRaycaster.setFromCamera(_spNdc, camera);
    const hits = _spRaycaster.intersectObjects(_spCollectTargets(), false);
    if (!hits.length) { detailEl.classList.remove('show'); _spDetailCurrent = null; return; }
    const hit = hits[0].object;
    // 解析 key：行星 / 太阳 / 星系 / 小行星带 / 月亮
    let key = null;
    if (hit.userData?.isGalaxyCore){
      key = 'galaxy' + distGalaxies.indexOf(hit.userData.galaxy);
      focusObj = hit.userData.galaxy;
      targetDistance = Math.min(800, hit.userData.r * 1.1);
      targetPitch = 0.6;
      targetFOV = 60;
    } else if (hit === sun){
      key = 'sun';
      focusObj = hit;
      targetDistance = 8;
      targetPitch = 0.2;
      targetFOV = 50;
    } else if (hit === asteroids){
      key = 'asteroidBelt';
      focusObj = hit;
      targetDistance = 25;
      targetPitch = 0.4;
      targetFOV = 55;
    } else if (hit.userData?.isMoon){
      key = 'moon';
      focusObj = hit;
      targetDistance = Math.max(hit.userData.orbitR * 1.5, 6);
      targetPitch = 0.2;
      targetFOV = 50;
    } else if (hit.userData?.name){
      key = hit.userData.name;
      focusObj = hit;
      const r = hit.userData.r || 3;
      targetDistance = Math.max(r * 1.15, Math.min(800, r * 2.2));
      targetPitch = 0.32;
      targetFOV = 52;
    }
    if (key) showDetail(key, hit);
  }

  // 动画循环
  let alive = true;
  const t0 = performance.now();
  function animate(){
    if (!alive) return;
    const t = (performance.now() - t0) * 0.001;

    sunMat.uniforms.uTime.value = t;
    coronaMat.uniforms.uTime.value = t;
    planetMeshes.forEach(m => {
      if (m.material.uniforms && m.material.uniforms.uTime) m.material.uniforms.uTime.value = t;
      const d = m.userData;
      // 公转：把 d.speed 范围压缩到 [0.4, 1.5]（避免水星狂转/海王星冻死），base 再降一档
      const eff = Math.max(0.4, Math.min(1.5, d.speed * 0.4));
      d.angle += 0.005 * eff;
      m.position.x = Math.cos(d.angle) * d.d;
      m.position.z = Math.sin(d.angle) * d.d;
      m.rotation.y += d.axial * 0.15;
      // 月亮绕地球公转（也降速）
      if (d.moonMesh){
        d.moonMesh.userData.moonAngle += 0.002;
        const ma = d.moonMesh.userData.moonAngle;
        const mr = d.moonMesh.userData.orbitR;
        d.moonMesh.position.set(Math.cos(ma) * mr, Math.sin(ma * 0.3) * mr * 0.15, Math.sin(ma) * mr);
        d.moonMesh.rotation.y += 0.0006;
      }
      // 卫星绕地球公转
      if (d.satellites){
        d.satellites.forEach(sat => {
          sat.userData.angle += sat.userData.speed * 0.08;
          const a = sat.userData.angle;
          const r = sat.userData.orbitR;
          sat.position.set(Math.cos(a) * r, Math.sin(a * 1.3) * r * 0.3 * sat.userData.tilt, Math.sin(a) * r);
          sat.rotation.y += 0.0015;
        });
      }
    });
    mainGalaxy.rotation.z = t * 0.002;
    mainGalaxy.scale.setScalar(1 + Math.sin(t*0.4)*0.025);
    // 远景星系各自缓慢自转
    for (let gi = 0; gi < distGalaxies.length; gi++){
      distGalaxies[gi].rotation.z = t * 0.0012 * (gi % 2 === 0 ? 1 : -1);
    }
    // 小行星带缓慢公转
    asteroids.rotation.y = t * 0.0025;
    // 自动相机推近：8 秒内 90→60
    if (t < 10 && targetDistance > 60) targetDistance = 120 - (t/10)*100;
    // 平滑插值
    yaw += (targetYaw - yaw) * 0.08;
    pitch += (targetPitch - pitch) * 0.08;
    distance += (targetDistance - distance) * 0.06;
    camera.fov += (targetFOV - camera.fov) * 0.06;
    camera.updateProjectionMatrix();
    applyCamera();

    // 标签随距离自动调节大小（保持屏幕近似恒定）：远景适度放大让标签可见，近景缩小避免遮天体
    const camPos = camera.position;
    const camDir = new T.Vector3(); camera.getWorldDirection(camDir);
    for (let li = 0; li < labels.length; li++){
      const lab = labels[li];
      const wpos = lab.obj.getWorldPosition(new T.Vector3());
      const dCam = wpos.distanceTo(camPos);
      // 标签基础大小按目标距离线性放大：屏幕大小 ≈ baseScale * dCam / refDist
      // baseScale 是 sprite 在 obj 局部坐标的大小；sprite.scale 已是 baseScale
      // 这里再额外按世界距离补偿：越远越放大（保持 ~baseScale * dist/ref）
      const refD = Math.max(1, lab.dist);
      const k = Math.max(0.3, Math.min(8, dCam / refD));
      // 只对 sprite 整体做一次缩放（baseScale * k）
      const sc = lab.baseScale * k * 0.55;
      lab.sp.scale.x = sc;
      lab.sp.scale.y = sc * (lab.sp.material.map.image.height / lab.sp.material.map.image.width);
      // 当标签背对相机（z > 1）时隐藏
      const v = wpos.clone().project(camera);
      lab.sp.visible = (v.z < 1 && dCam < refD * 12);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  // 调试 / 外部触发接口
  window.__splashDebug = () => ({
    yaw, pitch, distance, fov: camera.fov,
    planets: planetMeshes.length,
    focus: focusObj ? (focusObj.userData?.name || focusObj.userData?.isGalaxyCore && 'galaxy' || 'obj') : 'earth',
    camTarget: { x: cameraTarget.x.toFixed(1), y: cameraTarget.y.toFixed(1), z: cameraTarget.z.toFixed(1) },
    sun: sun.position.toArray(),
    galaxy: mainGalaxy.position.toArray(),
    angles: planetMeshes.map(m => m.userData.angle),
    planetPos: planetMeshes.map(m => [m.position.x.toFixed(2), m.position.z.toFixed(2)])
  });
  window.__splashTriggerDive = () => {
    focusObj = null;  // 俯冲进相册前回到地球
    targetDistance = 6;
    targetPitch = -0.2;
    targetFOV = 85;
  };
  // 把天体/星系投影到屏幕坐标（测试用：定位点击目标；galaxy0=主星系）
  window.__splashProject = (key) => {
    let obj = null;
    if (key === 'sun') obj = sun;
    else if (/^galaxy[0-3]$/.test(key)) obj = +key.slice(6) === 0 ? mainGalaxy : distGalaxies[+key.slice(6) - 1];
    else obj = planetMeshes.find(p => p.userData.name === key);
    if (!obj) return null;
    const v = obj.getWorldPosition(new T.Vector3()).project(camera);
    return { x: (v.x + 1) / 2 * window.innerWidth, y: (-v.y + 1) / 2 * window.innerHeight, inFront: v.z < 1 };
  };
  window.__disposeSplash = () => {
    alive = false;
    // 移除全局监听（避免泄漏到章节视图）
    window.removeEventListener('pointermove', _spMove);
    window.removeEventListener('pointerup', _spUp);
    window.removeEventListener('pointercancel', _spUp);
    window.removeEventListener('resize', _spResize);
    c.removeEventListener('touchmove', _spTouchMove);
    // 释放场景所有几何/材质/贴图 + 渲染器
    renderer.renderLists.dispose();
    const _disposedTexs = new Set();
    scene.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose && obj.geometry.dispose();
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        for (const mm of mats){
          mm.dispose && mm.dispose();
          for (const k of ['map','normalMap','aoMap','roughnessMap','emissiveMap','alphaMap']){
            if (mm[k] && !_disposedTexs.has(mm[k])){
              try { mm[k].dispose(); _disposedTexs.add(mm[k]); } catch(e){}
            }
          }
        }
      }
    });
    renderer.dispose();
    // 强制释放 WebGL 上下文（避免浏览器上下文配额耗尽）
    if (renderer.forceContextLoss) renderer.forceContextLoss();
    // 断开画布与 GL 的关联
    try {
      const gl = c.getContext('webgl2') || c.getContext('webgl');
      if (gl && gl.getExtension('WEBGL_lose_context')) gl.getExtension('WEBGL_lose_context').loseContext();
    } catch(e){}
    // 清空调试句柄
    delete window.__splashDebug;
    delete window.__splashTriggerDive;
    delete window.__disposeSplash;
  };
})();

// ============================================================
// 1.4 加载页特效：Three.js DNA 双螺旋 + 2D 粒子网 + glitch 标题

(() => {

  const ctx = fx.getContext('2d');

  function resizeFx(){
    W = fx.width = window.innerWidth * dpr;
    H = fx.height = window.innerHeight * dpr;
    fx.style.width = window.innerWidth + 'px';
    fx.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeFx();
  window.addEventListener('resize', resizeFx);

  // ---------- Three.js 场景：DNA 双螺旋（桌面 + 移动端都运行） ----------
  // 多阶段轮换控制器：每个 stage 显示一组 3D 对象，到时间切下一个
  let _loaderRunning = true;
  window.__stopLoaderThree = () => { _loaderRunning = false; };
  let _stageIdx = 0;  // 提前声明：rose effects 的 shader uniforms 需要读取
  const _stageGroups = { DNA: [], ROSE_CLOUD: [], BLOOM: [], PETAL_RAIN: [], ALL: [] };

  renderer.setSize(window.innerWidth, window.innerHeight, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  // 入场：相机从远处（z=15）缓缓推近到 z=9 —— "逐步放大"
  camera.position.set(0, 0, 15);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  const pLight1 = new THREE.PointLight(0xff8eb3, 1.6, 30); pLight1.position.set(-6, 4, 5); scene.add(pLight1);
  const pLight2 = new THREE.PointLight(0xc8a2ff, 1.4, 30); pLight2.position.set( 6,-3, 5); scene.add(pLight2);

  const helixTurns = 4;
  const helixPairs = 26;
  const helixTotal = helixTurns * helixPairs;
  const helixRadius = 1.6;
  const helixHeight = 8.2;
  const helixStepY = helixHeight / helixTotal;

  // 周围星尘场（移动端减量保流畅）
  const starCount = isDesktop ? 600 : 240;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++){
    // 在半径 8-22 的球壳上均匀分布
    const r = 8 + Math.random() * 14;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    starPos[i*3+2] = r * Math.cos(phi) - 4;  // 整体往后推一点
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xfff0fa, size: 0.05, transparent: true, opacity: 0.85, depthWrite: false });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  _stageGroups.DNA.push(stars);

  const strandGeoA = new THREE.BufferGeometry();
  const strandGeoB = new THREE.BufferGeometry();
  const strandPosA = new Float32Array(helixTotal * 3);
  const strandPosB = new Float32Array(helixTotal * 3);
  strandGeoA.setAttribute('position', new THREE.BufferAttribute(strandPosA, 3));
  strandGeoB.setAttribute('position', new THREE.BufferAttribute(strandPosB, 3));
  const strandMatA = new THREE.PointsMaterial({ color: 0xff8eb3, size: 0.22, transparent: true, opacity: 0.95, depthWrite:false, sizeAttenuation: true });
  const strandMatB = new THREE.PointsMaterial({ color: 0xc8a2ff, size: 0.22, transparent: true, opacity: 0.95, depthWrite:false, sizeAttenuation: true });
  const strandA = new THREE.Points(strandGeoA, strandMatA);
  const strandB = new THREE.Points(strandGeoB, strandMatB);
  scene.add(strandA, strandB);
  _stageGroups.DNA.push(strandA, strandB);

  const rungGeo = new THREE.BufferGeometry();
  const rungPos = new Float32Array(helixTotal * 2 * 3);
  rungGeo.setAttribute('position', new THREE.BufferAttribute(rungPos, 3));
  const rungMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 });
  const rungs = new THREE.LineSegments(rungGeo, rungMat);
  scene.add(rungs);

  const labelTextureCache = new Map();
  function makeDigitTexture(ch){
    if (labelTextureCache.has(ch)) return labelTextureCache.get(ch);
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    const cx = cv.getContext('2d');
    cx.font = 'bold 52px "Courier New", monospace';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const grad = cx.createLinearGradient(0,0,0,64);
    grad.addColorStop(0, '#ffd0e0'); grad.addColorStop(1, '#ff8eb3');
    cx.fillStyle = grad;
    cx.shadowColor = 'rgba(255,142,179,.9)'; cx.shadowBlur = 12;
    cx.fillText(ch, 32, 34);
    const tex = new THREE.CanvasTexture(cv);
    labelTextureCache.set(ch, tex);
    return tex;
  }
  const digits = [];
  for (let i = 0; i < helixTotal; i++){
    const mat = new THREE.SpriteMaterial({ map: makeDigitTexture(Math.random() > 0.5 ? '1' : '0'), transparent: true, opacity: 0 });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(0.42, 0.42, 0.42);
    scene.add(sp);
    digits.push({ sprite: sp });
  }

  function helixPoint(i, strand){

    const y = -helixHeight/2 + i * helixStepY;
    const angle = t * Math.PI * 2 * helixTurns + (strand === 0 ? 0 : Math.PI);
    return [Math.cos(angle) * helixRadius, y, Math.sin(angle) * helixRadius];
  }

  let loaded = false;
  let loadProgress = 0;
  window.__setLoaderProgress = (p) => { loadProgress = Math.max(0, Math.min(1, p)); };
  window.__setLoaderDone = () => { loaded = true; };
  window.__loaderDebug = () => ({ camZ: camera.position.z, rotY: scene.rotation.y, rotX: scene.rotation.x });

  let w3d = window.innerWidth, h3d = window.innerHeight;
  function onResize3d(){
    w3d = window.innerWidth; h3d = window.innerHeight;
    camera.aspect = w3d / h3d;
    camera.updateProjectionMatrix();
    renderer.setSize(w3d, h3d, false);
  }
  window.addEventListener('resize', onResize3d);

  let t0 = performance.now();
  // 拖拽旋转：整个 3D 场景跟随手势转动（带惯性）——桌面鼠标 + 移动端触摸
  // 双指捏合 / 滚轮：缩放（用户可自行放大看 DNA 细节）
  let _ldDrag = false, _ldLastX = 0, _ldLastY = 0, _ldVelY = 0;

      _ldLastX = x; _ldLastY = y;
    };
    const ldUp = () => { _ldDrag = false; };
    const ldTouchDist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (isDesktop){
      _ldHost.addEventListener('mousedown', e => ldDown(e.clientX, e.clientY));
      window.addEventListener('mousemove', e => ldMove(e.clientX, e.clientY), { passive: true });
      window.addEventListener('mouseup', ldUp, { passive: true });
      _ldHost.addEventListener('wheel', e => {

    } else {
      _ldHost.addEventListener('touchstart', e => {
        if (e.touches.length >= 2){ _ldDrag = false; _ldPinchD = ldTouchDist(e); }
        else ldDown(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      _ldHost.addEventListener('touchmove', e => {
        if (e.touches.length >= 2){
          const d = ldTouchDist(e);
          if (_ldPinchD > 0 && d > 0)
            _ldZoom = _ldZoomClamp((_ldZoom === null ? camera.position.z : _ldZoom) * _ldPinchD / d);
          _ldPinchD = d;
        } else ldMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      _ldHost.addEventListener('touchend', e => {
        if (e.touches.length < 2) _ldPinchD = 0;
        if (e.touches.length === 0) ldUp();
      }, { passive: true });
    }
  }

  function animate3d(){
    if (!_loaderRunning) return;
    const t = (performance.now() - t0) * 0.001;
    // 入场推镜：5 秒内 z 15 → 9（ease-out）；用户捏合/滚轮后交给用户
    if (_ldZoom !== null){
      camera.position.z += (_ldZoom - camera.position.z) * 0.12;
    } else if (t < 5){
      const e = t / 5;
      camera.position.z = 9 + 6 * Math.pow(1 - e, 3);
    }
    // 拖拽惯性
    if (!_ldDrag){
      _ldVelY *= 0.95;
      scene.rotation.y += _ldVelY;
    }
    if (!loaded){
      // 揭示进度：加载进度 与 时间（7 秒内必然铺满）取大者 ——
      // 照片加载慢时 DNA 也会在数秒内成形，不会"只有一点星星"
      const prog = Math.max(loadProgress, Math.min(1, t / 7));
      const arrA = strandGeoA.attributes.position.array;
      const arrB = strandGeoB.attributes.position.array;
      const arrR = rungGeo.attributes.position.array;
      for (let i = 0; i < helixTotal; i++){
        const reveal = Math.max(0, Math.min(1, (prog * helixTotal - i) / 6));
        const [ax, ay, az] = helixPoint(i, 0);
        const [bx, by, bz] = helixPoint(i, 1);
        arrA[i*3]=ax; arrA[i*3+1]=ay; arrA[i*3+2]=az;
        arrB[i*3]=bx; arrB[i*3+1]=by; arrB[i*3+2]=bz;
        arrR[i*6]=ax; arrR[i*6+1]=ay; arrR[i*6+2]=az;
        arrR[i*6+3]=bx; arrR[i*6+4]=by; arrR[i*6+5]=bz;
        const fade = reveal * (0.55 + 0.45 * Math.sin(t*1.5 + i*0.3));
        strandMatA.opacity = strandMatB.opacity = 0.85 * fade + 0.15;
        rungMat.opacity = 0.22 * fade;
        const sp = digits[i].sprite;
        sp.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2);
        sp.material.opacity = reveal * 0.85;
        sp.scale.setScalar(0.42 * reveal);
      }
      strandGeoA.attributes.position.needsUpdate = true;
      strandGeoB.attributes.position.needsUpdate = true;
      rungGeo.attributes.position.needsUpdate = true;
      strandA.rotation.y = strandB.rotation.y = rungs.rotation.y = t * 0.4;
      strandA.position.y = strandB.position.y = rungs.position.y = Math.sin(t*0.7) * 0.15;
      digits.forEach(d => { d.sprite.material.rotation = t * 0.4; });
    } else {
      // 100% 后粒子飞向心形并脉动
      const heartSprite = makeDigitTexture('♥');
      digits.forEach((d, i) => {
        const a = (i / digits.length) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(a), 3);
        const y = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
        const target = new THREE.Vector3(x*0.16, y*0.16, Math.sin(a*3)*0.3);
        d.sprite.position.lerp(target, 0.05);
        d.sprite.material.opacity = 0.95;
        d.sprite.material.map = heartSprite;
        d.sprite.material.needsUpdate = true;
        d.sprite.scale.setScalar(0.45 + Math.sin(t*2 + i)*0.05);
      });
      strandA.rotation.y = strandB.rotation.y = rungs.rotation.y = t * 0.5;
    }
    renderer.render(scene, camera);
    stars.rotation.y = t * 0.05;
    stars.rotation.x = Math.sin(t * 0.3) * 0.05;
    requestAnimationFrame(animate3d);
  }
  animate3d();

  // ================================================================
  // 程序员浪漫：Shader-Based 玫瑰/极光/心形脉冲特效
  // 不只是 Mesh+PointsMaterial，而是 GLSL shader 程序化生成
  // ================================================================

  // ============== 花瓣几何（共享） ==============
  function createPetalGeometry(angle, scale){
    const g = new THREE.BufferGeometry();
    const positions = [];
    const indices = [];
    const uvs = [];
    const segs = 12;
    for (let i = 0; i <= segs; i++){
      const t = i / segs;
      const x = (t - 0.5) * 1.0 * scale;
      const y = Math.sin(t * Math.PI) * 0.6 * scale;
      positions.push(x, y, 0);
      uvs.push(t, t);
    }
    for (let i = 0; i < segs; i++){
      indices.push(i, i + 1, segs + 1);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(indices);
    g.computeVertexNormals();
    return g;
  }

  // ============== Fresnel 花瓣 shader（粉/紫渐变 + 心跳脉冲） ==============
  const _shaderMaterials = [];  // 收集所有 shaderMat 用于 update uTime
  function makePetalGlowMaterial(colorHex){
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(colorHex) },
        uPulse: { value: 1.0 }
      },
      vertexShader: /* glsl */`
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec2 vUv;
        void main(){
          vUv = uv;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vNormal = normalize(normalMatrix * normal);
          vViewDir = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec3 uColor;
        uniform float uPulse;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec2 vUv;
        void main(){
          float fres = 1.0 - max(dot(vNormal, vViewDir), 0.0);
          fres = pow(fres, 1.6);
          vec3 base = mix(uColor * 0.55, uColor * 1.5, vUv.y);
          float pulse = 0.82 + 0.18 * sin(uTime * 1.4);
          vec3 col = base * (0.4 + fres * 1.5) * pulse * uPulse;
          // 中心高光
          float centerBoost = smoothstep(0.7, 0.0, distance(vUv, vec2(0.5, 0.55)));
          col += uColor * centerBoost * 0.6;
          float alpha = (0.45 + fres * 0.5) * pulse;
          gl_FragColor = vec4(col, alpha);
        }
      `,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false
    });
    _shaderMaterials.push(mat);
    return mat;
  }

  // ============== (1) 玫瑰曲线粒子云：Morph Shader ==============
  // 用 uProgress 让粒子在 散开 → 玫瑰曲线 → 心形 之间 morph
  // Fragment 用 gl_PointCoord 画 5 瓣花瓣 sprite
  const roseParticleCount = isDesktop ? 3200 : 1500;  // 提升玫瑰粒子密度，让特效更醒目
  const rosePosScat = new Float32Array(roseParticleCount * 3);
  const rosePosRose = new Float32Array(roseParticleCount * 3);
  const rosePosHeart = new Float32Array(roseParticleCount * 3);
  const roseRands = new Float32Array(roseParticleCount);
  const roseSizes = new Float32Array(roseParticleCount);
  for (let i = 0; i < roseParticleCount; i++){
    const rnd = Math.random();
    roseRands[i] = rnd;
    roseSizes[i] = 0.55 + Math.random() * 1.8;

    // Scattered：球壳
    const sr = 5 + Math.random() * 8;
    const sa = Math.random() * Math.PI * 2;
    const sp = Math.acos(2 * Math.random() - 1);
    rosePosScat[i*3]   = sr * Math.sin(sp) * Math.cos(sa);
    rosePosScat[i*3+1] = sr * Math.sin(sp) * Math.sin(sa) * 0.55;
    rosePosScat[i*3+2] = sr * Math.cos(sp) - 2;

    // Rose curve：r = a + b*cos(k*θ)
    const tt = (i / roseParticleCount) * Math.PI * 2 * 4 + rnd * 0.4;
    const k = 5;
    const rad = (1.0 + 0.6 * Math.cos(k * tt)) * (1.0 + rnd * 0.35);
    rosePosRose[i*3]   = rad * Math.cos(tt) * 1.35;
    rosePosRose[i*3+1] = rad * Math.sin(tt) * 1.35;
    rosePosRose[i*3+2] = (rnd - 0.5) * 0.45;

    // Heart
    const ha = (i / roseParticleCount) * Math.PI * 2;
    const hx = 16 * Math.pow(Math.sin(ha), 3);
    const hy = 13 * Math.cos(ha) - 5 * Math.cos(2*ha) - 2 * Math.cos(3*ha) - Math.cos(4*ha);
    const scale = 0.13 + rnd * 0.04;
    rosePosHeart[i*3]   = hx * scale;
    rosePosHeart[i*3+1] = hy * scale;
    rosePosHeart[i*3+2] = (rnd - 0.5) * 0.35;
  }
  const roseCloudGeo = new THREE.BufferGeometry();
  roseCloudGeo.setAttribute('position', new THREE.BufferAttribute(rosePosScat, 3));
  roseCloudGeo.setAttribute('aRose', new THREE.BufferAttribute(rosePosRose, 3));
  roseCloudGeo.setAttribute('aHeart', new THREE.BufferAttribute(rosePosHeart, 3));
  roseCloudGeo.setAttribute('aRand', new THREE.BufferAttribute(roseRands, 1));
  roseCloudGeo.setAttribute('aSize', new THREE.BufferAttribute(roseSizes, 1));

  const roseCloudMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uProgress: { value: 0 },  // 0..1: scattered→rose, 1..2: rose→heart
      uPixelRatio: { value: dpr },
      uMouse: { value: new THREE.Vector2(0, 0) },      // NDC [-1,1]
      uMouseStrength: { value: 0 },                     // 0..1, 鼠标激活时 1
      uMouseRadius: { value: 2.5 }
    },
    vertexShader: /* glsl */`
      attribute vec3 aRose;
      attribute vec3 aHeart;
      attribute float aRand;
      attribute float aSize;
      uniform float uTime;
      uniform float uProgress;
      uniform float uPixelRatio;
      uniform vec2 uMouse;
      uniform float uMouseStrength;
      uniform float uMouseRadius;
      varying float vRand;
      varying float vMorph;
      varying float vMouseProx;

      void main(){
        vec3 pos;
        if (uProgress < 1.0){
          pos = mix(position, aRose, smoothstep(0.0, 1.0, uProgress));
        } else {
          pos = mix(aRose, aHeart, smoothstep(0.0, 1.0, uProgress - 1.0));
        }
        // 有机扰动
        float t = uTime * 0.5;
        pos.x += sin(t + aRand * 6.283) * 0.05;
        pos.y += cos(t * 1.1 + aRand * 6.283) * 0.06;
        pos.z += sin(t * 0.7 + aRand * 6.283) * 0.03;

        // 鼠标引力场：靠近鼠标的粒子被推开（3D 旋转时鼠标在 XY 平面）
        if (uMouseStrength > 0.01){
          vec2 m3 = vec3(uMouse * 5.0, 0.0).xy;  // 鼠标世界坐标
          vec2 toM = pos.xy - m3;
          float dM = length(toM);
          if (dM < uMouseRadius){
            float falloff = uMouseStrength * (1.0 - dM / uMouseRadius);
            // 排斥方向
            vec2 dir = normalize(toM + vec2(0.0001));
            pos.xy += dir * falloff * falloff * 0.5;
          }
          vMouseProx = 1.0 - smoothstep(0.0, uMouseRadius, dM);
        } else {
          vMouseProx = 0.0;
        }

        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;
        float dist = -mv.z;
        gl_PointSize = aSize * 38.0 * uPixelRatio / dist
          * (1.0 + 0.2 * sin(uTime * 2.0 + aRand * 6.283))
          * (1.0 + vMouseProx * 0.4);  // 鼠标附近粒子变大
        vRand = aRand;
        vMorph = uProgress;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vRand;
      varying float vMorph;
      varying float vMouseProx;
      void main(){
        vec2 p = gl_PointCoord - 0.5;
        float r = length(p);
        if (r > 0.5) discard;

        // 5 瓣花瓣 alpha mask（用极坐标角度）
        float a = atan(p.y, p.x);
        float petal = 0.5 + 0.5 * cos(5.0 * a + vRand * 3.14);
        // 中心柔光
        float core = smoothstep(0.5, 0.0, r);
        // 花瓣形状 = 软五瓣
        float shape = smoothstep(0.55, 0.18, r) * mix(0.35, 1.0, petal);
        float alpha = shape * 0.85 + core * 0.35;

        // 颜色：粉→紫 (散开到玫瑰时) / 粉→金 (玫瑰到心形时)
        vec3 pink = vec3(1.0, 0.55, 0.7);
        vec3 purple = vec3(0.7, 0.55, 1.0);
        vec3 gold = vec3(1.0, 0.85, 0.55);
        vec3 col = (vMorph < 1.0)
          ? mix(pink, purple, vRand)
          : mix(pink, gold, vRand);

        // 鼠标附近的粒子更亮
        col += vec3(1.0, 0.85, 0.95) * vMouseProx * 0.6;
        alpha += vMouseProx * 0.4;

        gl_FragColor = vec4(col * alpha, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  _shaderMaterials.push(roseCloudMat);
  const roseCloudParticles = new THREE.Points(roseCloudGeo, roseCloudMat);
  scene.add(roseCloudParticles);
  _stageGroups.ROSE_CLOUD.push(roseCloudParticles);

  // ============== (2) 玫瑰绽放：BLOOM stage ==============
  // 程序化玫瑰 + Fresnel 花瓣 shader + 金色花蕊
  const roseGroup = new THREE.Group();
  const petalLayers = 6;  // 4 → 6 层，更饱满
  const petalsPerLayer = 9;  // 7 → 9 瓣/层，更立体
  for (let layer = 0; layer < petalLayers; layer++){
    const layerR = 0.15 + layer * 0.18;
    const layerTilt = (layer - petalLayers / 2) * 0.35;
    const colorHex = new THREE.Color().setHSL(0.95 - layer * 0.02, 0.7, 0.55 - layer * 0.05).getHex();
    const petalMat = makePetalGlowMaterial(colorHex);
    for (let p = 0; p < petalsPerLayer; p++){
      const a = (p / petalsPerLayer) * Math.PI * 2 + layer * 0.4;
      const g = createPetalGeometry(0, 1 + layer * 0.15);
      const petal = new THREE.Mesh(g, petalMat);
      petal.position.set(Math.cos(a) * layerR, layerTilt, Math.sin(a) * layerR);
      petal.rotation.z = a + Math.PI / 2;
      petal.rotation.x = layerTilt * 0.5;
      roseGroup.add(petal);
    }
  }
  // 花蕊（金色 Fresnel 球）
  const stamenMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(0xffd770) }
    },
    vertexShader: /* glsl */`
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNormal = normalize(normalMatrix * normal);
        vViewDir = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform vec3 uColor;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main(){
        float fres = 1.0 - max(dot(vNormal, vViewDir), 0.0);
        fres = pow(fres, 2.5);
        float pulse = 0.7 + 0.3 * sin(uTime * 2.0);
        vec3 col = uColor * (0.3 + fres * 1.9) * pulse;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  _shaderMaterials.push(stamenMat);
  const stamen = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), stamenMat);
  roseGroup.add(stamen);
  roseGroup.position.set(0, -3.2, 0);
  roseGroup.scale.setScalar(0.9);
  scene.add(roseGroup);
  _stageGroups.BLOOM.push(roseGroup);

  // ============== (3) 飘落玫瑰花瓣（PETAL_RAIN，Fresnel 材质） ==============
  const fallingPetals = [];
  const petalGeo = new THREE.PlaneGeometry(0.3, 0.18);
  for (let i = 0; i < 140; i++){  // 加大花瓣密度，从 60 → 140（满屏飘落感）
    const colorHex = new THREE.Color().setHSL(0.94 + Math.random()*0.04, 0.7, 0.55 + Math.random()*0.15).getHex();
    const m = makePetalGlowMaterial(colorHex);
    const p = new THREE.Mesh(petalGeo, m);
    p.position.set(
      (Math.random() - 0.5) * 10,
      Math.random() * 8 - 2,
      (Math.random() - 0.5) * 6
    );
    p.userData = {
      vy: -0.005 - Math.random() * 0.01,
      vx: (Math.random() - 0.5) * 0.005,
      rotSpd: (Math.random() - 0.5) * 0.04,
      phase: Math.random() * Math.PI * 2
    };
    scene.add(p);
    _stageGroups.PETAL_RAIN.push(p);
    fallingPetals.push(p);
  }

  // 玫瑰光环（保留）
  const ringGeo = new THREE.TorusGeometry(4.5, 0.04, 8, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd0a0, transparent: true, opacity: 0.6 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);
  _stageGroups.PETAL_RAIN.push(ring);

  // ============== (4) 极光背景（独立场景渲染，恒在所有 stage 后方） ==============
  const auroraScene = new THREE.Scene();
  const auroraCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const auroraMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uIntensity: { value: 0.6 }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uIntensity;
      varying vec2 vUv;

      float hash(vec2 p){
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float vnoise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x),
                   mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
      }
      float fbm(vec2 p){
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++){
          v += a * vnoise(p);
          p *= 2.0;
          a *= 0.5;
        }
        return v;
      }

      void main(){
        vec2 uv = vUv;
        float aspect = uResolution.x / max(uResolution.y, 1.0);
        vec2 p = vec2(uv.x * aspect, uv.y);
        float t = uTime * 0.06;

        // ============== 玫瑰曲线花田 (Rhodonea Garden) ==============
        // 多条 r = a*cos(k*θ) 玫瑰曲线层叠旋转
        vec2 pC = vec2(uv.x - 0.5, uv.y - 0.5);
        pC.x *= aspect;
        float rC = length(pC);
        float thetaC = atan(pC.y, pC.x);
        float tC = uTime;

        vec3 col = vec3(0.0);

        // k=3 浅粉
        float r3rose = (0.55 + 0.06 * sin(tC * 0.4)) * cos(3.0 * (thetaC + tC * 0.08));
        col += vec3(1.0, 0.7, 0.82) * exp(-abs(rC - r3rose) * 30.0) * 0.65;

        // k=4 紫
        float r4rose = (0.48 + 0.05 * cos(tC * 0.5)) * cos(4.0 * (thetaC - tC * 0.06));
        col += vec3(0.78, 0.65, 1.0) * exp(-abs(rC - r4rose) * 32.0) * 0.6;

        // k=5 玫瑰红（主色）
        float r5rose = (0.6 + 0.07 * sin(tC * 0.3 + 1.0)) * cos(5.0 * (thetaC + tC * 0.05 + 0.5));
        col += vec3(1.0, 0.45, 0.65) * exp(-abs(rC - r5rose) * 28.0) * 0.7;

        // k=6 金
        float r6rose = (0.42 + 0.05 * cos(tC * 0.45 + 2.0)) * cos(6.0 * (thetaC - tC * 0.07 + 1.2));
        col += vec3(1.0, 0.85, 0.55) * exp(-abs(rC - r6rose) * 34.0) * 0.55;

        // k=7 极浅粉（几乎透明）
        float r7rose = (0.36 + 0.04 * sin(tC * 0.6 + 3.0)) * cos(7.0 * (thetaC + tC * 0.04 + 2.0));
        col += vec3(1.0, 0.92, 0.95) * exp(-abs(rC - r7rose) * 38.0) * 0.45;

        // 中心柔光（花蕊感）
        col += vec3(1.0, 0.6, 0.78) * exp(-rC * 6.0) * 0.3;

        // 闪烁星点
        vec2 grid = floor(uv * 250.0);
        float starHash = hash(grid);
        float star = pow(starHash, 50.0)
          * (0.4 + 0.6 * sin(uTime * 2.0 + starHash * 6.28));
        col += vec3(1.0, 0.95, 0.98) * star * 0.55;

        // 顶部稍暗（让 hex 字符更可读）
        float top = 1.0 - smoothstep(0.0, 0.5, uv.y);
        col *= mix(0.5, 1.0, top);

        col *= uIntensity;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    depthTest: false,
    depthWrite: false
  });
  _shaderMaterials.push(auroraMat);
  const auroraMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), auroraMat);
  auroraScene.add(auroraMesh);

  // ============== (5) 心形脉冲波（独立场景，ALL stage 中央特效） ==============
  const heartPulseScene = new THREE.Scene();
  const heartPulseCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const heartPulseMat = new THREE.ShaderMaterial({

      uniform float uTime;

      // 绘制过程：从 0 → 1 渐进显示（像被手绘出来）
      // 显示一段时间后整体淡出，重新开始
      float hash11(float p){

      }
      vec3 hsv2rgb(vec3 c){
        vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);

        float theta = atan(p.y, p.x);

            vec2 lp = p - grid;

// 愿望场景
function renderWishScene(ch){
  let hearts = '';
  for (let k=0;k<10;k++) hearts += `<div class="wish-heart" style="left:${Math.random()*100}%;animation-delay:${Math.random()*6}s">♥</div>`;
  viewerStage.innerHTML = `
    <div class="viewer-slide wish">
      <canvas class="wish-3d"></canvas>
      <div class="wish-hearts">${hearts}</div>
      <div class="wish-pages"></div>
      <div class="wish-tabs"></div>
    </div>`;

  // ============ 程序员浪漫：标题"解码"效果 + 相爱天数计数 ============
  const titleEl = viewerStage.querySelector('[data-decode]');
  if (titleEl){
    const finalText = titleEl.textContent;
    const glyphs = '01♥<>/{}#&@$%*+=~';
    let frame = 0;
    const decode = () => {
      frame++;
      // 从左到右逐字锁定：每个字符先经过 ~14 帧乱码再固定
      let out = '';
      for (let i = 0; i < finalText.length; i++){
        const lockAt = 8 + i * 9;
        if (frame >= lockAt) out += finalText[i];
        else out += glyphs[Math.floor(Math.random() * glyphs.length)];
      }
      titleEl.textContent = out;
      if (frame < 8 + finalText.length * 9 + 6){
        setTimeout(decode, 45);
      } else {
        titleEl.textContent = finalText;
      }
    };
    // 解码前先隐藏 CSS 入场动画的标题，避免两套动画打架
    titleEl.style.opacity = 1;
    titleEl.style.animation = 'none';
    decode();
  }

  // ============ Shader 级 3D 心形（GLSL 粒子云 + 呼吸脉冲 + 鼠标交互） ============
  const canvas = viewerStage.querySelector('.wish-3d');
  if (!canvas || typeof THREE === 'undefined') return;

  const N = isDesktop ? 2600 : 1200;
  // 三种形态：散布球壳 / 心形表面 / 双环（十年意象）
  const posScatter = new Float32Array(N * 3);
  const posHeart = new Float32Array(N * 3);
  const posRings = new Float32Array(N * 3);
  const aRand = new Float32Array(N);
  const aSize = new Float32Array(N);

  for (let i = 0; i < N; i++){
    aRand[i] = Math.random();
    aSize[i] = 0.6 + Math.random() * 2.0;
    // 散布球壳
    const sr = 6 + Math.random() * 9;
    const sa = Math.random() * Math.PI * 2;
    const sp = Math.acos(2 * Math.random() - 1);
    posScatter[i*3]   = sr * Math.sin(sp) * Math.cos(sa);
    posScatter[i*3+1] = sr * Math.sin(sp) * Math.sin(sa) * 0.6;
    posScatter[i*3+2] = sr * Math.cos(sp) * 0.5;

    // 心形曲面采样（3D heart implicit surface 的参数化近似）
    const u = Math.random() * Math.PI * 2;
    const v = Math.acos(2 * Math.random() - 1);
    // 2D 心形曲线
    const hx = 16 * Math.pow(Math.sin(u), 3);
    const hy = 13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
    // 挤出厚度：沿 v 做环绕缩放，形成 3D 实心感
    const depth = 0.32 + 0.68 * Math.abs(Math.sin(v));
    const scale = 0.115;
    posHeart[i*3]   = hx * scale * depth;
    posHeart[i*3+1] = hy * scale * depth;
    posHeart[i*3+2] = Math.sin(v) * 1.15 * depth;

    // 双环（相扣的十年之环）
    const ring = i % 2;
    const ra = u + (ring ? Math.PI / 2 : 0);
    const rr = 2.6 + aRand[i] * 0.25;
    posRings[i*3]   = Math.cos(ra) * rr + (ring ? 1.4 : -1.4);
    posRings[i*3+1] = Math.sin(ra) * rr * 0.45 + Math.sin(v * 3) * 0.3;
    posRings[i*3+2] = Math.sin(ra) * rr * (ring ? 0.35 : -0.35);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posScatter, 3));
  geo.setAttribute('aHeart', new THREE.BufferAttribute(posHeart, 3));
  geo.setAttribute('aRings', new THREE.BufferAttribute(posRings, 3));
  geo.setAttribute('aRand', new THREE.BufferAttribute(aRand, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uProgress: { value: 0 },        // 0 散布 → 1 心形 → 2 双环
      uMouse: { value: new THREE.Vector2(0, 0) },
      uMouseStrength: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
    },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uProgress;
      uniform vec2 uMouse;
      uniform float uMouseStrength;
      uniform float uPixelRatio;
      attribute vec3 aHeart;
      attribute vec3 aRings;
      attribute float aRand;
      attribute float aSize;
      varying float vRand;
      varying float vGlow;

      // 心跳曲线：两连跳 + 长间歇
      float heartbeat(float t){
        float p = fract(t / 1.15);
        float b1 = exp(-pow((p - 0.12) * 14.0, 2.0));
        float b2 = exp(-pow((p - 0.34) * 14.0, 2.0)) * 0.65;
        return 1.0 + (b1 + b2) * 0.28;
      }

      void main(){
        vRand = aRand;
        vec3 pos;
        // uProgress: 0→1 散布到心形；1→2 心形到双环（用 sin 让它来回呼吸切换）
        if (uProgress <= 1.0){
          float k = smoothstep(0.0, 1.0, uProgress);
          pos = mix(position, aHeart, k);
        } else {
          float k = smoothstep(0.0, 1.0, uProgress - 1.0);
          pos = mix(aHeart, aRings, k);
        }
        // 心跳脉冲（心形阶段最强）
        float hb = heartbeat(uTime + aRand * 0.15);
        pos *= hb;
        // 每粒子噪声漂移（有机感）
        pos.x += sin(uTime * 0.7 + aRand * 40.0) * 0.12;
        pos.y += cos(uTime * 0.6 + aRand * 55.0) * 0.12;
        // 鼠标斥力：靠近光标的粒子被推开
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        vec2 screenPos = mv.xy / max(-mv.z, 0.1);
        float md = distance(screenPos, uMouse);
        float repel = exp(-md * md * 6.0) * uMouseStrength;
        mv.xy += normalize(mv.xy - uMouse + 0.001) * repel * 1.6;
        vGlow = repel + hb * 0.25;
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPixelRatio * (22.0 / max(-mv.z, 1.0)) * (1.0 + vGlow * 0.8);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      varying float vRand;
      varying float vGlow;
      void main(){
        // 心形花瓣 sprite：径向渐变柔光点
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float core = exp(-d * d * 22.0);
        float halo = exp(-d * d * 6.0) * 0.35;
        // 粉→紫→金 三色调色板
        vec3 pink = vec3(1.0, 0.45, 0.62);
        vec3 purple = vec3(0.72, 0.5, 1.0);
        vec3 gold = vec3(1.0, 0.82, 0.55);
        vec3 col = mix(pink, purple, vRand);
        col = mix(col, gold, vGlow * 0.7);
        // 闪烁
        float tw = 0.75 + 0.25 * sin(uTime * 2.0 + vRand * 30.0);
        float alpha = (core + halo) * tw;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(col * (1.0 + vGlow * 1.2), alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const wishScene = new THREE.Scene();
  const wishCam = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
  wishCam.position.set(0, 0, 13);
  // 粒子 + 文字同组：旋转/心跳/拨动交互统一带动
  const wishGroup = new THREE.Group();
  const points = new THREE.Points(geo, mat);
  wishGroup.add(points);
  // 入场：从左上偏移 + 0.6 倍缩放，慢慢漂到中心 + 1.0 倍（2.5 秒）
  wishGroup.position.set(-4, 3, 0);
  wishGroup.scale.setScalar(0.6);
  wishScene.add(wishGroup);

  // ============ 文字围成心形：文案逐字沿心形曲线排布，贴附 3D 表面 ============
  // 每个字一个 sprite，按弧长均匀分布在心形轮廓上，随心跳同步脉动
  function makeTextTexture(text, opts){
    const o = Object.assign({ font: 'serif', size: 64, color: '#ffe6ee', glow: '#ff8eb3' }, opts);
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.font = `${o.weight || ''} ${o.size}px ${o.font}`.trim();
    const tw = ctx.measureText(text).width;
    c.width = Math.ceil(tw + o.size * 1.6);
    c.height = Math.ceil(o.size * 2.6);
    ctx.font = `${o.weight || ''} ${o.size}px ${o.font}`.trim();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = o.glow;
    ctx.shadowBlur = o.size * 0.55;
    ctx.fillStyle = o.color;
    ctx.fillText(text, c.width / 2, c.height / 2);
    ctx.shadowBlur = o.size * 0.25;
    ctx.fillText(text, c.width / 2, c.height / 2);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  const textSprites = [];
  // 组装心形文字：三条同心心形环 —— 内环标题大字，中外环正文，逐字贴附轮廓
  const wishTitle = '下一个十年';
  // 多段愿望——循环播放：每段是一段完整文案；字会先在底部浮出整段，然后逐字飞向心
  const wishPages = [
    {
      title: wishTitle,
      lines: [
        '愿我们继续牵着彼此的手看更多的山海走更远的路',
        '愿我们的小家永远充满笑声愿柯柯健康快乐地长大',
        '愿十年后二十年后五十年后你仍是我最想见的那个人',
        'Forever ♥'
      ]
    },
    {
      title: '下一段旅程',
      lines: [
        '愿每一个清晨醒来你都在身边',
        '愿每一个傍晚都有一起看的晚霞',
        '愿所有的柴米油盐都变成情味',
        'Marry me again.'
      ]
    },
    {
      title: '给未来的信',
      lines: [
        '愿我们记得第一次心动的感觉',
        '愿我们不被岁月磨去眼中的光',
        '愿我们白发时还能牵手走过街角',
        'Always & forever.'
      ]
    }
  ];
  const wishLines = wishPages[0].lines;
  // 心形曲线（与粒子 posHeart 同款），弧长参数化
  function heartPoint(u){
    const hx = 16 * Math.pow(Math.sin(u), 3);
    const hy = 13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
    return [hx, hy];
  }
  // 采样弧长表
  const ARC_N = 400;
  const arcLen = [0];
  for (let i = 1; i <= ARC_N; i++){
    const [x0, y0] = heartPoint(((i - 1) / ARC_N) * Math.PI * 2);
    const [x1, y1] = heartPoint((i / ARC_N) * Math.PI * 2);
    arcLen.push(arcLen[i-1] + Math.hypot(x1 - x0, y1 - y0));
  }
  const totalLen = arcLen[ARC_N];
  function heartAtArc(s){
    // s ∈ [0, totalLen) → 曲线坐标
    let lo = 0, hi = ARC_N;
    while (lo < hi){
      const mid = (lo + hi) >> 1;
      if (arcLen[mid] < s) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const t = (s - arcLen[i-1]) / Math.max(1e-6, arcLen[i] - arcLen[i-1]);
    const u = ((i - 1 + t) / ARC_N) * Math.PI * 2;
    return heartPoint(u);
  }

  // 三条文字环：内环标题（scale 0.135）+ 中环前两句（0.165）+ 外环后一句与落款（0.195）
  // 粒子心形 scale 0.115，文字环整体包在外面，形成嵌套心
  const TEXT_Z = 1.35;        // z 略前于粒子壳，避免被粒子吞没
  const rings = [
    { text: wishTitle,                 scale: 0.135, size: 96, weight: '300', color: '#fff0f5', glow: '#ff8eb3', charScale: 0.62 },
    { text: wishLines[0] + wishLines[1], scale: 0.165, size: 56, weight: '200', color: '#ffd6e4', glow: '#ff6b9e', charScale: 0.30 },
    { text: wishLines[2] + '  ' + wishLines[3], scale: 0.195, size: 56, weight: '200', color: '#ffd6e4', glow: '#ff6b9e', charScale: 0.32 }
  ];
  let charIdx = 0;
  rings.forEach(ring => {
    const chars = ring.text.split('');
    chars.forEach((ch0, i) => {
      if (ch0 === ' ') { charIdx++; return; }  // 空格占位不渲染
      const s = (i / chars.length) * totalLen;
      // 偏移 3/4 周长让分布起点在心形顶部凹陷处（视觉更对称）
      const [hx, hy] = heartAtArc((s + totalLen * 0.75) % totalLen);
      const tex = makeTextTexture(ch0, {
        size: ring.size, font: '"Noto Serif SC",serif', weight: ring.weight,
        color: ring.color, glow: ring.glow
      });
      const sm = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
      const sp = new THREE.Sprite(sm);
      const sc = ring.charScale;
      sp.scale.set(sc, sc * (tex.image.height / tex.image.width), 1);
      sp.userData = {
        hx: hx * ring.scale, hy: hy * ring.scale,
        phase: charIdx * 0.35, big: ring.size > 80,
        state: 'page',     // 'page' 初始(文案位) → 'in' 排队飞入心 → 'attached' 贴附 → 'out' 打散回归
        flyRound: -1,      // 已消费的飞入轮次
        startT: 0,         // 入场开始时间
        inT: 0,            // 入场结束时间
        outT: 0            // 飞散开始时间
      };
      wishGroup.add(sp);
      textSprites.push(sp);
      charIdx++;
    });
  });

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  function resizeWish(){
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    if (w === 0 || h === 0) return;
    renderer.setSize(w, h, false);
    wishCam.aspect = w / h;
    wishCam.updateProjectionMatrix();
  }
  resizeWish();
  // 监听 canvas 自身尺寸变化（章节切换 / 旋转 / 布局变更）
  const _wishResizeObs = new ResizeObserver(resizeWish);
  _wishResizeObs.observe(canvas);
  window.addEventListener('resize', resizeWish);

  // 鼠标 / 触摸交互
  const mouse = { ndc: new THREE.Vector2(0, 0), strength: 0, lastMove: 0 };
  function trackPointer(x, y){
    const r = canvas.getBoundingClientRect();
    mouse.ndc.set(((x - r.left) / r.width) * 2 - 1, -(((y - r.top) / r.height) * 2 - 1));
    mouse.lastMove = performance.now();
  }
  // 拨动交互：按住拖动 → 心 + 文字整体跟随旋转，松手带惯性衰减
  // 缩放交互：滚轮 / 双指 pinch → 相机推拉（可一路推进心形粒子深处）
  // 快速上滑（flick）→ 相机俯冲进心形内部，慢慢漂回
  let dragging = false, lastX = 0, lastY = 0, velX = 0, velY = 0;
  let camZ = 13, camZTarget = 13, diveVel = 0;   // 相机距离 + 深潜速度
  let downX = 0, downY = 0, downT = 0;
  let _wasDragging = false;   // 拖动后短暂屏蔽 click，避免拖动结束误触发文案解散
  function dragStart(x, y){ dragging = true; lastX = x; lastY = y; velX = velY = 0; downX = x; downY = y; downT = performance.now(); }
  function dragMove(x, y){
    if (!dragging) return;
    velY = (x - lastX) * 0.006;
    velX = (y - lastY) * 0.004;
    wishGroup.rotation.y += velY;
    wishGroup.rotation.x += velX;
    lastX = x; lastY = y;
  }
  function dragEnd(x, y){
    if (!dragging) return;
    dragging = false;
    // 快速上滑（<280ms 且位移 >60px）→ 触发深潜
    const dt = performance.now() - downT;
    const dy = (y ?? downY) - downY;
    if (dt < 280 && dy < -60) diveVel = -0.55;   // 负 = 向心形内部推进
    // 短按（位移 <6px 且时长 >180ms）→ 视为 click，触发由 canvas click 监听器统一处理
    const totalDx = (x ?? downX) - downX;
    const totalDy = (y ?? downY) - downY;
    const totalDist = Math.hypot(totalDx, totalDy);
    // 只有真实拖动（有位移）才屏蔽随后的 click；纯点击不置位
    if (totalDist >= 6){
      _wasDragging = true;
      setTimeout(() => { _wasDragging = false; }, 30);
    }
  }
  // 滚轮缩放（桌面）
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camZTarget = Math.max(1.2, Math.min(30, camZTarget + e.deltaY * 0.012));
  }, { passive: false });
  // 双指 pinch 缩放（移动端）
  let pinchD0 = 0, pinchZ0 = 0;
  if (isDesktop){
    window.addEventListener('mousemove', e => trackPointer(e.clientX, e.clientY), { passive: true });
    canvas.style.pointerEvents = 'auto';
    canvas.style.cursor = 'grab';
    canvas.addEventListener('mousedown', e => dragStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseup', e => dragEnd(e.clientX, e.clientY));
  } else {
    window.addEventListener('touchmove', e => trackPointer(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    window.addEventListener('touchstart', e => trackPointer(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    canvas.style.pointerEvents = 'auto';
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2){
        pinchD0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        pinchZ0 = camZTarget;
        dragging = false;  // 进入 pinch 模式
      } else {
        dragStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchD0 > 0){
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        camZTarget = Math.max(1.2, Math.min(30, pinchZ0 * (pinchD0 / d)));
      } else if (e.touches.length === 1){
        dragMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
      if (pinchD0 > 0 && e.touches.length === 0){ pinchD0 = 0; return; }
      dragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      // 短按兜底（移动端 click 不一定合成）：位移小 + 时长适中 → 触发解散
      const dt = performance.now() - downT;
      const td = Math.hypot(e.changedTouches[0].clientX - downX, e.changedTouches[0].clientY - downY);
      if (td < 8 && dt > 160 && dt < 600 && !_wasDragging){
        triggerAdvance();
      }
    }, { passive: true });
  }

  // 形态时间线：0-3s 散布→心形；3-9s 心形驻留（心跳）；
  // 9-12s 心形→双环；12-18s 双环驻留；18-21s 回心形；循环
  let running = true;
  const t0 = performance.now();
  const stop = () => { running = false; };
  (ch._wishStop = stop);
  // 调试接口（测试用）
  window.__wishDebug = () => {
    const states = {};
    textSprites.forEach(sp => { states[sp.userData.state] = (states[sp.userData.state] || 0) + 1; });
    return {
      camZ, camZTarget, diveVel, textCount: textSprites.length,
      page: currentPage + 1, states,
      flyInAt: Math.round(flyInAt * 10) / 10,
      flyOutAt: Math.round(flyOutAt * 10) / 10,
      attachedAt: Math.round(attachedAt * 10) / 10,
      pageAppearT: Math.round(pageAppearT * 10) / 10,
      ts: Math.round(tsNow() * 10) / 10,
      dim: pagesEl.classList.contains('dim')
    };
  };
  const _wishCleanupDebug = () => { delete window.__wishDebug; };

  // ============ 文案页层（DOM）+ 翻页 tabs + 点击/手势触发 ============
  // 每页周期 ≈ 20s（含开始/结束默认时间）：
  //   0-5s    初始状态：底部文案浮现 + 心形干净无字（开始默认 5s）
  //   5s      无滑动 → 字一个个排队飞向心形贴上（手动滑动可提前触发）
  //   ~8-18s  贴附心形（心跳呼吸）
  //   ~18s    自动打散 → 字飞回底部重组文案（回到初始状态）
  //   20s     切到下一个愿望页（三页轮转）
  const pagesEl = viewerStage.querySelector('.wish-pages');
  const tabsEl = viewerStage.querySelector('.wish-tabs');
  let currentPage = 0;
  let pageAppearT = 0;        // 当前页文案浮现时间
  let pageShown = false;      // 文案是否已浮现
  let flyInAt = -1;           // 排队飞向心形的触发 ts（-1 = 未触发）
  let flyInRound = 0;         // 飞入轮次（防止同一轮重复触发）
  let flyOutAt = -1;          // 触发解散的 ts（-1 = 未触发）
  let flyOutReason = null;    // 'auto' / 'manual' / 'tab'
  let attachedAt = -1;        // 全部字符贴附完成的时间
  const PAGE_FLYIN_DELAY = 5;   // 初始状态 5s 无操作 → 自动排队飞向心
  const ATTACHED_SCATTER = 10;  // 贴附 10s → 自动打散回到初始状态
  const PAGE_AUTO_SWITCH = 20;  // 每页总周期 20s → 自动切下一页

  function buildWishTabs(){
    tabsEl.innerHTML = '';
    wishPages.forEach((pg, i) => {
      const b = document.createElement('button');
      b.className = 'ar-tab' + (i === currentPage ? ' active' : '');
      b.textContent = pg.title;
      b.addEventListener('click', e => {
        e.stopPropagation();
        if (i === currentPage) return;
        const busy = textSprites.some(sp => ['in','attached','out'].includes(sp.userData.state));
        if (busy){
          // 已飞入/贴附：先解散，飞散落地后切到目标页
          if (flyOutAt < 0){ flyOutAt = tsNow(); flyOutReason = 'tab'; }
          targetPageAfter = i;
        } else {
          // 初始状态（字未上心）：直接切页
          switchToPage(i);
        }
      });
      tabsEl.appendChild(b);
    });
  }
  function showPage(i, instant){
    currentPage = i;
    pagesEl.innerHTML = '';
    const pg = wishPages[i];
    pg.lines.forEach((ln, li) => {
      const p = document.createElement('div');
      p.className = 'wish-page';
      p.textContent = ln;
      pagesEl.appendChild(p);
      // 错落浮现
      const delay = instant ? 0 : 220 * li;
      setTimeout(() => p.classList.add('show'), delay);
    });
    // 同步 tabs active
    tabsEl.querySelectorAll('.ar-tab').forEach((b, bi) => b.classList.toggle('active', bi === i));
  }
  function tsNow(){ return (performance.now() - t0) * 0.001; }
  let targetPageAfter = -1;

  // 页面布局缓存：初始状态 sprite 在文案位停留较久，避免每帧 getBoundingClientRect
  let _pageLayout = null;
  function computePageLayout(){
    try {
      const r = canvas.getBoundingClientRect();
      const pagesR = pagesEl.getBoundingClientRect();
      if (pagesR.height < 4 || !wishPages[currentPage]) return;
      _pageLayout = textSprites.map((_, si) => {
        const lineHeight = pagesR.height / Math.max(1, wishPages[currentPage].lines.length);
        const line = Math.floor(si / 6);   // 每 6 字一行（粗略）
        const col = si % 6;
        const pxCenter = pagesR.left + pagesR.width / 2;
        const pxX = pxCenter - 60 + col * 22;
        const pxY = pagesR.top + lineHeight * (line + 0.5);
        const ndcX = ((pxX - r.left) / r.width) * 2 - 1;
        const ndcY = -(((pxY - r.top) / r.height) * 2 - 1);
        const worldX = ndcX * Math.tan(wishCam.fov * Math.PI / 360) * wishCam.aspect * camZ;
        const worldY = ndcY * Math.tan(wishCam.fov * Math.PI / 360) * camZ;
        return [worldX, worldY];
      });
    } catch(e){}
  }
  window.addEventListener('resize', () => computePageLayout());

  // 切页：换文案 + 重置整轮节奏（字留在初始状态等下一轮 5s）
  function switchToPage(i){
    showPage(i, false);
    pageAppearT = tsNow();
    pageShown = true;
    flyInAt = -1; flyOutAt = -1; attachedAt = -1; targetPageAfter = -1;
    pagesEl.classList.remove('dim');
    computePageLayout();
  }

  buildWishTabs();
  // 首次文案浮现延后到 1.5s（等粒子成心形）
  let _initPageShown = false;
  function maybeShowInitial(){
    if (_initPageShown) return;
    _initPageShown = true;
    showPage(0, false);
    pageAppearT = tsNow();
    pageShown = true;
    computePageLayout();
  }

  // 手势推进：初始/休整状态 → 字排队飞向心；已飞入/贴附 → 打散回初始状态
  // 节流 1.5s：一次滑动会连续触发多个 checkSwipe，只推进一拍
  let _lastAdvanceT = -10;
  function triggerAdvance(){
    const now = tsNow();
    if (now - _lastAdvanceT < 1.5) return;
    _lastAdvanceT = now;
    const busy = textSprites.some(sp => ['in','attached','out'].includes(sp.userData.state));
    if (busy){
      if (flyOutAt < 0){ flyOutAt = now; flyOutReason = 'manual'; }
    } else {
      // 休整期手动再次触发：新一轮排队飞入
      flyInAt = now;
      flyInRound++;
      flyOutAt = -1; attachedAt = -1;
      pagesEl.classList.add('dim');
    }
  }
  // canvas 点击触发（避开文字 canvas 让 heart 形心点击也算）
  canvas.addEventListener('click', e => {
    if (_wasDragging) return;
    e.stopPropagation();
    triggerAdvance();
  });
  // 划过心形：鼠标/触摸进入 canvas 中心区域后，向心方向快速滑动
  let _swipeT = 0;
  function checkSwipe(x, y){
    const r = canvas.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const d = Math.hypot(x - cx, y - cy);
    if (d < r.width * 0.18){
      const now = performance.now();
      if (now - _swipeT < 220) triggerAdvance();
      _swipeT = now;
    }
  }
  canvas.addEventListener('mousemove', e => checkSwipe(e.clientX, e.clientY));
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1) checkSwipe(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // wish 章节当前页索引 → 每个 sprite 的文案位坐标从缓存读取
  textSprites.forEach((sp, si) => {
    sp.userData.pageXY = () => _pageLayout ? _pageLayout[si] : [0, -2.5];
  });

  function wishLoop(){
    if (!running) return;
    if (!viewerStage.isConnected || !canvas.isConnected){ stop(); return; }
    const ts = (performance.now() - t0) * 0.001;
    mat.uniforms.uTime.value = ts;
    // 形态进度
    const CYCLE = 21;
    const p = ts % CYCLE;
    let prog = 0;
    if (p < 3) prog = p / 3;                       // 散布 → 心
    else if (p < 9) prog = 1;                      // 心驻留
    else if (p < 12) prog = 1 + (p - 9) / 3;       // 心 → 环
    else if (p < 18) prog = 2;                     // 环驻留
    else prog = 1 + (1 - (p - 18) / 3);            // 环 → 心
    mat.uniforms.uProgress.value = prog;
    // 鼠标强度衰减
    const since = (performance.now() - mouse.lastMove) * 0.001;
    const target = since < 1.2 ? 1 : 0;
    mouse.strength += (target - mouse.strength) * 0.06;
    mat.uniforms.uMouse.value.copy(mouse.ndc);
    mat.uniforms.uMouseStrength.value = mouse.strength;
    // 整体缓慢旋转（拖动惯性叠加在用户旋转量上，文字随组同步转动）
    if (!dragging){
      velY *= 0.95; velX *= 0.95;
      wishGroup.rotation.y += velY + 0.0022;
      wishGroup.rotation.x += velX + Math.sin(ts * 0.22) * 0.0008;
    }
    // 入场动画：从远处 0.6 倍缩放慢慢推近 + 放大（2.5 秒 ease-out 后停止干预）
    if (ts < 2.5){
      const e = ts / 2.5;
      const ease = 1 - Math.pow(1 - e, 3);  // easeOutCubic
      wishGroup.position.x = -4 * (1 - ease);
      wishGroup.position.y = 3 * (1 - ease);
      wishGroup.scale.setScalar(0.6 + 0.4 * ease);
    }

    // 相机：缩放目标插值 + 深潜惯性（flick 触发，摩擦衰减）
    if (Math.abs(diveVel) > 0.001){
      camZTarget = Math.max(1.2, camZTarget + diveVel);
      diveVel *= 0.965;   // 摩擦
    }
    camZ += (camZTarget - camZ) * 0.06;
    wishCam.position.z = camZ;

    // 文字围心：每个 sprite 按 state 走 page → in → attached → out → page
    // page：初始状态，字停在文案位（DOM 文案负责显示，sprite 隐藏）
    // in：从文案位一个个排队飞向心形轮廓位置
    // attached：贴在心形上，随心跳呼吸
    // out：解散为心外飞散 → 飞回底部文案位 → 回到初始状态
    const hb = 1 + 0.045 * Math.sin(ts * 5.5);
    textSprites.forEach((sp, si) => {
      const ud = sp.userData;
      // 初始状态 → 排队飞入（flyInAt 触发，字与字错开排队；轮次防重复）
      if (ud.state === 'page' && flyInAt > 0 && ud.flyRound !== flyInRound){
        ud.state = 'in';
        ud.flyRound = flyInRound;
        ud.startT = flyInAt + 0.03 * si;
        ud.inT = 0;
      }
      // 飞入完成 → 贴附
      if (ud.state === 'in' && ud.inT && ts > ud.inT + 0.15){
        ud.state = 'attached';
        if (si === textSprites.length - 1) attachedAt = ts;
      }
      // 贴附/飞入中 → 打散回初始状态（flyOutAt 触发）
      if ((ud.state === 'attached' || ud.state === 'in') && flyOutAt > 0 && !ud.outT){
        ud.state = 'out';
        ud.outT = ts;
      }
      // 打散完成 → 回到初始状态（停在文案位，等下一轮/切页）
      if (ud.state === 'out' && ud.outT && ts > ud.outT + 2.5){
        ud.state = 'page';
        ud.inT = 0; ud.outT = 0; ud.startT = 0;
      }

      let tx, ty, tz, opacity;
      if (ud.state === 'page'){
        // 初始状态：字停在文案区，由 DOM 文案负责显示
        const [pageX, pageY] = ud.pageXY ? ud.pageXY() : [0, -2.5];
        tx = pageX; ty = pageY; tz = TEXT_Z;
        opacity = 0;
      } else if (ud.state === 'in'){
        // 从文案位置排队飞向心形位置（字"离开"底部文案）
        const [px0, py0] = ud.pageXY ? ud.pageXY() : [0, -2.5];
        const local = Math.min(1, Math.max(0, (ts - ud.startT) / 1.1));
        const ease = 1 - Math.pow(1 - local, 3);  // easeOutCubic
        tx = px0 + (ud.hx * hb - px0) * ease;
        ty = py0 + (ud.hy * hb - py0) * ease;
        tz = TEXT_Z + (1 - ease) * 1.4;
        opacity = ease;
        if (local >= 1 && !ud.inT) ud.inT = ts;
      } else if (ud.state === 'attached'){
        // 心跳缩放：字符沿心形轮廓法线方向内外呼吸
        const breathe = hb + Math.sin(ts * 1.4 + ud.phase) * 0.012;
        tx = ud.hx * breathe;
        ty = ud.hy * breathe;
        tz = TEXT_Z + Math.sin(ts * 0.8 + ud.phase) * 0.08;
        opacity = 1;
      } else {  // 'out'
        const local = Math.min(1, Math.max(0, (ts - ud.outT) / 1.6));
        const ease = local < 0.45
          ? 1 - Math.pow(1 - local / 0.45, 2)         // 0~0.45 飞散加速
          : 1;                                          // 0.45~1 已经在新页位置
        // 0~0.45：从心位置 → 屏外飞散 + 缩小
        // 0.45~1：从飞散位置 → 屏底重组到新页位置（DOM .wish-pages 的中心）
        const [pageX, pageY] = ud.pageXY ? ud.pageXY() : [0, -2.5];
        if (local < 0.45){
          const k = local / 0.45;
          tx = ud.hx * (1 - k) + Math.cos(ud.phase * 5.1) * 3.6 * k;
          ty = ud.hy * (1 - k) + Math.sin(ud.phase * 7.7) * 3.6 * k - 1.4 * k;
          tz = TEXT_Z - 1.6 * k;
        } else {
          const k = (local - 0.45) / 0.55;
          const e = 1 - Math.pow(1 - k, 3);
          const sx = Math.cos(ud.phase * 5.1) * 3.6;
          const sy = Math.sin(ud.phase * 7.7) * 3.6 - 1.4;
          tx = sx + (pageX - sx) * e;
          ty = sy + (pageY - sy) * e;
          tz = TEXT_Z - 1.6 + 1.6 * e;
        }
        opacity = 1 - ease * 0.4;  // 飞散时短暂变暗，重组后恢复
      }

      sp.position.set(tx, ty, tz);

      // 浪漫变色：粉→紫→金 循环流转，每字错开相位
      const hueShift = (ts * 0.045 + si * 0.09) % 1;
      let cr, cg, cb;
      if (hueShift < 0.33){
        const k = hueShift / 0.33;
        cr = 1.0; cg = 0.62 + k * 0.02; cb = 0.70 + k * 0.30;
      } else if (hueShift < 0.66){
        const k = (hueShift - 0.33) / 0.33;
        cr = 0.85 + k * 0.15; cg = 0.64 + k * 0.16; cb = 1.0;
      } else {
        const k = (hueShift - 0.66) / 0.34;
        cr = 1.0; cg = 0.80 - k * 0.16; cb = 1.0 - k * 0.45;
      }
      sp.material.color.setRGB(cr, cg, cb);
      sp.material.opacity = opacity;
    });

    // 流程推进：
    // 1) 粒子成心形（prog ≈ 1 且 ts > 1.5）→ 浮现第一段文案（初始状态）
    // 2) 初始状态 5s 无滑动 → 字自动排队飞向心形（文案随字隐去）
    // 3) 贴附 10s → 自动打散，字飞回底部重组文案（回到初始状态）
    // 4) 页周期 20s（含开始/结束默认时间）→ 字回初始状态后自动切下一页
    if (!_initPageShown && ts > 1.5 && prog >= 0.85 && prog <= 1.15){
      maybeShowInitial();
    }
    if (flyInAt < 0 && _initPageShown && ts - pageAppearT > PAGE_FLYIN_DELAY
        && textSprites.every(sp => sp.userData.state === 'page')){
      flyInAt = ts;
      flyInRound++;
      pagesEl.classList.add('dim');
    }
    if (flyInAt > 0 && flyOutAt < 0 && attachedAt > 0 && ts > attachedAt + ATTACHED_SCATTER){
      flyOutAt = ts;
      flyOutReason = 'auto';
    }
    if (flyOutAt > 0 && targetPageAfter < 0 && ts > flyOutAt + 1.3){
      pagesEl.classList.remove('dim');   // 打散回归：底部文案重新浮现
    }
    if (targetPageAfter >= 0 && flyOutAt > 0 && ts - flyOutAt > 2.6){
      switchToPage(targetPageAfter);     // tab 跳页：飞散落地后切换
    } else if (targetPageAfter < 0 && _initPageShown && ts - pageAppearT > PAGE_AUTO_SWITCH
        && textSprites.every(sp => sp.userData.state === 'page')){
      switchToPage((currentPage + 1) % wishPages.length);   // 20s 周期到点自动翻页
    }

    renderer.render(wishScene, wishCam);
    requestAnimationFrame(wishLoop);
  }
  wishLoop();

  // 章节销毁时释放 GPU
  const origStop = viewerFxState.stop;
  viewerFxState.stop = true;
  const cleanup = () => {
    stop();
    _wishCleanupDebug();
    geo.dispose(); mat.dispose(); renderer.dispose();
    try { renderer.forceContextLoss(); } catch(e){}  // 释放 GL 上下文
    textSprites.forEach(sp => { sp.material.map.dispose(); sp.material.dispose(); });
    if (_wishResizeObs) _wishResizeObs.disconnect();
    window.removeEventListener('resize', resizeWish);
    window.removeEventListener('mouseup', dragEnd);
    if (isDesktop) window.removeEventListener('mousemove', dragMove);
    else canvas.removeEventListener('touchmove', dragMove);
  };
  // 挂到 fxState，renderChapterScene 重建时由 viewerFxState.stop 置位触发
  const watchStop = setInterval(() => {
    if (!viewerStage.isConnected || !canvas.isConnected || viewerFxState._wish !== cleanup){
      cleanup();
      clearInterval(watchStop);
    }
  }, 500);
  viewerFxState._wish = cleanup;
}

// ============================================================
// ch15 AR时光墙 —— 全息照片墙
// GLSL 全息卡片（扫描线/色差/边缘辉光/故障闪烁）+ 主题星域
// 主题切换 = 卡片从星尘中弹簧聚合成弧形墙，旧卡片漂散消隐
// 拖拽旋转 / hover 高亮 / 点击凝视一帧
// ============================================================
let arApi = null;  // 供触摸滑动切换主题的外部接口
function renderARScene(ch){
  if (typeof THREE === 'undefined' || !arThemes.length) return;

  const slide = document.createElement('div');
  slide.className = 'viewer-slide ar';
  slide.innerHTML = `
    <canvas class="ar-canvas"></canvas>
    <div class="ar-vignette"></div>
    <div class="ar-head">
      <div class="ar-num">No.${String(viewerIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="ar-title">${ch.title}</div>
      <div class="ar-en">${ch.en}</div>
    </div>
    <div class="ar-theme-label"></div>
    <div class="ar-tabs"></div>
    <div class="ar-hint">${isDesktop ? '拖 拽 · 旋 转 时 光　　点 击 · 凝 视 一 帧' : '转 动 手 机 · 环 视 时 光　　点 击 · 凝 视 一 帧'}</div>`;
  viewerStage.appendChild(slide);

  const canvas = slide.querySelector('.ar-canvas');
  const labelEl = slide.querySelector('.ar-theme-label');
  const tabsEl = slide.querySelector('.ar-tabs');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  const arScene = new THREE.Scene();
  const arCam = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
  arCam.position.set(0, 0.3, isDesktop ? 13.5 : 19);

  const world = new THREE.Group();
  arScene.add(world);

  const t0 = performance.now();
  const curColor = new THREE.Color(arThemes[0].color);

  // ---------- 背景星域（GLSL 点云：噪声漂移 + 主题色流转） ----------
  const PN = isDesktop ? 700 : 320;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(PN * 3);
  const pRand = new Float32Array(PN);
  const pSize = new Float32Array(PN);
  for (let i = 0; i < PN; i++){
    const r = 9 + Math.random() * 14;
    const a = Math.random() * Math.PI * 2;
    const sp = Math.acos(2 * Math.random() - 1);
    pPos[i*3]   = r * Math.sin(sp) * Math.cos(a);
    pPos[i*3+1] = r * Math.sin(sp) * Math.sin(a) * 0.7;
    pPos[i*3+2] = r * Math.cos(sp);
    pRand[i] = Math.random();
    pSize[i] = 0.5 + Math.random() * 1.8;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('aRand', new THREE.BufferAttribute(pRand, 1));
  pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
  const pMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: curColor },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
    },
    vertexShader: /* glsl */`
      attribute float aRand;
      attribute float aSize;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vRand;
      void main(){
        vRand = aRand;
        vec3 p = position;
        p.x += sin(uTime * 0.15 + aRand * 40.0) * 0.9;
        p.y += cos(uTime * 0.12 + aRand * 55.0) * 0.9;
        p.z += sin(uTime * 0.10 + aRand * 30.0) * 0.9;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPixelRatio * (26.0 / max(-mv.z, 1.0)) * (0.8 + 0.4 * sin(uTime * 1.3 + aRand * 20.0));
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform vec3 uColor;
      varying float vRand;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float core = exp(-d * d * 26.0);
        float halo = exp(-d * d * 7.0) * 0.3;
        vec3 col = mix(uColor, vec3(0.75, 0.9, 1.0), vRand * 0.55);
        float tw = 0.7 + 0.3 * sin(uTime * 1.8 + vRand * 30.0);
        float alpha = (core + halo) * tw;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(col, alpha * 0.85);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  world.add(new THREE.Points(pGeo, pMat));

  // ---------- 全息地网（GLSL 网格 + 扫描脉冲环） ----------
  const gGeo = new THREE.PlaneGeometry(46, 30, 1, 1);
  gGeo.rotateX(-Math.PI / 2);
  const gMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: curColor }, uBurst: { value: -10 } },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform float uBurst;
      uniform vec3 uColor;
      varying vec2 vUv;
      void main(){
        // 网格线
        vec2 g = abs(fract(vUv * vec2(22.0, 14.0)) - 0.5);
        float line = smoothstep(0.44, 0.5, max(g.x, g.y)) * 0.4;
        // 扫描脉冲环（从中心周期扩散）
        float d = distance(vUv, vec2(0.5));
        float pulse = exp(-pow((d - fract(uTime * 0.09)) * 16.0, 2.0)) * 0.7;
        // 主题切换能量爆发波（一次性，从中心冲出）
        float burst = 0.0;
        float age = uTime - uBurst;
        if (age > 0.0 && age < 2.0){
          burst = exp(-pow((d - age * 0.55) * 11.0, 2.0)) * (1.0 - age / 2.0);
        }
        float fade = smoothstep(0.52, 0.08, d);
        float alpha = (line + pulse + burst * 1.2) * fade;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(uColor * (1.0 + pulse * 1.5 + burst * 2.0), alpha);
      }
    `,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const grid = new THREE.Mesh(gGeo, gMat);
  grid.position.y = -5.4;
  world.add(grid);

  // ---------- 全息卡片 ----------
  const BASE_H = isDesktop ? 3.0 : 2.6;
  const cards = [];       // {mesh, mat, themeIdx, base, pos, target, reveal, revealT, scaleT, phase, active, loaded}
  const texLoader = new THREE.TextureLoader();

  const CARD_FS = /* glsl */`
    uniform sampler2D uMap;
    uniform float uTime;
    uniform float uReveal;
    uniform float uHover;
    uniform float uHasTex;
    uniform vec3 uColor;
    varying vec2 vUv;
    varying vec3 vN;   // 视空间法线
    varying vec3 vV;   // 视空间视线方向（表面→相机）
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    // 光谱彩虹（hue → RGB）
    vec3 spectral(float h){
      return 0.5 + 0.5 * cos(6.2832 * (h + vec3(0.0, 0.33, 0.67)));
    }
    void main(){
      if (uHasTex < 0.5) discard;
      // 视角倾斜度：正对 = 0，侧看 = 1（陀螺仪转手机 / 桌面拖拽时变化）
      float facing = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
      float tilt = 1.0 - facing;
      // 全息色差：中心弱、边缘强，hover 增强 + 视角倾斜时 RGB 分离加剧（全息卡质感）
      vec2 c = vUv - 0.5;
      float ab = 0.004 + uHover * 0.007 + tilt * 0.014;
      // 内视差：照片在卡内随视角反向平移（景深错觉）
      vec2 par = vec2(normalize(vV).x, -normalize(vV).y) * tilt * 0.02;
      vec3 col;
      col.r = texture2D(uMap, vUv + c * ab + par).r;
      col.g = texture2D(uMap, vUv).g;
      col.b = texture2D(uMap, vUv - c * ab + par).b;
      // 全息彩虹镀层：随视角倾斜扫过整张照片（hue = uv + 倾斜角）
      float hue = fract(vUv.x * 0.35 + vUv.y * 0.12 + tilt * 2.2 + uTime * 0.02);
      col += spectral(hue) * (tilt * 0.55 + uHover * tilt * 0.3);
      // 角度高光带：一条随视线方位横扫的镜面亮带
      float bandPos = 0.5 + (normalize(vV).x / max(0.25, abs(normalize(vV).z))) * 0.28;
      float band = exp(-pow((vUv.x - bandPos) * 4.5, 2.0));
      col += vec3(1.0, 0.98, 0.92) * band * (0.10 + tilt * 0.38 + uHover * 0.15);
      // 扫描流光
      float scan = sin(vUv.y * 90.0 - uTime * 2.2) * 0.5 + 0.5;
      col += uColor * scan * 0.10;
      // 边缘辉光
      vec2 edge = min(vUv, 1.0 - vUv);
      float glow = 1.0 - smoothstep(0.0, 0.07, min(edge.x, edge.y));
      col += uColor * glow * (0.5 + uHover * 0.9);
      // 偶发故障行闪烁
      float fl = step(0.985, hash(vec2(floor(uTime * 7.0), floor(vUv.y * 22.0))));
      col += fl * uColor * 0.4;
      // 亮度：hover 提亮
      col *= 0.86 + uHover * 0.5;
      // 出现/消散：扫描线自下而上点亮
      float rowVis = smoothstep(vUv.y, vUv.y + 0.3, uReveal * 1.3);
      // 微噪点
      col += hash(vUv * 700.0 + fract(uTime) * 13.0) * 0.045;
      float alpha = rowVis * (0.9 + glow * 0.4 + uHover * 0.1);
      if (alpha < 0.01) discard;
      gl_FragColor = vec4(col, alpha);
    }
  `;

  arThemes.forEach((theme, ti) => {
    theme.photos.forEach(src => {
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uMap: { value: null },
          uTime: { value: 0 },
          uReveal: { value: 0 },
          uHover: { value: 0 },
          uHasTex: { value: 0 },
          uColor: { value: theme.color }
        },
        vertexShader: /* glsl */`
          varying vec2 vUv;
          varying vec3 vN;
          varying vec3 vV;
          void main(){
            vUv = uv;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vN = normalize(normalMatrix * normal);
            vV = normalize(-mv.xyz);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: CARD_FS,
        transparent: true, depthWrite: false, side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1.33), mat);
      // 初始：散布在星域里的随机位置
      const a = Math.random() * Math.PI * 2;
      const r = 10 + Math.random() * 8;
      const y = (Math.random() - 0.5) * 14;
      mesh.position.set(Math.cos(a) * r, y, Math.sin(a) * r * 0.6 - 4);
      world.add(mesh);
      const card = {
        mesh, mat, themeIdx: ti,
        base: new THREE.Vector3(),       // 本主题弧形墙上的固定位
        target: mesh.position.clone(),    // 弹簧目标
        reveal: 0, revealT: 0,
        scale: 0.6, scaleT: 0.6,
        hover: 0, hoverT: 0,
        phase: Math.random() * Math.PI * 2,
        active: false, loaded: false
      };
      cards.push(card);
      // 异步加载缩略图：加载完立刻"物化"（若属于当前主题）
      texLoader.load(src, tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        mat.uniforms.uMap.value = tex;
        mat.uniforms.uHasTex.value = 1;
        card.loaded = true;
        // 按真实宽高比重设几何
        const aspect = tex.image.width / tex.image.height;
        let h = BASE_H, w = h * aspect;
        if (w > h * 1.5){ w = h * 1.5; }  // 全景照限宽
        mesh.geometry.dispose();
        mesh.geometry = new THREE.PlaneGeometry(w, h);
      });
    });
  });

  // ---------- 主题弧形墙排布 ----------
  function arrangeTheme(ti){
    const list = cards.filter(c => c.themeIdx === ti);
    const n = list.length;
    const rows = n > 5 ? 2 : 1;
    const perRow = Math.ceil(n / rows);
    const R = 8.4;
    const spread = rows === 2 ? 1.7 : Math.min(1.9, 0.45 * n);
    list.forEach((card, i) => {
      const row = Math.floor(i / perRow);
      const col = i % perRow;
      const cnt = Math.min(perRow, n - row * perRow);
      const t = cnt <= 1 ? 0 : (col / (cnt - 1)) * 2 - 1;   // -1..1
      const ang = t * spread / 2;
      const y = (rows === 1 ? 0 : (row === 0 ? 1.75 : -1.75)) + (Math.random() - 0.5) * 0.22;
      card.base.set(Math.sin(ang) * R, y, R * (Math.cos(ang) - 1) - row * 0.55);
      card.mesh.rotation.set(0, -ang * 0.5, 0);
    });
  }
  arThemes.forEach((_, ti) => arrangeTheme(ti));

  // ---------- 主题切换 ----------
  let curTheme = -1;
  let focused = null;
  let autoTimer = null;

  function applyThemeVars(ti){
    const th = arThemes[ti];
    const hex = '#' + th.color.getHexString();
    slide.style.setProperty('--ar-color', hex);
    slide.style.setProperty('--ar-glow', th.color.getStyle().replace('rgb(', 'rgba(').replace(')', ',.55)'));
  }

  function switchTheme(ti, manual){
    ti = (ti + arThemes.length) % arThemes.length;
    if (ti === curTheme) return;
    curTheme = ti;
    focused = null;
    const th = arThemes[ti];
    // 能量爆发波：地面网格从中心冲出一圈光
    gMat.uniforms.uBurst.value = (performance.now() - t0) * 0.001;
    applyThemeVars(ti);
    // 主题大字：淡出→换字→淡入
    labelEl.classList.remove('show');
    setTimeout(() => {
      labelEl.textContent = `${th.name} · ${th.en}`;
      labelEl.classList.add('show');
    }, 450);
    // 标签页高亮
    tabsEl.querySelectorAll('.ar-tab').forEach((b, i) => b.classList.toggle('active', i === ti));
    // 卡片调度：旧主题漂散消隐，新主题错峰弹簧聚合
    cards.forEach(card => {
      if (card.themeIdx === ti){
        card.active = true;
        card.revealT = 1;
        card.scaleT = 1;
        const i = cards.filter(c => c.themeIdx === ti).indexOf(card);
        setTimeout(() => { card.target.copy(card.base); }, 120 + i * 90);
      } else if (card.active){
        card.active = false;
        card.revealT = 0;
        card.scaleT = 0.6;
        // 沿远离中心方向漂散
        const dir = card.mesh.position.clone().normalize();
        card.target.copy(card.mesh.position).addScaledVector(dir, 3.5);
      }
    });
    if (manual) restartAuto();
  }

  function restartAuto(){
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      if (!focused) switchTheme(curTheme + 1, false);
      restartAuto();
    }, 10000);
  }

  // 主题标签
  arThemes.forEach((th, i) => {
    const b = document.createElement('button');
    b.className = 'ar-tab';
    b.textContent = th.name;
    b.addEventListener('click', e => { e.stopPropagation(); switchTheme(i, true); });
    tabsEl.appendChild(b);
  });

  // ---------- 交互：拖拽旋转 / hover 高亮 / 点击凝视 ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2(-10, -10);
  let mouseSeen = false;
  let dragging = false, lastX = 0, lastY = 0, velY = 0;
  let downX = 0, downY = 0;
  let rotTargetY = null;

  function toNDC(x, y){
    const r = canvas.getBoundingClientRect();
    ndc.set(((x - r.left) / r.width) * 2 - 1, -(((y - r.top) / r.height) * 2 - 1));
    mouseSeen = true;
  }
  function onDown(x, y){
    dragging = true; velY = 0;
    lastX = downX = x; lastY = downY = y;
  }
  function onMove(x, y){
    toNDC(x, y);
    if (!dragging) return;
    velY = (x - lastX) * 0.005;
    world.rotation.y += velY;
    world.rotation.x = Math.max(-0.35, Math.min(0.35, world.rotation.x + (y - lastY) * 0.003));
    rotTargetY = null;
    lastX = x; lastY = y;
  }
  function onUp(x, y){
    if (!dragging) return;
    dragging = false;
    // 位移极小 → 视为点击（凝视/取消凝视）
    if (Math.abs(x - downX) < 6 && Math.abs(y - downY) < 6){
      toNDC(x, y);
      raycaster.setFromCamera(ndc, arCam);
      const activeMeshes = cards.filter(c => c.active && c.loaded).map(c => c.mesh);
      const hits = raycaster.intersectObjects(activeMeshes, false);
      if (hits.length){
        const card = cards.find(c => c.mesh === hits[0].object);
        if (card) toggleFocus(card);
      } else if (focused){
        toggleFocus(null);
      }
    }
  }
  function toggleFocus(card){
    if (focused === card) card = null;
    focused = card;
    cards.forEach(c => {
      if (c === focused){
        c.target.copy(c.base).add(new THREE.Vector3(0, 0, 2.6));
        c.scaleT = 1.55;
        c.revealT = 1;
      } else if (c.active){
        c.target.copy(c.base);
        c.scaleT = c.active ? 1 : 0.6;
        c.revealT = focused ? 0.18 : 1;
      }
    });
    if (focused){
      // 转回正面看它
      rotTargetY = Math.round(world.rotation.y / (Math.PI * 2)) * Math.PI * 2;
    }
  }

  // ---------- 陀螺仪：转动手机环视时光墙（移动端） ----------
  let gyroActive = false, gyroYaw = null, gyroPitch = 0, gyroBase = null;
  function onGyro(e){
    if (e.alpha == null || e.beta == null) return;
    gyroActive = true;
    const alphaRad = THREE.MathUtils.degToRad(e.alpha);
    // 以首次读数为基准，转头才转墙（避免进入时跳变）
    if (gyroBase === null) gyroBase = alphaRad;
    // 环形差值（-π..π）
    let dy = alphaRad - gyroBase;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    gyroYaw = dy;
    // beta 45°（手机自然持握）为俯仰中性位
    gyroPitch = THREE.MathUtils.degToRad(Math.max(-35, Math.min(35, e.beta - 45))) * 0.5;
  }
  function startGyro(){
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') window.addEventListener('deviceorientation', onGyro);
      }).catch(() => {});
    } else {
      window.addEventListener('deviceorientation', onGyro);
    }
  }

  const winMove = e => onMove(e.clientX, e.clientY);
  const winUp = e => onUp(e.clientX, e.clientY);
  if (isDesktop){
    canvas.style.cursor = 'grab';
    canvas.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
    window.addEventListener('mousemove', winMove, { passive: true });
    window.addEventListener('mouseup', winUp, { passive: true });
  } else {
    canvas.addEventListener('touchstart', e => { onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    canvas.addEventListener('touchmove', e => { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    canvas.addEventListener('touchend', e => { onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: true });
    // iOS 需要用户手势触发权限弹窗：首次触摸时申请
    canvas.addEventListener('touchstart', startGyro, { once: true, passive: true });
  }

  // ---------- 渲染循环 ----------
  function resizeAR(){
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    arCam.aspect = w / h;
    arCam.updateProjectionMatrix();
  }
  resizeAR();
  window.addEventListener('resize', resizeAR);

  let running = true;
  const stop = () => {
    running = false;
    window.removeEventListener('deviceorientation', onGyro);
  };

  function arLoop(){
    if (!running) return;
    if (!viewerStage.isConnected || !canvas.isConnected){ stop(); return; }
    const ts = (performance.now() - t0) * 0.001;

    pMat.uniforms.uTime.value = ts;
    gMat.uniforms.uTime.value = ts;
    // 背景色向当前主题色缓变
    if (curTheme >= 0) curColor.lerp(arThemes[curTheme].color, 0.035);

    // 空闲时缓慢自转 + 拖拽惯性；陀螺仪可用时优先跟随手机朝向
    if (!dragging){
      if (gyroActive && gyroYaw !== null){
        // 转动手机 → 时光墙跟随（带阻尼）
        const targetY = gyroYaw;
        let dy2 = targetY - world.rotation.y;
        while (dy2 > Math.PI) dy2 -= Math.PI * 2;
        while (dy2 < -Math.PI) dy2 += Math.PI * 2;
        world.rotation.y += dy2 * 0.08;
        world.rotation.x += (gyroPitch - world.rotation.x) * 0.06;
      } else {
        velY *= 0.94;
        world.rotation.y += velY + 0.0016;
        if (rotTargetY !== null){
          world.rotation.y += (rotTargetY - world.rotation.y) * 0.07;
          if (Math.abs(rotTargetY - world.rotation.y) < 0.002) rotTargetY = null;
        }
        world.rotation.x += (0 - world.rotation.x) * 0.03;
      }
    }

    // 桌面 hover 检测
    if (isDesktop && !dragging && mouseSeen){
      raycaster.setFromCamera(ndc, arCam);
      const activeMeshes = cards.filter(c => c.active && c.loaded).map(c => c.mesh);
      const hits = raycaster.intersectObjects(activeMeshes, false);
      const hot = hits.length ? cards.find(c => c.mesh === hits[0].object) : null;
      canvas.style.cursor = hot ? 'pointer' : 'grab';
      cards.forEach(c => { c.hoverT = (c === hot || c === focused) ? 1 : 0; });
    }

    // 桌面相机视差：光标微微牵引镜头，画面更"活"
    if (isDesktop && mouseSeen && !dragging){
      const px = Math.max(-1, Math.min(1, ndc.x));
      const py = Math.max(-1, Math.min(1, ndc.y));
      arCam.position.x += (px * 0.7 - arCam.position.x) * 0.04;
      arCam.position.y += (0.3 + py * 0.45 - arCam.position.y) * 0.04;
      arCam.lookAt(0, 0, 0);
    }

    // 卡片弹簧动画（位置/显隐/缩放/hover 全部平滑趋近）
    cards.forEach(card => {
      card.reveal += (card.revealT - card.reveal) * 0.07;
      card.scale += (card.scaleT - card.scale) * 0.09;
      card.hover += (card.hoverT - card.hover) * 0.12;
      card.mesh.position.lerp(card.target, 0.065);
      // 轻微悬浮呼吸
      card.mesh.position.y += Math.sin(ts * 0.8 + card.phase) * 0.0012;
      card.mesh.scale.setScalar(card.scale);
      card.mat.uniforms.uTime.value = ts;
      card.mat.uniforms.uReveal.value = card.reveal;
      card.mat.uniforms.uHover.value = card.hover;
    });

    renderer.render(arScene, arCam);
    requestAnimationFrame(arLoop);
  }
  arLoop();

  // 进场：先出标题星域，再聚合第一个主题
  applyThemeVars(0);
  setTimeout(() => switchTheme(0, false), 600);
  restartAuto();

  // 外部接口（触摸上下滑切换主题）
  arApi = {
    cycle(dir){ switchTheme(curTheme + dir, true); },
    dispose(){ stop(); }
  };
  // 调试/测试钩子
  window.__arDebug = () => ({
    theme: curTheme,
    rotY: +world.rotation.y.toFixed(3),
    cards: cards.map(c => ({
      t: c.themeIdx, active: c.active, loaded: c.loaded, focused: c === focused,
      reveal: +c.reveal.toFixed(3), hover: +c.hover.toFixed(2), scale: +c.scale.toFixed(2),
      pos: c.mesh.position.toArray().map(v => +v.toFixed(2)),
      base: c.base.toArray().map(v => +v.toFixed(2))
    }))
  });

  // 章节销毁时释放 GPU（沿用 wish 的 watch 模式）
  const cleanup = () => {
    stop();
    if (autoTimer) clearTimeout(autoTimer);
    if (arApi) arApi = null;
    cards.forEach(c => { c.mat.uniforms.uMap.value?.dispose(); c.mat.dispose(); c.mesh.geometry.dispose(); });
    pGeo.dispose(); pMat.dispose();
    gGeo.dispose(); gMat.dispose();
    renderer.dispose();
    try { renderer.forceContextLoss(); } catch(e){}  // 释放 GL 上下文
    window.removeEventListener('resize', resizeAR);
    window.removeEventListener('mousemove', winMove);
    window.removeEventListener('mouseup', winUp);
  };
  const dbg = window.__arDebug;
  const watchStop = setInterval(() => {
    if (!viewerStage.isConnected || !canvas.isConnected || viewerFxState._ar !== cleanup){
      cleanup();
      if (window.__arDebug === dbg) window.__arDebug = null;
      clearInterval(watchStop);
    }
  }, 500);
  viewerFxState._ar = cleanup;
}

// 章节特效：每章自定义粒子 + 装饰
function startChapterFx(scene, ch){
  const canvas = scene.querySelector('.scene-fx');
  if (!canvas) return;
  const ctx2 = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  function resize(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const state = { stop: false, particles: [] };
  viewerFxState = state;
  const rand = (a,b) => a + Math.random()*(b-a);
  const cw = () => canvas.width/dpr, chh = () => canvas.height/dpr;
  const fx = ch.effect;

  // 根据章节扩展粒子初始化（移动端粒子数减半以降低 GPU/CPU 压力）
  const mult = isDesktop ? 1 : 0.5;
  const count = (n) => Math.max(4, Math.floor(n * mult));
  if (fx === 'snow'){
    for (let i=0;i<count(60);i++) state.particles.push({x:rand(0,1),y:rand(0,1),r:rand(1.5,4.5),vy:rand(.0006,.0018),vx:rand(-.0003,.0003),ph:rand(0,6.28),alpha:rand(.5,1)});
  } else if (fx === 'meteor'){
    for (let i=0;i<count(20);i++) state.particles.push({x:Math.random(),y:Math.random()*.5,vx:rand(.002,.005),vy:rand(.001,.003)});
  } else if (fx === 'wave'){
    // ch04 北海：2D 层加海鸥 + 气泡（和 3D 层呼应，不做波浪顶点）
    state.phase = 0;
    for (let i = 0; i < 12; i++){
      state.particles.push({x:rand(0,1), y:rand(0.4,1), vy:rand(-.0006,-.0002), vx:rand(-.0004,.0004), ph:rand(0,6.28), sz:rand(2,5), a:rand(.25,.55), isSeagull: true});
    }
    for (let i = 0; i < 18; i++){
      state.particles.push({x:rand(0,1), y:rand(0,1), vy:rand(-.0008,-.0003), ph:rand(0,6.28), r:rand(1.5,3.5), a:rand(.4,.7), isBubble: true});
    }
  } else if (fx === 'petal'){
    for (let i=0;i<count(22);i++) state.particles.push({x:Math.random(),y:Math.random(),vy:rand(.0004,.0014),vx:rand(-.0004,.0004),rot:rand(0,6.28),vrot:rand(-.008,.008),sz:rand(5,9),hue:rand(330,360)});
  } else if (fx === 'rose'){
    for (let i=0;i<count(28);i++) state.particles.push({x:Math.random(),y:rand(0,1)+.2,vy:rand(.0003,.0008),vx:rand(-.0003,.0003),sz:rand(2,5),a:rand(.4,.8),ph:rand(0,6.28),hue:rand(340,360)});
  } else if (fx === 'bubble'){
    for (let i=0;i<count(24);i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(4,14),vy:rand(-.001,-.0003),ph:rand(0,6.28)});
  } else if (fx === 'lantern'){
    for (let i=0;i<count(14);i++) state.particles.push({x:Math.random(),y:rand(.3,1),vy:rand(-.0003,-.0001),ph:rand(0,6.28),sz:rand(4,7)});
  } else if (fx === 'bokeh'){
    for (let i=0;i<count(22);i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(10,26),ph:rand(0,6.28),col:`hsl(${rand(20,40)},80%,70%)`});
  } else if (fx === 'heart'){
    for (let i=0;i<count(16);i++) state.particles.push({x:Math.random(),y:rand(.5,1),vy:rand(-.0008,-.0003),sz:rand(8,16),ph:rand(0,6.28)});
  } else if (fx === 'film'){
    // 浮尘 + 偶尔的胶片划痕
    for (let i=0;i<count(25);i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(.6,1.5),vy:rand(-.0003,-.0001),vx:rand(-.0001,.0001),ph:rand(0,6.28),a:rand(.3,.7)});
    state.scratches = [];
    state.scratchTimer = 0;
  }

  const loop = t => {
    if (state.stop) return;
    const w = cw(), h = chh();
    ctx2.clearRect(0,0,w,h);

    if (fx === 'snow'){
      ctx2.fillStyle = 'rgba(255,255,255,.85)';
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(t*.001+p.ph)*.0005;
        if (p.y > 1){p.y=-.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.globalAlpha = p.alpha;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      ctx2.globalAlpha = 1;
    } else if (fx === 'meteor'){
      state.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x>1.2||p.y>1.2){p.x=-.2;p.y=Math.random()*.3;}
        const x0=p.x*w,y0=p.y*h,x1=(p.x-p.vx*80)*w,y1=(p.y-p.vy*80)*h;
        const g=ctx2.createLinearGradient(x1,y1,x0,y0);
        g.addColorStop(0,'rgba(255,220,180,0)');
        g.addColorStop(1,'rgba(255,240,200,.9)');
        ctx2.strokeStyle=g;ctx2.lineWidth=1.8;
        ctx2.beginPath();ctx2.moveTo(x1,y1);ctx2.lineTo(x0,y0);ctx2.stroke();
      });
    } else if (fx === 'wave'){
    // ch04 北海：绘制远处海鸥剪影 + 上升气泡（去掉波浪线）
    state.particles.forEach(p => {
      // 推进位置（海鸥缓慢漂 / 气泡上升）
      p.y += p.vy || 0;
      p.x += p.vx || 0;
      if (p.isBubble && p.y < -0.05){
        p.y = 1.05; p.x = Math.random();
      }
      if (p.isSeagull && (p.x < -0.1 || p.x > 1.1)){
        p.y = Math.random()*0.4 + 0.3;
        if (p.vx < 0) p.x = 1.05; else p.x = -0.05;
      }
      const x = p.x*w, y = p.y*h;
      if (p.isSeagull){
        // 海鸥：双翼弧线
        const flap = Math.sin(p.ph + t*.004) * 4;
        ctx2.strokeStyle = `rgba(50,55,68,${p.a})`;
        ctx2.lineWidth = 1.6;
        ctx2.beginPath();
        ctx2.moveTo(x-7, y-flap); ctx2.quadraticCurveTo(x-3, y-flap-2, x, y);
        ctx2.quadraticCurveTo(x+3, y-flap-2, x+7, y-flap);
        ctx2.stroke();
      } else if (p.isBubble){
        // 气泡：白圆 + 高光
        ctx2.fillStyle = `rgba(255,255,255,${p.a*0.6})`;
        ctx2.strokeStyle = `rgba(220,240,255,${p.a})`;
        ctx2.lineWidth = 0.8;
        ctx2.beginPath();
        ctx2.arc(x, y, p.r, 0, Math.PI*2);
        ctx2.fill(); ctx2.stroke();
        // 高光
        ctx2.fillStyle = `rgba(255,255,255,${p.a*0.9})`;
        ctx2.beginPath();
        ctx2.arc(x-p.r*0.35, y-p.r*0.35, p.r*0.3, 0, Math.PI*2);
        ctx2.fill();
      }
    });
    } else if (fx === 'petal'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt+p.rot)*.0006;
        p.rot += p.vrot;
        if (p.y>1.1){p.y=-.1;p.x=Math.random();}
        ctx2.save();ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.rot);
        ctx2.fillStyle=`hsla(${p.hue},75%,82%,.7)`;
        ctx2.beginPath();ctx2.ellipse(0,0,p.sz,p.sz*.6,0,0,Math.PI*2);ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'rose'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y -= p.vy; p.x += Math.sin(tt+p.ph)*.0004;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        ctx2.save();
        ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.ph+tt);
        ctx2.fillStyle=`hsla(${p.hue},70%,75%,${p.a})`;
        ctx2.beginPath();
        // 简化玫瑰花瓣形（5 瓣）
        for (let k=0;k<5;k++){
          const ang = k*Math.PI*2/5;
          ctx2.ellipse(0,0,p.sz*1.4,p.sz*.8,ang,0,Math.PI*2);
        }
        ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'bubble'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt*.5+p.ph)*.0005;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const g=ctx2.createRadialGradient(p.x*w-p.r*.3,p.y*h-p.r*.3,1,p.x*w,p.y*h,p.r);
        g.addColorStop(0,'rgba(255,255,255,.6)');
        g.addColorStop(.5,'rgba(220,240,255,.18)');
        g.addColorStop(1,'rgba(180,220,255,.02)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'lantern'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy;
        if (p.y<0){p.y=1;p.x=Math.random();}
        const al=.4+Math.sin(tt*2+p.ph)*.3;
        const r=p.sz*(1+Math.sin(tt+p.ph)*.2);
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r*4);
        g.addColorStop(0,`rgba(255,180,80,${al})`);
        g.addColorStop(.3,`rgba(255,140,60,${al*.4})`);
        g.addColorStop(1,'rgba(255,100,40,0)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r*4,0,Math.PI*2);ctx2.fill();
        ctx2.fillStyle=`rgba(255,220,150,${al})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'bokeh'){
      const tt=t*.001;
      state.particles.forEach(p => {
        const sc=1+Math.sin(tt*.5+p.ph)*.2;
        const r=p.r*sc;
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r);
        g.addColorStop(0,p.col.replace('70%)','50%)').replace(')',',.4)'));
        g.addColorStop(1,p.col.replace('70%)','40%)').replace(')',',0)'));
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
    } else if (fx === 'heart'){
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt+p.ph)*.0002;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const sc=1+Math.sin(tt+p.ph)*.3;
        const r=p.sz*sc;
        ctx2.save();
        ctx2.translate(p.x*w,p.y*h);
        ctx2.scale(r/16,r/16);
        ctx2.fillStyle=`rgba(255,142,179,${.4+Math.sin(tt+p.ph)*.2})`;
        ctx2.beginPath();
        ctx2.moveTo(0,-2);
        ctx2.bezierCurveTo(-4,-8,-12,-4,-8,4);
        ctx2.bezierCurveTo(-4,8,0,12,0,16);
        ctx2.bezierCurveTo(0,12,4,8,8,4);
        ctx2.bezierCurveTo(12,-4,4,-8,0,-2);
        ctx2.fill();
        ctx2.restore();
      });
    } else if (fx === 'film'){
      const tt=t*.001;
      // 浮尘
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt*.5+p.ph)*.0002;
        if (p.y<-.05){p.y=1.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.fillStyle=`rgba(255,230,180,${p.a})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      // 胶片划痕（偶发横线闪烁）
      state.scratchTimer -= 16;
      if (state.scratchTimer <= 0 && Math.random() < 0.05){
        state.scratches.push({y: Math.random()*h, life: 8+Math.random()*12, x: 0, speed: 1+Math.random()*2});
        state.scratchTimer = 800 + Math.random()*1500;
      }
      ctx2.strokeStyle = 'rgba(255,240,200,.5)';
      ctx2.lineWidth = 1;
      state.scratches = state.scratches.filter(s => s.life > 0);
      state.scratches.forEach(s => {
        s.x = (s.x + s.speed) % w;
        s.life -= 1;
        ctx2.globalAlpha = Math.min(1, s.life / 12);
        ctx2.beginPath();
        ctx2.moveTo(s.x, s.y);
        ctx2.lineTo(s.x + 30, s.y + (Math.random()-0.5)*4);
        ctx2.stroke();
      });
      ctx2.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

// 在章节视图中：左滑下一章、右滑上一章、上下滑切换同一章内的照片
let viewTouchStartX = 0, viewTouchStartY = 0, viewTouchStartT = 0;
viewerStage.addEventListener('touchstart', e => {
  viewTouchStartX = e.touches[0].clientX;
  viewTouchStartY = e.touches[0].clientY;
  viewTouchStartT = performance.now();
}, {passive:true});
viewerStage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - viewTouchStartX;
  const dy = e.changedTouches[0].clientY - viewTouchStartY;
  const dt = performance.now() - viewTouchStartT;
  if (dt > 600) return;
  // 特效互动章节（wish / ar）：滑动全部交给场景内交互（旋转/缩放/深潜/切主题），
  // 禁用左右滑切章避免冲突 —— 退出走左上角返回按钮
  if (viewerMode === 'wish') return;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50){
    // 左右滑 - 切换章节（AR 章节禁用：拖拽旋转与切章冲突）
    if (viewerMode === 'ar') return;
    if (dx < 0) openNextChapter();
    else if (dx > 0) openPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 - AR 章节切换主题，其他章节切换照片
    if (viewerMode === 'ar' && arApi){
      arApi.cycle(dy < 0 ? 1 : -1);
      return;
    }
    // 上下滑 - 切换同章节内的照片
    const scene = viewerStage.querySelector('.scene');
    if (!scene || !viewerPhotos.length) return;
    if (dy < 0){
      // 下一张
      if (viewerMode === 'book' && scene._book) bookFlip(scene._book, 'next');
      else if (viewerMode === 'flow' && scene._flow) flowGo(scene, 'next');
      else if (viewerMode === 'stack' && scene._stack) stackGo(scene, 'next');
    } else {
      if (viewerMode === 'book' && scene._book) bookFlip(scene._book, 'prev');
      else if (viewerMode === 'flow' && scene._flow) flowGo(scene, 'prev');
      else if (viewerMode === 'stack' && scene._stack) stackGo(scene, 'prev');
    }
    // 手动滑动后，重启定时器（避免刚滑完又自动跳）
    startAutoAdvance(scene);
  }
}, {passive:true});

// 滚轮 / 鼠标上下键 → 章节内切换照片（仅桌面端有滚轮）
let _wheelAccum = 0;
viewerStage.addEventListener('wheel', e => {
  if (!viewerPhotos.length) return;
  const scene = viewerStage.querySelector('.scene');
  if (!scene) return;
  // 累积阈值：单次 wheel deltaY 多半为 ±100，避免滚一格触发多次
  _wheelAccum += e.deltaY;
  if (Math.abs(_wheelAccum) < 60) return;
  const dir = _wheelAccum > 0 ? 'next' : 'prev';
  _wheelAccum = 0;
  e.preventDefault();
  if (viewerMode === 'ar' && arApi){ arApi.cycle(dir === 'next' ? 1 : -1); return; }
  if (viewerMode === 'book' && scene._book) bookFlip(scene._book, dir);
  else if (viewerMode === 'flow' && scene._flow) flowGo(scene, dir);
  else if (viewerMode === 'stack' && scene._stack) stackGo(scene, dir);
  startAutoAdvance(scene);
}, {passive:false});

// 键盘上下键 → 同章节切照片
window.addEventListener('keydown', e => {
  if (!viewerEl.classList.contains('active')) return;  // 只在章节视图
  if (e.target?.tagName === 'INPUT' || e.target?.tagName === 'TEXTAREA') return;
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const scene = viewerStage.querySelector('.scene');
  if (!scene || !viewerPhotos.length) return;
  e.preventDefault();
  const dir = e.key === 'ArrowUp' ? 'prev' : 'next';
  if (viewerMode === 'ar' && arApi){ arApi.cycle(dir === 'next' ? 1 : -1); return; }
  if (viewerMode === 'book' && scene._book) bookFlip(scene._book, dir);
  else if (viewerMode === 'flow' && scene._flow) flowGo(scene, dir);
  else if (viewerMode === 'stack' && scene._stack) stackGo(scene, dir);
  startAutoAdvance(scene);
});

// 活跃音符登记：切歌时立即停掉旧曲目所有已排程音符（否则两曲混音最长 ~10s）
const _activeOscs = new Set();
function _killActiveNotes(fade = 0.08){
  const now = audioCtx ? audioCtx.currentTime : 0;
  _activeOscs.forEach(o => {
    try {
      // 快速淡出再停，避免爆音
      if (o.gain){
        o.gain.gain.cancelScheduledValues(now);
        o.gain.gain.setTargetAtTime(0, now, fade / 3);
      }
      o.osc.stop(now + fade + 0.05);
    } catch(e){}
  });
  _activeOscs.clear();
}
function playNote(freq, st, dur, vol, type){
  if (!audioCtx) return;
  if (type === 'piano'){
    // 钢琴：基音 + 2x 谐波（亮度）+ 3x 谐波（细节），快速 attack + 较长 decay
    const partials = [
      { mul: 1, amp: 1.00, oscType: 'triangle' },
      { mul: 2, amp: 0.35, oscType: 'sine' },
      { mul: 3, amp: 0.12, oscType: 'sine' }
    ];
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0, st);
    master.connect(audioCtx.destination);
    const entry = { gain: master };
    _activeOscs.add(entry);
    partials.forEach(p => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = p.oscType;
      osc.frequency.value = freq * p.mul;
      // 钢琴 ADSR：attack .005, decay 到 0.4 倍, sustain 0.3, release 自然衰减
      const peak = vol * p.amp;
      g.gain.setValueAtTime(0, st);
      g.gain.linearRampToValueAtTime(peak, st + .005);
      g.gain.exponentialRampToValueAtTime(peak * 0.35, st + .15);
      g.gain.exponentialRampToValueAtTime(.001, st + dur);
      osc.connect(g).connect(master);
      osc.onended = () => _activeOscs.delete(entry);
      osc.start(st);
      osc.stop(st + dur + .1);
    });
    return;
  }
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, st);
  g.gain.linearRampToValueAtTime(vol, st + .02);
  g.gain.exponentialRampToValueAtTime(vol*.5, st + dur*.5);
  g.gain.exponentialRampToValueAtTime(.001, st + dur);
  osc.connect(g).connect(audioCtx.destination);
  const entry = { osc, gain: g };
  _activeOscs.add(entry);
  osc.onended = () => _activeOscs.delete(entry);
  osc.start(st); osc.stop(st + dur + .1);
}
function playPad(freqs, st, dur, vol){
  if (!audioCtx) return;
  freqs.forEach(f => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(vol, st + .5);
    g.gain.linearRampToValueAtTime(vol, st + dur - .5);
    g.gain.exponentialRampToValueAtTime(.001, st + dur);
    osc.connect(g).connect(audioCtx.destination);
    const entry = { osc, gain: g };
    _activeOscs.add(entry);
    osc.onended = () => _activeOscs.delete(entry);
    osc.start(st); osc.stop(st + dur + .1);
  });
}
function playBGM(name){
  if (!audioCtx || !musicPlaying) return;
  const bgm = BGMS[name];
  if (!bgm) return;
  const tempo = bgm.tempo, beatDur = 60/tempo;
  const t0 = audioCtx.currentTime + .1;
  const loopDur = bgm.melody.reduce((s, n) => s + n.d, 0) * beatDur;

  let t = t0;
  bgm.melody.forEach(n => {
    if (NOTES[n.n] !== undefined)
      playNote(NOTES[n.n], t, n.d * beatDur * .9, bgm.vol, bgm.type);
    t += n.d * beatDur;
  });
  const chordStep = loopDur / bgm.chords.length;
  bgm.chords.forEach((c, i) => {
    c.forEach(note => {
      if (NOTES[note] !== undefined)
        playNote(NOTES[note], t0 + i*chordStep, chordStep*.95, bgm.padVol, 'sine');
    });
  });
  playPad(bgm.chords[0].map(n => NOTES[n]/4).filter(n => n && isFinite(n)), t0, loopDur, bgm.bassVol);

  musicLoopTimer = setTimeout(() => playBGM(name), (loopDur - .3) * 1000);
}
function startMusic(){
  _unlockIOSAudio();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
}
function stopMusic(){
  musicPlaying = false;
  if (musicLoopTimer) clearTimeout(musicLoopTimer);
  if (audioCtx) audioCtx.suspend();
}
function switchBGM(name){
  if (!audioCtx || !musicPlaying || !name) return;
  if (currentBGM === name) return;
  if (musicLoopTimer) clearTimeout(musicLoopTimer);
  _killActiveNotes();   // 立即停旧曲，防止两曲混音
  currentBGM = name;
  playBGM(name);
}

let _silenceEl = null;
function _makeSilenceWavUrl(){
  const sr = 8000, len = sr * 0.2;  // 0.2s 静音
  const buf = new ArrayBuffer(44 + len);

  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + len, true); ws(8, 'WAVE');
  ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  ws(36, 'data'); v.setUint32(40, len, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function _unlockIOSAudio(){
  if (_silenceEl) return;
  try {
    _silenceEl = new Audio(_makeSilenceWavUrl());
    _silenceEl.loop = true;
    _silenceEl.volume = 1;  // 内容本身是纯静音
    _silenceEl.play().catch(() => {});
  } catch (e) {}
}
['pointerdown','touchstart','keydown'].forEach(ev => {
  window.addEventListener(ev, () => {
    _unlockIOSAudio();
    _lazyInitAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    // splash 期间启动钢琴版银河 BGM（cosmic 已改为钢琴音色，低音垫极弱，无"心跳"感）
    if (audioCtx && !currentBGM){
      const splashEl = document.getElementById('splash');
      if (splashEl && !splashEl.classList.contains('hidden')){
        currentBGM = 'cosmic';
        playBGM('cosmic');
      }
    }
  }, { once: false, passive: true });
});
// iOS 后台返回时唤醒音频
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    // 静音解锁元素可能被系统暂停，回到前台时补播
    if (_silenceEl && _silenceEl.paused) _silenceEl.play().catch(() => {});
  }
});

// ============================================================
// 6. 启动
// ============================================================
document.getElementById('openBtn').addEventListener('click', async () => {
  window.openTime = Date.now();
  startMusic();
  // splash 银河阶段用钢琴版 cosmic；进入相册后无缝切到 lucky
  // （原 cosmic 低音垫太像心跳，用户不要；现已重写为钢琴音色 + 极弱低音）
  switchBGM('lucky');
  if (window.__splashTriggerDive) window.__splashTriggerDive();
  // 俯冲动画进行到 1.8s 时，提前释放 splash WebGL 资源（避免和 loader 抢 GPU）
  await new Promise(r => setTimeout(r, 1800));
  if (window.__disposeSplash) window.__disposeSplash();
  // 俯冲动画结束后再隐藏 splash（BGM 已是 lucky，无需切换）
  await new Promise(r => setTimeout(r, 700));
  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => document.getElementById('splash').remove(), 1300);
  // 防御性：即使 photos.json 失败，也要把首页建出来（空数据），让用户至少能点回忆录
  try {
    const photosData = await loadPhotosData();
    await buildSphereWall(photosData);
  } catch (e) {
    console.error('[openBtn] buildSphereWall failed:', e);
    try { await buildSphereWall({}); } catch(e2) { console.error('[openBtn] empty build also failed:', e2); }
  }
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>爱的回忆 · 给你的纪念册</title>
<meta name="description" content="一本只属于我们的纪念册 — 从 2017 到 ∞">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Noto+Serif+SC:wght@200;400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
  touch-action:none;overscroll-behavior:none;
}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}

/* ============== Splash 星空漩涡 ============== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#02010a;  /* fallback 深色，scene.background 加载后会被覆盖 */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;user-select:none}
.splash-content{position:relative;z-index:2;text-align:center;color:#f8e8d4;padding:0 30px;pointer-events:none}
.splash-eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.6em;color:rgba(248,232,212,.5);margin-bottom:18px;opacity:0;animation:fadeIn 1.4s ease .3s forwards}
.splash-title{font-family:"Dancing Script","Cormorant Garamond",serif;font-size:clamp(3rem,12vw,5rem);font-weight:400;letter-spacing:.04em;color:#fff;text-shadow:0 0 40px rgba(255,180,200,.4),0 0 80px rgba(180,120,255,.2);margin-bottom:8px;opacity:0;animation:titleIn 1.8s ease .8s forwards}
.splash-sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.5em;color:rgba(248,232,212,.7);margin-bottom:36px;opacity:0;animation:fadeIn 1.4s ease 1.4s forwards}
.splash-btn{position:absolute;z-index:3;right:max(34px,env(safe-area-inset-right));bottom:max(72px,calc(env(safe-area-inset-bottom) + 56px));display:inline-flex;align-items:center;gap:10px;padding:14px 40px;background:rgba(248,232,212,.06);border:1px solid rgba(248,232,212,.4);color:#f8e8d4;font-family:"Noto Serif SC",serif;font-size:clamp(.9rem,3vw,1rem);letter-spacing:.35em;cursor:pointer;border-radius:50px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;animation:fadeUp 1.4s ease 2s forwards;transition:all .3s ease}
.splash-btn:active{transform:scale(.96);background:rgba(248,232,212,.12);border-color:#f8e8d4}
.splash-btn .heart{display:inline-block;color:#ff6b95;animation:heartbeat 1.4s ease-in-out infinite;font-size:1.1em}
.splash-hint{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(248,232,212,.35);font-size:.7rem;letter-spacing:.4em;z-index:2;animation:fadeIn 1.4s ease 2.5s forwards;opacity:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleIn{from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* ============== Splash 百科面板 ============== */
.space-detail{
  position:fixed;left:max(28px,env(safe-area-inset-left));bottom:max(140px,calc(env(safe-area-inset-bottom) + 110px));
  z-index:10000;max-width:380px;padding:18px 22px;border-radius:14px;
  background:rgba(10,8,22,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,200,180,.18);color:#f8e8d4;
  box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;
  pointer-events:none;font-family:"Noto Serif SC",serif;
}
.space-detail.show{opacity:1;transform:translateY(0);pointer-events:auto}
.space-detail .sd-zh{font-size:1.25rem;font-weight:400;letter-spacing:.22em;color:#fff2c8;margin-bottom:10px}
.space-detail .sd-desc{font-size:.9rem;line-height:1.8;color:rgba(248,232,212,.85);letter-spacing:.04em}
.space-detail .sd-close{position:absolute;top:6px;right:10px;font-size:1.2rem;color:rgba(248,232,212,.5);cursor:pointer;line-height:1;padding:4px 8px;border-radius:50%;transition:background .3s ease,color .3s ease}
.space-detail .sd-close:hover{color:#fff;background:rgba(255,255,255,.08)}
@media(max-width:600px){
  .space-detail{left:14px;right:14px;max-width:none;bottom:max(120px,calc(env(safe-area-inset-bottom) + 96px));padding:14px 16px}
}

/* ============== 3D 球面首页 ============== */
#home{
  position:fixed;inset:0;z-index:10;
  background:#000;
  display:block;
}
#bgFx{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
#home canvas{position:absolute;inset:0;width:100%;height:100%}
#home canvas:not(#bgFx){z-index:1}
#homeHint{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),90px);
  transform:translateX(-50%);z-index:12;
  color:rgba(255,255,255,.75);font-size:.72rem;letter-spacing:.3em;
  text-align:center;pointer-events:none;
  opacity:0;animation:fadeIn 1.4s ease .5s forwards;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
#homeHint > div{margin:3px 0}
#homeHint .arrow{display:inline-block;font-size:1.2rem;margin-right:6px;animation:bob 2s ease-in-out infinite;vertical-align:-.1em}
#homeHint .hint2,#homeHint .hint3{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.4em}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 回忆录入口按钮（球体下方） */
#openChapterBtn{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),24px);
  transform:translateX(-50%);z-index:20;
  display:inline-flex;align-items:center;gap:10px;
  padding:12px 28px 12px 22px;
  background:rgba(248,232,212,.06);
  border:1px solid rgba(248,232,212,.35);
  border-radius:50px;color:#f8e8d4;
  font-family:"Noto Serif SC",serif;
  font-size:clamp(.82rem,3vw,.95rem);
  letter-spacing:.4em;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;animation:fadeUp 1.4s ease 1.4s forwards;
  transition:all .3s ease;
  box-shadow:0 4px 24px rgba(248,180,200,.15),inset 0 0 12px rgba(248,180,200,.08);
}
#openChapterBtn:active{transform:translateX(-50%) scale(.96);background:rgba(248,232,212,.14)}
#openChapterBtn .ch-bookmark{color:#ff8eb3;animation:heartbeat 1.6s ease-in-out infinite}
#openChapterBtn .ch-arrow{transition:transform .3s ease}
#openChapterBtn:hover .ch-arrow{transform:translateX(4px)}
@keyframes chGlow{
  0%,100%{box-shadow:0 4px 24px rgba(248,180,200,.15),inset 0 0 12px rgba(248,180,200,.08)}
  50%{box-shadow:0 4px 32px rgba(248,180,200,.28),inset 0 0 16px rgba(248,180,200,.15)}
}
#openChapterBtn.show{animation:fadeUp .8s ease forwards, chGlow 3s ease-in-out infinite .8s}

/* 缩放控制按钮 */
#zoomCtl{
  position:fixed;right:14px;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:15;display:flex;flex-direction:column;gap:6px;
  opacity:0;animation:fadeIn 1.4s ease 1s forwards;
}
.zoom-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;
}
.zoom-btn:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.zoom-btn.reset{font-size:.7rem;letter-spacing:.05em;font-weight:500}
#homeTitle{
  position:fixed;left:50%;top:max(env(safe-area-inset-top),30px);
  transform:translateX(-50%);z-index:12;
  text-align:center;color:#fff;pointer-events:none;
}
#homeTitle .t1{font-family:"Dancing Script",serif;font-size:clamp(1.8rem,7vw,2.4rem);text-shadow:0 2px 20px rgba(0,0,0,.8)}
#homeTitle .t2{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.75rem;letter-spacing:.5em;color:rgba(248,232,212,.7);margin-top:4px}

/* ============== 预览大图 ============== */
#preview{
  position:fixed;inset:0;z-index:25;background:#000;
  display:none;
}
#preview.active{display:block}
.preview-stage{position:absolute;inset:0;overflow:hidden;background:#000}
.preview-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;
  pointer-events:none;
}
.preview-slide.show{opacity:1;pointer-events:auto}
.preview-slide img{
  width:100%;height:100%;object-fit:contain;
  background:#000;
}
/* preview EXIF 旋转：contain 模式下旋转后图片会变小居中，但始终能完整看到 */
.preview-img[style*="rotate"]{
  width:100vh;height:100vw;max-width:100vw;max-height:100vh;
}
.preview-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.6);font-size:.85rem;letter-spacing:.3em;
  z-index:2;pointer-events:none;
}
.preview-loading::after{
  content:'';display:block;width:30px;height:30px;
  margin:14px auto 0;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:rgba(255,180,200,.8);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.preview-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.preview-back.show{display:flex}
.preview-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

.preview-info{
  position:fixed;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  text-align:center;color:#fff;padding:0 24px;z-index:10;
  pointer-events:none;
}
.preview-info .pn{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:4px}
.preview-info .pt{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.2rem,5vw,1.6rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7)}

.preview-hint{
  position:fixed;left:50%;bottom:calc(max(env(safe-area-inset-bottom),30px) + 70px);
  transform:translateX(-50%);z-index:20;
  color:rgba(255,255,255,.5);font-size:.7rem;letter-spacing:.3em;
  pointer-events:none;display:none;
}
.preview-hint.show{display:block}

.preview-dots{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);
  z-index:15;display:none;flex-direction:column;gap:5px;
}
.preview-dots.show{display:flex}
.pdot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.pdot.active{background:#ffb0c4;transform:scale(1.6)}

/* ============== 章节全屏视图 ============== */
#viewer{
  position:fixed;inset:0;z-index:20;background:#000;
  display:none;
  touch-action:pan-y;
}
#viewer.active{display:block}
.viewer-stage{position:absolute;inset:0;overflow:hidden}
.viewer-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  animation:slideFadeIn .35s ease-out;
}
@keyframes slideFadeIn{
  from{opacity:.4}
  to{opacity:1}
}
.viewer-slide img.slide-photo{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(.85) saturate(110%);
  transition:transform .4s ease;
}
.viewer-slide::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.85) 100%);
  pointer-events:none;
}
.viewer-info{
  position:absolute;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  z-index:3;text-align:center;color:#fff;padding:0 24px;
  pointer-events:none;
}
.viewer-num{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.95rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:10px}
.viewer-title{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7);margin-bottom:4px}
.viewer-en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.7rem,2.5vw,.85rem);letter-spacing:.4em;color:rgba(248,232,212,.7)}
.viewer-text{
  position:absolute;left:0;right:0;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:3;text-align:center;color:rgba(255,245,235,.95);padding:0 32px;
  font-size:clamp(.85rem,3.2vw,.95rem);line-height:2;letter-spacing:.05em;
  pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.8);
  white-space:pre-line;
}
.viewer-text::before{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-right:4px;vertical-align:-.15em}
.viewer-text::after{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-left:2px;vertical-align:-.25em}
.viewer-fx{position:absolute;inset:0;z-index:2;pointer-events:none}

/* 返回按钮 */
.viewer-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.viewer-back.show{display:flex}
.viewer-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

/* 章节进度 */
.viewer-dots{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),18px);transform:translateX(-50%);
  z-index:40;display:none;flex-direction:row;gap:10px;
  padding:8px 14px;border-radius:999px;
  background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.viewer-dots.show{display:flex}
.vdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);border:none;padding:0;cursor:pointer;transition:all .3s ease}
.vdot.active{background:#ffb0c4;transform:scale(1.8);box-shadow:0 0 10px rgba(255,176,196,.7)}

/* 许愿页特殊样式 */
.viewer-slide.wish{background:radial-gradient(ellipse at center,#2a1840 0%,#08040e 100%)}
.viewer-slide.wish img{filter:brightness(.4)}
.viewer-wish-title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(2rem,8vw,3rem);color:#fff;letter-spacing:.3em;margin-bottom:30px;text-shadow:0 0 30px rgba(255,180,200,.6)}
.viewer-wish-text{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.9rem,3.5vw,1.05rem);color:rgba(255,245,235,.95);letter-spacing:.1em;line-height:2.3;max-width:88%;margin:0 auto 14px}
.viewer-wish-sign{font-family:"Dancing Script",serif;font-size:clamp(1.2rem,5vw,1.6rem);color:#ffb0c4;letter-spacing:.15em;margin-top:30px;text-shadow:0 0 20px rgba(255,180,200,.5)}
.wish-hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wish-heart{position:absolute;color:#ff6b95;font-size:1.2rem;animation:floatUp 6s ease-in infinite;opacity:0}

/* ============ wish 章节：shader 3D 心形 canvas + 文字特效 ============ */
.wish-3d{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.wish .cover-content{position:relative;z-index:3}
/* 文字逐行浮现 + 呼吸光晕，与心形脉冲呼应 */
.wish .viewer-wish-title{
  opacity:0;animation:wishTitleIn 1.4s ease .3s forwards, wishGlow 3.2s ease-in-out 1.8s infinite;
}
.wish .viewer-wish-text{
  opacity:0;transform:translateY(16px);
  animation:wishLineIn 1s ease forwards;
}
.wish .viewer-wish-text:nth-of-type(1){animation-delay:1.1s}
.wish .viewer-wish-text:nth-of-type(2){animation-delay:2.0s}
.wish .viewer-wish-text:nth-of-type(3){animation-delay:2.9s}
.wish .viewer-wish-sign{
  opacity:0;animation:wishLineIn 1.2s ease 3.8s forwards, wishGlow 3.2s ease-in-out 5s infinite;
}
@keyframes wishTitleIn{to{opacity:1;transform:translateY(0)}}
@keyframes wishLineIn{to{opacity:1;transform:translateY(0)}}
@keyframes wishGlow{
  0%,100%{text-shadow:0 0 18px rgba(255,140,170,.45)}
  50%{text-shadow:0 0 42px rgba(255,140,170,.95), 0 0 80px rgba(255,100,150,.35)}
}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
}

/* ============ ch15 AR时光墙 —— 全息照片墙 ============ */
.viewer-slide.ar{background:radial-gradient(ellipse at center,#0a1428 0%,#05070f 70%);overflow:hidden}
.ar-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.ar-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(3,6,14,.75) 100%)}
.ar-head{position:absolute;top:clamp(18px,4vh,44px);left:0;right:0;z-index:3;text-align:center;pointer-events:none;
  opacity:0;animation:arHeadIn 1.2s ease .25s forwards}
@keyframes arHeadIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.ar-head .ar-num{font-family:"Cormorant Garamond",serif;font-size:.75rem;letter-spacing:.5em;color:rgba(160,210,255,.55);margin-bottom:10px}
.ar-head .ar-title{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.6rem,5vw,2.4rem);color:#eaf4ff;letter-spacing:.4em;
  text-shadow:0 0 24px rgba(120,190,255,.5),0 0 60px rgba(80,140,255,.25)}
.ar-head .ar-en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.45em;color:rgba(150,200,255,.5);margin-top:8px}
.ar-theme-label{position:absolute;bottom:clamp(120px,16vh,170px);left:0;right:0;z-index:3;text-align:center;pointer-events:none;
  font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1rem,3vw,1.25rem);letter-spacing:.6em;
  color:var(--ar-color,#ffb3c8);opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease;
  text-shadow:0 0 20px var(--ar-glow,rgba(255,179,200,.6))}
.ar-theme-label.show{opacity:.95;transform:translateY(0)}
.ar-tabs{position:absolute;bottom:clamp(56px,9vh,90px);left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:12px;
  padding:10px 16px;border-radius:999px;background:rgba(8,14,28,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(120,180,255,.18)}
.ar-tab{font-family:"Noto Serif SC",serif;font-size:1rem;letter-spacing:.28em;color:rgba(190,215,245,.6);
  padding:12px 22px;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer;
  transition:all .4s ease;white-space:nowrap;min-width:64px;min-height:44px}
.ar-tab:hover{color:#eaf4ff}
.ar-tab.active{color:#fff;background:var(--ar-color,#ffb3c8);border-color:transparent;
  box-shadow:0 0 22px var(--ar-glow,rgba(255,179,200,.65));text-shadow:none}
.ar-hint{position:absolute;bottom:clamp(16px,3vh,28px);left:0;right:0;z-index:3;text-align:center;

@media(max-width:480px){

}

/* ====== wish 章节 底部文案页 + tabs ====== */
.wish-pages{position:absolute;left:0;right:0;bottom:clamp(150px,22vh,210px);z-index:3;

.wish-pages{transition:opacity .9s ease}
.wish-pages.dim{opacity:0}
.wish-tabs{position:absolute;bottom:clamp(56px,9vh,90px);left:50%;transform:translateX(-50%);z-index:5;

/* 封面特殊样式 */
.viewer-slide.cover{background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 100%)}
.viewer-slide.cover img{display:none}

/* ============================================================ */
/* 每章文案专属动画（结合章节特点 —— 字符级动态）              */
/* ============================================================ */
/* 默认（基础）已在上面 .scene-text 定义；这里只覆盖各章特殊样式 */

.scene-text{white-space:pre-wrap;line-height:2.1;font-size:.95rem;position:relative}
.scene-text .ch{display:inline-block;transition:transform .25s ease, color .25s ease, text-shadow .25s ease}
/* 桌面端专属：文案扫光 */
.is-desktop .scene-text .text-sweep{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, transparent 0%, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%, transparent 100%);
  background-size:300% 100%;
  -webkit-mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent);
  mask-image:linear-gradient(transparent, #000 30%, #000 70%, transparent);
  animation:txtSweep 4.5s ease-in-out infinite;
}
@keyframes txtSweep{
  0%{background-position:300% 50%}
  100%{background-position:-300% 50%}
}

/* ============ ch01 在那之前 —— 流星雨字符逐颗闪烁 ============ */
.scene.ch01 .scene-text{
  background:linear-gradient(90deg,#f8e8d4,#fff,#f8e8d4);
  background-size:200% 100%;
  -webkit-background-clip:text;
  background-clip:text;color:transparent;
}
.scene.ch01 .scene-text .ch{
  animation:ch01Char 3.5s ease-in-out infinite;
}
.scene.ch01 .scene-text .ch:nth-child(odd){animation-delay:.7s;color:rgba(180,210,255,.9);text-shadow:0 0 8px rgba(140,180,255,.7)}
.scene.ch01 .scene-text .ch:nth-child(3n){animation-delay:1.4s;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.8)}
@keyframes ch01Char{
  0%,100%{transform:translateY(0) scale(1);opacity:.85}
  35%{transform:translateY(-2px) scale(1.05);opacity:1}
  70%{transform:translateY(1px) scale(.98);opacity:.7}
}

/* ============ ch02 峨眉雪 —— 雪花飘落字符 ============ */
.scene.ch02 .scene-text .ch{
  animation:ch02Snow 4s ease-in-out infinite;
  text-shadow:0 0 10px rgba(200,225,255,.55), 0 2px 14px rgba(0,0,0,.9);
}
.scene.ch02 .scene-text .ch:nth-child(2n){animation-delay:.6s;color:#fff}
.scene.ch02 .scene-text .ch:nth-child(3n){animation-delay:1.2s;color:rgba(200,225,255,1)}
@keyframes ch02Snow{
  0%{transform:translateY(-6px);opacity:0}
  20%{transform:translateY(-2px);opacity:1}
  60%{transform:translateY(0);opacity:.95}
  100%{transform:translateY(2px);opacity:.85}
}

/* ============ ch03 山城之夜 —— 灯笼明灭字符 ============ */
.scene.ch03 .scene-text .ch{
  animation:ch03Lantern 2.2s ease-in-out infinite;
  color:rgba(255,200,140,.95);
  text-shadow:0 0 8px rgba(255,180,80,.6), 0 0 18px rgba(255,140,60,.35), 0 2px 14px rgba(0,0,0,.9);
}
.scene.ch03 .scene-text .ch:nth-child(2n){animation-delay:.5s}
.scene.ch03 .scene-text .ch:nth-child(3n){animation-delay:1s}
@keyframes ch03Lantern{
  0%,100%{transform:translateY(0) scale(1);opacity:.85}
  50%{transform:translateY(-1px) scale(1.04);opacity:1}
}

/* ============ ch04 北海海风 —— 文字柔和呼吸（移除浪花扫线，改为轻飘） ============ */
.scene.ch04 .scene-text{position:relative}
.scene.ch04 .scene-text::before{
  display:none;
}
.scene.ch04 .scene-text .ch{
  animation:ch04Float 4.5s ease-in-out infinite;
  color:rgba(245,250,255,.97);
  text-shadow:0 0 14px rgba(180,220,255,.55), 0 0 28px rgba(120,180,220,.32);
}
.scene.ch04 .scene-text .ch:nth-child(2n){animation-delay:.4s}
.scene.ch04 .scene-text .ch:nth-child(3n){animation-delay:.8s}
.scene.ch04 .scene-text .ch:nth-child(4n){animation-delay:1.2s}
@keyframes ch04Float{
  0%,100%{transform:translateY(0);opacity:.92}
  50%{transform:translateY(-2px);opacity:1}
}

/* ============ ch05 那年毕业 —— 花瓣飘落字符 ============ */
.scene.ch05 .scene-text .ch{
  animation:ch05Petal 5s ease-in-out infinite;
  text-shadow:0 0 8px rgba(255,190,210,.45);
}
.scene.ch05 .scene-text .ch:nth-child(2n){animation-delay:.8s;color:rgba(255,210,225,1)}
.scene.ch05 .scene-text .ch:nth-child(3n){animation-delay:1.6s;color:#fff;text-shadow:0 0 12px rgba(255,180,200,.7)}
.scene.ch05 .scene-text .ch:nth-child(5n){animation-delay:2.4s;color:rgba(255,225,235,.95)}
@keyframes ch05Petal{
  0%,100%{transform:translate(0,0) rotate(0);opacity:.88}
  25%{transform:translate(3px,-4px) rotate(2deg);opacity:1}
  50%{transform:translate(-2px,-7px) rotate(-2deg);opacity:.95}
  75%{transform:translate(2px,-3px) rotate(1deg);opacity:1}
}

/* ============ ch06 在一起 —— 烛光暖晕字符 ============ */
.scene.ch06 .scene-text .ch{
  animation:ch06Bokeh 3.5s ease-in-out infinite;
  color:rgba(255,235,215,.92);
  text-shadow:0 0 10px rgba(255,170,100,.55), 0 0 24px rgba(255,150,80,.3), 0 2px 14px rgba(0,0,0,.9);
}
.scene.ch06 .scene-text .ch:nth-child(2n){animation-delay:.5s}
.scene.ch06 .scene-text .ch:nth-child(3n){animation-delay:1s}
@keyframes ch06Bokeh{
  0%,100%{transform:translateY(0) scale(1);opacity:.86}
  50%{transform:translateY(-1px) scale(1.04);opacity:1}
}

/* ============ ch07 我们结婚了 —— 玫瑰金光扫过 ============ */
.scene.ch07 .scene-text{
  background:linear-gradient(110deg,#ffd4dc 0%,#fff 30%,#ffb0c4 60%,#fff 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;color:transparent;
}
.scene.ch07 .scene-text .ch{color:transparent}
/* 玫瑰金光带：加强版扫光（独立元素，不触发 clip 文字重栅格化） */
.scene.ch07 .scene-text .text-sweep{
  background:linear-gradient(100deg, transparent 0%, transparent 38%, rgba(255,214,226,.5) 50%, transparent 62%, transparent 100%);
  background-size:300% 100%;
  animation-duration:3.6s;
}

/* ============ ch08 柯柯来了 —— 气泡上浮字符 ============ */
.scene.ch08 .scene-text .ch{
  animation:ch11Bubble 3.6s ease-in-out infinite;
  text-shadow:0 0 10px rgba(255,190,215,.5), 0 2px 14px rgba(0,0,0,.9);
}
.scene.ch08 .scene-text .ch:nth-child(2n){animation-delay:.6s}
.scene.ch08 .scene-text .ch:nth-child(3n){animation-delay:1.2s;color:rgba(255,210,235,1);text-shadow:0 0 12px rgba(255,180,210,.7)}
.scene.ch08 .scene-text .ch:nth-child(4n){animation-delay:1.8s;color:#fff}
@keyframes ch11Bubble{
  0%,100%{transform:translateY(0) scale(1);opacity:.88}
  35%{transform:translateY(-3px) scale(1.05);opacity:1}
  70%{transform:translateY(-1px) scale(1.02);opacity:.94}
}

/* ============ ch09 时光影片 —— 老电影抖动字符 ============ */
.scene.ch09 .scene-text .ch{
  animation:ch14Film 3s steps(8) infinite;
  color:rgba(255,235,210,.95);
  text-shadow:0 0 8px rgba(255,200,140,.5), 1px 0 0 rgba(255,0,0,.28), -1px 0 0 rgba(0,255,255,.28), 0 2px 14px rgba(0,0,0,.9);
}
.scene.ch09 .scene-text .ch:nth-child(2n){animation-delay:.4s}
.scene.ch09 .scene-text .ch:nth-child(3n){animation-delay:.8s}
@keyframes ch14Film{
  0%,100%{transform:translate(0,0) skewX(0);opacity:.92}
  20%{transform:translate(-1px,0) skewX(.5deg);opacity:1}
  40%{transform:translate(1px,1px) skewX(-.3deg);opacity:.85}
  60%{transform:translate(0,-1px);opacity:1}
  80%{transform:translate(0,1px) skewX(.3deg);opacity:.9}
}
.cover-content{text-align:center;color:#fff;padding:0 30px;z-index:3}
.cover-content .deco{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.8rem;letter-spacing:.5em;color:rgba(248,232,212,.5);margin-bottom:18px}

/* 加载进度 */
#loader{
  position:fixed;inset:0;z-index:10000;
  background:radial-gradient(ellipse at center,#0a0618 0%,#050310 60%,#000 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
}
#loader.show{display:flex;animation:fadeIn .6s ease}
#loader canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#loader canvas.loader-3d{z-index:0}
#loader canvas.loader-fx{z-index:1}
/* 加载完成后的"进入回忆球"按钮（右下角，CSS 3D 小球图标） */
#loaderEnterBtn{
  position:absolute;z-index:5;
  right:max(34px,env(safe-area-inset-right));
  bottom:max(72px,calc(env(safe-area-inset-bottom) + 56px));
  display:inline-flex;align-items:center;gap:12px;
  padding:13px 34px;
  background:rgba(248,232,212,.06);border:1px solid rgba(248,232,212,.45);
  color:#f8e8d4;font-family:"Noto Serif SC",serif;
  font-size:clamp(.85rem,2.8vw,.95rem);letter-spacing:.3em;
  cursor:pointer;border-radius:50px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transform:translateY(16px);
  animation:fadeUp .9s ease .15s forwards;
  transition:background .3s ease,border-color .3s ease,transform .15s ease;
}
#loaderEnterBtn:active{transform:scale(.96);background:rgba(248,232,212,.14);border-color:#f8e8d4}
#loaderEnterBtn .le-ball{
  width:22px;height:22px;border-radius:50%;flex:0 0 auto;
  background:
    radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 6%, transparent 34%),
    radial-gradient(circle at 68% 74%, rgba(255,142,179,.5) 0 18%, transparent 44%),
    linear-gradient(135deg,#ffb3c8 0%,#c8a2ff 55%,#5a3d8a 100%);
  box-shadow:0 0 14px rgba(255,142,179,.55),inset -3px -4px 8px rgba(0,0,0,.55);
  animation:leBallSpin 3.2s linear infinite;
}
@keyframes leBallSpin{
  0%{background-position:0% 0%,100% 100%,0% 50%}
  100%{background-position:0% 0%,100% 100%,200% 50%}
}
.loader-inner{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:center;
  width:100%;max-width:340px;
}
.loader-hex{
  position:relative;
  font-family:"Noto Serif SC",serif;font-weight:200;
  font-size:clamp(1rem,3.4vw,1.15rem);letter-spacing:.4em;
  color:rgba(255,200,220,.92);margin-bottom:6px;
  text-shadow:0 0 20px rgba(255,142,179,.5), 0 0 40px rgba(200,162,255,.3);
  height:1.6em;
  display:flex;align-items:center;justify-content:center;
}
.loader-hex-text{position:relative;z-index:2}
.loader-hex::before{
  content:attr(data-hex);
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:"Courier New",monospace;
  font-size:.55rem;letter-spacing:.18em;
  color:rgba(140,220,180,.55);
  white-space:nowrap;opacity:.7;
}
@keyframes loaderGlitch{
  0%,100%{transform:translate(0,0);filter:none}
  20%{transform:translate(-1px,0)}
  40%{transform:translate(1px,0);filter:hue-rotate(15deg)}
  60%{transform:translate(0,1px)}
  80%{transform:translate(-.5px,-.5px)}
}
.loader-hex.shake{animation:loaderGlitch .35s steps(4) 1}
.loader-quote{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.78rem;letter-spacing:.25em;color:rgba(248,232,212,.45);
  margin-bottom:34px;height:1.2em;text-align:center;
  transition:opacity .8s ease;
}
.loader-quote.fade{opacity:0}
.loader-count{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.85rem;letter-spacing:.2em;color:rgba(248,232,212,.6);
  margin-bottom:24px;
}
.loader-count b{color:#ffb0c4;font-style:normal;font-family:"Noto Serif SC",serif;font-weight:200;margin:0 2px}
/* 缩略图预览条 */
.loader-thumbs{
  position:relative;width:90%;max-width:340px;height:54px;
  overflow:hidden;border-radius:6px;
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
}
.loader-thumbs-track{
  display:flex;gap:6px;
  transition:transform .4s ease;
  will-change:transform;
}
.loader-thumb{
  flex:0 0 auto;width:42px;height:54px;border-radius:4px;
  background:rgba(255,255,255,.04);
  opacity:0;transform:translateY(10px) scale(.9);
  transition:opacity .5s ease,transform .5s ease;
  background-size:cover;background-position:center;
}
.loader-thumb.show{opacity:1;transform:translateY(0) scale(1)}
.loader-thumb.glow{box-shadow:0 0 12px rgba(255,142,179,.35)}

/* 程序员控制台日志（打字机效果） */
.loader-log{
  margin-top:18px;width:90%;max-width:340px;height:54px;
  font-family:"Courier New",monospace;font-size:.65rem;
  color:rgba(140,220,180,.7);letter-spacing:.05em;
  text-align:left;line-height:1.5;
  opacity:0;animation:fadeIn .8s ease 1.2s forwards;
  overflow:hidden;
}
.loader-log .ln{display:block}
.loader-log .k{color:#c8a2ff}
.loader-log .s{color:#ffb0c4}
.loader-log .ok{color:#88ff88}

/* CRT 扫描线 + 渐变暗角 */
.loader-scan{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,
    rgba(255,255,255,.02) 0 1px,transparent 1px 3px);
  animation:scanShift 6s linear infinite;
}
@keyframes scanShift{
  0%{background-position:0 0}
  100%{background-position:0 100px}
}

@media (max-width:380px){
  .viewer-title{font-size:1.5rem}
  .viewer-text{font-size:.82rem}
}

/* ============================================================ */
/* 章节场景（每章专属氛围）                                    */
/* ============================================================ */
.scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;overflow:hidden;
}
.scene-bg{position:absolute;inset:0;z-index:0}

}
.scene-info{

.scene-title{

.scene-en{

  opacity:0;animation:sceneTitleIn .8s ease .4s forwards;
}
.scene-text{
  font-family:"Noto Serif SC",serif;font-weight:200;
  font-size:clamp(.85rem,3.2vw,.95rem);

@keyframes sceneTitleIn{to{opacity:1;transform:translateY(0)}}

/* ============ ch04 北海：文字随波飘荡 ============ */

}

}

/* ============================================================ */
/* ============================================================ */
/* 3D 照片展示 —— book（中心展开相册）/flow（聚光封面流）/stack（影院画廊） */
/* ============================================================ */

/* ============ BOOK：立体对开相册 ============ */
.book{
  position:relative;
  width:84vw;max-width:360px;height:88%;
  transform-style:preserve-3d;
  perspective:1200px;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.5));
}
.book-spread{
  position:absolute;inset:0;
  display:flex;transform-style:preserve-3d;
  transform:rotateY(-8deg) rotateX(2deg);
}
.book-spread::before{
  /* 中缝阴影 */
  content:'';position:absolute;left:50%;top:0;bottom:0;width:30px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,
    rgba(0,0,0,.25) 0%,
    rgba(0,0,0,.05) 35%,
    rgba(255,255,255,.12) 50%,
    rgba(0,0,0,.05) 65%,
    rgba(0,0,0,.25) 100%);
  z-index:5;pointer-events:none;
}
.book-page{
  position:relative;
  flex:1;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,250,240,.6) 0%,rgba(245,235,220,.3) 60%,rgba(220,200,170,.4) 100%),
    #f8f1e3;
  overflow:hidden;
  backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(120,90,60,.18);
}
.book-page.left{
  border-radius:4px 0 0 4px;
  border-right:1px solid rgba(120,90,60,.15);
}
.book-page.right{
  border-radius:0 4px 4px 0;
  border-left:1px solid rgba(120,90,60,.15);
}
.book-page img{
  width:100%;height:100%;object-fit:cover;
  display:block;
}
/* 纸张右下角阴影 / 弧线（更立体） */
.book-page::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at right top,rgba(255,255,255,.35) 0%,transparent 30%),
    radial-gradient(ellipse at left bottom,rgba(80,50,30,.22) 0%,transparent 40%);
  mix-blend-mode:multiply;
}
.book-page .page-num{
  position:absolute;bottom:10px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.7rem;letter-spacing:.15em;
  color:rgba(80,60,40,.55);
}
.book-page.left .page-num{left:14px}
.book-page.right .page-num{right:14px}
.book-page .page-corner{
  /* 右上角微翻（折角） */
  position:absolute;top:0;right:0;
  width:0;height:0;
  border-style:solid;border-width:0 14px 14px 0;
  border-color:transparent rgba(40,30,20,.35) transparent transparent;
  filter:drop-shadow(-1px 1px 1px rgba(0,0,0,.3));
  pointer-events:none;
}
/* 翻页动画：当前页（右边）向左掀起 180°，下一页从右边滑入 */
.book.flipping .book-page.right{
  transform-origin:left center;
  animation:bookFlipR 1.1s cubic-bezier(.4,.05,.25,1) forwards;
}
.book.flipping .book-page.right .page-corner{
  animation:bookFlipCorner 1.1s cubic-bezier(.4,.05,.25,1) forwards;
}
@keyframes bookFlipR{
  0%{transform:rotateY(0)}
  60%{transform:rotateY(-150deg);box-shadow:-20px 0 50px rgba(0,0,0,.55)}
  100%{transform:rotateY(-180deg);box-shadow:0 0 0 rgba(0,0,0,0)}
}
@keyframes bookFlipCorner{
  0%{opacity:1}
  50%{opacity:0}
  100%{opacity:0}
}
.book .book-next-in{
  position:absolute;right:0;top:0;bottom:0;width:50%;
  background:#fff;
  transform-origin:left center;
  transform:rotateY(180deg);
  overflow:hidden;
  z-index:2;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(120,90,60,.18);
  border-radius:0 4px 4px 0;
}
.book.flipping .book-next-in{
  animation:bookFlipIn 1.1s cubic-bezier(.4,.05,.25,1) forwards;
}
@keyframes bookFlipIn{
  0%{transform:rotateY(180deg)}
  60%{transform:rotateY(20deg);box-shadow:-20px 0 50px rgba(0,0,0,.55)}
  100%{transform:rotateY(0deg);box-shadow:none}
}

/* ============ FLOW：聚光封面流（中间大 + 两侧倾斜 + Ken Burns）============ */
.flow{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;perspective:1200px;
}
.flow-card{
  position:absolute;left:50%;top:50%;
  width:62vw;max-width:280px;height:78%;
  border-radius:8px;overflow:hidden;
  background:#000;
  box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  transition:transform 1s cubic-bezier(.22,.61,.36,1),opacity 1s ease,box-shadow 1s ease;
  backface-visibility:hidden;
  transform-origin:center center;
  will-change:transform,opacity;
}
.flow-card img{
  position:absolute;left:0;top:0;
  width:100%;height:100%;object-fit:cover;
  display:block;
  transform-origin:center;
  transition:transform 6s ease-out;
  --exif-rot: none;
}
/* EXIF 旋转 90/270：flow-card 是小卡片，图片保持 100%/100% 即可（center rotate 居中） */
.flow-card img[style*="rotate(90deg)"],
.flow-card img[style*="rotate(-90deg)"],
.flow-card img[style*="scaleX(-1) rotate(90deg)"],
.flow-card img[style*="scaleX(-1) rotate(-90deg)"]{
  width:100%;height:100%;
}
.book-img[style*="rotate(90deg)"],
.book-img[style*="rotate(-90deg)"],
.book-img[style*="scaleX(-1) rotate(90deg)"],
.book-img[style*="scaleX(-1) rotate(-90deg)"],
.cinema-img[style*="rotate(90deg)"],
.cinema-img[style*="rotate(-90deg)"],
.cinema-img[style*="scaleX(-1) rotate(90deg)"],
.cinema-img[style*="scaleX(-1) rotate(-90deg)"]{
  width:100vh;height:100vw;max-width:none;max-height:none;
}
.flow-card.active{
  box-shadow:0 32px 90px rgba(0,0,0,.75), 0 0 60px rgba(255,180,200,.18);
  z-index:5;
}
/* Ken Burns：复合 EXIF 旋转（CSS 变量）+ scale + translate */
@keyframes kenBurns{
  0%{transform:var(--exif-rot, none) scale(1.04) translate(0,0)}
  100%{transform:var(--exif-rot, none) scale(1.12) translate(-1.5%,-1%)}
}
.flow-card.active img{
  animation:kenBurns 7s ease-out forwards;
}
.flow-card .flow-num{
  position:absolute;top:12px;right:16px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.85rem;color:#fff;letter-spacing:.1em;
  text-shadow:0 1px 6px rgba(0,0,0,.8);z-index:3;
}
.flow-card .flow-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);
  z-index:2;
}
.flow-card .flow-glow{
  /* 顶部暖色高光 */
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,200,180,.12) 0%,transparent 25%);
  z-index:2;
}
.flow-card .flow-caption{
  position:absolute;left:18px;right:18px;bottom:16px;
  font-family:"Dancing Script","Noto Serif SC",serif;
  font-size:1.05rem;color:#fff;letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
  z-index:3;
  opacity:0;transform:translateY(10px);
  transition:opacity .6s ease .3s, transform .6s ease .3s;
}
.flow-card.active .flow-caption{
  opacity:1;transform:translateY(0);
}

/* ============ STACK：影院画廊（一图全屏 + 缩略图条）============ */
.cinema{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
/* stack 模式：文案常驻底部，主图上移，缩略图不再盖住文案 */
.scene.stack-mode{justify-content:flex-start}
.scene.stack-mode .scene-frame{height:auto;flex:0 0 auto}
.scene.stack-mode .cinema{height:auto}
.scene.stack-mode .cinema-hero{
  max-height:52vh;
}
.scene.stack-mode .scene-info{
  position:absolute;left:0;right:0;bottom:0;
  margin-top:0;padding-bottom:max(env(safe-area-inset-bottom),64px);
  background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 45%);
  pointer-events:none;
}
.cinema-hero{
  position:relative;
  width:88vw;max-width:380px;
  aspect-ratio: 3/4;
  border-radius:6px;overflow:hidden;
  background:#000;
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
}
.cinema-hero img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  transform-origin:center;
  animation:cinemaPan 9s ease-in-out infinite alternate;
}
@keyframes cinemaPan{
  0%{transform:scale(1.08) translate(0,0)}
  100%{transform:scale(1.14) translate(-2%,-1.5%)}
}
.cinema-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%),
    linear-gradient(180deg,rgba(255,200,180,.08) 0%,transparent 30%);
}
.cinema-hero .cinema-num{
  position:absolute;top:14px;left:18px;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.9rem;color:#fff;letter-spacing:.15em;
  text-shadow:0 1px 6px rgba(0,0,0,.7);z-index:3;
}
.cinema-hero .cinema-cap{
  position:absolute;left:20px;right:20px;bottom:18px;
  font-family:"Dancing Script","Noto Serif SC",serif;
  font-size:1.1rem;color:#fff;letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
  z-index:3;
  animation:cinemaCap 1s ease forwards;
}
@keyframes cinemaCap{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}
}
.cinema-thumbs{
  position:absolute;bottom:max(env(safe-area-inset-bottom),76px);left:50%;
  transform:translateX(-50%);
  display:flex;gap:6px;
  padding:6px 10px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(10px);
  border-radius:20px;
  max-width:88vw;
  overflow-x:auto;
  scrollbar-width:none;
}
/* stack 模式：缩略图条放主图下方正常流，不遮挡文案 */
.scene.stack-mode .cinema-thumbs{
  position:static;transform:none;
  margin-top:12px;
}
.cinema-thumbs::-webkit-scrollbar{display:none}
.cinema-thumb{
  flex:0 0 auto;width:36px;height:48px;border-radius:4px;
  background-size:cover;background-position:center;
  background-color:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.1);
  cursor:pointer;
  opacity:.5;
  transition:opacity .3s ease, transform .3s ease, border-color .3s ease;
}
.cinema-thumb:hover{opacity:.85;transform:translateY(-2px)}
.cinema-thumb.active{
  opacity:1;transform:translateY(-3px) scale(1.05);
  border-color:#ffb0c4;
  box-shadow:0 0 14px rgba(255,142,179,.55);
}

/* 章节进度计数器 */
.scene-counter{
  position:absolute;left:50%;top:max(env(safe-area-inset-top),14px);
  transform:translateX(-50%);z-index:5;
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.8rem;color:rgba(255,255,255,.7);
  letter-spacing:.3em;
  background:rgba(0,0,0,.3);padding:5px 14px;border-radius:20px;
  backdrop-filter:blur(10px);
}

/* ============================================================ */
/* 章节专属氛围（8 个章节 8 种场景）                            */
/* ============================================================ */

/* ch01 —— 在那之前（星空·相遇） */
.scene.ch01 .scene-bg{
  background:radial-gradient(ellipse at 30% 40%,#1c1840 0%,#0a0820 60%,#000 100%);
}
.scene.ch01 .scene-deco::before,
.scene.ch01 .scene-deco::after{
  content:'✦';position:absolute;
  font-size:1.5rem;color:rgba(255,220,200,.5);
  animation:ch01Orbit 12s linear infinite;
  text-shadow:0 0 20px rgba(255,180,150,.6);
}
.scene.ch01 .scene-deco::before{top:18%;left:14%;animation-delay:0s}
.scene.ch01 .scene-deco::after{top:60%;right:18%;animation-delay:-6s;font-size:2rem;color:rgba(255,180,210,.6)}
@keyframes ch01Orbit{
  0%,100%{transform:translate(0,0) scale(1);opacity:.5}
  50%{transform:translate(20px,-30px) scale(1.3);opacity:1}
}

/* ch02 —— 峨眉雪 */
.scene.ch02 .scene-bg{
  background:linear-gradient(180deg,#0a1428 0%,#1a2440 50%,#2a3850 100%);
}
.scene.ch02 .scene-deco{
  background:
    linear-gradient(180deg,transparent 60%,rgba(255,255,255,.04) 100%),
    radial-gradient(ellipse at 50% 100%,rgba(180,200,220,.18) 0%,transparent 60%);
}
.scene.ch02 .scene-deco::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,transparent 0%,rgba(40,50,70,.4) 50%,#0e1422 100%);
  clip-path:polygon(0 60%,10% 30%,25% 50%,40% 20%,55% 45%,70% 25%,85% 50%,100% 35%,100% 100%,0 100%);
}
.scene.ch02 .scene-deco::after{
  content:'';position:absolute;top:15%;left:20%;width:60%;height:60%;
  background:radial-gradient(ellipse at 60% 50%,rgba(255,220,150,.15) 0%,transparent 60%);
}

/* ch03 —— 山城之夜 */
.scene.ch03 .scene-bg{
  background:linear-gradient(180deg,#1a0a20 0%,#2a1838 50%,#3a2040 100%);
}
.scene.ch03 .scene-deco::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:50%;
  background:
    linear-gradient(180deg,transparent 0%,rgba(30,15,40,.6) 60%,#0a0414 100%),
    repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,180,80,.08) 14px 15px);
}
.scene.ch03 .scene-deco::after{
  content:'';position:absolute;top:8%;left:8%;width:80%;height:20%;
  background:radial-gradient(ellipse at 30% 50%,rgba(255,200,100,.2) 0%,transparent 50%),
             radial-gradient(ellipse at 70% 50%,rgba(255,150,80,.15) 0%,transparent 50%);
  filter:blur(8px);
}

/* ch04 —— 北海海风：背景 = 真实海滩图片，叠加海面雾气 */
.scene.ch04 .scene-bg{
  background:url('bg-images/04-beach.jpg') center/cover no-repeat;
  background-color:#4a8eb0;  /* 兜底色：海天蓝 */
}
.scene.ch04 .scene-deco::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(160,210,230,.18) 0%,transparent 30%,transparent 65%,rgba(220,200,170,.22) 100%);
}
.scene.ch04 .scene-deco::after{
  /* 海面粼光细线，远景 */
  content:'';position:absolute;bottom:18%;left:0;right:0;height:6px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,235,200,.55) 50%,transparent 95%);
  animation:ch04Shine 4s ease-in-out infinite;
  filter:blur(2px);
}
@keyframes ch04Shine{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(15px);opacity:.8}}

/* ch05 —— 那年毕业 */
.scene.ch05 .scene-bg{
  background:linear-gradient(180deg,#2a1830 0%,#503040 50%,#705050 100%);
}
.scene.ch05 .scene-deco::before{
  content:'🎓';position:absolute;top:18%;left:18%;font-size:2.4rem;
  animation:ch05Cap 6s ease-in-out infinite;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
.scene.ch05 .scene-deco::after{
  content:'🎓';position:absolute;top:30%;right:15%;font-size:1.8rem;
  animation:ch05Cap 7s ease-in-out infinite -3s;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
@keyframes ch05Cap{
  0%,100%{transform:translateY(0) rotate(-15deg)}
  50%{transform:translateY(-25px) rotate(15deg)}
}

/* ch06 —— 在一起（温暖日常） */
.scene.ch06 .scene-bg{
  background:radial-gradient(ellipse at 50% 30%,#3a2820 0%,#2a1a14 60%,#0a0604 100%);
}
.scene.ch06 .scene-deco{
  background:
    radial-gradient(circle at 20% 80%,rgba(255,180,100,.1) 0%,transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(255,150,180,.08) 0%,transparent 30%),
    radial-gradient(circle at 50% 50%,rgba(255,200,120,.06) 0%,transparent 40%);
}

/* ch07 —— 我们结婚了 */
.scene.ch07 .scene-bg{
  background:radial-gradient(ellipse at center,#4a1830 0%,#2a0a18 60%,#100408 100%);
}
.scene.ch07 .scene-deco::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,180,200,.1) 0%,transparent 50%),
    radial-gradient(circle at 50% 88%,rgba(255,142,179,.28) 0%,rgba(255,142,179,.1) 30%,transparent 62%);
}
.scene.ch07 .scene-deco::after{
  content:'♥';position:absolute;bottom:10%;left:50%;transform:translateX(-50%);
  font-size:4rem;color:rgba(255,152,186,.42);
}

/* ch11 —— 柯柯来了 */
.scene.ch11 .scene-bg{
  background:radial-gradient(ellipse at 50% 30%,#3a2a48 0%,#2a1a38 60%,#100818 100%);
}
.scene.ch11 .scene-deco::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 70%,rgba(255,200,220,.08) 0%,transparent 30%),
    radial-gradient(circle at 70% 30%,rgba(180,200,255,.08) 0%,transparent 30%);
}

/* 章节底部隐藏文字下的"翻页/换章"提示 */

/* ============================================================ */
/* 视频章节 —— 胶片条 + 播放器弹窗                                */
/* ============================================================ */
.filmstrip{
  display:flex;gap:14px;
  width:100%;height:100%;
  padding:20px 24px;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
}
.filmstrip::-webkit-scrollbar{display:none}
.film-card{
  flex:0 0 auto;
  width:62vw;max-width:260px;
  scroll-snap-align:center;
  cursor:pointer;
  transition:transform .3s ease;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.film-card:active{transform:scale(.96)}
.film-frame{
  position:relative;
  width:100%;aspect-ratio:16/9;
  background:#000;
  border-radius:4px;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.6);
  border:2px solid #1a1a1a;
}
.film-frame video{
  width:100%;height:100%;object-fit:cover;
  background:#000;
}
.film-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;color:#fff;
  text-shadow:0 0 10px rgba(0,0,0,.5);
  backdrop-filter:blur(4px);
  transition:transform .25s ease, background .25s ease;
  pointer-events:none;
}
.film-card:hover .film-play{transform:translate(-50%,-50%) scale(1.12);background:rgba(255,255,255,.25)}
.film-grain{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}
.film-num{
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.75rem;letter-spacing:.3em;color:rgba(248,232,212,.55);
}
.film-num::before,.film-num::after{content:'—';margin:0 4px;color:rgba(248,232,212,.3)}

/* 视频播放器弹窗 */
.video-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.92);
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .3s ease;
}
.video-overlay video{
  width:96vw;max-height:80vh;object-fit:contain;
  background:#000;
  border-radius:6px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
}
.video-close{
  position:absolute;top:max(env(safe-area-inset-top),16px);right:16px;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;font-size:1.6rem;
  cursor:pointer;backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
}
.video-info{
  position:absolute;bottom:max(env(safe-area-inset-bottom),24px);
  left:50%;transform:translateX(-50%);
  font-family:"Cormorant Garamond",serif;font-style:italic;
  font-size:.8rem;letter-spacing:.3em;color:rgba(255,255,255,.6);
}

/* ch14 章节背景：复古电影感 */
.scene.ch14 .scene-bg{
  background:radial-gradient(ellipse at center,#2a1a14 0%,#15080a 60%,#000 100%);
}
.scene.ch14 .scene-deco::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,200,140,.06) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(255,180,100,.04) 0%,transparent 40%);
}

<body>

// ============================================================
// 0. 设备检测：决定使用轻量版还是 3D 满血版

const isDesktop = window.matchMedia('(min-width:769px) and (hover:hover) and (pointer:fine)').matches;
const isMobile = !isDesktop;
// 暴露到 window 方便 puppeteer 测试 + 调试
window.__isDesktop = isDesktop;
window.__isMobile = isMobile;
window._openChapterToken = 0;  // 章节切换竞争保护（快速连点取消旧 openChapter）
// 写入根节点，方便 CSS 也能针对设备差异化（如隐藏某些层）

// ============================================================
// 0.5 桌面端专属：鼠标位置追踪 / 光标尾迹 / 翻页粒子翻飞
// ============================================================
const mouse = { x: 0.5, y: 0.5, nx: 0, ny: 0, hasMoved: false };  // 0~1 视口坐标 + -1~1 归一化
if (isDesktop) {
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX / window.innerWidth;
    mouse.y = e.clientY / window.innerHeight;
    mouse.nx = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.ny = (e.clientY / window.innerHeight) * 2 - 1;
    mouse.hasMoved = true;
  }, { passive: true });
}

// 桌面端：全局光标尾迹（彩色光点拖尾）
function initCursorTrail() {
  if (!isDesktop) return;
  const cv = document.createElement('canvas');
  cv.id = 'cursorTrail';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize(){
    const dpr = Math.min(window.devicePixelRatio, 2);
    W = cv.width = window.innerWidth * dpr;
    H = cv.height = window.innerHeight * dpr;
    cv.style.width = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:screen;opacity:.9';

  const palette = [
    [255,180,210], [200,160,255], [255,220,170], [180,230,255], [255,160,200]
  ];
  const trail = [];
  let lastX = -100, lastY = -100, sinceLast = 0;
  function draw(){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const cx = mouse.x * window.innerWidth;
    const cy = mouse.y * window.innerHeight;
    // 仅当鼠标实际移动才发射
    if (mouse.hasMoved && (Math.hypot(cx - lastX, cy - lastY) > 2 || sinceLast > 0)) {
      sinceLast++;
      if (sinceLast > 1) {
        const c = palette[(trail.length + Math.floor(Math.random()*5)) % palette.length];
        trail.push({ x: cx, y: cy, r: 2 + Math.random()*3.5, life: 1, c });
        sinceLast = 0;
      }
      lastX = cx; lastY = cy;
    }
    for (let i = trail.length - 1; i >= 0; i--){
      const p = trail[i];
      p.life -= 0.025;
      if (p.life <= 0) { trail.splice(i, 1); continue; }
      const [r, g, b] = p.c;
      ctx.fillStyle = `rgba(${r},${g},${b},${p.life * 0.45})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.fill();
    }
    // 主光点（更亮）
    if (mouse.hasMoved){
      const c = palette[Math.floor(Math.random()*palette.length)];
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},.55)`;
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}
initCursorTrail();

// 桌面端：翻页粒子翻飞
const flipParticles = [];
function spawnFlipBurst(sceneEl, opts = {}) {
  if (!isDesktop || !sceneEl) return;
  const cv = sceneEl.querySelector('.flip-burst');
  let bcv = cv;
  let bctx = null;
  if (!bcv) {
    bcv = document.createElement('canvas');
    bcv.className = 'flip-burst';
    bcv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8';
    sceneEl.appendChild(bcv);
    const dpr = Math.min(window.devicePixelRatio, 2);
    function rs(){
      bcv.width = sceneEl.clientWidth * dpr;
      bcv.height = sceneEl.clientHeight * dpr;
      bcv.style.width = sceneEl.clientWidth + 'px';
      bcv.style.height = sceneEl.clientHeight + 'px';
      bctx = bcv.getContext('2d');
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    rs();
    window.addEventListener('resize', rs);
  }
  bctx = bcv.getContext('2d');
  const w = sceneEl.clientWidth;
  const h = sceneEl.clientHeight;
  const cx = opts.cx ?? w * 0.5;
  const cy = opts.cy ?? h * 0.45;
  const count = opts.count ?? 40;
  const palette = ['#ff8eb3','#c8a2ff','#ffd4a0','#fff0c4','#a8d8ff'];
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 6;
    flipParticles.push({
      cv: bcv, ctx: bctx,
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.5,
      g: 0.12 + Math.random() * 0.08,
      life: 1,
      r: 1.2 + Math.random() * 2.5,
      color: palette[Math.floor(Math.random()*palette.length)]
    });
  }
  if (flipParticles.length === 1) requestAnimationFrame(animateFlipBurst);
}
function animateFlipBurst(){
  for (let i = flipParticles.length - 1; i >= 0; i--){
    const p = flipParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;
    p.vx *= 0.985;
    p.life -= 0.018;
    if (p.life <= 0) { flipParticles.splice(i, 1); continue; }
    p.ctx.globalAlpha = p.life;
    p.ctx.fillStyle = p.color;
    p.ctx.beginPath();
    p.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    p.ctx.fill();
  }
  if (flipParticles.length > 0) requestAnimationFrame(animateFlipBurst);
}

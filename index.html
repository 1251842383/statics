<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>爱的回忆 · 给你的纪念册</title>
<meta name="description" content="一本只属于我们的纪念册 — 从 2017 到 ∞">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Noto+Serif+SC:wght@200;400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:"Noto Serif SC","Cormorant Garamond",serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
  touch-action:none;overscroll-behavior:none;
}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}

/* ============== Splash 星空漩涡 ============== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 70%,#000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
.splash-content{position:relative;z-index:2;text-align:center;color:#f8e8d4;padding:0 30px}
.splash-eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.6em;color:rgba(248,232,212,.5);margin-bottom:18px;opacity:0;animation:fadeIn 1.4s ease .3s forwards}
.splash-title{font-family:"Dancing Script","Cormorant Garamond",serif;font-size:clamp(3rem,12vw,5rem);font-weight:400;letter-spacing:.04em;color:#fff;text-shadow:0 0 40px rgba(255,180,200,.4),0 0 80px rgba(180,120,255,.2);margin-bottom:8px;opacity:0;animation:titleIn 1.8s ease .8s forwards}
.splash-sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.85rem,3vw,1rem);letter-spacing:.5em;color:rgba(248,232,212,.7);margin-bottom:36px;opacity:0;animation:fadeIn 1.4s ease 1.4s forwards}
.splash-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 40px;background:rgba(248,232,212,.05);border:1px solid rgba(248,232,212,.4);color:#f8e8d4;font-family:"Noto Serif SC",serif;font-size:clamp(.9rem,3vw,1rem);letter-spacing:.35em;cursor:pointer;border-radius:50px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;animation:fadeUp 1.4s ease 2s forwards;transition:all .3s ease}
.splash-btn:active{transform:scale(.96);background:rgba(248,232,212,.12);border-color:#f8e8d4}
.splash-btn .heart{display:inline-block;color:#ff6b95;animation:heartbeat 1.4s ease-in-out infinite;font-size:1.1em}
.splash-hint{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(248,232,212,.35);font-size:.7rem;letter-spacing:.4em;z-index:2;animation:fadeIn 1.4s ease 2.5s forwards;opacity:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleIn{from{opacity:0;transform:translateY(30px) scale(.95);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* ============== 3D 球面首页 ============== */
#home{
  position:fixed;inset:0;z-index:10;
  background:#000;
  display:block;
}
#home canvas{display:block;width:100%;height:100%}
#homeHint{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),40px);
  transform:translateX(-50%);z-index:12;
  color:rgba(255,255,255,.75);font-size:.72rem;letter-spacing:.3em;
  text-align:center;pointer-events:none;
  opacity:0;animation:fadeIn 1.4s ease .5s forwards;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
#homeHint > div{margin:3px 0}
#homeHint .arrow{display:inline-block;font-size:1.2rem;margin-right:6px;animation:bob 2s ease-in-out infinite;vertical-align:-.1em}
#homeHint .hint2,#homeHint .hint3{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.4em}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 缩放控制按钮 */
#zoomCtl{
  position:fixed;right:14px;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:15;display:flex;flex-direction:column;gap:6px;
  opacity:0;animation:fadeIn 1.4s ease 1s forwards;
}
.zoom-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;
}
.zoom-btn:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.zoom-btn.reset{font-size:.7rem;letter-spacing:.05em;font-weight:500}
#homeTitle{
  position:fixed;left:50%;top:max(env(safe-area-inset-top),30px);
  transform:translateX(-50%);z-index:12;
  text-align:center;color:#fff;pointer-events:none;
}
#homeTitle .t1{font-family:"Dancing Script",serif;font-size:clamp(1.8rem,7vw,2.4rem);text-shadow:0 2px 20px rgba(0,0,0,.8)}
#homeTitle .t2{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.75rem;letter-spacing:.5em;color:rgba(248,232,212,.7);margin-top:4px}

#musicBtn{
  position:fixed;top:max(env(safe-area-inset-top),16px);right:16px;z-index:100;
  width:42px;height:42px;border-radius:50%;
  background:rgba(248,232,212,.08);border:1px solid rgba(248,232,212,.25);
  color:#f8e8d4;font-size:1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;transition:all .25s ease;
}
#musicBtn:active{transform:scale(.92)}
#musicBtn.playing{color:#ffb0c4;border-color:#ffb0c4;background:rgba(255,176,196,.1)}

/* ============== 预览大图 ============== */
#preview{
  position:fixed;inset:0;z-index:25;background:#000;
  display:none;
}
#preview.active{display:block}
.preview-stage{position:absolute;inset:0;overflow:hidden;background:#000}
.preview-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;
  pointer-events:none;
}
.preview-slide.show{opacity:1;pointer-events:auto}
.preview-slide img{
  width:100%;height:100%;object-fit:contain;
  background:#000;
}
.preview-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,.6);font-size:.85rem;letter-spacing:.3em;
  z-index:2;pointer-events:none;
}
.preview-loading::after{
  content:'';display:block;width:30px;height:30px;
  margin:14px auto 0;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:rgba(255,180,200,.8);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.preview-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.preview-back.show{display:flex}
.preview-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

.preview-info{
  position:fixed;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  text-align:center;color:#fff;padding:0 24px;z-index:10;
  pointer-events:none;
}
.preview-info .pn{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:4px}
.preview-info .pt{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.2rem,5vw,1.6rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7)}

.preview-enter{
  position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),30px);
  transform:translateX(-50%);z-index:30;
  display:none;align-items:center;gap:10px;
  padding:14px 32px;border-radius:50px;
  background:rgba(248,232,212,.95);
  color:#3a1f1f;font-family:"Noto Serif SC",serif;font-size:.9rem;letter-spacing:.3em;
  cursor:pointer;transition:all .3s ease;
  box-shadow:0 6px 30px rgba(255,180,200,.4);
  backdrop-filter:blur(10px);
}
.preview-enter.show{display:inline-flex}
.preview-enter:active{transform:translateX(-50%) scale(.96)}
.preview-enter .enter-arrow{animation:slideRight 1.5s ease-in-out infinite}
@keyframes slideRight{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

.preview-hint{
  position:fixed;left:50%;bottom:calc(max(env(safe-area-inset-bottom),30px) + 70px);
  transform:translateX(-50%);z-index:20;
  color:rgba(255,255,255,.5);font-size:.7rem;letter-spacing:.3em;
  pointer-events:none;display:none;
}
.preview-hint.show{display:block}

.preview-dots{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);
  z-index:15;display:none;flex-direction:column;gap:5px;
}
.preview-dots.show{display:flex}
.pdot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.pdot.active{background:#ffb0c4;transform:scale(1.6)}

/* ============== 章节全屏视图 ============== */
#viewer{
  position:fixed;inset:0;z-index:20;background:#000;
  display:none;
  touch-action:pan-y;
}
#viewer.active{display:block}
.viewer-stage{position:absolute;inset:0;overflow:hidden}
.viewer-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.viewer-slide img.slide-photo{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(.85) saturate(110%);
  transition:transform .4s ease;
}
.viewer-slide::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.85) 100%);
  pointer-events:none;
}
.viewer-info{
  position:absolute;left:0;right:0;top:max(env(safe-area-inset-top),24px);
  z-index:3;text-align:center;color:#fff;padding:0 24px;
  pointer-events:none;
}
.viewer-num{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.95rem;letter-spacing:.3em;color:rgba(248,232,212,.8);margin-bottom:10px}
.viewer-title{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:.25em;text-shadow:0 2px 20px rgba(0,0,0,.7);margin-bottom:4px}
.viewer-en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.7rem,2.5vw,.85rem);letter-spacing:.4em;color:rgba(248,232,212,.7)}
.viewer-text{
  position:absolute;left:0;right:0;bottom:max(env(safe-area-inset-bottom),100px);
  z-index:3;text-align:center;color:rgba(255,245,235,.95);padding:0 32px;
  font-size:clamp(.85rem,3.2vw,.95rem);line-height:2;letter-spacing:.05em;
  pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.8);
  white-space:pre-line;
}
.viewer-text::before{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-right:4px;vertical-align:-.15em}
.viewer-text::after{content:'"';font-family:"Cormorant Garamond",serif;font-size:1.5em;color:#ffb0c4;opacity:.7;margin-left:2px;vertical-align:-.25em}
.viewer-fx{position:absolute;inset:0;z-index:2;pointer-events:none}

/* 返回按钮 */
.viewer-back{
  position:fixed;left:16px;top:max(env(safe-area-inset-top),16px);z-index:50;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:1.1rem;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;transition:all .25s ease;
}
.viewer-back.show{display:flex}
.viewer-back:active{transform:scale(.92);background:rgba(255,255,255,.2)}

/* 章节进度 */
.viewer-dots{
  position:fixed;right:14px;top:50%;transform:translateY(-50%);
  z-index:40;display:none;flex-direction:column;gap:8px;
}
.viewer-dots.show{display:flex}
.vdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);border:none;padding:0;cursor:pointer;transition:all .3s ease}
.vdot.active{background:#ffb0c4;transform:scale(1.8)}

/* 许愿页特殊样式 */
.viewer-slide.wish{background:radial-gradient(ellipse at center,#2a1840 0%,#08040e 100%)}
.viewer-slide.wish img{filter:brightness(.4)}
.viewer-wish-title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(2rem,8vw,3rem);color:#fff;letter-spacing:.3em;margin-bottom:30px;text-shadow:0 0 30px rgba(255,180,200,.6)}
.viewer-wish-text{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.9rem,3.5vw,1.05rem);color:rgba(255,245,235,.95);letter-spacing:.1em;line-height:2.3;max-width:88%;margin:0 auto 14px}
.viewer-wish-sign{font-family:"Dancing Script",serif;font-size:clamp(1.2rem,5vw,1.6rem);color:#ffb0c4;letter-spacing:.15em;margin-top:30px;text-shadow:0 0 20px rgba(255,180,200,.5)}
.wish-hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.wish-heart{position:absolute;color:#ff6b95;font-size:1.2rem;animation:floatUp 6s ease-in infinite;opacity:0}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) rotate(360deg);opacity:0}
}

/* 封面特殊样式 */
.viewer-slide.cover{background:radial-gradient(ellipse at center,#1a0e2a 0%,#08040e 100%)}
.viewer-slide.cover img{display:none}
.cover-content{text-align:center;color:#fff;padding:0 30px;z-index:3}
.cover-content .deco{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.8rem;letter-spacing:.5em;color:rgba(248,232,212,.5);margin-bottom:18px}
.cover-content .title{font-family:"Dancing Script",serif;font-size:clamp(3.2rem,13vw,5.5rem);font-weight:400;letter-spacing:.05em;text-shadow:0 0 40px rgba(255,180,200,.5);margin-bottom:12px;line-height:1.1}
.cover-content .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(.95rem,3.5vw,1.1rem);color:rgba(248,232,212,.7);letter-spacing:.5em;margin-bottom:30px}
.cover-content .heart{font-size:1.8rem;color:#ff6b95;animation:heartbeat 2s ease-in-out infinite;display:inline-block;margin-bottom:30px}
.cover-content .quote{font-family:"Noto Serif SC",serif;font-weight:200;font-size:clamp(.85rem,3.2vw,.95rem);color:rgba(255,245,235,.85);letter-spacing:.12em;line-height:2.1;max-width:85%;margin:0 auto 32px}
.cover-content .date{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.85rem;letter-spacing:.4em;color:rgba(248,232,212,.5)}

/* 加载进度 */
#loader{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse at center,#1a0e2a 0%,#000 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;
}
#loader.show{display:flex}
.loader-text{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1rem;letter-spacing:.4em;color:rgba(248,232,212,.7);margin-bottom:24px}
.loader-bar{width:60%;max-width:280px;height:2px;background:rgba(255,255,255,.15);border-radius:1px;overflow:hidden}
.loader-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffb0c4,#a080ff);transition:width .3s ease}
.loader-pct{font-family:"Dancing Script",serif;font-size:1.2rem;color:rgba(248,232,212,.5);margin-top:16px}

@media (max-width:380px){
  .viewer-title{font-size:1.5rem}
  .viewer-text{font-size:.82rem}
}
</style>
</head>
<body>

<!-- ============== Splash 星空漩涡 ============== -->
<div id="splash">
  <canvas id="splashCanvas"></canvas>
  <div class="splash-content">
    <div class="splash-eyebrow">A LOVE STORY · 2017 — ∞</div>
    <h1 class="splash-title">Love Story</h1>
    <div class="splash-sub">爱 · 的 · 回 · 忆</div>
    <button class="splash-btn" id="openBtn"><span class="heart">♥</span><span>进 入 相 册</span></button>
  </div>
  <div class="splash-hint">轻触进入 · 享受音乐请打开声音</div>
</div>

<!-- ============== 加载进度 ============== -->
<div id="loader">
  <div class="loader-text">正在加载回忆</div>
  <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
  <div class="loader-pct" id="loaderPct">0%</div>
</div>

<!-- ============== 3D 球面首页 ============== -->
<div id="home">
  <div id="homeTitle">
    <div class="t1">Love Story</div>
    <div class="t2">拖动浏览 · 点击进入</div>
  </div>
  <div id="homeHint">
    <div><span class="arrow">↻</span>拖 动 · 旋 转 视 角</div>
    <div class="hint2">双 指 · 缩 放 大 小</div>
    <div class="hint3">点 击 · 预 览 照 片</div>
  </div>

  <div id="zoomCtl">
    <button class="zoom-btn" id="zoomIn" title="拉近">+</button>
    <button class="zoom-btn reset" id="zoomReset" title="重置">⟲</button>
    <button class="zoom-btn" id="zoomOut" title="拉远">−</button>
  </div>
</div>

<!-- ============== 章节全屏视图 ============== -->
<div id="viewer">
  <button class="viewer-back" id="viewerBack">‹</button>
  <div class="viewer-stage" id="viewerStage"></div>
  <div class="viewer-dots" id="viewerDots"></div>
</div>

<!-- ============== 音乐按钮 ============== -->
<button id="musicBtn" title="背景音乐">♪</button>

<!-- ============== 预览大图 ============== -->
<div id="preview">
  <button class="preview-back" id="previewBack">‹</button>
  <div class="preview-stage" id="previewStage"></div>
  <div class="preview-enter" id="previewEnter">
    <span class="enter-text">进 入 章 节</span>
    <span class="enter-arrow">→</span>
  </div>
  <div class="preview-hint" id="previewHint">↑ 滑 · 切 换 同 章 节 照 片</div>
  <div class="preview-dots" id="previewDots"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ============================================================
// 0. 数据
// ============================================================
const CHAPTERS = [
  { id:'cover', title:'爱的回忆', en:'A LOVE STORY', folder:null, bg:null, effect:null, text:'', isCover:true, photo:null },
  { id:'ch01', title:'在那之前', en:'BEFORE WE MET', folder:'chapter-01-before', bg:'bg-images/01-snow.jpg', effect:'meteor',
    text:'从茫茫人海到彼此相望\n那一年我们还各自走在不同的路上\n不知道未来会有你\n只知道心里一直期待着什么' },
  { id:'ch02', title:'峨眉雪', en:'SNOW ON EMEI', folder:'chapter-02-emei', bg:'bg-images/02-emei.jpg', effect:'snow',
    text:'金顶之上，白雪纷飞\n我们裹着同一件大衣\n看远山如画，近处是你\n这一刻，整个世界都安静了' },
  { id:'ch03', title:'山城之夜', en:'CHONGQING NIGHT', folder:'chapter-03-chongqing', bg:'bg-images/03-chongqing.jpg', effect:'lantern',

(() => {
  const c = document.getElementById('splashCanvas');
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  let W, H, stars = [];
  function resize(){
    W = c.width = window.innerWidth * dpr;
    H = c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);
  function initStars(){
    stars = [];
    const maxDim = Math.max(window.innerWidth, window.innerHeight);
    for (let i=0;i<200;i++){
      const angle = Math.random()*Math.PI*2;
      const radius = 30 + Math.random()*maxDim*.6;
      stars.push({
        angle, radius,
        speed: .0005 + Math.random()*.001,
        size: .3 + Math.random()*1.4,
        hue: Math.random()<.7 ? 280+Math.random()*40 : 330+Math.random()*40,
        alpha: .4+Math.random()*.5,
        drift: (Math.random()-.5)*.0003
      });
    }
  }
  initStars();
  function draw(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.fillStyle = 'rgba(8,4,14,.25)';
    ctx.fillRect(0,0,w,h);
    const cx = w/2, cy = h/2;
    const haloR = Math.min(w,h)*.35;
    const halo = ctx.createRadialGradient(cx,cy,0,cx,cy,haloR);
    halo.addColorStop(0,'rgba(255,180,200,.12)');
    halo.addColorStop(.3,'rgba(180,120,255,.08)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.fillRect(0,0,w,h);
    stars.forEach(s => {
      s.angle += s.speed; s.radius += s.drift;
      const r = s.radius;
      const x = cx + Math.cos(s.angle)*r, y = cy + Math.sin(s.angle)*r;
      const fade = Math.max(0, Math.min(1, 1 - r/(haloR*1.4)));
      const sz = s.size*(1 + (1-fade)*.8);
      ctx.fillStyle = `hsla(${s.hue},70%,75%,${s.alpha*fade})`;
      ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2); ctx.fill();
      if (r < haloR){
        const tx = cx + Math.cos(s.angle - s.speed*3)*r;
        const ty = cy + Math.sin(s.angle - s.speed*3)*r;
        ctx.strokeStyle = `hsla(${s.hue},70%,75%,${s.alpha*fade*.4})`;
        ctx.lineWidth = sz*.6;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
      }
      if (r < 5 || r > Math.max(w,h)*.8){
        s.angle = Math.random()*Math.PI*2;
        s.radius = Math.max(w,h)*.6;
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function fibonacciSphere(n, radius){
  const points = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(1 - y*y);
    const theta = phi * i;
    const x = Math.cos(theta)*r;
    const z = Math.sin(theta)*r;
    points.push(new THREE.Vector3(x*radius, y*radius, z*radius));
  }
  return points;
}

async function buildSphereWall(photosData){
  // 收集所有照片（缩略图用 thumb_small，原图等用户点击才加载）
  const allItems = [];
  CHAPTERS.forEach((ch, ci) => {
    if (!ch.folder) return;
    const photos = photosData[ch.folder]?.original || [];
    const shuffled = shuffle(photos);
    shuffled.forEach((p, i) => {
      if (!p) return;
      allItems.push({
        chapterIdx: ci,
        src: `${ch.folder}/${p}`,
        thumbSrc: `${ch.folder}/thumb_small/${p.replace(/^thumb\//,'')}`,
        isMain: i === 0
      });
    });
  });

  // 第一批：每章主图（8 张） - 立即加载
  const mainItems = allItems.filter(it => it.isMain);
  const otherItems = allItems.filter(it => !it.isMain);
  // 第一批再额外加几张 coll（最多共 16 张，先够球面铺开一圈）
  const firstBatch = [...mainItems, ...shuffle(otherItems).slice(0, 8)];
  const restBatch = otherItems.filter(it => !firstBatch.includes(it));

  const loader = document.getElementById('loader');
  const loaderFill = document.getElementById('loaderFill');
  const loaderPct = document.getElementById('loaderPct');
  loader.classList.add('show');

  // 用 Fibonacci 球面分布（按 firstBatch 数量先占位，加载完一张占一个槽）
  // 实际占位数 = firstBatch.length + restBatch.length = 全部
  const totalPositions = allItems.length;
  const allPositions = fibonacciSphere(totalPositions, SPHERE_R - 2.5);

  function loadOne(item){
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        resolve({ item, tex });
      };
      img.onerror = () => resolve(null);
      img.src = item.thumbSrc;
    });
  }

  function addPhotoToSphere(item, tex, posIndex){
    const img = tex.image;
    const aspect = img.width / img.height;
    const baseH = 6.5;
    const baseW = baseH * aspect;
    const geo = new THREE.PlaneGeometry(baseW, baseH);
    const mat = new THREE.MeshBasicMaterial({ map: tex, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(allPositions[posIndex]);
    mesh.lookAt(0, 0, 0);
    // 入场从 scale 0 长到 1
    mesh.scale.set(0.01, 0.01, 0.01);
    photoGroup.add(mesh);
    photoMeshes.push({ mesh, chapterIdx: item.chapterIdx, src: item.src });
    window.photoCount = photoMeshes.length;
  }

  // 第一批加载（并发，加载一张立刻入场）
  let posIdx = 0;
  let firstLoaded = 0;
  const firstPromises = firstBatch.map(item =>
    loadOne(item).then(result => {
      if (result){
        addPhotoToSphere(result.item, result.tex, posIdx++);
      }
      firstLoaded++;
      const pct = Math.floor(firstLoaded / firstBatch.length * 100);
      loaderFill.style.width = pct + '%';
      loaderPct.textContent = pct + '%';
    })
  );

  // 等前 4 张加载完就关闭 loader（不必等全部 16 张）
  // 用 race + 短超时模拟"前几张完成"
  await Promise.race([
    new Promise(r => setTimeout(() => r('timeout'), 1500)),  // 至少显示 1.5s loader
    Promise.all(firstPromises.slice(0, 4))
  ]);

  // 第一批加载完就关闭 loader
  loader.classList.remove('show');
  setTimeout(() => loader.remove(), 500);

  // 继续加载第一批剩余
  await Promise.all(firstPromises);

  // 第二批：剩余照片异步加载（并发数 4，避免一次性请求过多）
  const CONCURRENT = 4;
  for (let i = 0; i < restBatch.length; i += CONCURRENT){
    const slice = restBatch.slice(i, i + CONCURRENT);
    await Promise.all(slice.map(item =>
      loadOne(item).then(result => {
        if (result){
          addPhotoToSphere(result.item, result.tex, posIdx++);
        }
      })
    ));
  }
}

// 旋转控制（拖动 + 自动旋转 + 缩放）
let rotY = 0, rotX = 0;
let camDist = 70;  // 相机到球心距离
const CAM_MIN = 12;   // 最近（飞入球内）
const CAM_MAX = 100;  // 最远（看全貌）
const CAM_DEFAULT = 70;
let autoRotate = true;
let lastTouchX = 0, lastTouchY = 0;
let isDragging = false;
let pinchStartDist = 0;
let pinchStartCamDist = 0;

function applyRotation(){
  photoGroup.rotation.y = rotY;
  photoGroup.rotation.x = rotX;
  homeCamera.position.set(0, 0, camDist);
  homeCamera.lookAt(0, 0, 0);
}
applyRotation();

function getDist(a, b){
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    // 双指捏合
    isDragging = false;
    pinchStartDist = getDist(e.touches[0], e.touches[1]);
    pinchStartCamDist = camDist;
    autoRotate = false;
    return;
  }
  isDragging = true; autoRotate = false;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 2){
    const d = getDist(e.touches[0], e.touches[1]);
    const ratio = pinchStartDist / d;
    camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, pinchStartCamDist * ratio));
    applyRotation();
    return;
  }
  if (!isDragging) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
  applyRotation();
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// 鼠标拖动（PC）
homeRenderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false;
  lastTouchX = e.clientX; lastTouchY = e.clientY;
});
homeRenderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastTouchX;
  const dy = e.clientY - lastTouchY;
  rotY += dx * 0.005;
  rotX += dy * 0.005;
  rotX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotX));
  lastTouchX = e.clientX; lastTouchY = e.clientY;
  applyRotation();
});
homeRenderer.domElement.addEventListener('mouseup', () => isDragging = false);
homeRenderer.domElement.addEventListener('mouseleave', () => isDragging = false);

// 鼠标滚轮缩放（PC）
homeRenderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist + e.deltaY * 0.05));
  autoRotate = false;
  applyRotation();
}, {passive:false});

// 点击照片 - 打开预览大图
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let touchDownX = 0, touchDownY = 0;

function pickPhoto(clientX, clientY){
  const rect = homeRenderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, homeCamera);
  const meshes = photoMeshes.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length){
    return photoMeshes.find(p => p.mesh === hits[0].object) || null;
  }
  return null;
}

homeRenderer.domElement.addEventListener('touchstart', e => {
  touchDownX = e.touches[0].clientX;
  touchDownY = e.touches[0].clientY;
}, {passive:true});
homeRenderer.domElement.addEventListener('touchend', e => {
  const dx = Math.abs(e.changedTouches[0].clientX - touchDownX);
  const dy = Math.abs(e.changedTouches[0].clientY - touchDownY);
  if (dx > 8 || dy > 8) return;
  const pm = pickPhoto(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  if (pm) openPreview(pm);
});

homeRenderer.domElement.addEventListener('click', e => {
  const pm = pickPhoto(e.clientX, e.clientY);
  if (pm) openPreview(pm);
});

// 自动旋转 + 高亮镜头正前方的照片 + 共享入场缩放
const photoEnterStart = new WeakMap();  // mesh -> 入场开始时间

function animateHome(){
  if (autoRotate){
    rotY += 0.0012;
    applyRotation();
  }
  stars.rotation.y = rotY * 0.1;

  // 找到最朝向镜头的照片（z 最大，即最靠近镜头）
  let bestIdx = -1;
  let bestZ = -Infinity;
  const tmpVec = new THREE.Vector3();
  photoMeshes.forEach((p, i) => {
    tmpVec.copy(p.mesh.position).applyEuler(photoGroup.rotation);
    const z = tmpVec.z;
    if (z > bestZ){
      bestZ = z;
      bestIdx = i;
    }
  });

  const now = performance.now();
  photoMeshes.forEach((p, i) => {
    if (!photoEnterStart.has(p.mesh)){
      photoEnterStart.set(p.mesh, now);
    }
    const enterT = Math.min(1, (now - photoEnterStart.get(p.mesh)) / 600);
    const enterScale = enterT < 1 ? (1 - Math.pow(1 - enterT, 3)) : 1;

    // 高亮条件：相机远时（camDist > 40）所有照片同等显示；相机近时高亮正前方
    const isHi = (i === bestIdx && bestZ > 5 && camDist < 40);
    const targetScale = isHi ? 1.15 : 1.0;
    const cur = p.mesh.scale.x;
    const highlightScale = cur + (targetScale - cur) * 0.1;

    const finalScale = enterT < 1 ? enterScale : highlightScale;
    p.mesh.scale.set(finalScale, finalScale, 1);
  });

  homeRenderer.render(homeScene, homeCamera);
  requestAnimationFrame(animateHome);
}
animateHome();

const previewEl = document.getElementById('preview');

let previewChapterIdx = 0;
let previewPhotos = [];      // 该章节所有原图 URL
let previewPhotoIdx = 0;
let previewAllChapters = {};  // 缓存每章的照片列表

async function openPreview(pm){
  previewChapterIdx = pm.chapterIdx;
  // 取该章节所有照片（不重复）
  const ch = CHAPTERS[previewChapterIdx];
  if (!previewAllChapters[previewChapterIdx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[previewChapterIdx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[previewChapterIdx] = [];
    }
  }
  previewPhotos = previewAllChapters[previewChapterIdx];
  // 找到当前点击的照片在预览列表中的位置
  previewPhotoIdx = previewPhotos.findIndex(p => p === pm.src);
  if (previewPhotoIdx < 0) previewPhotoIdx = 0;

  previewEl.classList.add('active');
  homeEl.style.display = 'none';
  previewBack.classList.add('show');
  previewEnter.classList.add('show');
  setTimeout(() => previewHint.classList.add('show'), 600);

  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';

  buildPreviewDots();
  renderPreview();
}

function buildPreviewDots(){
  previewDots.innerHTML = '';
  previewPhotos.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pdot';
    if (i === previewPhotoIdx) d.classList.add('active');
    d.addEventListener('click', e => { e.stopPropagation(); previewPhotoIdx = i; renderPreview(); });
    previewDots.appendChild(d);
  });
  previewDots.classList.add('show');
}

function renderPreview(){
  const ch = CHAPTERS[previewChapterIdx];
  previewStage.innerHTML = `
    <div class="preview-info">
      <div class="pn">No.${String(previewChapterIdx).padStart(2,'0')} · ${ch.en}</div>
      <div class="pt">${ch.title}</div>
    </div>
  `;
  // 加载原图
  const loading = document.createElement('div');
  loading.className = 'preview-loading';
  loading.textContent = '加载原图中…';
  previewStage.appendChild(loading);

  const url = previewPhotos[previewPhotoIdx];
  const img = new Image();
  img.onload = () => {
    loading.remove();
    const slide = document.createElement('div');
    slide.className = 'preview-slide show';
    slide.innerHTML = `<img src="${url}" alt="${ch.title}">`;
    previewStage.appendChild(slide);
    // 更新 dots
    previewDots.querySelectorAll('.pdot').forEach((d, i) => d.classList.toggle('active', i === previewPhotoIdx));
  };
  img.onerror = () => {
    loading.textContent = '加载失败';
  };
  img.src = url;
}

function closePreview(){
  previewEl.classList.remove('active');
  homeEl.style.display = 'block';
  previewBack.classList.remove('show');
  previewEnter.classList.remove('show');
  previewHint.classList.remove('show');
  previewDots.classList.remove('show');
  document.getElementById('homeTitle').style.display = 'block';
  document.getElementById('homeHint').style.display = 'block';
  previewStage.innerHTML = '';
}

previewBack.addEventListener('click', closePreview);
previewEnter.addEventListener('click', () => {
  closePreview();
  openChapter(previewChapterIdx);
});

let prevTSX = 0, prevTSY = 0, prevTST = 0;
previewEl.addEventListener('touchstart', e => {
  prevTSX = e.touches[0].clientX;
  prevTSY = e.touches[0].clientY;
  prevTST = performance.now();
}, {passive:true});
previewEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - prevTSX;
  const dy = e.changedTouches[0].clientY - prevTSY;
  const dt = performance.now() - prevTST;
  if (dt > 600) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    // 左右滑 → 切换章节
    if (dx < 0) previewNextChapter();
    else previewPrevChapter();
  } else if (Math.abs(dy) > 50){
    // 上下滑 → 切换同章节照片
    if (dy < 0) previewNext();
    else previewPrev();
  }
}, {passive:true});

function previewNext(){
  if (previewPhotoIdx < previewPhotos.length - 1){
    previewPhotoIdx++;
    renderPreview();
  }
}
function previewPrev(){
  if (previewPhotoIdx > 0){
    previewPhotoIdx--;
    renderPreview();
  }
}
function previewNextChapter(){
  // 找到下一个有 folder 的章节
  for (let i = previewChapterIdx + 1; i < CHAPTERS.length; i++){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
function previewPrevChapter(){
  for (let i = previewChapterIdx - 1; i >= 0; i--){
    if (CHAPTERS[i].folder){ switchPreviewChapter(i); return; }
  }
}
async function switchPreviewChapter(idx){
  previewChapterIdx = idx;
  const ch = CHAPTERS[idx];
  if (!previewAllChapters[idx]){
    if (ch.folder){
      const data = await loadPhotosData();
      previewAllChapters[idx] = (data[ch.folder]?.original || []).map(p => `${ch.folder}/${p}`);
    } else {
      previewAllChapters[idx] = [];
    }
  }
  previewPhotos = previewAllChapters[idx];
  previewPhotoIdx = 0;
  buildPreviewDots();
  renderPreview();
}

// 5. 章节全屏视图
// ============================================================
const viewerEl = document.getElementById('viewer');
const viewerStage = document.getElementById('viewerStage');
const viewerBack = document.getElementById('viewerBack');
const viewerDots = document.getElementById('viewerDots');
let viewerIdx = 0;
let viewerPhotos = [];  // 每章所有照片

async function openChapter(idx){
  viewerIdx = idx;
  const ch = CHAPTERS[idx];
  viewerEl.classList.add('active');
  homeEl.style.display = 'none';
  viewerBack.classList.add('show');
  // 隐藏首页标题和提示
  document.getElementById('homeTitle').style.display = 'none';
  document.getElementById('homeHint').style.display = 'none';

  // 加载这一章的照片
  viewerPhotos = [];
  viewerStage.innerHTML = '';
  if (ch.folder){
    const data = await loadPhotosData();
    const arr = data[ch.folder]?.original || [];
    arr.forEach(p => viewerPhotos.push(`${ch.folder}/${p}`));
  }
  // 如果当前章节在 photoMeshes 里，用 photoMeshes 的 src
  if (!viewerPhotos.length && ch.folder){
    const fromSphere = photoMeshes.filter(p => p.chapterIdx === idx).map(p => p.src);
    viewerPhotos = fromSphere;
  }

  buildViewerDots();
  showSlide(0);
}

function buildViewerDots(){
  viewerDots.innerHTML = '';
  CHAPTERS.forEach((_,i) => {
    const d = document.createElement('button');
    d.className = 'vdot';
    if (i === viewerIdx) d.classList.add('active');
    d.addEventListener('click', e => { e.stopPropagation(); showSlide(0); viewerIdx = i; updateDots(); });
    viewerDots.appendChild(d);
  });
  viewerDots.classList.add('show');
}
function updateDots(){
  document.querySelectorAll('.vdot').forEach((d,i) => d.classList.toggle('active', i === viewerIdx));
}

function showSlide(photoIdx){
  viewerStage.innerHTML = '';
  const ch = CHAPTERS[viewerIdx];
  const slide = document.createElement('div');
  slide.className = 'viewer-slide' + (ch.isCover ? ' cover' : '') + (ch.isWish ? ' wish' : '');

  if (ch.isCover){
    slide.innerHTML = `
      <div class="cover-content">
        <div class="deco">❀ ❀ ❀</div>
        <h1 class="title">Love Story</h1>
        <div class="sub">爱 · 的 · 回 · 忆</div>
        <div class="heart">♥</div>
        <div class="quote">"遇见你是所有故事里<br>最温柔的开篇"</div>
        <div class="date">est. 2017 · forever & always</div>
      </div>`;
  } else if (ch.isWish){
    let hearts = '';
    for (let k=0;k<10;k++) hearts += `<div class="wish-heart" style="left:${Math.random()*100}%;animation-delay:${Math.random()*6}s">♥</div>`;
    slide.innerHTML = `
      <div class="wish-hearts">${hearts}</div>
      <div class="cover-content" style="position:relative;z-index:3">
        <h2 class="viewer-wish-title">下一个十年</h2>
        <p class="viewer-wish-text">愿我们继续牵着彼此的手，看更多的山海，走更远的路。</p>
        <p class="viewer-wish-text">愿我们的小家永远充满笑声，愿柯柯健康快乐地长大。</p>
        <p class="viewer-wish-text">愿十年后、二十年后、五十年后，你仍是我最想见的那个人。</p>
        <div class="viewer-wish-sign">— Forever & Always ♥</div>
      </div>`;
  } else {
    const photoUrl = viewerPhotos[photoIdx] || ch.bg;
    slide.innerHTML = `
      <img class="slide-photo" src="${photoUrl}" alt="${ch.title}">
      <canvas class="viewer-fx" data-fx="${ch.effect || ''}"></canvas>
      <div class="viewer-info">
        <div class="viewer-num">No.${String(viewerIdx).padStart(2,'0')}</div>
        <div class="viewer-title">${ch.title}</div>
        <div class="viewer-en">${ch.en}</div>
      </div>
      <div class="viewer-text">${ch.text}</div>`;
  }
  viewerStage.appendChild(slide);
  if (!ch.isCover && !ch.isWish){
    startViewerFx(slide, ch.effect);
  }
}

let viewerFxState = { stop:true };
function startViewerFx(slide, fx){
  viewerFxState.stop = true;
  if (!fx) return;
  const canvas = slide.querySelector('.viewer-fx');
  if (!canvas) return;
  const ctx2 = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio, 2);
  function resize(){
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    ctx2.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  const state = { stop:false, particles:[] };
  viewerFxState = state;
  const rand = (a,b) => a + Math.random()*(b-a);
  const cw = () => canvas.width/dpr, chh = () => canvas.height/dpr;
  if (fx === 'snow'){
    for (let i=0;i<40;i++) state.particles.push({x:rand(0,1),y:rand(0,1),r:rand(1.5,4),vy:rand(.0006,.0015),vx:rand(-.0003,.0003),ph:rand(0,6.28)});
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(t*.001+p.ph)*.0004;
        if (p.y > 1){p.y=-.05;p.x=Math.random();}
        if (p.x<0)p.x=1;if(p.x>1)p.x=0;
        ctx2.fillStyle = 'rgba(255,255,255,.85)';
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'meteor'){
    for (let i=0;i<18;i++) state.particles.push({x:Math.random(),y:Math.random()*.5,vx:rand(.002,.005),vy:rand(.001,.003)});
    const loop = () => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      state.particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x>1.2||p.y>1.2){p.x=-.2;p.y=Math.random()*.3;}
        const x0=p.x*w,y0=p.y*h,x1=(p.x-p.vx*80)*w,y1=(p.y-p.vy*80)*h;
        const g=ctx2.createLinearGradient(x1,y1,x0,y0);
        g.addColorStop(0,'rgba(255,220,180,0)');
        g.addColorStop(1,'rgba(255,240,200,.9)');
        ctx2.strokeStyle=g;ctx2.lineWidth=1.8;
        ctx2.beginPath();ctx2.moveTo(x1,y1);ctx2.lineTo(x0,y0);ctx2.stroke();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'wave'){
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      ctx2.strokeStyle = 'rgba(180,220,255,.4)';
      ctx2.lineWidth = 1.2;
      const tt = t*.001;
      for (let row=0;row<6;row++){
        ctx2.beginPath();
        const y0 = h*(.5+row*.07);
        for (let x=0;x<=w;x+=8){
          const y = y0 + Math.sin(x*.02-tt*2+row*.5)*5 + Math.sin(x*.01+tt)*3;
          if (x===0)ctx2.moveTo(x,y);else ctx2.lineTo(x,y);
        }
        ctx2.stroke();
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'petal'){
    for (let i=0;i<18;i++) state.particles.push({x:Math.random(),y:Math.random(),vy:rand(.0004,.0012),vx:rand(-.0004,.0004),rot:rand(0,6.28),vrot:rand(-.008,.008),sz:rand(4,7),hue:rand(330,355)});
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += p.vx + Math.sin(tt+p.rot)*.0006;
        p.rot += p.vrot;
        if (p.y>1.1){p.y=-.1;p.x=Math.random();}
        ctx2.save();ctx2.translate(p.x*w,p.y*h);ctx2.rotate(p.rot);
        ctx2.fillStyle=`hsla(${p.hue},75%,82%,.65)`;
        ctx2.beginPath();ctx2.ellipse(0,0,p.sz,p.sz*.6,0,0,Math.PI*2);ctx2.fill();
        ctx2.restore();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'rose'){
    for (let i=0;i<15;i++) state.particles.push({x:Math.random(),y:Math.random()+.3,vy:rand(.0002,.0006),vx:rand(-.0003,.0003),sz:rand(2,5),a:rand(.3,.7),ph:rand(0,6.28)});
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y -= p.vy; p.x += Math.sin(tt+p.ph)*.0003;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        ctx2.fillStyle=`rgba(255,140,180,${p.a})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.sz,0,Math.PI*2);ctx2.fill();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'bubble'){
    for (let i=0;i<20;i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(3,12),vy:rand(-.001,-.0003),ph:rand(0,6.28)});
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy; p.x += Math.sin(tt*.5+p.ph)*.0004;
        if (p.y<-.1){p.y=1.1;p.x=Math.random();}
        const g=ctx2.createRadialGradient(p.x*w-p.r*.3,p.y*h-p.r*.3,1,p.x*w,p.y*h,p.r);
        g.addColorStop(0,'rgba(255,255,255,.55)');
        g.addColorStop(.5,'rgba(220,240,255,.18)');
        g.addColorStop(1,'rgba(180,220,255,.02)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx2.fill();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'lantern'){
    for (let i=0;i<10;i++) state.particles.push({x:Math.random(),y:rand(.3,1),vy:rand(-.0003,-.0001),ph:rand(0,6.28),sz:rand(4,7)});
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      const tt=t*.001;
      state.particles.forEach(p => {
        p.y += p.vy;
        if (p.y<0){p.y=1;p.x=Math.random();}
        const al=.4+Math.sin(tt*2+p.ph)*.3;
        const r=p.sz*(1+Math.sin(tt+p.ph)*.2);
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r*4);
        g.addColorStop(0,`rgba(255,180,80,${al})`);
        g.addColorStop(.3,`rgba(255,140,60,${al*.4})`);
        g.addColorStop(1,'rgba(255,100,40,0)');
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r*4,0,Math.PI*2);ctx2.fill();
        ctx2.fillStyle=`rgba(255,220,150,${al})`;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else if (fx === 'bokeh'){
    for (let i=0;i<18;i++) state.particles.push({x:Math.random(),y:Math.random(),r:rand(8,22),ph:rand(0,6.28),col:`hsl(${rand(20,40)},80%,70%)`});
    const loop = t => {
      if (state.stop) return;
      const w = cw(), h = chh();
      ctx2.clearRect(0,0,w,h);
      const tt=t*.001;
      state.particles.forEach(p => {
        const sc=1+Math.sin(tt*.5+p.ph)*.2;
        const r=p.r*sc;
        const g=ctx2.createRadialGradient(p.x*w,p.y*h,0,p.x*w,p.y*h,r);
        g.addColorStop(0,p.col.replace('70%)','50%)').replace(')',',.4)'));
        g.addColorStop(1,p.col.replace('70%)','40%)').replace(')',',0)'));
        ctx2.fillStyle=g;
        ctx2.beginPath();ctx2.arc(p.x*w,p.y*h,r,0,Math.PI*2);ctx2.fill();
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

// 在章节视图中：左滑下一章、右滑上一章、上下滑切换同一章内的照片
let viewTouchStartX = 0, viewTouchStartY = 0, viewTouchStartT = 0;
viewerStage.addEventListener('touchstart', e => {
  viewTouchStartX = e.touches[0].clientX;
  viewTouchStartY = e.touches[0].clientY;
  viewTouchStartT = performance.now();
}, {passive:true});
viewerStage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - viewTouchStartX;
  const dy = e.changedTouches[0].clientY - viewTouchStartY;
  const dt = performance.now() - viewTouchStartT;
  if (dt > 600) return;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50){
    // 左右滑 - 切换章节
    if (dx < 0 && viewerIdx < CHAPTERS.length - 1) openChapter(viewerIdx + 1);
    else if (dx > 0 && viewerIdx > 0) openChapter(viewerIdx - 1);
  } else if (Math.abs(dy) > 50){
    // 上下滑 - 切换同章节内的照片
    const ch = CHAPTERS[viewerIdx];
    if (!ch.folder || !viewerPhotos.length) return;
    // 用 current slide index 来切
    // 我们没有存 slideIdx，所以简单做：dy<0 下一张，dy>0 上一张
    // 重新做：根据当前图片名找 idx
    const cur = viewerStage.querySelector('.slide-photo');
    if (!cur) return;
    const curIdx = viewerPhotos.indexOf(cur.src.split('/').slice(-2).join('/'));
    let next = curIdx;
    if (dy < 0) next = (curIdx + 1) % viewerPhotos.length;
    else next = (curIdx - 1 + viewerPhotos.length) % viewerPhotos.length;
    showSlide(next);
  }
}, {passive:true});

// 返回首页

  viewerEl.classList.remove('active');

// 6. Web Audio 钢琴
// ============================================================
let audioCtx = null, musicPlaying = false;
const musicBtn = document.getElementById('musicBtn');
const NOTES = {
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77,
  C6:1046.50,D6:1174.66,E6:1318.51
};
const MELODY = [
  {n:'E5',d:1},{n:'E5',d:1},{n:'F5',d:1},{n:'D5',d:1},
  {n:'C5',d:1},{n:'D5',d:1},{n:'E5',d:2},
  {n:'D5',d:1},{n:'D5',d:1},{n:'E5',d:1},{n:'C5',d:1},
  {n:'D5',d:1},{n:'E5',d:.5},{n:'F5',d:.5},{n:'E5',d:1},{n:'C5',d:1},
  {n:'D5',d:2},{n:'G4',d:2},
  {n:'C6',d:1},{n:'C6',d:1},{n:'D6',d:1},{n:'B5',d:1},
  {n:'A5',d:1},{n:'B5',d:1},{n:'C6',d:2},
  {n:'B5',d:1},{n:'B5',d:1},{n:'C6',d:1},{n:'A5',d:1},
  {n:'B5',d:1},{n:'C6',d:.5},{n:'D6',d:.5},{n:'C6',d:1},{n:'A5',d:1},
  {n:'B5',d:2},{n:'E5',d:2}
];
const CHORDS = [
  ['C4','E4','G4'],['C4','E4','G4'],['F4','A4','C5'],['F4','A4','C5'],
  ['G4','B4','D5'],['G4','B4','D5'],['C4','E4','G4'],['C4','E4','G4'],
  ['F4','A4','C5'],['F4','A4','C5'],['G4','B4','D5'],['C4','E4','G4']
];
function playNote(freq, st, dur, vol=.12, type='triangle'){
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0,st);
  g.gain.linearRampToValueAtTime(vol,st+.02);
  g.gain.exponentialRampToValueAtTime(vol*.5,st+dur*.5);
  g.gain.exponentialRampToValueAtTime(.001,st+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(st); osc.stop(st+dur+.1);
}
function playMusicLoop(){
  if (!audioCtx || !musicPlaying) return;
  const tempo = 76, beatDur = 60/tempo;
  const t0 = audioCtx.currentTime + .1;
  const loopDur = MELODY.reduce((s,n) => s+n.d, 0) * beatDur;
  let t = t0;
  MELODY.forEach(n => { playNote(NOTES[n.n], t, n.d*beatDur*.9); t += n.d*beatDur; });
  const chordStep = loopDur / CHORDS.length;
  CHORDS.forEach((c,i) => c.forEach(note => playNote(NOTES[note], t0+i*chordStep, chordStep*.95, .035, 'sine')));
  for (let i=0;i<loopDur;i+=beatDur*2) playNote(130.81, t0+i, beatDur*1.8, .02, 'sine');
  setTimeout(playMusicLoop, (loopDur - .5) * 1000);
}
function startMusic(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = true;
  musicBtn.classList.add('playing'); musicBtn.textContent = '�';
  playMusicLoop();
}
function stopMusic(){
  musicPlaying = false;
  musicBtn.classList.remove('playing'); musicBtn.textContent = '♪';
  if (audioCtx) audioCtx.suspend();
}
musicBtn.addEventListener('click', () => { musicPlaying ? stopMusic() : startMusic(); });
